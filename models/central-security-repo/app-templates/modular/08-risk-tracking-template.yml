# ==============================================================================
# RISK MANAGEMENT: risk_tracking
# Maintainer: Application Security Team
#
# PURPOSE:
# This file documents the accepted risks, mitigations, and false positive
# suppressions for your application's threat model. It provides an auditable
# record of security decisions and ensures that identified risks are
# acknowledged, owned, and tracked to resolution.
#
# USAGE INSTRUCTIONS (The "Risk Decision" Method):
# 1. RUN the Threagile analysis engine against your completed threat model to
#    generate the initial set of identified risks.
# 2. REVIEW each risk finding and determine the appropriate response:
#    (a) MITIGATED - a control is in place; document it in 'mitigation'.
#    (b) ACCEPTED  - risk is acknowledged and accepted by the data owner;
#        document the business justification in 'justification'.
#    (c) FALSE POSITIVE - the finding does not apply to your architecture;
#        provide a clear technical rationale in 'justification'.
# 3. ASSIGN an 'owner' to every risk entry — this must map to a named team
#    or individual accountable for the risk decision.
# 4. SET a 'due_date' for any risk that requires a future remediation action;
#    leave blank only for formally accepted or false positive entries.
# 5. DO NOT delete risk entries — use the 'status' field to mark resolved
#    items so the audit trail is preserved across model versions.
#
# KEY FORMAT: <risk-category-id>@<technical-asset-id> (wildcards "*" allowed
# in place of the asset ID to cover every asset a category fired on). Both
# IDs come from the risk report generated by an initial pipeline run — look
# them up in risks.xlsx's "ID" column or the small grey ID string under each
# finding in report.pdf, rather than guessing them.
#
# AI ASSISTANCE (optional):
#   Provide this template, a completed pipeline run's risks.json/risks.xlsx
#   for your app, and your own risk-acceptance decisions to an AI assistant
#   and ask it to draft the tracking entries in the correct format. Review
#   the output for accuracy before committing — status/justification/owner
#   decisions should reflect real sign-off, not be invented.
# ==============================================================================

risk_tracking:

  some-risk-category-id@some-technical-asset-id: # wildcards "*" allowed for the asset ID
    status: in-discussion # values: unchecked, in-discussion, accepted, in-progress, mitigated, false-positive
    justification: >
      Some justification for this status — required for accepted and
      false-positive statuses; appears directly in the generated report.
    ticket: Some ticket/POA&M reference, or "TBD"
    date: 2000-01-01 # ISO 8601 date of the most recent status update
    checked_by: Some Name