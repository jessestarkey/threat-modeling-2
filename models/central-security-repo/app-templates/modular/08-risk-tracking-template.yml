# ==============================================================================
# RISK MANAGEMENT: risk_tracking
# Maintainer: Application Security Team
#
# PURPOSE:
# This file records the accepted, mitigated, and false-positive decisions for
# your application's findings, as an auditable record that each risk was
# acknowledged and tracked to resolution.
#
# USAGE INSTRUCTIONS (The "Risk Decision" Method):
# 1. RUN the pipeline against your completed model to produce the findings.
# 2. REVIEW each finding and decide its status:
#    (a) mitigated: a control is in place, and 'justification' says which.
#    (b) accepted: the risk is formally accepted (with a POA&M where needed),
#        and 'justification' gives the business reason, written around the
#        four elements in 08-risk-tracking-lib.yml (expiration, extension
#        count, compensating measures, and accepting authority).
#    (c) false-positive: the finding does not apply to your architecture, and
#        'justification' gives the technical reason.
#    In-flight work uses in-discussion or in-progress.
# 3. RECORD who checked it ('checked_by'), when ('date'), and the tracking or
#    POA&M reference ('ticket'). These five fields are the only ones
#    risk_tracking supports.
# 4. DO NOT delete entries. Change the status instead, so the audit trail
#    survives across model versions.
#
# KEY FORMAT: <risk-category-id>@<technical-asset-id>, where "*" can stand in
# for the asset ID to cover every asset a category fired on. A finding about
# the system as a whole, such as an untested incident response plan, has no
# asset part, so its key is the category ID alone (for example,
# untested-incident-response-plan). Take every ID from the "ID" column of a
# pipeline run's risks.xlsx rather than guessing it.
#
# AI ASSISTANCE (optional):
#   Provide this template, a pipeline run's risks.json or risks.xlsx, and your
#   own decisions to an AI assistant, and ask it to draft the entries. Review
#   the output before committing, since each status and justification must
#   reflect a real sign-off.
# ==============================================================================

risk_tracking:

  some-risk-category-id@some-technical-asset-id: # wildcards "*" allowed for the asset ID
    status: in-discussion # values: unchecked, in-discussion, accepted, in-progress, mitigated, false-positive
    justification: >
      Some justification for this status. It is required for the accepted and
      false-positive statuses, and it appears in the generated report.
    ticket: Some ticket/POA&M reference, or "TBD"
    date: 2000-01-01 # ISO 8601 date of the most recent status update
    checked_by: Some Name