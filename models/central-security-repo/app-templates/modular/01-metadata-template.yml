# ==============================================================================
# Metadata INVENTORY: threagile_version, title, date, author,
# management_summary_comment, mission_criticality, threat_landscape,
# technical_overview, questions
# Maintainer: Application Development Team
# ==============================================================================

threagile_version: 1.0.0

title: >
  [Application] Threat Model

# Pipeline automates the date and can be left as is
date: 2000-01-01

author:
  name: Name
  role: Role


# ------------------------------------------------------------------------------
# EXECUTIVE SUMMARY: management_summary_comment
# ------------------------------------------------------------------------------
# PURPOSE: 
# This is the "Elevator Pitch" for the Authorizing Official (AO) and CISO. It appears on the first page of the generated PDF report. Do NOT use deep 
# technical jargon (e.g., "pods", "ingress", "JWTs") here.
#
# REQUIRED CONTENT (BLUF Format):
# 1. Mission Value: What does this application DO for the organization?
# 2. Primary Users: Who relies on this system?
# 3. CIA Impact: What happens to the mission if this system is breached (Confidentiality), tampered with (Integrity), or goes offline (Availability)?
#
# EXAMPLE:
# "The 'Alpha' targeting system is the primary ISR aggregation platform for forward-deployed analysts. It processes highly restricted, multi-source 
# sensor data. A loss of integrity would result in catastrophic miscalculation # of targeting coordinates, and a loss of availability would immediately halt 
# the operational mission. Therefore, the system is rated Mission-Critical."
# ------------------------------------------------------------------------------
management_summary_comment: >
  [ENTER YOUR EXECUTIVE SUMMARY HERE. Follow the guidance above.]

# ------------------------------------------------------------------------------
# MISSION PRIORITY: mission_criticality
# ------------------------------------------------------------------------------
# PURPOSE:
# How much the mission depends on this application. It does not change any
# finding's score; at mission-essential or above it adds the incident-response
# readiness checks (IR plan testing, breach notification, forensics) to the report.
#
# ALLOWED VALUES (Choose one):
# - mission-critical:  (Warfighting) Essential for kinetic/operational success.
#                      Loss = immediate mission failure.
# - mission-essential: Needed to accomplish the mission. Loss stops a mission
#                      function (e.g., Confluence as the program's system of record).
# - mission-support:   Supports the mission. Loss degrades it, but workarounds exist.
# - administrative:    Administrative or back-office functions. The mission
#                      continues without it.
# (business_criticality, the older name, is still accepted.)
# ------------------------------------------------------------------------------
mission_criticality: mission-support # values: administrative, mission-support, mission-essential, mission-critical


# ------------------------------------------------------------------------------
# THREAT LANDSCAPE: threat_landscape
# ------------------------------------------------------------------------------
# PURPOSE: 
# This section describes the primary security concerns and the overall risk profile of the application from an attacker's perspective. It highlights 
# the most valuable targets within the system and the core defensive strategies employed to protect them.
#
# REQUIRED CONTENT (BLUF Format):
# 1. Primary Threat Vector: What is the most likely way this system would be attacked? (e.g., Insider Threat, Supply Chain, Public API Abuse).
# 2. High-Value Targets: What data or access is the attacker trying to steal/disrupt?
# 3. Core Defenses: What are the primary mitigations in place? (e.g., WAF, Zero Trust Isolation, FIPS Encryption).
#
# EXAMPLE:
# "The threat profile for this API is driven by its exposure to the public internet and its processing of proprietary sensor telemetry. The primary security focus 
# is mitigating asymmetric Denial of Service (DoS) and unauthorized data scraping. Defense-in-depth is achieved via strict API Gateway rate-limiting and robust 
# payload validation before traffic enters the internal Kubernetes boundary."
# ------------------------------------------------------------------------------
threat_landscape:
  description: >
    [ENTER YOUR THREAT LANDSCAPE NARRATIVE HERE. Follow the guidance above.]
  images:
#    - custom-image-1.png: Some dummy image 1


# ------------------------------------------------------------------------------
# ARCHITECTURE SUMMARY: technical_overview
# ------------------------------------------------------------------------------
# PURPOSE: 
# This section provides a concise technical summary of the application stack, its hosting environment, and its primary integration points. It serves as 
# the narrative context for the Data Flow Diagram (DFD).
#
# REQUIRED CONTENT (BLUF Format):
# 1. Deployment Model: Where is it hosted? (e.g., AKS on Azure Gov, standalone 
#    IaaS VMs, multi-region cluster).
# 2. Tech Stack: What are the core components? (e.g., Java JVM, Nginx Ingress, 
#    Postgres Database, OIDC/Entra ID).
# 3. Security Boundary: How is traffic isolated? (e.g., Kubernetes namespaces, 
#    VNet Peering, Private Endpoints, dedicated secrets vault).
#
# EXAMPLE:
# "This service is deployed as a microservice on Azure Kubernetes Service (AKS) in the Azure Government IL5 region. It utilizes an Nginx Ingress for traffic 
# routing and integrates with Entra ID for centralized authentication. Persistent data is hosted on an Azure Managed Postgres instance, accessed 
# exclusively via Private Endpoints. Security is enforced through strict K8s NetworkPolicies and an CSI Driver for Azure Key Vault secret management."
# ------------------------------------------------------------------------------
technical_overview:
  description: >
    [ENTER YOUR TECHNICAL ARCHITECTURE SUMMARY HERE. Follow the guidance above.]
  images:
#    - custom-image-1.png: Some dummy image 1


# ==============================================================================
# APPLICATION FEATURES AND SCOPING: questions
# ==============================================================================
# PURPOSE:
# This section establishes which features the application actually has, and
# therefore which security requirements apply to it. The report prints it
# before the security requirements, as "Application Features and Scoping," and
# the PMO ISSE reviews it during the Continuous Certification to Field (CCTF)
# process.
#
# QUESTION SOURCE:
# Questions come from 01-metadata-lib.yml. For each focus area whose triggers match
# your technical assets' tags or machine types, copy that focus area's questions
# below.
#
# FEATURE CHECKLIST:
#   Each focus area in the library has a short feature checklist, and each item has
#   a fixed list of options. Copy each item below as "Feature: <item>", and
#   answer it with the options that apply, separated by commas, for example
#   "Enterprise IdP, Local accounts (including break-glass)". Append
#   [ANSWER REQUIRED] to a selection that still needs confirming. Answer the
#   checklist before tagging the assets, since an option can name the tags it
#   implies. Then, place each implied tag on the asset that has the feature.
#   The report prints the checklist as a table that marks each selected option
#   and lists the implied tags, so that a reviewer can check them.
#
# ANSWER FORMAT:
#   For each question, explain how the capability is implemented, which tool
#   enforces it, and how it is verified. Do not answer with a bare "Yes" or "No".
#   Keep each answer short: one paragraph of facts, and at most one paragraph of
#   open items that starts with [ANSWER REQUIRED] and numbers them (1), (2),
#   and so on. Separate paragraphs with a blank line.
#     Weak:   "Yes, we use an IdP."
#     Strong: "All user and administrator logins federate to Entra ID over
#              OIDC, with MFA enforced by conditional access. No local accounts
#              exist. Verified by a quarterly sign-in log review."
#   If a control is platform-inherited, name the specific platform tool.
#
# TAILORING THE REQUIREMENTS:
#   Each checklist item in the library has a `scoping` note that names the
#   requirement sections its answer can rule out. In 02-abuse-and-reqs.yml,
#   replace a ruled-out section's rows with "Not applicable: <reason>", citing
#   the answer, rather than deleting the section. For example:
#     "ASVS V6.2: Password Security": |
#       Not applicable: every login federates to Entra ID, and no local
#       accounts exist (see the authentication checklist item).
#   The report then shows that section as not applicable, with the reason.
#   Remove any abuse case that pairs with a section marked not applicable, since
#   the report warns about that combination.
#
# AI ASSISTANCE (optional):
#   Provide this template, 01-metadata-lib.yml, and a description of your
#   system's architecture and tags to an AI assistant. Then, ask it to draft the
#   narrative sections (management_summary_comment, threat_landscape, and
#   technical_overview), select the focus areas whose triggers match your tags and
#   machine types, and draft "[ANSWER REQUIRED]" guidance for each question,
#   rather than inventing compliance answers. Review the output for accuracy
#   before committing, and get the real answers from whoever actually knows the
#   implementation.
# ==============================================================================

questions:

  # ----------------------------------------------------------------------------
  # Copy question blocks from 01-metadata-lib.yml for each focus area that applies,
  # and delete this comment block once the questions are filled in.
  #
  # EXAMPLE (from the Identity focus area):
  #
  # "Feature: Authentication mechanisms": "Enterprise IdP, MFA"
  #
  # "How is each authentication mechanism implemented, enforced, and
  # documented?": >
  #   All user and administrator logins federate to Entra ID over OIDC, with
  #   MFA enforced by conditional access. The OIDC client is documented in the
  #   SSP, section 4.2. Verified by a quarterly sign-in log review.
  # ----------------------------------------------------------------------------