    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: unknown-technology
    tags:
    internet: false
    machine: virtual
    encryption: none
    owner: TBD
    confidentiality: internal
    integrity: operational
    availability: operational
    justification_cia_rating: Placeholder pending architecture design.
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed:
    data_assets_stored:
    data_formats_accepted:
