threagile_version: 1.0.0

# ==============================================================================
# REQUIREMENTS-ONLY TEMPLATE
# ==============================================================================
# For running the requirements-gathering phase (questions, abuse cases,
# security requirements) through this repo's report pipeline BEFORE the
# data-flow diagram / technical architecture exists yet. Fill in
# questions/abuse_cases/security_requirements for real; leave everything
# else in this file exactly as-is (see "DO NOT DELETE" below) until you're
# ready to start designing the actual architecture, at which point switch
# to monolithic-template.yml (or the modular app-templates) instead.
#
# WHY THE PLACEHOLDER ASSETS EXIST -- DO NOT DELETE:
# The pinned threagile:0.9.1 binary crashes outright on a model with zero
# technical_assets ("runtime error: integer divide by zero") and again
# with one technical_asset but zero data_assets ("runtime error: index
# out of range") -- confirmed by direct testing, not documented anywhere
# upstream. trust_boundaries, shared_runtimes, tags_available,
# individual_risk_categories, and risk_tracking are all safe to leave
# genuinely empty, also confirmed by testing -- only technical_assets and
# data_assets need at least one entry each to keep Threagile from
# panicking. "Placeholder Component"/"Placeholder Data" below exist
# solely to satisfy that floor; their field values are arbitrary and
# don't need to mean anything yet.
#
# WHAT TO EXPECT IN THE RENDERED REPORT:
# Open Questions, Abuse Cases, and Security Requirements render fully and
# correctly, each on its own page -- exactly like a fully-designed model.
# Diagrams still render (as a single trivial box). Potential Model
# Failures will show 2-3 expected, harmless findings ("Unknown
# Technology," "Unnecessary Data Asset," "Unnecessary Technical Asset")
# flagging that the placeholders aren't wired to anything real -- these
# disappear on their own once real assets replace the placeholders, and
# aren't something to fix or waive in the meantime.
#
# NEXT STEP: once you're ready to design the actual architecture, delete
# "Placeholder Component" and "Placeholder Data" below, pull real content
# from the central libraries (03-tags-lib.yml, 04-data-assets-lib/*.yml,
# 05-tech-assets-lib/{provider}/*.yml, 06-boundaries-lib/{provider}/*.yml,
# 07-shared-runtimes-lib/{provider}/*.yml) the way monolithic-template.yml
# describes, and carry this file's own questions/abuse_cases/
# security_requirements content forward into the real model -- none of
# that needs to be re-written.
# ==============================================================================


title: Requirements-Only Model Stub

