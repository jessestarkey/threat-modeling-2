  Some Abuse Case: >
    Some Description


security_requirements:
  Some Security Requirement: Some Description



# Tags can be used for anything, it's just a tag. Leave this empty during
# the requirements-only phase -- there's nothing to tag yet. Once real
# technical_assets/data_assets replace the placeholders below, populate
# this from 03-tags-lib.yml the way monolithic-template.yml describes
# (Threagile fails at runtime if a tag used on an asset isn't listed
# here).
tags_available:



data_assets:

