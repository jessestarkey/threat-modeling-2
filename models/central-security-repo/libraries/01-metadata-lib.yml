# ==============================================================================
# METADATA QUESTION LIBRARY: 01-metadata-lib.yml
# ==============================================================================
# This library contains the SSP question blocks for the Threagile metadata
# file (01-metadata.yml). It is not submitted to Threagile directly.
#
# USAGE:
#   1. Review your system's technical asset tags and machine types.
#   2. For each focus area with a matching trigger tag, copy the entire block
#      under `questions:` into the `questions:` section of your
#      01-metadata.yml file.
#   3. Answer the whole feature checklist first, for every focus area, since it
#      is the intake for a new model and decides which focus areas apply.
#      Copy each item into the same `questions:` section as "Feature: <item>",
#      and answer it with
#      the options that apply, separated by commas, for example
#      "Enterprise IdP, Local accounts (including break-glass)". Append
#      [ANSWER REQUIRED] to a selection that still needs confirming.
#   4. Then, answer the questions the checklist calls for. Each question has
#      an asked_when list: either "always", or the checklist selections that
#      make it apply (any one is enough). Copy each applicable question's text
#      into the `questions:` section as a key, and explain how the capability
#      is implemented, which tool or control enforces it, and how it is
#      verified.
#   5. Use the checklist to tailor your 02-abuse-and-reqs.yml. Each item's
#      `scoping` names the requirement sections that its answer can rule out.
#      Replace a ruled-out section's rows with the text
#      "Not applicable: <reason>" rather than deleting the section, so that
#      the report records what was tailored out and why.
#
# STRUCTURE:
#   The questions follow the same nine SABER focus areas as
#   02-abuse-and-reqs-lib.yml, with the same triggers copied verbatim, so a
#   focus area's applicability is decided once. The report prints these questions
#   first, as "Application Features and Scoping", before the requirements
#   that they scope.
#
#   Applicability works at two levels. First, a focus area's triggers decide
#   whether its block applies at all. Second, within a block, the feature
#   checklist decides which requirement sections apply, since a block's
#   triggers are broad. For example, the Identity block fires on any OAuth
#   or SAML feature, while password requirements apply only where local
#   passwords exist.
#
#   The checklist comes first for a new model, since it records what the
#   application has before any tags exist. Each item lists its options and
#   whether one or several may be selected, and an option can name the tags
#   and model fields it implies (for example, File uploads implies
#   feature:file-upload-processing, and Internet-facing endpoints implies
#   internet: true). Place each implied tag or field on the asset that
#   actually has the feature, since the checklist describes the application
#   as a whole and cannot say which asset that is. The tags then select the
#   focus area blocks to copy. The report prints the checklist as a table that
#   marks each selected option, along with the sections the item affects and
#   the tags and fields its selections imply. A reviewer checks those against
#   the model, and nothing checks them automatically.
#
#   The checklist covers only what the application's developers know.
#   Platform and authorization facts (such as the hosting environment, the
#   impact level, self-managed identity and network infrastructure, and
#   incident reporting duties) are not checklist items. Thus, tags that record
#   evidence of a control (such as the -hardened, ops:, and ir: tags),
#   topology (zone:, net:, and path:), platform ownership (such as
#   mgmt:csp-managed and mgmt:self-managed-network), and policy waivers
#   (exception:) are placed per asset as the model is built, and the sections
#   they affect are tailored the same way.
#
#   The questions are short on purpose, since the precise criteria live in
#   the requirement rows rather than in the question. Each question is
#   grouped by capability rather than by ASVS, AISVS, or NIST ID, and its
#   requirement_ids name the numbered criteria to consult before answering.
#   The report leaves out a question whose selections are absent. However, it
#   lists one that depends on an unanswered checklist item as "Pending", and
#   it warns about one that applies but is missing from the model.
#
# FOCUS AREA QUICK-REFERENCE (see 02-abuse-and-reqs-lib.yml for full sourcing
# detail per focus area):
#   IDENTITY                   ASVS V6, V7, V8, V9, V10, NIST SP 800-53 (AC-2(6), AC-2(7))
#   DEVICE AND INFRASTRUCTURE  NIST SP 800-53 (CM, SI, SC, AC, PE families)
#   NETWORK AND ENVIRONMENT    ASVS V12, NIST SP 800-53 (SC-7, AC-18, AC-3, AC-4(6/9/19/25), AU-9, SI-3, SI-7, SC-31, MP-8, CA-3)
#   APPLICATION                ASVS V1, V2, V3, V4, V5, V13, V15, V17
#   ARTIFICIAL INTELLIGENCE    AISVS C1-C10, C11.1-C11.3
#   DATA                       ASVS V11, V14
#   DETECTION                  ASVS V16, AISVS C11.4, C12
#   RESPONSE                   NIST SP 800-53 (IR family)
#   RECOVERY                   NIST SP 800-53 (CP family, plus SA-9, AC-5, SC-12)
# ==============================================================================

categories:

  - name: "Identity"
    triggers:
      - feature:oauth-oidc-provider
      - feature:saml-sp
      - feature:password-reset
      - multi_tenant:true
      - feature:admin-panel
      - mgmt:self-managed-identity
      - mgmt:self-managed-pam

    features:

      - feature: "Authentication mechanisms"
        select: multiple
        options:
          - "Enterprise IdP"
          - "Local accounts (including break-glass)"
          - "MFA"
          - "Out-of-band codes"
          - "Certificates or hardware keys"
          - option: "Self-service password reset"
            tags: [feature:password-reset]
        affects: "ASVS V6.2, V6.4, V6.6, V6.7"
        scoping: >
          If Enterprise IdP is selected without Local accounts (including break-glass), mark
          V6.2 (Password Security) and V6.4 (Authentication Factor Lifecycle and Recovery) not
          applicable. However, a local or break-glass account keeps both in scope for that
          account, and so does Self-service password reset. Additionally, V6.6 applies only if
          Out-of-band codes is selected, and V6.7 only if Certificates or hardware keys is
          selected.

      - feature: "Session model"
        select: multiple
        options:
          - "Application sessions"
          - "IdP-issued tokens"
          - "Federated login"
        affects: "ASVS V7.6"
        scoping: >
          V7.6 (Federated Re-authentication) applies only if Federated login is selected. The
          rest of V7 applies whenever the application keeps a session of any kind.

      - feature: "OAuth, OIDC, and SAML roles"
        select: multiple
        options:
          - option: "OAuth client"
            tags: [feature:oauth-oidc-provider]
          - option: "OAuth resource server"
            tags: [feature:oauth-oidc-provider]
          - option: "OAuth authorization server"
            tags: [feature:oauth-oidc-provider]
          - option: "OIDC client"
            tags: [feature:oauth-oidc-provider]
          - option: "OpenID provider"
            tags: [feature:oauth-oidc-provider]
          - option: "SAML service provider"
            tags: [feature:saml-sp]
          - "Consent management"
          - "None"
        affects: "ASVS V10.2-V10.7"
        scoping: >
          Keep only the V10 sections for the selected roles, namely V10.2 (OAuth client), V10.3
          (OAuth resource server), V10.4 (OAuth authorization server), V10.5 (OIDC client),
          V10.6 (OpenID provider), and V10.7 (Consent management). V9 and V10.1 apply whenever
          any OAuth or OIDC role is selected. Place feature:oauth-oidc-provider on each asset
          that issues or validates the tokens, and feature:saml-sp on each asset in the SAML
          exchange.

      - feature: "Administrative and support access"
        select: multiple
        options:
          - option: "Administrative interface"
            tags: [feature:admin-panel]
          - option: "Vendor remote support"
            tags: [feature:vendor-remote-support]
          - "None"
        affects: "ASVS V8.3, and the Identity block"
        scoping: >
          An administrative interface brings in the Identity block and the
          exposed-admin-interface finding, and vendor remote support brings in the vendor-access
          finding. Place each tag on the asset that offers the access.

      - feature: "Multi-tenancy"
        select: multiple
        options:
          - option: "Application serves multiple tenants"
            fields:
              - "multi_tenant: true on the assets that tenants share"
          - "None"
        affects: "ASVS V8, AISVS C5.3, and the Identity focus area"
        scoping: >
          Multi-tenancy brings in the Identity focus area and the tenant-isolation findings.
          Mark each asset that tenants share multi_tenant: true, so the findings are raised on
          those assets.

    questions:

      - question: "Describe how each authentication mechanism is implemented, enforced, and documented"
        requirement_ids: "ASVS V6.1-ASVS V6.8"
        asked_when: always

      - question: "Describe how sessions are created, timed out, ended, and re-authenticated"
        requirement_ids: "ASVS V7.1-ASVS V7.6"
        asked_when: always

      - question: "Describe how authorization is enforced at the function, data, and field level, and what protects the admin interface"
        requirement_ids: "ASVS V8.1-ASVS V8.4"
        asked_when: always

      - question: "For each OAuth or OIDC role the asset plays, describe how tokens are validated and scoped, and how the flows are secured"
        requirement_ids: "ASVS V9.1-ASVS V9.2, ASVS V10.1-ASVS V10.7"
        asked_when:
          - "OAuth, OIDC, and SAML roles: OAuth client"
          - "OAuth, OIDC, and SAML roles: OAuth resource server"
          - "OAuth, OIDC, and SAML roles: OAuth authorization server"
          - "OAuth, OIDC, and SAML roles: OIDC client"
          - "OAuth, OIDC, and SAML roles: OpenID provider"
          - "OAuth, OIDC, and SAML roles: SAML service provider"
          - "OAuth, OIDC, and SAML roles: Consent management"

  - name: "Device and Infrastructure"
    triggers:
      - machine:container
      - machine:virtual
      - mgmt:self-managed-hardware

    features:

      - feature: "Compute and workload identity"
        select: multiple
        options:
          - option: "Containers"
            fields:
              - "machine: container on each containerized asset"
          - option: "Virtual machines"
            fields:
              - "machine: virtual on each virtual machine"
          - option: "Managed or serverless platform services"
            fields:
              - "machine: serverless on each managed service"
          - option: "Workload identity for cloud or platform APIs"
            tags: [mgmt:workload-identity-assigned]
        affects: "AC-6, and the Device and Infrastructure focus area"
        scoping: >
          Containers and virtual machines bring in the Device and Infrastructure focus area.
          Additionally, a workload identity brings in the over-privileged workload identity
          finding for each asset that holds one.

    questions:

      - question: "Describe how the containers and VMs are hardened, patched, monitored, and administered"
        requirement_ids: "CM-14, CM-7, SC-7(21), SC-5, AC-6, CM-6, SI-2, SI-4, AC-17, SC-28"
        asked_when: always

  - name: "Network and Environment"
    triggers:
      - net:tls-terminator
      - zone:dmz
      - mgmt:self-managed-network
      - cds:low-side-submitter
      - cds:low-side-receiver
      - cds:low-side-broker
      - cds:high-side-submitter
      - cds:high-side-receiver
      - cds:high-side-broker

    features:

      - feature: "Users and exposure"
        select: multiple
        options:
          - option: "Internal users"
            fields:
              - "an out-of-scope external-entity asset for each user population"
          - option: "Mission partners"
            fields:
              - "an external-entity asset for each partner system"
          - option: "Public users"
            fields:
              - "internet: true on a public client asset, and on each asset it reaches directly"
          - option: "Internet-facing endpoints"
            fields:
              - "internet: true on each internet-facing asset"
        affects: "The internet-exposure findings, such as unguarded access from internet, and the Network and Environment focus area"
        scoping: >
          Internet exposure drives many findings, so mark internet: true only on assets that
          face the internet, and model outside users and partner systems as external entities or
          out-of-scope assets. That way, the rules can tell an internet-side caller from an
          in-scope gateway.

      - feature: "Authorization boundary crossings"
        select: multiple
        options:
          - "Exchanges data with systems outside the program"
          - "None"
        affects: "AU-9, AC-3, SC-31, MP-8, CA-3"
        scoping: >
          If None is selected, mark these sections not applicable. Otherwise, MP-8 applies only
          where media or datasets are downgraded to a lower classification.

      - feature: "Cross-domain solution roles"
        select: multiple
        options:
          - option: "Low-side submitter"
            tags: [cds:low-side-submitter]
          - option: "Low-side receiver"
            tags: [cds:low-side-receiver]
          - option: "Low-side broker"
            tags: [cds:low-side-broker]
          - option: "High-side submitter"
            tags: [cds:high-side-submitter]
          - option: "High-side receiver"
            tags: [cds:high-side-receiver]
          - option: "High-side broker"
            tags: [cds:high-side-broker]
          - "None"
        affects: "AC-4(19), AC-4(8) / SI-3, AC-3, AC-4(25) / AC-4(9), SI-7"
        scoping: >
          If None is selected, mark the CDS sections not applicable. Otherwise, keep the
          sections that match the selected roles. For example, release-authority gating
          (AC-4(25) / AC-4(9)) applies only to a high-side submitter.

    questions:

      - question: "Describe how TLS is implemented for external traffic and for service-to-service calls"
        requirement_ids: "ASVS V12.1-ASVS V12.3"
        asked_when: always

      - question: "Describe how classification markings are checked, content is inspected and sanitized, and releases are approved at the cross-domain solution"
        requirement_ids: "AC-4(19), AC-4(8) / SI-3, AC-4(25) / AC-4(9), SI-7"
        asked_when:
          - "Cross-domain solution roles: Low-side submitter"
          - "Cross-domain solution roles: Low-side receiver"
          - "Cross-domain solution roles: Low-side broker"
          - "Cross-domain solution roles: High-side submitter"
          - "Cross-domain solution roles: High-side receiver"
          - "Cross-domain solution roles: High-side broker"

      - question: "Describe how each transfer across the authorization boundary is governed and audited"
        requirement_ids: "AU-9, AC-3, SC-31, MP-8, CA-3"
        asked_when:
          - "Authorization boundary crossings: Exchanges data with systems outside the program"

  - name: "Application"
    triggers:
      - feature:file-upload-processing
      - feature:import-export
      - feature:pdf-generation
      - risk:malware-vector
      - feature:dynamic-code-execution
      - feature:public-api-endpoint
      - feature:graphql-endpoint
      - feature:search-index
      - feature:webhook-receiver
      - feature:websocket
      - feature:ugc-rendering
      - feature:deserialization
      - feature:admin-panel
      - feature:email-sending
      - feature:background-jobs
      - feature:third-party-plugins

    features:

      - feature: "Browser and VDI access"
        select: multiple
        options:
          - "Rendered in a browser"
          - "Sets cookies"
          - "Loads external resources"
          - option: "Accessed through VDI"
            tags: [feature:vdi-path]
          - "None"
        affects: "ASVS V3, V3.3, V3.6"
        scoping: >
          If the application is not rendered in a browser, mark V3 not applicable. Otherwise,
          V3.3 applies only if Sets cookies is selected, and V3.6 only if Loads external
          resources is selected. Access through VDI brings in the VDI clipboard finding.

      - feature: "Code execution and deserialization"
        select: multiple
        options:
          - option: "Dynamic code or template execution"
            tags: [feature:dynamic-code-execution]
          - "Unmanaged or memory-unsafe code"
          - option: "Object deserialization"
            tags: [feature:deserialization]
          - option: "XML deserialization"
            tags: [feature:deserialization]
          - "None"
        affects: "ASVS V1.4, V1.5"
        scoping: >
          V1.4 (Memory, String, and Unmanaged Code) applies only if Unmanaged or memory-unsafe
          code is selected, and V1.5 (Safe Deserialization) only if either deserialization
          option is selected. Dynamic code or template execution brings in the template
          injection finding.

      - feature: "Interfaces exposed"
        select: multiple
        options:
          - option: "Public or B2B API"
            tags: [feature:public-api-endpoint]
          - option: "GraphQL"
            tags: [feature:graphql-endpoint]
          - option: "WebSockets"
            tags: [feature:websocket]
          - option: "Webhook receiver"
            tags: [feature:webhook-receiver]
          - option: "Search over an index"
            tags: [feature:search-index]
          - "WebRTC"
          - "None"
        affects: "ASVS V4.3, V4.4, V17, and the Application focus area"
        scoping: >
          V4.3 applies only if GraphQL is selected, and V4.4 only if WebSockets is selected.
          Place each tag on the asset that exposes the interface. Additionally, ASVS V17 applies
          only if WebRTC is selected.

      - feature: "Content handling"
        select: multiple
        options:
          - option: "File uploads"
            tags: [feature:file-upload-processing, risk:malware-vector]
          - option: "Bulk import or export"
            tags: [feature:import-export]
          - option: "Server-side PDF generation"
            tags: [feature:pdf-generation]
          - option: "Rendering one user's content to others"
            tags: [feature:ugc-rendering]
          - option: "Email built from user input"
            tags: [feature:email-sending]
          - "None"
        affects: "ASVS V5, and the Application block"
        scoping: >
          If no option other than None is selected, mark ASVS V5 not applicable. File uploads
          also implies risk:malware-vector on the data asset that holds the uploaded content.

      - feature: "Platform features"
        select: multiple
        options:
          - option: "Background jobs built from user input"
            tags: [feature:background-jobs]
          - option: "Application cache"
            tags: [feature:caching-layer]
          - option: "Third-party plugins"
            tags: [feature:third-party-plugins]
          - "None"
        affects: "ASVS V15.2, and the Application block"
        scoping: >
          Each selection brings in its matching finding, namely background job injection, cache
          poisoning, or unauthorized plugins. Place each tag on the asset that has the feature.

      - feature: "User-facing flows that could be automated at scale"
        select: one
        options:
          - option: "Yes"
            tags: [feature:sensitive-business-flow]
          - "No"
        affects: "ASVS V2.4"
        scoping: >
          If No is selected, V2.4 (Anti-automation) can be marked not applicable.

      - feature: "Development and delivery"
        select: multiple
        options:
          - option: "Custom-developed code"
            fields:
              - "custom_developed_parts: true on each asset with custom code"
          - option: "CI/CD pipeline the team runs"
            fields:
              - "a build-pipeline and a sourcecode-repository asset, with links to their deployment targets"
          - option: "Container images the team builds"
            fields:
              - "a container-registry asset, and links from the pipeline to it"
          - "Commercial or open-source software only"
        affects: "The supply-chain findings, such as code backdooring, unchecked deployment, and missing build infrastructure"
        scoping: >
          Custom-developed code brings in the supply-chain rules, and without a modeled pipeline
          it raises the missing build infrastructure finding. If only Commercial or open-source
          software only is selected, those rules do not apply.

    questions:

      - question: "Describe what prevents injection and unsafe deserialization"
        requirement_ids: "ASVS V1.1-ASVS V1.5"
        asked_when: always

      - question: "Describe what stops users from skipping business-logic steps or automating abuse"
        requirement_ids: "ASVS V2.1-ASVS V2.4"
        asked_when: always

      - question: "Describe how cookies, security headers, CSRF, and origin separation are configured for the browser"
        requirement_ids: "ASVS V3.1-ASVS V3.7"
        asked_when:
          - "Browser and VDI access: Rendered in a browser"

      - question: "Describe how the HTTP, GraphQL, and WebSocket interfaces are secured"
        requirement_ids: "ASVS V4.1-ASVS V4.4"
        asked_when: always

      - question: "Describe how uploaded files are validated, stored, and served"
        requirement_ids: "ASVS V5.1-ASVS V5.4"
        asked_when:
          - "Content handling: File uploads"
          - "Content handling: Bulk import or export"
          - "Content handling: Server-side PDF generation"

      - question: "Describe how configuration is managed, how backend services authenticate, and where secrets are stored"
        requirement_ids: "ASVS V13.1-ASVS V13.4"
        asked_when: always

      - question: "Describe how third-party dependency risk is tracked, and which defensive coding practices are enforced"
        requirement_ids: "ASVS V15.1-ASVS V15.4"
        asked_when: always

      - question: "Describe how the WebRTC TURN relay, media, and signaling are secured"
        requirement_ids: "ASVS V17.1-ASVS V17.3"
        asked_when:
          - "Interfaces exposed: WebRTC"

  - name: "Artificial Intelligence"
    triggers:
      - ai:user-prompt-input
      - ai:indirect-prompt-input
      - technology:ai-llm-endpoint
      - technology:ai-rag-pipeline
      - technology:ai-agent-orchestrator
      - ai:ot-adjacent-output
      - ai:third-party-model-api
      - technology:ai-model-serving
      - technology:ai-model-registry
      - technology:ai-training-pipeline
      - technology:ai-dataset-store
      - technology:ai-eval-pipeline
      - ai:air-gapped-model-delivery
      - technology:ai-rag-ingest-pipeline
      - ai:agent-memory
      - technology:ai-multi-agent-gateway
      - technology:ai-tool-server
      - technology:ai-gateway
      - technology:ai-vector-store
      - ai:code-execution
      - ai:skills-enabled
      - ai:human-labeling
      - ai:endpoint-assistant

    features:

      - feature: "AI use and model sourcing"
        select: multiple
        options:
          - option: "Vendor-hosted model"
            tags: [ai:third-party-model-api]
          - "Self-hosted model"
          - "Training or fine-tuning"
          - option: "Data labeling"
            tags: [ai:human-labeling]
          - "Model served in production"
          - option: "Model delivered into an air-gapped enclave"
            tags: [ai:air-gapped-model-delivery]
          - "None"
        affects: "AISVS C1, C3, C6, C11.2, C11.3, C11.4, C12"
        scoping: >
          If None is selected, the application uses no AI, so the Artificial Intelligence focus
          area does not apply. Otherwise, if only Vendor-hosted model is selected, mark C1, C3,
          and C6 not applicable, and record that the vendor covers C11.2 and C11.3.
          Additionally, C1.2 applies only if Data labeling is selected, C3.5 and C12.5 only if
          Training or fine-tuning is selected, and C11.4 and C12 only if Model served in
          production is selected.

      - feature: "AI deployment"
        select: multiple
        options:
          - "Accelerators the application controls"
          - "Edge or distributed devices"
          - "None"
        affects: "AISVS C4.2, C4.3, C5.3"
        scoping: >
          C4.2 applies only if Accelerators the application controls is selected, C4.3 only if
          Edge or distributed devices is selected, and C5.3 only if Application serves multiple
          tenants is selected under Multi-tenancy.

      - feature: "Agent capabilities"
        select: multiple
        options:
          - option: "Memory or RAG index"
            tags: [ai:agent-memory]
          - "Tool calls"
          - "MCP servers"
          - option: "Code execution by the agent"
            tags: [ai:code-execution]
          - option: "Agent skills"
            tags: [ai:skills-enabled]
          - "Source citation in output"
          - "None"
        affects: "AISVS C7.4, C8, C9, C10"
        scoping: >
          C8 applies only if Memory or RAG index is selected, C9 only if Tool calls is selected,
          C10 only if MCP servers is selected, and C7.4 only if Source citation in output is
          selected.

      - feature: "AI inputs and outputs"
        select: multiple
        options:
          - option: "Prompts from end users"
            tags: [ai:user-prompt-input]
          - option: "External content read by the model"
            tags: [ai:indirect-prompt-input]
          - option: "Output used for consequential decisions"
            tags: [ai:decision-support-output]
          - option: "Output that can reach OT or safety-critical processes"
            tags: [ai:ot-adjacent-output]
          - option: "AI assistant on user endpoints"
            tags: [ai:endpoint-assistant]
          - "None"
        affects: "AISVS C2, C7, and the AI block"
        scoping: >
          AISVS C2 applies whenever prompts or external content reach the model. Each selection
          brings in its matching finding, such as direct or indirect prompt injection,
          overreliance, or an ungated path to OT actuation.

    questions:

      - question: "Describe how training data, labeling, and model artifacts are secured, and how model integrity and provenance are verified"
        requirement_ids: "AISVS C1.1-AISVS C1.3, AISVS C3.1-AISVS C3.5, AISVS C6.1-AISVS C6.2"
        asked_when:
          - "AI use and model sourcing: Self-hosted model"
          - "AI use and model sourcing: Training or fine-tuning"
          - "AI use and model sourcing: Data labeling"
          - "AI use and model sourcing: Model delivered into an air-gapped enclave"

      - question: "Describe how untrusted input, including retrieved and embedded content, is screened before it reaches the model, and who can access the memory or RAG index"
        requirement_ids: "AISVS C2.1-AISVS C2.2, AISVS C8.1-AISVS C8.3"
        asked_when:
          - "AI inputs and outputs: Prompts from end users"
          - "AI inputs and outputs: External content read by the model"
          - "Agent capabilities: Memory or RAG index"

      - question: "Describe how AI workloads are isolated, and how access to AI resources is authenticated and authorized"
        requirement_ids: "AISVS C4.1-AISVS C4.3, AISVS C5.1-AISVS C5.3"
        asked_when: always

      - question: "Describe how model output is validated and bounded before users or downstream systems receive it"
        requirement_ids: "AISVS C7.1-AISVS C7.4"
        asked_when: always

      - question: "Describe what constrains the agent and its tools, and how its MCP servers are sourced, authenticated, and validated"
        requirement_ids: "AISVS C9.1-AISVS C9.6, AISVS C10.1-AISVS C10.4"
        asked_when:
          - "Agent capabilities: Tool calls"
          - "Agent capabilities: MCP servers"
          - "Agent capabilities: Code execution by the agent"
          - "Agent capabilities: Agent skills"

      - question: "Describe how the model is hardened against adversarial input, membership inference, and extraction"
        requirement_ids: "AISVS C11.1-AISVS C11.3"
        asked_when:
          - "AI use and model sourcing: Self-hosted model"
          - "AI use and model sourcing: Training or fine-tuning"
          - "AI use and model sourcing: Model served in production"

  - name: "Data"
    triggers:
      - type:datastore
      - technology:vault
      - data:external-feed-ingest
      - data:release-candidate
      - feature:import-export
      - cds:high-side-submitter
      - cds:high-side-broker
      - data:pii

    features:

      - feature: "In-use and client-side data"
        select: multiple
        options:
          - "Data protected while in use"
          - "Sensitive data reaches a client"
          - "None"
        affects: "ASVS V11.7, V14.3"
        scoping: >
          V11.7 (In-Use Data Cryptography) applies only if Data protected while in use is
          selected, which is typically an L3 requirement. Additionally, V14.3 (Client-side Data
          Protection) applies only if Sensitive data reaches a client is selected.

      - feature: "Sensitive data handled"
        select: multiple
        options:
          - option: "Personal information"
            tags: [data:pii]
          - option: "Credentials or keys"
            tags: [data:credential]
          - option: "Credentials brokered for other services"
            tags: [sec:secrets-broker]
          - option: "Ongoing external data feeds"
            tags: [data:external-feed-ingest]
          - option: "Files or datasets released outside the boundary"
            tags: [data:release-candidate]
          - "None"
        affects: "ASVS V14, and the Data block"
        scoping: >
          Each selection brings in its matching finding, such as the privacy impact assessment,
          the credential blast radius, data provenance, or re-identification of released data.
          Place data:pii, data:credential, and data:release-candidate on the assets or data
          assets that hold the data.

    questions:

      - question: "Describe how cryptographic keys are managed, and whether the algorithms are approved"
        requirement_ids: "ASVS V11.1-ASVS V11.7"
        asked_when: always

      - question: "Describe how sensitive data is classified and protected at rest, in transit, and on the client"
        requirement_ids: "ASVS V14.1-ASVS V14.3"
        asked_when: always

  - name: "Detection"
    triggers:
      - feature:public-api-endpoint
      - machine:container
      - technology:ai-observability-stack

    questions:

      - question: "Describe what is logged, where the logs go, and what error messages reveal"
        requirement_ids: "ASVS V16.1-ASVS V16.5"
        asked_when: always

      - question: "Describe how the model is monitored for anomalies, abuse, and drift, and whether its lifecycle is audited"
        requirement_ids: "AISVS C11.4, AISVS C12.1-AISVS C12.5"
        asked_when:
          - "AI use and model sourcing: Model served in production"

  - name: "Response"
    triggers:
      - zone:dmz
      - sec:secrets-broker

    questions:

      - question: "Describe how containment, credential rotation, and incident reporting are handled, and whether they have been tested"
        requirement_ids: "IR-4, IR-4, IR-3, IR-6"
        asked_when: always

  - name: "Recovery"
    triggers:
      - ops:requires-backup
      - ops:vendor-hosted-service

    features:

      - feature: "Vendor-hosted or SaaS components"
        select: one
        options:
          - "Yes"
          - "No"
        affects: "SA-9"
        scoping: >
          SA-9 applies only if Yes is selected.

      - feature: "Data that requires backup"
        select: one
        options:
          - option: "Yes"
            tags: [ops:requires-backup]
          - "No"
        affects: "CP-9 / AC-5, CP-2, CP-4, SC-12, and the Recovery block"
        scoping: >
          If Yes is selected, place ops:requires-backup on each asset whose data must survive
          its loss, which brings in the backup findings for that asset.

    questions:

      - question: "Describe how the asset is backed up, what its RTO and RPO are, and whether a restore has been tested"
        requirement_ids: "CP-9 / AC-5, CP-2, CP-4, SA-9, SC-12"
        asked_when: always
