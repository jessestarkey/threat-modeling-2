# ==============================================================================
# METADATA QUESTION LIBRARY: 01-metadata-lib.yml
# ==============================================================================
# This library contains the SSP question blocks for the Threagile metadata
# file (01-metadata.yml). It is not submitted to Threagile directly.
#
# USAGE:
#   1. Review your system's technical asset tags and machine types.
#   2. For each focus area with a matching trigger tag, copy the entire block
#      under `questions:` into the `questions:` section of your
#      01-metadata.yml file.
#   3. Answer the focus area's feature checklist first. Copy each item into the
#      same `questions:` section as "Feature: <item>", and answer it with
#      the options that apply, separated by commas, for example
#      "Enterprise IdP, Local accounts (including break-glass)". Append
#      [ANSWER REQUIRED] to a selection that still needs confirming.
#   4. Then, answer each question for the features the application has,
#      explaining how the capability is implemented, which tool or control
#      enforces it, and how it is verified.
#   5. Use the checklist to tailor your 02-abuse-and-reqs.yml. Each item's
#      `scoping` names the requirement sections that its answer can rule out.
#      Replace a ruled-out section's rows with the text
#      "Not applicable: <reason>" rather than deleting the section, so that
#      the report records what was tailored out and why.
#
# STRUCTURE:
#   The questions follow the same nine SABER focus areas as
#   02-abuse-and-reqs-lib.yml, with the same triggers copied verbatim, so a
#   focus area's applicability is decided once. The report prints these questions
#   first, as "Application Features and Scoping", before the requirements
#   that they scope.
#
#   Applicability works at two levels. First, a focus area's triggers decide
#   whether its block applies at all. Second, within a block, the feature
#   checklist decides which requirement sections apply, since a block's
#   triggers are broad. For example, the Identity block fires on any OAuth
#   or SAML feature, while password requirements apply only where local
#   passwords exist.
#
#   The checklist comes first for a new model, since it records what the
#   application has before any tags exist. Each item lists its options and
#   whether one or several may be selected, and an option can name the tags
#   it implies (for example, File uploads implies
#   feature:file-upload-processing). Place each implied tag on the asset that
#   actually has the feature, since the checklist describes the application
#   as a whole and cannot say which asset that is. The tags then select the
#   focus area blocks to copy. The report prints the checklist as a table that
#   marks each selected option, along with the sections the item affects and
#   the tags its selections imply. A reviewer checks those tags against the
#   model, and nothing checks them automatically.
#
#   Tags that record evidence of a control (such as the -hardened, ops:, and
#   ir: tags), topology (zone:, net:, and path:), and policy waivers
#   (exception:) are not checklist items. They are placed per asset as the
#   model is built.
#
#   The questions are short on purpose, since the precise criteria live in
#   the requirement rows rather than in the question. Each question is
#   grouped by capability rather than by ASVS, AISVS, or NIST ID, and its
#   comment lists the requirement IDs whose numbered criteria to consult
#   before answering.
#
# FOCUS AREA QUICK-REFERENCE (see 02-abuse-and-reqs-lib.yml for full sourcing
# detail per focus area):
#   IDENTITY                   ASVS V6, V7, V8, V9, V10, NIST SP 800-53 (AC-2(6), AC-2(7))
#   DEVICE AND INFRASTRUCTURE  NIST SP 800-53 (CM, SI, SC, AC, PE families)
#   NETWORK AND ENVIRONMENT    ASVS V12, NIST SP 800-53 (SC-7, AC-18, AC-3, AC-4(6/9/19/25), AU-9, SI-3, SI-7, SC-31, MP-8, CA-3)
#   APPLICATION                ASVS V1, V2, V3, V4, V5, V13, V15, V17
#   ARTIFICIAL INTELLIGENCE    AISVS C1-C10, C11.1-C11.3
#   DATA                       ASVS V11, V14
#   DETECTION                  ASVS V16, AISVS C11.4, C12
#   RESPONSE                   NIST SP 800-53 (IR family)
#   RECOVERY                   NIST SP 800-53 (CP family, plus SA-9, AC-5, SC-12)
# ==============================================================================

categories:

  - name: "Identity"
    triggers:
      - feature:oauth-oidc-provider
      - feature:saml-sp
      - feature:password-reset
      - multi_tenant:true
      - feature:admin-panel
      - mgmt:self-managed-identity
      - mgmt:self-managed-pam

    features:

      - feature: "Authentication mechanisms"
        select: multiple
        options:
          - "Enterprise IdP"
          - "Local accounts (including break-glass)"
          - "MFA"
          - "Out-of-band codes"
          - "Certificates or hardware keys"
          - option: "Self-service password reset"
            tags: [feature:password-reset]
        affects: "ASVS V6.2, V6.4, V6.6, V6.7"
        scoping: >
          If Enterprise IdP is selected without Local accounts (including break-glass), mark
          V6.2 (Password Security) and V6.4 (Authentication Factor Lifecycle and Recovery) not
          applicable. However, a local or break-glass account keeps both in scope for that
          account, and so does Self-service password reset. Additionally, V6.6 applies only if
          Out-of-band codes is selected, and V6.7 only if Certificates or hardware keys is
          selected.

      - feature: "Session model"
        select: multiple
        options:
          - "Application sessions"
          - "IdP-issued tokens"
          - "Federated login"
        affects: "ASVS V7.6"
        scoping: >
          V7.6 (Federated Re-authentication) applies only if Federated login is selected. The
          rest of V7 applies whenever the application keeps a session of any kind.

      - feature: "OAuth, OIDC, and SAML roles"
        select: multiple
        options:
          - option: "OAuth client"
            tags: [feature:oauth-oidc-provider]
          - option: "OAuth resource server"
            tags: [feature:oauth-oidc-provider]
          - option: "OAuth authorization server"
            tags: [feature:oauth-oidc-provider]
          - option: "OIDC client"
            tags: [feature:oauth-oidc-provider]
          - option: "OpenID provider"
            tags: [feature:oauth-oidc-provider]
          - option: "SAML service provider"
            tags: [feature:saml-sp]
          - "Consent management"
          - "None"
        affects: "ASVS V10.2-V10.7"
        scoping: >
          Keep only the V10 sections for the selected roles, namely V10.2 (OAuth client), V10.3
          (OAuth resource server), V10.4 (OAuth authorization server), V10.5 (OIDC client),
          V10.6 (OpenID provider), and V10.7 (Consent management). V9 and V10.1 apply whenever
          any OAuth or OIDC role is selected. Place feature:oauth-oidc-provider on each asset
          that issues or validates the tokens, and feature:saml-sp on each asset in the SAML
          exchange.

      - feature: "Self-managed identity infrastructure"
        select: multiple
        options:
          - option: "Directory"
            tags: [mgmt:self-managed-identity]
          - option: "Certificate authority"
            tags: [mgmt:self-managed-identity]
          - option: "Hybrid sync"
            tags: [mgmt:self-managed-identity]
          - option: "PAM"
            tags: [mgmt:self-managed-pam]
          - "None"
        affects: "AC-2(7), AC-2(6)"
        scoping: >
          If None is selected, mark AC-2(7) and AC-2(6) not applicable. Otherwise, AC-2(7)
          applies to a directory, certificate authority, or hybrid sync, and AC-2(6) to PAM.

      - feature: "Administrative and support access"
        select: multiple
        options:
          - option: "Administrative interface"
            tags: [feature:admin-panel]
          - option: "Vendor remote support"
            tags: [feature:vendor-remote-support]
          - "None"
        affects: "ASVS V8.3, and the Identity block"
        scoping: >
          An administrative interface brings in the Identity block and the
          exposed-admin-interface finding, and vendor remote support brings in the vendor-access
          finding. Place each tag on the asset that offers the access.

    questions:

      # Requirement IDs: ASVS V6.1-ASVS V6.8
      "How is each authentication mechanism implemented, enforced, and documented?": ""

      # Requirement IDs: ASVS V7.1-ASVS V7.6
      "How are sessions created, timed out, ended, and re-authenticated?": ""

      # Requirement IDs: ASVS V8.1-ASVS V8.4
      "How is authorization enforced at the function, data, and field level, and what protects the admin interface?": ""

      # Requirement IDs: ASVS V9.1-ASVS V9.2, ASVS V10.1-ASVS V10.7
      "For each OAuth or OIDC role the asset plays, how are tokens validated and scoped, and how are the flows secured?": ""

      # Requirement IDs: AC-2(7), AC-2(6)
      "How is the self-managed identity infrastructure hardened, and who governs privileged access to it?": ""

  - name: "Device and Infrastructure"
    triggers:
      - machine:container
      - machine:virtual
      - mgmt:self-managed-hardware

    features:

      - feature: "Host hardening and access"
        select: multiple
        options:
          - "Hardening inherited from a managed platform"
          - "Direct administrator access to hosts"
          - "None"
        affects: "AC-17, and any section the platform inherits"
        scoping: >
          If Hardening inherited from a managed platform is selected, mark the inherited
          sections not applicable and name the inherited control in the hardening question.
          Additionally, AC-17 applies only if Direct administrator access to hosts is selected.

      - feature: "Self-managed hosts and workload identity"
        select: multiple
        options:
          - option: "Physical hosts the team administers"
            tags: [mgmt:self-managed-hardware]
          - option: "Workload identity for cloud or platform APIs"
            tags: [mgmt:workload-identity-assigned]
          - "None"
        affects: "PE-3 / SI-7, AC-6"
        scoping: >
          PE-3 / SI-7 applies only if Physical hosts the team administers is selected.
          Additionally, a workload identity brings in the over-privileged workload identity
          finding for each asset that holds one.

    questions:

      # Requirement IDs: CM-14, CM-7, SC-7(21), SC-5, AC-6, CM-6, SI-2, SI-4, AC-17, SC-28
      "How are the containers and VMs hardened, patched, monitored, and administered?": ""

      # Requirement IDs: PE-3 / SI-7
      "How is the self-managed hardware hardened, including its BMC credentials, firmware patching, and secure boot?": ""

  - name: "Network and Environment"
    triggers:
      - net:tls-terminator
      - zone:dmz
      - mgmt:self-managed-network
      - cds:low-side-submitter
      - cds:low-side-receiver
      - cds:low-side-broker
      - cds:high-side-submitter
      - cds:high-side-receiver
      - cds:high-side-broker

    features:

      - feature: "Self-managed network"
        select: multiple
        options:
          - option: "Self-managed segmentation"
            tags: [mgmt:self-managed-network]
          - option: "Self-managed wireless"
            tags: [mgmt:self-managed-network]
          - option: "Self-managed external routing"
            tags: [mgmt:self-managed-network]
          - "None"
        affects: "SC-7, AC-18"
        scoping: >
          SC-7 applies only if Self-managed segmentation is selected, and AC-18 only if
          Self-managed wireless is selected. Self-managed external routing brings in the route
          origin validation finding.

      - feature: "Authorization boundary crossings"
        select: multiple
        options:
          - "Data crosses the authorization boundary"
          - "Media or datasets downgraded to a lower classification"
          - "None"
        affects: "AU-9, AC-3, SC-31, MP-8, CA-3"
        scoping: >
          If None is selected, mark these sections not applicable. Additionally, MP-8 applies
          only if Media or datasets downgraded to a lower classification is selected.

      - feature: "Cross-domain solution roles"
        select: multiple
        options:
          - option: "Low-side submitter"
            tags: [cds:low-side-submitter]
          - option: "Low-side receiver"
            tags: [cds:low-side-receiver]
          - option: "Low-side broker"
            tags: [cds:low-side-broker]
          - option: "High-side submitter"
            tags: [cds:high-side-submitter]
          - option: "High-side receiver"
            tags: [cds:high-side-receiver]
          - option: "High-side broker"
            tags: [cds:high-side-broker]
          - "None"
        affects: "AC-4(19), AC-4(8) / SI-3, AC-3, AC-4(25) / AC-4(9), SI-7"
        scoping: >
          If None is selected, mark the CDS sections not applicable. Otherwise, keep the
          sections that match the selected roles. For example, release-authority gating
          (AC-4(25) / AC-4(9)) applies only to a high-side submitter.

    questions:

      # Requirement IDs: ASVS V12.1-ASVS V12.3
      "How is TLS implemented for external traffic and for service-to-service calls?": ""

      # Requirement IDs: SC-7, AC-18
      "How is the self-managed network segmented, and how is wireless access controlled?": ""

      # Requirement IDs: AC-4(19), AC-4(8) / SI-3, AC-4(25) / AC-4(9), SI-7
      "How are classification markings checked, content inspected and sanitized, and releases approved at the cross-domain solution?": ""

      # Requirement IDs: AU-9, AC-3, SC-31, MP-8, CA-3
      "How is each transfer across the authorization boundary governed and audited?": ""

  - name: "Application"
    triggers:
      - feature:file-upload-processing
      - feature:import-export
      - feature:pdf-generation
      - risk:malware-vector
      - feature:dynamic-code-execution
      - feature:public-api-endpoint
      - feature:graphql-endpoint
      - feature:search-index
      - feature:webhook-receiver
      - feature:websocket
      - feature:ugc-rendering
      - feature:deserialization
      - feature:admin-panel
      - feature:email-sending
      - feature:background-jobs
      - feature:third-party-plugins

    features:

      - feature: "Browser and VDI access"
        select: multiple
        options:
          - "Rendered in a browser"
          - "Sets cookies"
          - "Loads external resources"
          - option: "Accessed through VDI"
            tags: [feature:vdi-path]
          - "None"
        affects: "ASVS V3, V3.3, V3.6"
        scoping: >
          If the application is not rendered in a browser, mark V3 not applicable. Otherwise,
          V3.3 applies only if Sets cookies is selected, and V3.6 only if Loads external
          resources is selected. Access through VDI brings in the VDI clipboard finding.

      - feature: "Code execution and deserialization"
        select: multiple
        options:
          - option: "Dynamic code or template execution"
            tags: [feature:dynamic-code-execution]
          - "Unmanaged or memory-unsafe code"
          - option: "Object deserialization"
            tags: [feature:deserialization]
          - option: "XML deserialization"
            tags: [feature:deserialization]
          - "None"
        affects: "ASVS V1.4, V1.5"
        scoping: >
          V1.4 (Memory, String, and Unmanaged Code) applies only if Unmanaged or memory-unsafe
          code is selected, and V1.5 (Safe Deserialization) only if either deserialization
          option is selected. Dynamic code or template execution brings in the template
          injection finding.

      - feature: "Interfaces exposed"
        select: multiple
        options:
          - option: "Public or B2B API"
            tags: [feature:public-api-endpoint]
          - option: "GraphQL"
            tags: [feature:graphql-endpoint]
          - option: "WebSockets"
            tags: [feature:websocket]
          - option: "Webhook receiver"
            tags: [feature:webhook-receiver]
          - option: "Search over an index"
            tags: [feature:search-index]
          - "None"
        affects: "ASVS V4.3, V4.4, and the Application block"
        scoping: >
          V4.3 applies only if GraphQL is selected, and V4.4 only if WebSockets is selected.
          Place each tag on the asset that exposes the interface.

      - feature: "Content handling"
        select: multiple
        options:
          - option: "File uploads"
            tags: [feature:file-upload-processing, risk:malware-vector]
          - option: "Bulk import or export"
            tags: [feature:import-export]
          - option: "Server-side PDF generation"
            tags: [feature:pdf-generation]
          - option: "Rendering one user's content to others"
            tags: [feature:ugc-rendering]
          - option: "Email built from user input"
            tags: [feature:email-sending]
          - "None"
        affects: "ASVS V5, and the Application block"
        scoping: >
          If no option other than None is selected, mark ASVS V5 not applicable. File uploads
          also implies risk:malware-vector on the data asset that holds the uploaded content.

      - feature: "Platform features"
        select: multiple
        options:
          - option: "Background jobs built from user input"
            tags: [feature:background-jobs]
          - option: "Application cache"
            tags: [feature:caching-layer]
          - option: "Third-party plugins"
            tags: [feature:third-party-plugins]
          - "None"
        affects: "ASVS V15.2, and the Application block"
        scoping: >
          Each selection brings in its matching finding, namely background job injection, cache
          poisoning, or unauthorized plugins. Place each tag on the asset that has the feature.

      - feature: "User-facing flows that could be automated at scale"
        select: one
        options:
          - option: "Yes"
            tags: [feature:sensitive-business-flow]
          - "No"
        affects: "ASVS V2.4"
        scoping: >
          If No is selected, V2.4 (Anti-automation) can be marked not applicable.

    questions:

      # Requirement IDs: ASVS V1.1-ASVS V1.5
      "What prevents injection and unsafe deserialization?": ""

      # Requirement IDs: ASVS V2.1-ASVS V2.4
      "What stops users from skipping business-logic steps or automating abuse?": ""

      # Requirement IDs: ASVS V3.1-ASVS V3.7
      "How are cookies, security headers, CSRF, and origin separation configured for the browser?": ""

      # Requirement IDs: ASVS V4.1-ASVS V4.4
      "How are the HTTP, GraphQL, and WebSocket interfaces secured?": ""

      # Requirement IDs: ASVS V5.1-ASVS V5.4
      "How are uploaded files validated, stored, and served?": ""

      # Requirement IDs: ASVS V13.1-ASVS V13.4
      "How is configuration managed, how do backend services authenticate, and where do secrets live?": ""

      # Requirement IDs: ASVS V15.1-ASVS V15.4
      "How is third-party dependency risk tracked, and which defensive coding practices are enforced?": ""

      # Requirement IDs: ASVS V17.1-ASVS V17.3
      "How are the WebRTC TURN relay, media, and signaling secured?": ""

  - name: "Artificial Intelligence"
    triggers:
      - ai:user-prompt-input
      - ai:indirect-prompt-input
      - technology:ai-llm-endpoint
      - technology:ai-rag-pipeline
      - technology:ai-agent-orchestrator
      - ai:ot-adjacent-output
      - ai:third-party-model-api
      - technology:ai-model-serving
      - technology:ai-model-registry
      - technology:ai-training-pipeline
      - technology:ai-dataset-store
      - technology:ai-eval-pipeline
      - ai:air-gapped-model-delivery
      - technology:ai-rag-ingest-pipeline
      - ai:agent-memory
      - technology:ai-multi-agent-gateway
      - technology:ai-tool-server
      - technology:ai-gateway
      - technology:ai-vector-store
      - ai:code-execution
      - ai:skills-enabled
      - ai:human-labeling
      - ai:endpoint-assistant

    features:

      - feature: "Model sourcing"
        select: multiple
        options:
          - option: "Vendor-hosted model"
            tags: [ai:third-party-model-api]
          - "Self-hosted model"
          - "Training or fine-tuning"
          - option: "Data labeling"
            tags: [ai:human-labeling]
          - "Model served in production"
          - option: "Model delivered into an air-gapped enclave"
            tags: [ai:air-gapped-model-delivery]
        affects: "AISVS C1, C3, C6, C11.2, C11.3, C11.4, C12"
        scoping: >
          If only Vendor-hosted model is selected, mark C1, C3, and C6 not applicable, and
          record that the vendor covers C11.2 and C11.3. Additionally, C1.2 applies only if Data
          labeling is selected, C3.5 and C12.5 only if Training or fine-tuning is selected, and
          C11.4 and C12 only if Model served in production is selected.

      - feature: "AI deployment"
        select: multiple
        options:
          - "Accelerators the application controls"
          - "Edge or distributed devices"
          - "Tenants sharing the AI infrastructure"
          - "None"
        affects: "AISVS C4.2, C4.3, C5.3"
        scoping: >
          C4.2 applies only if Accelerators the application controls is selected, C4.3 only if
          Edge or distributed devices is selected, and C5.3 only if Tenants sharing the AI
          infrastructure is selected.

      - feature: "Agent capabilities"
        select: multiple
        options:
          - option: "Memory or RAG index"
            tags: [ai:agent-memory]
          - "Tool calls"
          - "MCP servers"
          - option: "Code execution by the agent"
            tags: [ai:code-execution]
          - option: "Agent skills"
            tags: [ai:skills-enabled]
          - "Source citation in output"
          - "None"
        affects: "AISVS C7.4, C8, C9, C10"
        scoping: >
          C8 applies only if Memory or RAG index is selected, C9 only if Tool calls is selected,
          C10 only if MCP servers is selected, and C7.4 only if Source citation in output is
          selected.

      - feature: "AI inputs and outputs"
        select: multiple
        options:
          - option: "Prompts from end users"
            tags: [ai:user-prompt-input]
          - option: "External content read by the model"
            tags: [ai:indirect-prompt-input]
          - option: "Output used for consequential decisions"
            tags: [ai:decision-support-output]
          - option: "Output that can reach OT or safety-critical processes"
            tags: [ai:ot-adjacent-output]
          - option: "AI assistant on user endpoints"
            tags: [ai:endpoint-assistant]
          - "None"
        affects: "AISVS C2, C7, and the AI block"
        scoping: >
          AISVS C2 applies whenever prompts or external content reach the model. Each selection
          brings in its matching finding, such as direct or indirect prompt injection,
          overreliance, or an ungated path to OT actuation.

    questions:

      # Requirement IDs: AISVS C1.1-AISVS C1.3, AISVS C3.1-AISVS C3.5, AISVS C6.1-AISVS C6.2
      "How are training data, labeling, and model artifacts secured, and how are model integrity and provenance verified?": ""

      # Requirement IDs: AISVS C2.1-AISVS C2.2, AISVS C8.1-AISVS C8.3
      "How is untrusted input, including retrieved and embedded content, screened before it reaches the model, and who can access the memory or RAG index?": ""

      # Requirement IDs: AISVS C4.1-AISVS C4.3, AISVS C5.1-AISVS C5.3
      "How are AI workloads isolated, and how is access to AI resources authenticated and authorized?": ""

      # Requirement IDs: AISVS C7.1-AISVS C7.4
      "How is model output validated and bounded before users or downstream systems receive it?": ""

      # Requirement IDs: AISVS C9.1-AISVS C9.6, AISVS C10.1-AISVS C10.4
      "What constrains the agent and its tools, and how are its MCP servers sourced, authenticated, and validated?": ""

      # Requirement IDs: AISVS C11.1-AISVS C11.3
      "How is the model hardened against adversarial input, membership inference, and extraction?": ""

  - name: "Data"
    triggers:
      - type:datastore
      - technology:vault
      - data:external-feed-ingest
      - data:release-candidate
      - feature:import-export
      - cds:high-side-submitter
      - cds:high-side-broker
      - data:pii

    features:

      - feature: "In-use and client-side data"
        select: multiple
        options:
          - "Data protected while in use"
          - "Sensitive data reaches a client"
          - "None"
        affects: "ASVS V11.7, V14.3"
        scoping: >
          V11.7 (In-Use Data Cryptography) applies only if Data protected while in use is
          selected, which is typically an L3 requirement. Additionally, V14.3 (Client-side Data
          Protection) applies only if Sensitive data reaches a client is selected.

      - feature: "Sensitive data handled"
        select: multiple
        options:
          - option: "Personal information"
            tags: [data:pii]
          - option: "Credentials or keys"
            tags: [data:credential]
          - option: "Credentials brokered for other services"
            tags: [sec:secrets-broker]
          - option: "Ongoing external data feeds"
            tags: [data:external-feed-ingest]
          - option: "Files or datasets released outside the boundary"
            tags: [data:release-candidate]
          - "None"
        affects: "ASVS V14, and the Data block"
        scoping: >
          Each selection brings in its matching finding, such as the privacy impact assessment,
          the credential blast radius, data provenance, or re-identification of released data.
          Place data:pii, data:credential, and data:release-candidate on the assets or data
          assets that hold the data.

    questions:

      # Requirement IDs: ASVS V11.1-ASVS V11.7
      "How are cryptographic keys managed, and are the algorithms approved?": ""

      # Requirement IDs: ASVS V14.1-ASVS V14.3
      "How is sensitive data classified and protected at rest, in transit, and on the client?": ""

  - name: "Detection"
    triggers:
      - feature:public-api-endpoint
      - machine:container
      - technology:ai-observability-stack

    questions:

      # Requirement IDs: ASVS V16.1-ASVS V16.5
      "What is logged, where do the logs go, and what do error messages reveal?": ""

      # Requirement IDs: AISVS C11.4, AISVS C12.1-AISVS C12.5
      "How is the model monitored for anomalies, abuse, and drift, and is its lifecycle audited?": ""

  - name: "Response"
    triggers:
      - zone:dmz
      - sec:secrets-broker

    features:

      - feature: "Incident reporting requirement"
        select: one
        options:
          - "Yes"
          - "No"
        affects: "IR-6"
        scoping: >
          IR-6 applies only if Yes is selected, meaning a contract or regulation (for example,
          DFARS 252.204-7012) sets a reporting timeline. The other IR sections apply to every
          asset in the Response focus area.

    questions:

      # Requirement IDs: IR-4, IR-4, IR-3, IR-6
      "How are containment, credential rotation, and incident reporting handled, and have they been tested?": ""

  - name: "Recovery"
    triggers:
      - ops:requires-backup
      - ops:vendor-hosted-service

    features:

      - feature: "Vendor-hosted or SaaS components"
        select: one
        options:
          - "Yes"
          - "No"
        affects: "SA-9"
        scoping: >
          SA-9 applies only if Yes is selected.

      - feature: "Data that requires backup"
        select: one
        options:
          - option: "Yes"
            tags: [ops:requires-backup]
          - "No"
        affects: "CP-9 / AC-5, CP-2, CP-4, SC-12, and the Recovery block"
        scoping: >
          If Yes is selected, place ops:requires-backup on each asset whose data must survive
          its loss, which brings in the backup findings for that asset.

    questions:

      # Requirement IDs: CP-9 / AC-5, CP-2, CP-4, SA-9, SC-12
      "How is the asset backed up, what are its RTO and RPO, and has a restore been tested?": ""
