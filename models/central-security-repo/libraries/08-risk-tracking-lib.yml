# ==============================================================================
# CONTINUOUS COMPLIANCE LEDGER: risk_tracking
# Maintainer: Application Development Team & ISSO
#
# PURPOSE:
# This file serves as the formal ledger for tracking, mitigating, and accepting 
# the security risks identified by the Threagile engine and the enterprise 
# Python compliance script (inject_risks.py).
#
# USAGE INSTRUCTIONS (The "Risk Lifecycle & Inheritance" Method):
# 1. RUN the Threagile pipeline to generate your initial Risk Report (Excel/PDF).
# 2. IDENTIFY any 'Open' risks assigned to your application's technical assets.
# 3. OPEN the Enterprise Risk Tracking Library (e.g., 08-risk-tracking-lib.yml) 
#    located in the central security repository.
# 4. MATCH your 'Open' risks against the library. If the risk is a known 
#    Platform Inherited Mitigation or False-Positive, COPY the justification 
#    block exactly as written and PASTE it below.
# 5. REPLACE the `<app-specific-asset-id>` placeholder in the copied key 
#    with the exact Technical Asset ID flagged in your report.
# 6. For any remaining application-specific risks NOT found in the library, 
#    CREATE a new tracking block below using the exact syntax: 
#    [risk-category-id]@[technical-asset-id]:
# 7. ASSIGN a valid 'status' to your custom risk:
#    - unchecked:      (Default) Risk has not been reviewed.
#    - in-discussion:  Risk is being evaluated by the team.
#    - in-progress:    Active development/engineering is underway to fix it.
#    - mitigated:      A technical control has been implemented.
#    - accepted:       Formal AO approval (POA&M) is on file to accept the risk.
#    - false-positive: The engine flagged a risk that is contextually invalid.
# 8. PROVIDE a detailed 'justification' explaining exactly *how* the risk
#    is mitigated or *why* it is accepted.
# 9. LINK an official issue tracker or POA&M number in the 'ticket' field.
#
# FOR status: accepted ENTRIES SPECIFICALLY, structure the 'justification'
# text itself around four labeled elements below -- deliberately NOT new
# top-level YAML keys. risk_tracking's only real fields are status,
# justification, ticket, date, and checked_by (00-threagile-field-
# reference.yml's risk_tracking_fields) -- this file's content is merged
# straight into the model Threagile itself parses, and an unrecognized
# key risks a strict-schema failure in Threagile's own Go parser (not
# verified safe either way; treat "free text inside justification" as the
# only guaranteed-safe place for this until it is). An acceptance with
# none of these four elements is a standing waiver nobody is on the hook
# to revisit, not a tracked risk decision:
# 10. "Expiration: YYYY-MM-DD" -- an acceptance with no expiration is a
#     permanent waiver nobody is on the hook to revisit. Re-decide (don't
#     silently renew) at expiration: re-run the acceptance decision
#     against current conditions rather than just pushing the date out.
# 11. "Extension count: N" (starts at 0, incremented each time the
#     acceptance is re-decided past its original expiration) -- a risk
#     accepted once and extended eleven times should not read identically
#     in the ledger to one accepted once and never revisited.
# 12. "Compensating measures: ..." -- the specific technical or
#     procedural control relied upon (e.g., "network-isolated to the
#     management VNet, monitored via X"), stated separately from the rest
#     of the narrative justification. A residual risk with nothing listed
#     here usually means an unstated assumption that some other control
#     covers it.
# 13. "Accepting authority: ..." (ISSO / ISSM / PMO ISSE / AO) -- named at
#     a tier matching the finding's severity, especially relevant once
#     inject_risks.py's severity-escalation rule (see CLAUDE.md) has
#     bumped a finding a level.
# ==============================================================================

# NOTE:
# For risk tracking each risk-id needs to be defined (the string with the @ sign in it). These unique risk IDs
# are visible in the PDF report (the small grey string under each risk), the Excel (column "ID"), as well as the JSON responses.
# Some risk IDs have only one @ sign in them, while others multiple. The idea is to allow for unique but still speaking IDs.
# Therefore each risk instance creates its individual ID by taking all affected elements causing the risk to be within an @-delimited part.
# Using wildcards (the * sign) for parts delimited by @ signs allows to handle groups of certain risks at once. Best is to lookup the IDs
# to use in the created Excel file. Alternatively a model macro "seed-risk-tracking" is available that helps in initially
# seeding the risk tracking part here based on already identified and not yet handled risks.

risk_tracking: {}
