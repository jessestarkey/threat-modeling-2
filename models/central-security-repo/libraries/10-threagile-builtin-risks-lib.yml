# ==============================================================================
# THREAGILE BUILT-IN RISK REFERENCE: 10-threagile-builtin-risks-lib.yml
# ==============================================================================
# Live dependency, read directly by generate_report.py -- same tier as
# 09-custom-risks-lib.yml (see central-security-repo's CLAUDE.md section for
# the live-dependency/reference-catalog distinction). Not read by
# inject_risks.py: this file never injects anything, it only supplies
# enrichment content (description/impact/asvs/cheat_sheet/risk_assessment/
# false_positives/detection_logic/references) for Threagile's OWN built-in
# Go risk rules, the same way 09-custom-risks-lib.yml does for our custom
# categories -- so "Identified Risks by Vulnerability Category" and the
# Risk Category Reference section can show a real Description/Impact for a
# built-in finding (e.g. Missing Authentication, SQL/NoSQL Injection).
#
# WHERE ACTION / MITIGATION LIVE -- not here. A built-in finding's Action and
# Mitigation text in the report comes exclusively from Threagile's own
# risks.xlsx export, which is populated from the hardcoded Action:/
# Mitigation: string literals in each rule's Go source in the
# jessestarkey/threagile fork (pkg/risks/builtin/*_rule.go). Those were
# rewritten in the fork in the same pass as this file; edit them there, not
# by adding action/mitigation keys here (generate_report.py would ignore
# them).
#
# PROVENANCE -- this file started as a one-time extraction of Threagile's
# own upstream rule text from the pinned `threagile/threagile:0.9.1` image
# (`-explain-risk-rules` for descriptions, PyMuPDF parsing of the native
# report.pdf for the rest, plus the small handcrafted
# threagile-builtin-probe-model.yml in this directory to make the 3 rules
# none of our real models trigger -- container-platform-escape,
# missing-identity-provider-isolation, service-registry-poisoning -- fire
# somewhere). That upstream text proved too thin to act on (e.g. the
# Cross-Site Scripting description in its entirety was "For each web
# application Cross-Site Scripting (XSS) risks might arise"), so every
# entry's description/impact/risk_assessment was rewritten by this project
# to the depth of 09-custom-risks-lib.yml, with two new fields:
#   - detection_logic: how to actually find/verify this condition in a real
#     system (tooling, queries, test cases), not Threagile's own rule-match
#     logic.
#   - references: CWE / CAPEC / MITRE ATT&CK / OWASP Top 10:2025 / OWASP API
#     Security Top 10:2023 / NIST citations where genuinely applicable.
# asvs/cheat_sheet/false_positives were kept where adequate and tightened
# where not. Each risk_assessment describes how the jessestarkey/threagile
# fork actually scores the rule (baseline Likelihood/Impact and the
# escalation conditions read from the Go source), including the fork's
# shared computeLikelihood() nudge where that rule applies it: +1 step at
# RAA >= 40%, -1 step at RAA < 15%, and +1 step if the asset is
# internet-reachable (native internet flag or the net:internet-reachable
# tag).
#
# COVERAGE -- all 35 built-in categories with enrichment, i.e. every
# built-in rule except the 7 pure model-authoring failures in
# generate_report.py's MODEL_FAILURE_CATEGORY_IDS (which render in
# "Potential Model Failures" and never consult this file).
# missing-build-infrastructure and missing-identity-store ARE included --
# they're real risk categories in our pipeline, not in
# MODEL_FAILURE_CATEGORY_IDS. mixed-targets-on-shared-runtime is included
# here for enrichment, but its Go Action/Mitigation were deliberately left
# untouched in the fork's rewrite pass.
#
# MAINTENANCE -- this content is now hand-authored and owned by this
# project. If the fork's rule logic changes (new escalation conditions,
# thresholds, or a re-based upstream Threagile version), update the
# matching risk_assessment here by hand; re-running the original
# extraction would overwrite this content with the thin upstream text.
# ==============================================================================

builtin_risks:

  accidental-secret-leak:
    title: "Accidental Secret Leak"
    description: >
      A source repository (including its commit history) or an artifact or container registry in
      scope contains plaintext secrets, or has no control that keeps them out. Deleting a secret in
      a later commit does not remove it, since it remains in the history, every clone, and every
      pushed image layer.
    impact: >
      If this risk remains unmitigated, anyone who can read the repository, a clone, a CI log, or a
      pulled image recovers working credentials for databases, cloud control planes, or partner
      APIs. For an IL5 system, one leaked cloud key can expose all the CUI it reaches, and it is a
      reportable incident.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely, and impact starts at Low. Impact steps on the confidentiality of
      the data that the repository or registry processes, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. In practice, however, any confirmed live secret in the history is High regardless of
      score until it has been rotated, since the exposure is already complete.
    false_positives: >
      A repository or registry can be treated as a false positive after review when it meets three
      conditions: (1) it already enforces server-side push protection and CI secret scanning, (2)
      its full history and existing image layers have been scanned clean, or every finding has been
      rotated and purged, and (3) the review confirms both. Additionally, detected strings that are
      verifiably non-functional, such as documented test fixtures and revoked or placeholder values,
      are not exposures.
    detection_logic: >
      Run gitleaks or trufflehog against the full history of every in-scope repository (git log
      --all, including all branches and tags), and run trufflehog or the registry's native secret
      scanner against every image layer in the registry. Next, verify that push protection is
      enabled by attempting to push a commit that contains a canary AWS-format key to a scratch
      branch, and confirm that the push is rejected. Additionally, check the CI logs for echoed
      environment variables. Finally, for each candidate secret, confirm whether it is live (with
      trufflehog verification) and whether the issuer shows it as rotated.
    references: >
      CWE-798 (Use of Hard-coded Credentials); CWE-540 (Inclusion of
      Sensitive Information in Source Code); MITRE ATT&CK T1552.001
      (Credentials In Files); MITRE ATT&CK T1213.003 (Code Repositories);
      NIST SP 800-53 IA-5(7)

  code-backdooring:
    title: "Code Backdooring"
    description: >
      A build pipeline, source repository, or developer client is exposed to the internet or to
      unmanaged developer clients. Thus, an attacker with a stolen developer credential, CI runner,
      plugin, or dependency can insert code that the organization then builds, signs, and ships as a
      trusted release (as in SolarWinds SUNBURST).
    impact: >
      If this risk remains unmitigated, the attacker gains code execution with the application's
      privileges in every environment that deploys the release. The artifact passes every signature
      check, so the compromise persists and typically goes undetected for months.
    asvs: "V10 - Malicious Code Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Medium. Impact steps on the higher of the
      confidentiality and integrity of the data that the asset processes, one level lower for a code
      inspection platform, and moves one level up for a rating of Confidential/Critical or above and
      one level down for Internal/Operational or below. Additionally, likelihood moves one level
      with the asset's attractiveness (RAA) and internet exposure. Treat the finding as High for any
      pipeline that deploys to production without signed provenance verification at the target,
      since that removes the last control able to catch a backdoored artifact.
    false_positives: >
      The finding can be accepted after review when the source repository and build pipeline meet
      three conditions: (1) they are reachable only from managed developer endpoints over VPN or
      zero-trust access, with no direct internet exposure and no unmanaged clients, (2) they enforce
      reviewed and signed commits, and (3) they produce signed provenance that the deployment
      targets verify.
    detection_logic: >
      Inventory the network exposure of the repository and the CI system, such as public IPs,
      publicly resolvable hostnames, and the absence of a conditional-access or IP-allowlist policy.
      Additionally, review the branch protection settings on release branches for required reviews,
      signed commits, and admin bypass. Compare the CI pipeline definitions and third-party action
      references for mutable tags rather than pinned SHAs. Then, verify that the deployment target
      rejects an unsigned or provenance-less artifact by attempting to deploy one to a
      non-production environment. Finally, compare the built artifacts against a reproducible
      rebuild where feasible.
    references: >
      CWE-506 (Embedded Malicious Code); CWE-494 (Download of Code Without
      Integrity Check); CAPEC-444 (Development Alteration); MITRE ATT&CK
      T1195.002 (Compromise Software Supply Chain); OWASP Top 10:2025 A03
      (Software Supply Chain Failures); NIST SP 800-218 (SSDF) PS.1, PS.2;
      SLSA v1.0 Build Track

  cluster-control-plane-audit-gap:
    title: Container Orchestrator Control-Plane Audit Logging Gap
    description: >
      The cluster's API server audit policy is left at its default, which does not capture pod exec,
      attach, and port-forward, secret access, or admission-controller decisions. This rule attaches
      once to the cluster rather than once per container.
    impact: >
      If this risk remains unmitigated, post-compromise lateral movement inside the cluster leaves
      no audit trail for an incident responder to reconstruct.
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html
    risk_assessment: >
      Likelihood starts at Likely, taken from the most attractive container on the cluster, and
      impact starts at Low. Impact steps on the highest integrity rating among the cluster's
      containers, moving one level up for a rating of Confidential/Critical or above and one level
      down for Internal/Operational or below. Additionally, likelihood moves one level with the
      asset's attractiveness (RAA) and internet exposure. Treat any cluster that runs the API
      server's default audit policy, or none at all, as High.
    false_positives: >
      The finding fires once per shared runtime that runs in-scope containers, and once for any
      in-scope container that runs on no shared runtime. Thus, model each cluster as a shared
      runtime, so that the finding lands on it once.
    detection_logic: >
      Review the API server's configured audit policy for coverage of exec, attach, and
      port-forward, secret access, and admission decisions. Then, confirm that the audit log is
      forwarded to the SIEM.
    references: >
      CWE-778 (Insufficient Logging); NIST SP 800-53 AU-2 and AU-12; CIS Kubernetes Benchmark
      (Control Plane Logging); MITRE ATT&CK T1609 (Container Administration Command)

  container-platform-escape:
    title: "Container Platform Escape"
    description: >
      This container platform (Kubernetes, OpenShift, or a Docker host) does not prevent workloads
      from breaking container isolation, through privileged containers, host mounts or namespaces, a
      mounted runtime socket, excessive capabilities, over-privileged service accounts, or unpatched
      kernel and runtime flaws. Owning one node means owning every container on it.
    impact: >
      If this risk remains unmitigated, code execution in any single container can escalate to the
      node and then the cluster. From there, an attacker reads every co-located workload's secrets
      and data, persists, and pivots to the cloud control plane through node identities or the
      metadata service.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at High. Impact steps on the highest of the
      confidentiality, integrity, and availability of the data that the container processes, moving
      one level up for a rating of Confidential/Critical or above and one level down for
      Internal/Operational or below. Additionally, likelihood moves one level with the asset's
      attractiveness (RAA) and internet exposure. Raise the finding to High where privileged pods or
      hostPath mounts are permitted in workload namespaces, since that reduces an escape to a single
      API call.
    false_positives: >
      Either of two cases can be treated as a false positive after review: (1) a container platform
      that hosts none of the in-scope workloads, or (2) one validated against the DISA Kubernetes
      STIG or the CIS Kubernetes Benchmark, with the restricted Pod Security Standard enforced on
      every workload namespace.
    detection_logic: >
      Run kube-bench against the nodes and control plane, and kubescape or Polaris against the
      workloads, for STIG and CIS findings. Additionally, query for pods with
      securityContext.privileged set to true, with hostPID, hostNetwork, or hostIPC, with hostPath
      volumes, or with added capabilities (kubectl get pods -A -o json piped through jq). Check the
      namespace labels for pod-security.kubernetes.io enforce=restricted. From a test pod, attempt
      to reach the kubelet API (port 10250) and 169.254.169.254. Furthermore, run kubectl auth can-i
      --list for each workload service account. Finally, alert on the Falco escape rules in
      production, such as container drift and sensitive mounts.
    references: >
      CWE-250 (Execution with Unnecessary Privileges); CWE-269 (Improper
      Privilege Management); MITRE ATT&CK T1611 (Escape to Host); MITRE
      ATT&CK T1610 (Deploy Container); NIST SP 800-190; DISA Kubernetes STIG

  cross-site-request-forgery:
    title: "Cross-Site Request Forgery (CSRF)"
    description: >
      This web application is reached by browsers and may authenticate with ambient credentials
      (session cookies, HTTP Basic, or client certificates). Without a per-session token, an Origin
      check, or SameSite cookies, it cannot tell a request the user intended from one that another
      site forged through the user's browser.
    impact: >
      If this risk remains unmitigated, an attacker can make an authenticated user change
      credentials, grant roles, approve workflows, or alter records under the victim's identity.
      Against an administrator, a single visited link can create accounts or change the security
      configuration.
    asvs: "V4 - Access Control Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible (one level lower for DevOps links), and impact starts at Low.
      Impact steps on the integrity of the data on the request link, moving one level up for a
      rating of Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Raise the finding where administrative or privilege-changing functions are
      cookie-authenticated without a token.
    false_positives: >
      An application can be treated as a false positive when it either (1) authenticates exclusively
      with bearer tokens in the Authorization header, never with cookies or other ambient browser
      credentials, or (2) enforces a verified synchronizer token or an Origin check on every
      state-changing endpoint. Additionally, endpoints that are never invoked from a browser are not
      affected.
    detection_logic: >
      Use Burp Suite or OWASP ZAP to replay each state-changing request with the anti-CSRF token
      removed, altered, or taken from another session, as well as with a foreign Origin header, and
      confirm that each is rejected. Additionally, inspect the Set-Cookie headers for SameSite
      attributes, and confirm that no state change is reachable through GET. Build a minimal
      cross-origin HTML form as a proof of concept for any endpoint that accepts the forged request.
      Finally, run Semgrep rules for disabled framework CSRF protection, such as csrf_exempt or
      csrf().disable().
    references: >
      CWE-352 (Cross-Site Request Forgery); CWE-1275 (Sensitive Cookie with
      Improper SameSite Attribute); CAPEC-62 (Cross Site Request Forgery);
      OWASP Top 10:2025 A01 (Broken Access Control); NIST SP 800-53 SC-23
      (Session Authenticity)

  cross-site-scripting:
    title: "Cross-Site Scripting (XSS)"
    description: >
      This web application renders data from an untrusted source (request parameters, stored
      content, imported files, or upstream APIs) into HTML, JavaScript, or URL contexts without
      context-appropriate encoding, or passes it to dangerous DOM sinks. Thus, attacker-supplied
      script runs in the victim's browser under this application's origin.
    impact: >
      If this risk remains unmitigated, injected script acts with the victim's full session, reading
      any data and performing any action the victim can, including administrative ones. Stored XSS
      reaches every user who views the page, so one that administrators can reach is a full
      compromise.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely, and impact starts at Medium. Impact steps on the higher of the
      confidentiality and integrity of the data that the asset processes, moving one level up for a
      rating of Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Treat any confirmed stored XSS that privileged users can reach as High. However, a
      reflected XSS mitigated by a strict, nonce-based CSP can be rated lower.
    false_positives: >
      Assets that a browser or browser-like component never renders can be treated as false
      positives after review. These are pure machine-to-machine APIs that return JSON with a correct
      non-HTML Content-Type and X-Content-Type-Options set to nosniff.
    detection_logic: >
      Run DAST (an OWASP ZAP active scan or Burp Suite Scanner) with context-specific payloads
      against every input, including stored-input flows that render on other pages. Additionally,
      run SAST (Semgrep or CodeQL) for sinks that request data reaches, such as innerHTML,
      dangerouslySetInnerHTML, bypassSecurityTrustHtml, Html.Raw, the Jinja |safe filter, and
      v-html. Inspect the Content-Security-Policy response header for unsafe-inline, unsafe-eval,
      wildcard sources, or its absence, and verify that session cookies carry HttpOnly. Finally, in
      production, collect CSP violation reports, and alert on inline-script violations.
    references: >
      CWE-79 (Improper Neutralization of Input During Web Page Generation);
      CAPEC-63 (Cross-Site Scripting); CAPEC-588 (DOM-Based XSS); CAPEC-592
      (Stored XSS); MITRE ATT&CK T1189 (Drive-by Compromise); OWASP Top
      10:2025 A05 (Injection)

  dos-risky-access-across-trust-boundary:
    title: "DoS-risky Access Across Trust-Boundary"
    description: >
      An asset rated Critical or Mission-Critical for availability accepts flows from callers in
      another trust boundary, possibly through intermediate hops, with no evidence of throttling,
      quotas, or redundancy. Those callers can exhaust its resources with floods, slow requests, or
      a few expensive requests.
    impact: >
      If this risk remains unmitigated, an attacker can make an availability-critical function
      unavailable for the duration of the attack. Because other components depend on the asset, the
      outage can cascade through retries and queued work, which directly affects mission execution.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Low. Impact steps on the asset's
      availability, and since the rule fires only at Critical availability or above, it lands at
      Medium. However, it is one level lower when the link is VPN-protected or IP-filtered, or when
      the asset is redundant. Each impact step moves one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Load balancers are excluded.
    false_positives: >
      Three kinds of flow can be treated as false positives after review: (1) flows whose target
      operations are cheap and bounded, (2) flows to assets deployed redundantly behind autoscaling
      with enforced per-client rate limits, and (3) flows restricted to VPN or IP-allowlisted
      callers.
    detection_logic: >
      Review the gateway or ingress configuration for per-client rate limits, connection and
      body-size limits, and timeouts. Then, run controlled load tests (k6, JMeter, or Locust)
      against a non-production replica, including slow-request and expensive-query cases, and record
      the request rate at which the latency or error-rate objectives are breached. Additionally,
      confirm that the asset runs more than one instance across zones. Finally, in production, alert
      on sustained HTTP 429 and 503 rates, connection saturation, and abnormal per-client request
      rates in the WAF or gateway logs.
    references: >
      CWE-400 (Uncontrolled Resource Consumption); CWE-770 (Allocation of
      Resources Without Limits or Throttling); CAPEC-125 (Flooding); MITRE
      ATT&CK T1498 (Network Denial of Service); MITRE ATT&CK T1499 (Endpoint
      Denial of Service); OWASP API Security Top 10:2023 API4 (Unrestricted
      Resource Consumption); NIST SP 800-53 SC-5

  ldap-injection:
    title: "LDAP-Injection"
    description: >
      An in-scope client queries this LDAP directory. If caller-supplied values (such as a login
      username or a search term) are concatenated into a search filter or distinguished name without
      RFC 4515 or RFC 4514 escaping, an attacker can inject metacharacters that rewrite the query,
      such as a filter that matches any user.
    impact: >
      If this risk remains unmitigated, an attacker can bypass LDAP-backed authentication and
      enumerate every account, group, and attribute that the bind account can read. Where the
      application writes to the directory, the attacker can also change group membership to escalate
      privilege.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible (one level lower for DevOps links), and impact starts at Medium.
      Impact steps on the higher of the confidentiality and integrity of the data that the asset
      processes, moving one level up for a rating of Confidential/Critical or above and one level
      down for Internal/Operational or below. Additionally, likelihood moves one level with the
      asset's attractiveness (RAA) and internet exposure. Raise the finding where the directory is
      the application's authentication source.
    false_positives: >
      After code review, LDAP queries can be treated as false positives when they are built solely
      from server-side constants, or from caller input that passes through a library escaping
      function or a parameterized filter builder on every code path.
    detection_logic: >
      Search the code with grep, Semgrep, or CodeQL for LDAP search and bind calls (such as
      DirContext.search, the ldap3 search, or DirectorySearcher.Filter) whose filter string is built
      by concatenating or formatting request data. Additionally, in DAST, submit filter
      metacharacters (an asterisk, )(uid=*, or *)(|(objectClass=*)) in the login and search fields,
      and look for changed result counts or authentication success. Review the bind account's
      directory permissions. Finally, alert on directory logs that show wildcard-heavy or unusually
      broad searches from the application's bind account.
    references: >
      CWE-90 (Improper Neutralization of Special Elements used in an LDAP
      Query); CAPEC-136 (LDAP Injection); MITRE ATT&CK T1190 (Exploit
      Public-Facing Application); MITRE ATT&CK T1087 (Account Discovery);
      OWASP Top 10:2025 A05 (Injection); NIST SP 800-53 SI-10

  missing-authentication:
    title: "Missing Authentication"
    description: >
      A flow into this asset carries sensitive data, or the asset is multi-tenant, yet the flow has
      no authentication. Thus, the asset accepts requests from anything that can reach it, as with
      internal services behind a firewall, management endpoints that ship open, or backends that
      trust a gateway.
    impact: >
      If this risk remains unmitigated, any attacker who reaches the endpoint (from the internet, a
      compromised neighbor, or an SSRF flaw elsewhere) can read and change its sensitive data with
      no identity attached. Those actions are also unattributable, which defeats audit requirements.
    asvs: "V2 - Authentication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely, and impact starts at Medium. Impact steps on the highest rating
      of the data on the unauthenticated link, or of the target asset when the link carries no data,
      moving one level up for a rating of Confidential/Critical or above and one level down for
      Internal/Operational or below. Additionally, likelihood moves one level with the asset's
      attractiveness (RAA) and internet exposure. The rule excludes monitoring callers, in-process
      calls, and load balancers, reverse proxies, WAFs, IDS/IPS, and service registries. Treat any
      unauthenticated path to CUI as High.
    false_positives: >
      Where authentication genuinely occurs but was not modeled (for example, mutual TLS enforced by
      a service mesh), fix the model rather than accepting the finding. However, assets that serve
      only intentionally public, non-sensitive content can be treated as false positives after
      review.
    detection_logic: >
      Enumerate every listening endpoint of the asset (from service definitions, ingress routes,
      OpenAPI specs, and port scans from a neighboring subnet), and call each one without
      credentials, expecting an HTTP 401 or 403, or a TLS handshake failure for mTLS. Specifically,
      probe the default management paths (/actuator, /metrics, /_cat, /debug, and /admin).
      Additionally, review the service mesh's PeerAuthentication and AuthorizationPolicy for STRICT
      mode, and run SAST for route handlers that lack authentication decorators or middleware.
      Finally, alert on successful requests in the access logs that have no authenticated principal.
    references: >
      CWE-306 (Missing Authentication for Critical Function); CWE-287
      (Improper Authentication); MITRE ATT&CK T1190 (Exploit Public-Facing
      Application); OWASP Top 10:2025 A07 (Authentication Failures); OWASP
      API Security Top 10:2023 API2 (Broken Authentication); NIST SP 800-53
      IA-2, IA-9

  missing-authentication-second-factor:
    title: "Missing Two-Factor Authentication (2FA)"
    description: >
      Human users reach this asset, which handles highly sensitive data, through a flow
      authenticated by a single factor, traced back through non-authenticating hops such as proxies
      to the originating client. Phishing, password reuse, credential stuffing, and password
      spraying all defeat single-factor authentication at low cost.
    impact: >
      If this risk remains unmitigated, one stolen or guessed password gives an attacker a fully
      authenticated session with that user's access. For federal and DoD systems, password-only
      access to sensitive systems does not comply with OMB M-22-09 or the DoD CAC requirements, and
      it blocks authorization.
    asvs: "V2 - Authentication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely, and impact starts at Medium. Impact steps on the highest rating
      of the data on the human-facing link, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Raise the finding to High for internet-reachable administrative or privileged
      access, and for any access path that accepts only phishable factors (SMS, voice, or push
      without number matching).
    false_positives: >
      Some access paths enforce MFA upstream, through the identity provider's conditional-access
      policy for every user and session, while the model simply does not flag the flow as
      two-factor. Correct the model for those paths, and close the finding once the policy is
      verified. Additionally, assets that do not handle user-linked data or functionality may also
      be false positives after review.
    detection_logic: >
      Review the identity provider's conditional-access or authentication policies scoped to this
      application for an MFA requirement that excludes no users, groups, locations, or
      legacy-protocol clients. Then, attempt to sign in with a test account from an unregistered
      device, and confirm that a second factor is demanded. Additionally, query the sign-in logs
      (the Entra ID sign-in logs or the Okta System Log) for successful single-factor
      authentications to this application. Finally, verify that legacy authentication protocols are
      blocked.
    references: >
      CWE-308 (Use of Single-factor Authentication); MITRE ATT&CK T1078
      (Valid Accounts); MITRE ATT&CK T1110 (Brute Force); MITRE ATT&CK T1621
      (Multi-Factor Authentication Request Generation); OWASP Top 10:2025 A07
      (Authentication Failures); NIST SP 800-63B; NIST SP 800-53 IA-2(1),
      IA-2(2); OMB M-22-09

  missing-build-infrastructure:
    title: "Missing Build Infrastructure"
    description: >
      The model contains in-scope custom-developed components but no devops client, source
      repository, or build pipeline. Thus, none of the supply-chain rules can evaluate how code
      reaches production. This is a gap in the model's completeness, not proof that the build path
      is insecure.
    impact: >
      If this risk remains unmitigated, the pipeline that produces trusted releases, which is the
      most consequential attack path against custom software, stays invisible. Its controls are
      never assessed, and the authorization package omits a component that can alter every
      production artifact.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at a flat Unlikely, and impact starts at a flat Low. This is a whole-model
      check, so the asset it names is only an example, and that asset's ratings and attractiveness
      do not move the score.
    false_positives: >
      Two kinds of model can be treated as false positives after review: (1) a model with no
      custom-developed components (only configured COTS or SaaS), and (2) a model whose build
      platform is covered by a separately authorized enterprise pipeline that is explicitly
      referenced as an inherited control. However, prefer modeling such a pipeline as out-of-scope
      assets instead.
    detection_logic: >
      Compare the model's technical assets marked with custom_developed_parts against the presence
      of the devops-client, sourcecode-repository, and build-pipeline technologies. Then, interview
      the development team, or read the CI configuration (.github/workflows, azure-pipelines.yml, or
      .gitlab-ci.yml), to identify every repository, runner, and registry that actually produces
      deployed artifacts. Finally, confirm that each one appears in the model with links to its
      deployment targets.
    references: >
      NIST SP 800-218 (SSDF) PO.3, PO.5; NIST SP 800-53 SA-15, SR-3, PL-8;
      MITRE ATT&CK T1195.002 (Compromise Software Supply Chain)

  missing-cloud-hardening:
    title: "Missing Cloud Hardening"
    description: >
      This cloud asset, trust boundary, or shared runtime is not marked as hardened against its
      provider's baseline (the CIS Foundations Benchmark or the DISA Cloud Computing SRG). Typical
      gaps are public storage or database endpoints, missing control-plane audit logging, long-lived
      access keys, IMDSv1, and over-broad role assignments.
    impact: >
      If this risk remains unmitigated, an attacker can reach cloud resources through paths that
      bypass the application, such as public storage, leaked keys, or metadata credentials stolen
      through SSRF. Without audit logging, that access goes unnoticed and cannot be reconstructed.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secure_Cloud_Architecture_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Low. Impact steps on the integrity rating
      of the asset, shared runtime, or trust boundary (meaning its highest-rated content), moving
      one level up for a rating of Confidential/Critical or above and one level down for
      Internal/Operational or below. Additionally, likelihood moves one level with the asset's
      attractiveness (RAA) and internet exposure. Treat any publicly accessible store of CUI as High
      regardless of score.
    false_positives: >
      Two kinds of component can be treated as false positives after review: (1) cloud components
      that run no part of the target architecture, and (2) components already scored against the
      provider benchmark in a continuous posture-management tool with no open failed controls, as
      evidenced by a compliance report.
    detection_logic: >
      Pull the regulatory compliance or benchmark report for the in-scope resources from Microsoft
      Defender for Cloud, AWS Security Hub (with the CIS AWS Foundations and NIST 800-53 standards),
      or GCP Security Command Center, and list the failed controls. Additionally, supplement it with
      Prowler or ScoutSuite runs. Specifically, query for (1) public network access enabled on
      storage, databases, and key vaults, (2) instances with IMDSv1 enabled, (3) access keys older
      than 90 days, (4) role assignments with Owner, Contributor, or AdministratorAccess on broad
      scopes, and (5) missing diagnostic settings or CloudTrail trails.
    references: >
      CWE-16 (Configuration); MITRE ATT&CK T1530 (Data from Cloud Storage);
      MITRE ATT&CK T1078.004 (Cloud Accounts); MITRE ATT&CK T1552.005 (Cloud
      Instance Metadata API); OWASP Top 10:2025 A02 (Security
      Misconfiguration); NIST SP 800-53 CM-6, CM-7; DISA Cloud Computing SRG

  missing-file-validation:
    title: "Missing File Validation"
    description: >
      This custom-developed asset accepts files (uploads, attachments, or imports) with no evidence
      that it validates each file's real type, name, size, and content on the server. Thus,
      attackers can upload web shells, script-bearing HTML or SVG, malware, archive bombs, Zip Slip
      archives, or parser exploits.
    impact: >
      If this risk remains unmitigated, the consequences range from remote code execution through an
      uploaded web shell, to malware or stored XSS delivered to every user who opens the file, to
      denial of service. In cross-domain contexts, an unvalidated file is the most direct way to
      move malicious content between domains.
    asvs: "V12 - File and Resources Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Medium. Impact steps on the integrity of
      the data that the asset processes, moving one level up for a rating of Confidential/Critical
      or above and one level down for Internal/Operational or below. Additionally, likelihood moves
      one level with the asset's attractiveness (RAA) and internet exposure. Raise the finding to
      High where uploaded files are stored under a path that the web server will execute, or where
      privileged staff open them.
    false_positives: >
      File inputs can be treated as false positives after review when they either (1) accept only
      cryptographically signed files from a trusted source, verified before any parsing, or (2) pass
      through a dedicated validation and content-disarm service before reaching this asset.
    detection_logic: >
      Upload test files to each file endpoint, namely a renamed executable with an image extension,
      a polyglot (a valid JPEG with an embedded script), an SVG that contains script, an EICAR test
      file, an oversized file, a high-ratio zip bomb, and a zip that contains a ../../ entry. Then,
      confirm that each is rejected or neutralized, and that stored files are not reachable or
      executable under the web root. Additionally, review the code for any use of the client's
      filename or Content-Type in storage decisions. Finally, confirm that anti-malware scan events
      appear in the logs for every upload.
    references: >
      CWE-434 (Unrestricted Upload of File with Dangerous Type); CWE-409
      (Improper Handling of Highly Compressed Data); CAPEC-17 (Using
      Malicious Files); MITRE ATT&CK T1505.003 (Web Shell); OWASP Top 10:2025
      A06 (Insecure Design)

  missing-hardening:
    title: "Missing Hardening"
    description: >
      This asset's Relative Attacker Attractiveness (RAA) is at or above 55%, or 40% for high-value
      types such as data stores and identity providers, yet it is not modeled as hardened against a
      recognized baseline. Default vendor configurations commonly leave unused services, default
      accounts, and weak protocols in place.
    impact: >
      If this risk remains unmitigated, every default weakness on the asset that attackers most
      want, such as default credentials and exposed management interfaces, stays available to them.
      For DoD systems, an unhardened asset generates STIG CAT I and CAT II findings that block
      authorization.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at Low. Since the rule fires only at a high
      RAA, the finding usually lands at Possible likelihood. Impact steps on the integrity of the
      data that the asset processes, moving one level up for a rating of Confidential/Critical or
      above and one level down for Internal/Operational or below. Additionally, likelihood moves one
      level with the asset's attractiveness (RAA) and internet exposure. Treat open STIG CAT I
      findings on the asset as High, independently of this score.
    false_positives: >
      Two kinds of asset can be treated as false positives after review: (1) an asset with a
      documented, current STIG or CIS benchmark scan that shows no open CAT I findings and justified
      deviations for the rest, and (2) a managed PaaS service whose hardening is an inherited
      provider control.
    detection_logic: >
      Identify the applicable DISA STIG, SRG, or CIS benchmark for each layer of the asset, and scan
      against it. Specifically, use the SCAP Compliance Checker or OpenSCAP for operating systems,
      CIS-CAT or vendor tools (such as Oracle DBSAT) for databases, kube-bench for Kubernetes, and
      Evaluate-STIG or manual checklists for applications. Additionally, compare the listening ports
      (ss -tlnp or netstat) with the ports, protocols, and services list, and check for default
      accounts and credentials. Finally, track open findings over time in the POA&M.
    references: >
      CWE-16 (Configuration); CWE-1188 (Initialization of a Resource with an
      Insecure Default); MITRE ATT&CK T1190 (Exploit Public-Facing
      Application); MITRE ATT&CK T1068 (Exploitation for Privilege
      Escalation); OWASP Top 10:2025 A02 (Security Misconfiguration); NIST SP
      800-53 CM-6, CM-7

  missing-identity-propagation:
    title: "Missing Identity Propagation"
    description: >
      This service processes end-user data and receives authenticated requests from another in-scope
      component, but the flow is not authorized by the originating user's identity. Thus, the
      backend trusts the calling service and acts on whatever user or object identifiers it
      supplies, so authorization exists only at the edge.
    impact: >
      If this risk remains unmitigated, an attacker who compromises any upstream component can call
      this backend directly and read or change any user's records. A single-component compromise
      becomes a multi-tenant breach, and the audit records attribute it all to the service account.
    asvs: "V4 - Access Control Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Low. Impact steps on the highest of the
      asset's own confidentiality, integrity, and availability ratings, moving one level up for a
      rating of Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Raise the finding for multi-tenant backends that hold data from multiple
      organizations or classifications.
    false_positives: >
      Two cases can be treated as false positives after review: (1) flows where the end-user token
      is in fact forwarded and validated, in which case the model's authorization field should be
      fixed to enduser-identity-propagation, and (2) assets that serve no user-linked data or
      functions.
    detection_logic: >
      Trace a user request end to end, and confirm that the backend receives a signed user token and
      validates it, inspecting the headers at the backend rather than at the gateway. Next, with a
      valid service-to-service credential but no user token, or with a token for user A, request
      user B's objects from the backend directly, and confirm that the request is denied.
      Additionally, review the backend code for authorization decisions based on unsigned headers
      such as X-User-Id. Finally, check that the backend's audit logs record the end-user principal.
    references: >
      CWE-639 (Authorization Bypass Through User-Controlled Key); CWE-285
      (Improper Authorization); OWASP API Security Top 10:2023 API1 (Broken
      Object Level Authorization), API5 (Broken Function Level
      Authorization); OWASP Top 10:2025 A01 (Broken Access Control); NIST SP
      800-53 AC-3; NIST SP 800-207 (Zero Trust Architecture)

  missing-identity-provider-isolation:
    title: "Missing Identity Provider Isolation"
    description: >
      An identity provider or its identity store shares a network segment with non-identity assets,
      with no network trust boundary between them, and the risk is greatest when they also share an
      execution environment. Identity providers hold the signing keys and credential stores that
      every other component trusts.
    impact: >
      If this risk remains unmitigated, compromising any co-located asset gives a direct path to the
      identity tier. From there, an attacker can dump credential hashes, forge tokens or SAML
      assertions for any user (Golden SAML), or add persistent federation trusts, which compromises
      every relying system.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Network_Segmentation_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, one level higher when another asset shares the identity asset's
      execution environment, and impact starts at Medium. Impact steps on the highest of the
      identity asset's own ratings, moving one level up for a rating of Confidential/Critical or
      above and one level down for Internal/Operational or below. Additionally, likelihood moves one
      level with the asset's attractiveness (RAA) and internet exposure.
    false_positives: >
      Two cases can be treated as false positives after review: (1) segments in which every
      co-resident asset is hardened, monitored, and administered to the Tier-0 standard as if it
      were itself an identity provider, and (2) a managed cloud identity service (such as Entra ID
      or IAM Identity Center) whose isolation is an inherited provider control and that is merely
      modeled in a shared boundary.
    detection_logic: >
      Map the identity provider and its store to their subnets, VNets or VPCs, clusters, and hosts,
      and list every other asset in those segments. Then, review the NSG, firewall, and
      NetworkPolicy rules to confirm that only the required authentication flows are admitted, and
      that non-identity workloads cannot reach the identity store directly. Test this with a
      connection attempt from a neighboring workload. Additionally, confirm that the signing keys
      reside in an HSM-backed vault. Finally, alert on changes to federation trusts, token-signing
      certificates, and new application credentials in the identity provider's audit log.
    references: >
      CWE-653 (Improper Isolation or Compartmentalization); MITRE ATT&CK
      T1556 (Modify Authentication Process); MITRE ATT&CK T1606.002 (Forge
      Web Credentials: SAML Tokens); MITRE ATT&CK T1003 (OS Credential
      Dumping); NIST SP 800-53 SC-7, AC-6; NIST SP 800-207

  missing-identity-store:
    title: "Missing Identity Store"
    description: >
      The model contains flows authorized by end-user identity, but no in-scope identity store or
      identity provider that authenticates those users and issues their credentials. This is a gap
      in the model's completeness, not proof that identity is insecure.
    impact: >
      If this risk remains unmitigated, the risks to the component that issues every trusted
      identity (credential storage, MFA, signing keys, and federation) are never evaluated. The
      authorization package also cannot show where the identification and authentication controls
      are implemented or inherited.
    asvs: "V2 - Authentication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at a flat Unlikely, and impact starts at a flat Low. This is a whole-model
      check, so the asset it names is only an example, and that asset's ratings and attractiveness
      do not move the score.
    false_positives: >
      Models that offer only public, unauthenticated data or services can be treated as false
      positives after review. However, where an enterprise identity service is inherited, model it
      as an out-of-scope asset rather than accepting the finding.
    detection_logic: >
      Check whether the model contains any asset with the identity-provider, identity-store-ldap, or
      identity-store-database technology, and compare that against the communication links with the
      enduser-identity-propagation authorization. Then, confirm which identity provider actually
      authenticates users, using the application team, the OIDC or SAML configuration (issuer URLs
      and metadata endpoints), and the application settings. Finally, add that identity provider to
      the model.
    references: >
      NIST SP 800-53 IA-2, IA-5, PL-8; NIST SP 800-63-3 (Digital Identity
      Guidelines); DoD ICAM Reference Design

  missing-network-segmentation:
    title: "Missing Network Segmentation"
    description: >
      A sensitive, high-attractiveness asset (an RAA of 50% or higher) or a data store shares a
      network segment, with no trust boundary, with lower-trust components that have no legitimate
      direct connection to it, such as clients, web tiers, build pipelines, or monitoring hosts.
    impact: >
      If this risk remains unmitigated, compromising the most exposed component in the segment,
      typically an internet-facing web tier, gives an attacker direct access to the asset's database
      ports, management interfaces, and internal services. Defense in depth collapses into a single
      layer.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Network_Segmentation_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at Low. Since the rule fires only at a high
      RAA, the finding usually lands at Possible likelihood. Impact steps on the highest of the
      asset's own ratings, moving one level up for a rating of Confidential/Critical or above and
      one level down for Internal/Operational or below. Additionally, likelihood moves one level
      with the asset's attractiveness (RAA) and internet exposure.
    false_positives: >
      Two cases can be treated as false positives after review: (1) segments in which every
      co-resident asset is hardened and protected to the same level as the most sensitive one, and
      (2) segments where microsegmentation (per-workload NSGs, Kubernetes NetworkPolicies, or
      service-mesh authorization) enforces the same isolation as a separate segment, but is not
      represented as a trust boundary in the model. However, prefer modeling the real boundary.
    detection_logic: >
      Export the NSG, security-group, and NetworkPolicy rules for the segment, and confirm that the
      sensitive asset admits only its documented callers and ports. Then, from a lower-trust host in
      the same segment, attempt TCP connections to the asset's service and management ports (with
      nmap), and expect them to be blocked. Additionally, review the flow logs (NSG flow logs or VPC
      Flow Logs) for traffic from unexpected sources. Finally, audit Kubernetes NetworkPolicy for
      namespaces that have no default-deny policy.
    references: >
      CWE-653 (Improper Isolation or Compartmentalization); MITRE ATT&CK
      TA0008 (Lateral Movement); MITRE ATT&CK T1210 (Exploitation of Remote
      Services); NIST SP 800-53 SC-7, SC-7(5), AC-4; NIST SP 800-207

  missing-vault:
    title: "Missing Vault (Secret Storage)"
    description: >
      The model contains no vault or secret store, so components are assumed to hold credentials and
      keys in configuration files, environment variables, images, or manifests. Secrets stored this
      way can be read by any file-read flaw, cannot be rotated centrally, and leave no audit trail.
    impact: >
      If this risk remains unmitigated, a file-read or disclosure flaw in any component yields the
      credentials for everything it connects to, so a low-severity bug escalates into a full data
      compromise. Without rotation and access logging, stolen secrets stay valid and their use
      cannot be traced.
    asvs: "V6 - Stored Cryptography Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at Low. Impact steps on the confidentiality
      of the most confidential asset or data in the model, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure.
    false_positives: >
      Models in which no component holds any secret, because all authentication uses workload
      identity or managed identity with no stored credential, can be treated as false positives
      after review. However, a vault that exists but is not modeled should be added to the model
      rather than accepted.
    detection_logic: >
      Search the configuration files, Kubernetes manifests and Secrets, Helm values, container image
      environments (docker inspect), and app service settings for credentials and keys, using
      gitleaks or trufflehog in filesystem mode and kubectl get secrets and configmaps. Then,
      confirm whether each application authenticates to a vault with workload identity, and whether
      the vault's audit logs show its reads. Finally, list the secrets and certificates that have
      not been rotated in the last 90 days.
    references: >
      CWE-798 (Use of Hard-coded Credentials); CWE-522 (Insufficiently
      Protected Credentials); CWE-312 (Cleartext Storage of Sensitive
      Information); MITRE ATT&CK T1552.001 (Credentials In Files); MITRE
      ATT&CK T1552.004 (Private Keys); NIST SP 800-53 IA-5, SC-12, SC-28

  missing-vault-isolation:
    title: "Missing Vault Isolation"
    description: >
      A vault, or the data store that backs it, shares a network segment with non-vault assets, with
      no network trust boundary between them, and the risk is greatest when they also share an
      execution environment. Since the vault concentrates every credential and key, its exposure
      should be the smallest in the architecture.
    impact: >
      If this risk remains unmitigated, an attacker who compromises any co-located workload reaches
      the vault API and its storage backend directly. A single misconfiguration, stolen token, or
      unsealed snapshot then exposes every secret, and every system those secrets unlock.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Network_Segmentation_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, one level higher when another asset shares the vault's
      execution environment, and impact starts at Medium. Impact steps on the highest of the vault's
      own ratings, moving one level up for a rating of Confidential/Critical or above and one level
      down for Internal/Operational or below. Additionally, likelihood moves one level with the
      asset's attractiveness (RAA) and internet exposure.
    false_positives: >
      Two cases can be treated as false positives after review: (1) a managed cloud key vault with
      public network access disabled and reachable only through private endpoints, whose isolation
      is an inherited provider control even if it is modeled in a shared boundary, and (2) a segment
      where every co-resident asset is protected to the vault's level.
    detection_logic: >
      Check the vault's network configuration for public network access (for example, Azure Key
      Vault publicNetworkAccess, or AWS resource policies without aws:SourceVpce conditions), and
      list the subnets that are allowed to reach its private endpoint. For self-managed vaults,
      identify the hosts and the storage backend, and list the co-resident workloads. Then, attempt
      a connection to the vault API from a workload that should not use it. Finally, alert on vault
      access from unexpected source IPs and on bulk secret-list operations.
    references: >
      CWE-653 (Improper Isolation or Compartmentalization); MITRE ATT&CK
      T1555 (Credentials from Password Stores); MITRE ATT&CK T1552 (Unsecured
      Credentials); NIST SP 800-53 SC-7, SC-12, AC-6

  missing-waf:
    title: "Missing Web Application Firewall (WAF)"
    description: >
      A web application or web service is reached across a network trust boundary with no WAF in the
      path. Thus, nothing filters requests for common attack payloads or rate-limits scanners, and
      there is no place to apply a virtual patch before a code fix ships.
    impact: >
      If this risk remains unmitigated, scanners and exploit kits probe the application at full
      speed with no filtering or alerting. Additionally, mass exploitation after a public CVE (such
      as Log4Shell) reaches it with no compensating control.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Virtual_Patching_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Low. Impact steps on the integrity of the
      data that the asset processes, moving one level up for a rating of Confidential/Critical or
      above and one level down for Internal/Operational or below. Additionally, likelihood moves one
      level with the asset's attractiveness (RAA) and internet exposure. Raise the finding for
      internet-facing applications in DoD environments, where a WAF at the boundary is an expected
      SCCA component.
    false_positives: >
      Targets that are reachable only through a WAF, or through a reverse proxy with an enforcing
      WAF module (ModSecurity, Coraza, or a cloud WAF policy in prevention mode), that the model
      does not show can be treated as false positives after review. However, prefer modeling the
      WAF.
    detection_logic: >
      Trace the network path from each external caller to the application, and confirm that a WAF is
      present and in prevention mode (the Azure WAF policy mode, the AWS WAF web ACL association, or
      ModSecurity SecRuleEngine On). Next, confirm that the origin rejects requests that bypass the
      WAF by calling the origin directly. Then, send benign test signatures, such as a ' OR 1=1--
      parameter or a ../../etc/passwd path, and confirm that they are blocked and logged. Finally,
      review the WAF logs in the SIEM for active rule hits.
    references: >
      CWE-693 (Protection Mechanism Failure); MITRE ATT&CK T1190 (Exploit
      Public-Facing Application); MITRE ATT&CK T1595.002 (Vulnerability
      Scanning); NIST SP 800-53 SC-7, SI-4

  mixed-targets-on-shared-runtime:
    title: "Mixed Targets on Shared Runtime"
    description: >
      A shared runtime (a VM host, cluster or node pool, container host, or application server) runs
      assets from different trust boundaries, or mixes attacker-facing frontends with backends or
      data stores. Thus, the runtime's own isolation becomes the only barrier between low-trust and
      high-trust assets.
    impact: >
      If this risk remains unmitigated, compromising the most exposed asset on the runtime, or
      escaping its container or VM, reaches the memory, files, credentials, and network of
      co-located, higher-value assets. In other words, the model's trust boundaries overstate the
      real isolation.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Network_Segmentation_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at a flat Unlikely, since a shared runtime has no single asset to adjust
      for, and impact starts at Low. Impact steps on the highest rating among the assets on the
      shared runtime, moving one level up for a rating of Confidential/Critical or above and one
      level down for Internal/Operational or below.
    false_positives: >
      Two cases can be treated as false positives after review: (1) shared runtimes where every
      hosted asset is hardened and protected to the level of the most sensitive one, and (2)
      runtimes where hard multi-tenancy controls (dedicated node pools with taints, sandboxed
      runtimes, or separate VMs) give an effective separation that the model does not represent.
    detection_logic: >
      For each shared runtime, list the hosted workloads and their trust boundaries (for example,
      kubectl get pods -A -o wide grouped by node, the hypervisor's VM inventory, or the app
      server's deployment lists). Then, flag the nodes or hosts that run both internet-facing and
      data-tier workloads. Additionally, verify the node-pool taints and affinity rules for
      sensitive workloads. Finally, check for shared service accounts, shared filesystems, or shared
      host networking across tiers.
    references: >
      CWE-653 (Improper Isolation or Compartmentalization); MITRE ATT&CK
      T1611 (Escape to Host); MITRE ATT&CK TA0008 (Lateral Movement); NIST SP
      800-53 SC-2, SC-39; NIST SP 800-190

  path-traversal:
    title: "Path-Traversal"
    description: >
      An in-scope caller accesses this file system or file server. If any part of a file path comes
      from caller input (such as a download filename or template name) without canonicalization and
      a base-directory check, an attacker can use ../, encoded, or absolute paths to reach files
      outside the intended directory.
    impact: >
      If this risk remains unmitigated, an attacker can read configuration files with credentials,
      private keys, cloud credential files, source code, and other users' data. Where the traversal
      reaches a write or include path, it escalates to overwriting files or to code execution.
    asvs: "V12 - File and Resources Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely (one level lower for DevOps links), and impact starts at Medium.
      Impact steps on the confidentiality of the data that the asset processes, moving one level up
      for a rating of Confidential/Critical or above and one level down for Internal/Operational or
      below. Additionally, likelihood moves one level with the asset's attractiveness (RAA) and
      internet exposure. Raise the finding where the application's process account can read key or
      credential files.
    false_positives: >
      After code review, file accesses can be treated as false positives when their paths are built
      entirely from server-side constants or server-generated identifiers, with no caller-influenced
      component on any code path.
    detection_logic: >
      Run SAST (Semgrep, or the CodeQL path-injection queries) for file open, read, include, and
      send-file calls whose path derives from request data. Additionally, in DAST, fuzz the file
      parameters with lists of traversal payloads (encoded, double-encoded, overlong UTF-8,
      null-byte, and absolute-path variants), and look for known file contents such as root:x:0:0 or
      [boot loader]. Review the process account's filesystem permissions on key and configuration
      files. Finally, alert on web logs that contain ../ or %2e%2e sequences.
    references: >
      CWE-22 (Improper Limitation of a Pathname to a Restricted Directory);
      CWE-98 (PHP Remote File Inclusion); CAPEC-126 (Path Traversal); MITRE
      ATT&CK T1083 (File and Directory Discovery); MITRE ATT&CK T1005 (Data
      from Local System); OWASP Top 10:2025 A01 (Broken Access Control)

  push-instead-of-pull-deployment:
    title: "Push instead of Pull Deployment"
    description: >
      A build pipeline writes deployments directly into a production target over a non-read-only
      link. Push deployment needs (1) an inbound administrative interface on the target that the
      pipeline can reach, and (2) standing production credentials in the pipeline. Together, these
      make the pipeline a single point of compromise for production.
    impact: >
      If this risk remains unmitigated, an attacker who compromises the CI system (through a
      malicious pull request, a plugin, a stolen runner token, or a poisoned dependency) inherits
      its production credentials. The attacker can then deploy workloads or change production
      configuration directly, bypassing review.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/CI_CD_Security_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at Low. Impact steps on the integrity of the
      data that the deployment target processes, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Raise the finding where the pipeline holds long-lived production administrator
      credentials.
    false_positives: >
      Two cases can be treated as false positives after review: (1) communication links that are not
      deployment paths, and (2) push deployments that use per-run, short-lived, environment-scoped
      credentials issued through OIDC federation, with a mandatory production approval gate.
    detection_logic: >
      Read the pipeline definitions for deployment steps that target production (kubectl apply, helm
      upgrade, az or aws deploy commands, SSH, or WinRM), and list the credentials they use, along
      with each credential's lifetime and scope (from the pipeline secret stores and service
      connections). Additionally, check whether production exposes management endpoints that the CI
      runner networks can reach. Finally, confirm whether a GitOps controller (Argo CD or Flux) is
      the only writer to production, by reviewing the Kubernetes audit logs for changes made by
      other principals.
    references: >
      CWE-668 (Exposure of Resource to Wrong Sphere); MITRE ATT&CK T1072
      (Software Deployment Tools); MITRE ATT&CK T1195.002 (Compromise
      Software Supply Chain); OWASP Top 10:2025 A03 (Software Supply Chain
      Failures); NIST SP 800-53 CM-5, AC-17; NIST SP 800-204D

  search-query-injection:
    title: "Search-Query Injection"
    description: >
      An in-scope client queries this search engine (Elasticsearch, OpenSearch, or Solr). If caller
      input is embedded in raw query syntax, or caller parameters are passed through to the engine,
      an attacker can widen results beyond their authorization and invoke engine features never
      meant for users.
    impact: >
      If this risk remains unmitigated, an attacker can read documents and hidden fields outside
      their authorization and exhaust the cluster with expensive queries. In vulnerable versions,
      the attacker can reach SSRF or remote code execution on the search nodes (such as Solr
      CVE-2017-12629).
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible (one level lower for DevOps links), and impact starts at Medium.
      Impact steps on the higher of the confidentiality and integrity of the data that the asset
      processes, moving one level up for a rating of Confidential/Critical or above and one level
      down for Internal/Operational or below. Additionally, likelihood moves one level with the
      asset's attractiveness (RAA) and internet exposure.
    false_positives: >
      After code review, search requests can be treated as false positives when they are built only
      with typed query-builder APIs that pass caller input as term values, with no request
      parameters passed through to the engine.
    detection_logic: >
      Review the code for raw query_string use, concatenation of Lucene syntax, or forwarding of the
      incoming query string to the engine. Additionally, in DAST, submit Lucene or Solr syntax
      (field:*, OR *:*, {!xmlparser ...}, or a shards= or stream.url= parameter), and compare the
      result counts and errors. Check the engine's configuration for disabled dynamic scripting,
      enabled authentication, and patched versions. Finally, alert on the engine's slow-query logs,
      and on queries that contain local-parameter syntax.
    references: >
      CWE-943 (Improper Neutralization of Special Elements in Data Query
      Logic); CWE-74 (Injection); MITRE ATT&CK T1190 (Exploit Public-Facing
      Application); OWASP Top 10:2025 A05 (Injection)

  service-registry-poisoning:
    title: "Service Registry Poisoning"
    description: >
      This service registry (Consul, etcd, Eureka, ZooKeeper, or Kubernetes discovery) tells
      components where their dependencies are. If writes lack strong authentication and
      authorization, or callers trust whatever endpoint it returns, an attacker can register a
      malicious instance, overwrite an endpoint, or change runtime configuration.
    impact: >
      If this risk remains unmitigated, consumers send their requests, with the credentials and data
      inside them, to an attacker-controlled endpoint, or load configuration that disables security
      features. Because discovery is silent and trusted, this affects every consumer at once and is
      hard to notice.
    asvs: "V10 - Malicious Code Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at Medium. Impact steps on the highest
      integrity rating across the registry, its callers, and the data on their links, moving one
      level up for a rating of Confidential/Critical or above and one level down for
      Internal/Operational or below. Additionally, likelihood moves one level with the asset's
      attractiveness (RAA) and internet exposure.
    false_positives: >
      Two cases can be treated as false positives after review: (1) registries that are not used for
      service discovery, and (2) environments where every consumer verifies the discovered endpoint
      with mutual TLS against an issued service identity, which makes a poisoned entry fail closed.
    detection_logic: >
      Review the registry's ACL configuration (for example, Consul acl.default_policy deny, etcd
      --client-cert-auth with RBAC, or Kubernetes RBAC for create and update on endpoints and
      endpointslices), and list the principals with write access. Then, using a workload credential,
      attempt to register an entry for another service name, and confirm that it is denied.
      Additionally, confirm that service-to-service calls enforce mTLS identity verification (mesh
      PeerAuthentication in STRICT mode). Finally, alert on registry audit events for registrations
      from unexpected sources or with unexpected service names.
    references: >
      CWE-923 (Improper Restriction of Communication Channel to Intended
      Endpoints); CWE-345 (Insufficient Verification of Data Authenticity);
      MITRE ATT&CK T1557 (Adversary-in-the-Middle); NIST SP 800-53 SC-23,
      AC-3; NIST SP 800-204A

  server-side-request-forgery:
    title: "Server-Side Request Forgery (SSRF)"
    description: >
      This server-side asset makes outgoing HTTP(S) requests. If the destination comes from caller
      input (such as webhooks, link previews, import-from-URL, or document renderers), an attacker
      can make the server reach destinations the attacker cannot, such as internal services, the
      cloud metadata endpoint, or localhost ports.
    impact: >
      If this risk remains unmitigated, an attacker can read internal services that trust the
      server, steal cloud role credentials from the metadata service (the technique behind the 2019
      Capital One breach), and scan internal hosts. In effect, the server's network position becomes
      the attacker's.
    asvs: "V12 - File and Resources Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible (fixed at Unlikely for DevOps links), and impact starts at Low.
      Impact steps on the confidentiality of the most confidential target reachable over web
      protocols, and it is at least Medium inside a cloud trust boundary. Each impact step moves one
      level up for a rating of Confidential/Critical or above and one level down for
      Internal/Operational or below. Additionally, likelihood moves one level with the asset's
      attractiveness (RAA) and internet exposure.
    false_positives: >
      After code review, servers can be treated as false positives when their outgoing request
      destinations are fixed in server-side configuration, with no caller influence over the scheme,
      host, port, or path.
    detection_logic: >
      Review the code for HTTP client calls (such as requests.get, HttpClient, RestTemplate, fetch,
      or curl) whose URL derives from request data. Additionally, in DAST, supply URLs that point to
      an out-of-band collaborator (Burp Collaborator or interactsh), to 169.254.169.254, to
      localhost ports, and to redirecting and DNS-rebinding hosts, and observe the callbacks or
      response differences. Verify IMDSv2 enforcement and the egress firewall rules. Finally, alert
      on outbound connections from application workloads to the metadata IP, or to internal ranges
      they do not normally call.
    references: >
      CWE-918 (Server-Side Request Forgery); CAPEC-664 (Server Side Request
      Forgery); MITRE ATT&CK T1552.005 (Cloud Instance Metadata API); OWASP
      Top 10:2025 A01 (Broken Access Control); OWASP API Security Top
      10:2023 API7 (Server Side Request Forgery)

  sql-nosql-injection:
    title: "SQL/NoSQL-Injection"
    description: >
      An in-scope client reaches this database over a database protocol. If any query is built from
      caller input, through string concatenation in SQL or raw JSON objects in a NoSQL query, an
      attacker can change the query's structure.
    impact: >
      If this risk remains unmitigated, an attacker can read the entire database, bypass
      authentication, and change or delete data. Depending on the account's privileges, the attacker
      can also run operating system commands on the database server.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely (fixed at Possible for DevOps links), and impact starts at High.
      Impact steps on the higher of the confidentiality and integrity of the data that the asset
      processes, moving one level up for a rating of Confidential/Critical or above and one level
      down for Internal/Operational or below. Additionally, likelihood moves one level with the
      asset's attractiveness (RAA) and internet exposure. Treat any confirmed injection that is
      reachable from an end-user input as High.
    false_positives: >
      After code review, database access can be treated as a false positive when (1) every query
      uses bound parameters or a query builder, and (2) identifiers that cannot be parameterized are
      validated against fixed allowlists.
    detection_logic: >
      Run SAST (Semgrep, the CodeQL SQL-injection and NoSQL-injection queries, or SonarQube) for
      query execution calls that receive concatenated or formatted strings, and for raw-query ORM
      methods. Additionally, in DAST, run sqlmap or a ZAP or Burp injection scan on every parameter,
      header, and JSON body field, including operator payloads such as {"$ne": null} for NoSQL
      endpoints. Review the privileges of the application's database account. Finally, alert on
      database error rates, and on query patterns such as UNION SELECT, SLEEP(, or WAITFOR DELAY in
      the database or WAF logs.
    references: >
      CWE-89 (SQL Injection); CWE-943 (Improper Neutralization of Special
      Elements in Data Query Logic); CAPEC-66 (SQL Injection); CAPEC-676
      (NoSQL Injection); MITRE ATT&CK T1190 (Exploit Public-Facing
      Application); OWASP Top 10:2025 A05 (Injection)

  unchecked-deployment:
    title: "Unchecked Deployment"
    description: >
      This development asset (a repository, pipeline, registry, or devops client) delivers code to
      deployment targets with no evidence of automated security testing gates, such as static
      analysis, dependency scanning, image and infrastructure-as-code scanning, and dynamic testing.
      Thus, vulnerable code and dependencies reach production on every release.
    impact: >
      If this risk remains unmitigated, injection flaws, insecure configurations, and dependencies
      with published exploits (such as Log4Shell) are deployed continuously. The organization also
      has no SBOM with which to judge its exposure when the next critical dependency CVE appears.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely, and impact starts at Low. Impact steps on the integrity of the
      data that the deployment targets process, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure.
    false_positives: >
      Two kinds of pipeline can be treated as false positives after review: (1) pipelines that build
      no software (infrastructure-only or configuration-only), and (2) pipelines that already run
      blocking SAST, SCA, image, and DAST gates with documented thresholds, as evidenced by the
      pipeline definitions and recent results.
    detection_logic: >
      Read the pipeline definitions, and list which security scanners run, whether each one is
      blocking (it fails the job) or advisory, and its severity threshold. Additionally, confirm
      that an SBOM is produced and retained for each release. Then, pick a recent release, and
      verify that scan results exist for its exact commit and image digest. Finally, introduce a
      known-vulnerable dependency on a test branch, and confirm that the pipeline fails.
    references: >
      CWE-1395 (Dependency on Vulnerable Third-Party Component); CWE-1104
      (Use of Unmaintained Third Party Components); MITRE ATT&CK T1195.001
      (Compromise Software Dependencies and Development Tools); OWASP Top
      10:2025 A03 (Software Supply Chain Failures); NIST SP 800-218 (SSDF)
      PW.7, PW.8, RV.1; NIST SP 800-53 SA-11, RA-5

  unencrypted-asset:
    title: "Unencrypted Technical Assets"
    description: >
      This asset stores data rated Confidential or higher for confidentiality, or Critical or higher
      for integrity, with no encryption at rest, so its disks, backups, and snapshots hold that data
      in plaintext. For Strictly-Confidential or Mission-Critical end-user data, Threagile also
      expects keys that the data owner controls.
    impact: >
      If this risk remains unmitigated, anyone who obtains the storage (a copied snapshot or backup,
      a discarded disk, or a misconfigured permission) reads the data directly. For CUI, this
      violates NIST SP 800-171 3.13.16 and NIST SP 800-53 SC-28, and a lost unencrypted backup is a
      reportable breach.
    asvs: "V6 - Stored Cryptography Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Unlikely, and impact starts at Low. Impact steps on the confidentiality
      of the data that the asset stores, moving one level up for a rating of Confidential/Critical
      or above and one level down for Internal/Operational or below. Additionally, likelihood moves
      one level with the asset's attractiveness (RAA) and internet exposure. The rule excludes load
      balancers, reverse proxies, WAFs, IDS/IPS, and embedded libraries.
    false_positives: >
      Two kinds of asset can be treated as false positives after verification: (1) assets whose
      sensitive data is already encrypted at the document or field level before it is written, and
      (2) managed services where the provider enables encryption at rest and it cannot be disabled,
      while the model simply records the encryption as none. In both cases, correct the model's
      encryption field.
    detection_logic: >
      Query the cloud configuration for unencrypted resources, such as the Azure Policy or Defender
      for Cloud recommendations for TDE, storage, and disk encryption, or the AWS Config rules
      encrypted-volumes, rds-storage-encrypted, and s3-default-encryption. Then, confirm whether
      customer-managed keys are used where they are required. On self-managed hosts, check the LUKS
      or BitLocker status (lsblk -f or manage-bde -status). Additionally, verify that backups and
      snapshots inherit the encryption. Finally, confirm the cryptographic module's FIPS 140
      validation status.
    references: >
      CWE-311 (Missing Encryption of Sensitive Data); CWE-312 (Cleartext
      Storage of Sensitive Information); MITRE ATT&CK T1005 (Data from Local
      System); MITRE ATT&CK T1530 (Data from Cloud Storage); OWASP Top
      10:2025 A04 (Cryptographic Failures); NIST SP 800-53 SC-28, SC-28(1);
      NIST SP 800-171 3.13.16

  unencrypted-communication:
    title: "Unencrypted Communication"
    description: >
      This link uses an unencrypted protocol (such as HTTP, LDAP, plain JDBC, SMTP, FTP, or Telnet)
      to carry authentication data or data assets whose rating requires protection in transit. Thus,
      anyone on the network path can see the traffic. The rule excludes monitoring, local file,
      in-process, and inter-process traffic.
    impact: >
      If this risk remains unmitigated, a network-positioned attacker can read the data in transit,
      including passwords and tokens that grant further access, and change it without detection. For
      CUI, unencrypted transmission violates NIST SP 800-171 3.13.8 and NIST SP 800-53 SC-8.
    asvs: "V9 - Communication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, one level higher across a network trust boundary, and impact
      starts at Medium. Impact steps on the higher of the confidentiality and integrity of the data
      on the link, and authentication data in cleartext counts as Confidential. Each impact step
      moves one level up for a rating of Confidential/Critical or above and one level down for
      Internal/Operational or below. Additionally, likelihood moves one level with the asset's
      attractiveness (RAA) and internet exposure. Treat any transfer of a plaintext credential or
      token across a trust boundary as High.
    false_positives: >
      Two kinds of link can be treated as false positives after verification: (1) links where all
      sensitive content is encrypted end to end at the message or document level, and (2) intra-pod
      or sidecar-mediated traffic where a service mesh transparently enforces mTLS. In the second
      case, fix the model's protocol to reflect it.
    detection_logic: >
      Scan the service endpoints with testssl.sh, sslyze, or nmap --script ssl-enum-ciphers, and
      confirm that TLS is required, plaintext ports are closed, and only TLS 1.2 or later with
      approved ciphers is offered. Additionally, check the database and broker client connection
      strings for encryption and certificate validation settings (such as Encrypt=Strict or
      sslmode=verify-full). Capture traffic on a test segment (with tcpdump or Wireshark) to confirm
      that no cleartext payloads cross it. Finally, review the mesh's PeerAuthentication for STRICT
      mode.
    references: >
      CWE-319 (Cleartext Transmission of Sensitive Information); CAPEC-94
      (Adversary in the Middle); MITRE ATT&CK T1040 (Network Sniffing); MITRE
      ATT&CK T1557 (Adversary-in-the-Middle); OWASP Top 10:2025 A04
      (Cryptographic Failures); NIST SP 800-53 SC-8, SC-8(1); NIST SP
      800-52 Rev. 2

  unguarded-access-from-internet:
    title: "Unguarded Access From Internet"
    description: >
      An in-scope asset rated Confidential or Critical or higher accepts flows directly from an
      internet-side client, with no guarding component (a reverse proxy, gateway, WAF, load
      balancer, or bastion) in between. The rule excludes load balancers themselves, and HTTP(S)
      access to web servers and CMSs, which is expected by design.
    impact: >
      If this risk remains unmitigated, internet-wide scanners and exploit campaigns reach the
      sensitive asset with no filtering, rate limiting, or protocol break. A single unpatched
      vulnerability or exposed management interface on the asset then becomes exploitable from
      anywhere.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Likely, and impact starts at Low. Impact steps on the highest of the
      asset's own ratings, moving one level up for a rating of Confidential/Critical or above and
      one level down for Internal/Operational or below. Additionally, likelihood moves one level
      with the asset's attractiveness (RAA) and internet exposure. Treat any directly exposed
      administrative protocol (SSH, RDP, or database ports) as High regardless of score.
    false_positives: >
      Assets where a component not shown in the model applies equivalent filtering, such as a cloud
      WAF or API gateway in front, or a zero-trust access broker for administrative protocols, can
      be treated as false positives after verification. However, prefer adding that component to the
      model.
    detection_logic: >
      Enumerate the public IP addresses and public endpoints in the cloud inventory (Azure Resource
      Graph or AWS Config), and run an external port scan (nmap, or a Shodan or Censys lookup of the
      owned ranges) to list the services reachable from the internet. Then, map each reachable
      service back to the model, and confirm that a guarding component sits in front of it. Finally,
      check the NSG and security-group rules for 0.0.0.0/0 or Internet service-tag sources on
      non-web ports.
    references: >
      CWE-668 (Exposure of Resource to Wrong Sphere); MITRE ATT&CK T1190
      (Exploit Public-Facing Application); MITRE ATT&CK T1133 (External
      Remote Services); NIST SP 800-53 SC-7, SC-7(5), AC-17; DISA Cloud
      Computing SRG (SCCA)

  unguarded-direct-datastore-access:
    title: "Unguarded Direct Datastore Access"
    description: >
      A data store rated Confidential or Critical or higher accepts connections directly from an
      asset in another trust boundary, rather than through a mediating application service. The rule
      excludes DevOps deployment access, LDAP stores accessed by their identity provider, and file
      servers accessed over file-transfer protocols.
    impact: >
      If this risk remains unmitigated, compromising the caller exposes the store's full native
      query capability, namely bulk reads, schema discovery, and writes, rather than only what an
      application API allows. Such access also bypasses application-level authorization and audit.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Low. Impact steps on the highest of the
      data store's own ratings, moving one level up for a rating of Confidential/Critical or above
      and one level down for Internal/Operational or below. Additionally, likelihood moves one level
      with the asset's attractiveness (RAA) and internet exposure. Raise the finding where the
      external caller uses a shared or highly privileged database account.
    false_positives: >
      Callers that are effectively part of the data store's own trust zone, such as a dedicated
      replication or backup agent administered together with the store, can be treated as false
      positives after review.
    detection_logic: >
      List the data store's allowed network sources (firewall rules, private endpoint approvals,
      security groups, or pg_hba.conf), and map each one to its trust boundary. Then, review the
      database logins by source address and account over a 30-day window (from SQL audit,
      CloudWatch, or Log Analytics), and flag connections that do not originate from the application
      tier. Additionally, confirm that public network access is disabled (Azure SQL or Cosmos DB
      publicNetworkAccess, or RDS PubliclyAccessible). From a host in each non-application trust
      boundary, attempt a TCP connection to the store's native port (with nmap or
      Test-NetConnection), and expect it to be blocked. Furthermore, list the database accounts used
      by callers outside the application tier, along with their granted roles, since shared or
      db_owner-class and rds_superuser-class accounts are the case that raises the finding. Finally,
      alert on logins from source addresses outside the application tier's subnet.
    references: >
      CWE-668 (Exposure of Resource to Wrong Sphere); CWE-284 (Improper
      Access Control); MITRE ATT&CK T1213 (Data from Information
      Repositories); MITRE ATT&CK T1078 (Valid Accounts); NIST SP 800-53
      AC-3, AC-4, SC-7

  untrusted-deserialization:
    title: "Untrusted Deserialization"
    description: >
      This asset accepts data in a native serialization format (such as Java serialization, the .NET
      BinaryFormatter, Python pickle, PHP unserialize, or Ruby Marshal), or through polymorphic JSON
      or YAML that instantiates the types named in the input. Thus, an attacker can chain classes
      already on the classpath into code execution.
    impact: >
      If this risk remains unmitigated, an attacker who delivers a serialized payload achieves
      remote code execution with the application's privileges, typically before any authentication
      runs. The attacker then controls the host, its credentials, and its network position.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, one level higher when the serialized input crosses a trust
      boundary, and impact starts at High. Impact steps on the higher of the confidentiality and
      integrity of the data that the asset processes, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. Treat confirmed native deserialization of unauthenticated input as Critical.
    false_positives: >
      Two cases can be treated as false positives after review: (1) serialized data whose integrity
      is verified cryptographically (an HMAC or signature checked before deserialization) and that
      originates only from trusted components, and (2) endpoints that use a strict class allowlist
      (a JEP 290 filter), confirmed by testing.
    detection_logic: >
      Search the code and dependencies for ObjectInputStream.readObject,
      BinaryFormatter.Deserialize, pickle.loads, unserialize(, Marshal.load, yaml.load without
      SafeLoader, Jackson enableDefaultTyping or @JsonTypeInfo with Id.CLASS, and Json.NET
      TypeNameHandling. Additionally, watch the traffic for serialized-object signatures, such as
      Java aced0005 (rO0AB in base64) or .NET AAEAAAD/////. In a non-production environment, test
      the endpoints with ysoserial or ysoserial.net URLDNS and out-of-band payloads. Finally, check
      the RMI and JMX ports for network exposure.
    references: >
      CWE-502 (Deserialization of Untrusted Data); CAPEC-586 (Object
      Injection); MITRE ATT&CK T1190 (Exploit Public-Facing Application);
      OWASP Top 10:2025 A08 (Software or Data Integrity Failures)

  xml-external-entity:
    title: "XML External Entity (XXE)"
    description: >
      This asset parses XML that a caller can influence, such as SOAP APIs, SAML assertions, SVG and
      Office uploads, or XSLT input. Many parsers resolve external entities by default, so an
      attacker-supplied DOCTYPE makes the parser read local files or make network requests, and
      nested entities exhaust memory.
    impact: >
      If this risk remains unmitigated, an attacker can read files from the server, such as
      credentials, private keys, and source code, and use it for SSRF against internal services and
      cloud metadata. In SAML processing, XXE can also expose the service provider's signing
      material.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      Likelihood starts at Possible, and impact starts at Medium. Impact steps on the
      confidentiality of the data that the asset processes, moving one level up for a rating of
      Confidential/Critical or above and one level down for Internal/Operational or below.
      Additionally, likelihood moves one level with the asset's attractiveness (RAA) and internet
      exposure. In cloud environments, however, treat the impact as at least Medium regardless,
      since XXE is also an SSRF primitive against the instance metadata service.
    false_positives: >
      Two cases can be treated as false positives after review: (1) XML that is accepted only from
      trusted, authenticated components and verified by signature before parsing, and (2) parsers
      confirmed, by configuration review and testing, to reject DOCTYPE declarations.
    detection_logic: >
      Review the parser construction for every XML entry point (DocumentBuilderFactory,
      SAXParserFactory, XMLInputFactory, XmlReaderSettings, lxml, or libxml2), and confirm that DTD
      processing is disabled. Additionally, in DAST, submit payloads with an external entity that
      points to an out-of-band collaborator and to a known local file, including inside uploaded SVG
      and DOCX files and SAML responses, and watch for callbacks or reflected content. Finally,
      alert on outbound requests from parser hosts to unexpected destinations.
    references: >
      CWE-611 (Improper Restriction of XML External Entity Reference);
      CWE-776 (Improper Restriction of Recursive Entity References in DTDs);
      CAPEC-221 (Data Serialization External Entities Blowup); MITRE ATT&CK
      T1190 (Exploit Public-Facing Application); OWASP Top 10:2025 A02
      (Security Misconfiguration)
