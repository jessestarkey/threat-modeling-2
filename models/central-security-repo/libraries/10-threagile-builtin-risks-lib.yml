# ==============================================================================
# THREAGILE BUILT-IN RISK REFERENCE: 10-threagile-builtin-risks-lib.yml
# ==============================================================================
# Live dependency, read directly by generate_report.py -- same tier as
# 09-custom-risks-lib.yml (see central-security-repo's CLAUDE.md section for
# the live-dependency/reference-catalog distinction). Not read by
# inject_risks.py: this file never injects anything, it only supplies the
# same enrichment content (description/impact/asvs/cheat_sheet/
# risk_assessment/false_positives) for Threagile's OWN built-in risk
# categories that 09-custom-risks-lib.yml supplies for our custom ones --
# so "Identified Risks by Vulnerability Category" and the Risk Category
# Reference section can show a real Description/Impact for a built-in
# finding (e.g. Missing Authentication, SQL/NoSQL Injection) instead of
# just Action/Mitigation from risks.xlsx.
#
# PROVENANCE -- this content is NOT authored by us. It is Threagile's own
# risk-rule text, extracted from the pinned `threagile/threagile:0.9.1`
# Docker image (internal version string: 1.0.0 / 20240730113903) via two
# sources:
#   - description: `docker run --entrypoint sh threagile/threagile:0.9.1
#     -c "/app/threagile -explain-risk-rules"` -- plain CLI text, no
#     extraction artifacts.
#   - impact / asvs / cheat_sheet / risk_assessment / false_positives:
#     Threagile's own native report.pdf (the one this pipeline otherwise
#     discards in favor of generate_report.py's own render -- see
#     CLAUDE.md) renders all of these per category; parsed out via a
#     one-time PyMuPDF text-extraction pass across native reports for all
#     4 modular apps plus Threagile's own `-create-example-model`, since
#     no single model's findings exercise every built-in rule. Spot-
#     checked for the PDF font-encoding mojibake this same extraction
#     technique hit in trim_report.py's era (none found in Threagile's own
#     built-in text, which is plain-ASCII prose without the em-dashes that
#     triggered it in our own custom-risk text elsewhere).
#   - cheat_sheet is Threagile's own short cheat-sheet slug (e.g.
#     "Cross_Site_Scripting_Prevention_Cheat_Sheet"), expanded here to the
#     actual OWASP Cheat Sheet Series URL following that project's own
#     naming convention.
#
# COVERAGE -- all 35 built-in categories that aren't purely model-authoring
# failures (missing-build-infrastructure and missing-identity-store ARE
# included -- they're real risk categories in our pipeline, not in
# MODEL_FAILURE_CATEGORY_IDS; the 7 actual model-failure IDs are excluded
# since they render in "Potential Model Failures" and never consult this
# file). 32 of the 35 came from the same real-model/example-model sources
# described above; the remaining 3 -- container-platform-escape,
# missing-identity-provider-isolation, service-registry-poisoning -- never
# fired in any of those, since none of our 4 real apps or Threagile's own
# example model happen to include a container-platform, identity-provider-
# sharing-a-boundary, or service-registry asset. Rather than leave those 3
# without enrichment, a small handcrafted probe model
# (threagile-builtin-probe-model.yml, kept in this directory for
# reproducibility -- not a real app, never merged into any pipeline)
# exists solely to contain exactly those 3 asset types so all 35 rules
# would fire somewhere; extracted from its own native report.pdf the same
# way as everything else in this file.
#
# MAINTENANCE -- this file only needs regenerating if the pinned Threagile
# image version changes (a version bump could reword or add/remove rules).
# It is never hand-edited; re-run the extraction against the new image
# instead of patching entries here piecemeal, since the whole point is
# that this is Threagile's own upstream text, not ours to author.
# ==============================================================================

builtin_risks:

  accidental-secret-leak:
    title: "Accidental Secret Leak"
    description: >
      Sourcecode repositories (including their histories) as well as artifact
      registries can accidentally contain secrets like checked-in or
      packaged-in passwords, API tokens, certificates, crypto keys, etc.
    impact: >
      If this risk is unmitigated, attackers which have access to affected
      sourcecode repositories or artifact registries might find secrets
      accidentally checked-in.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored.
    false_positives: "Usually no false positives."

  # No asvs/cheat_sheet fields on this entry, unlike every other category
  # in this file -- flagged during review, not yet re-verified against a
  # fresh extraction. Could be a real absence in Threagile's own native
  # report.pdf text for this category (plausible: it's a CI/CD-pipeline
  # category that may not have fired across all 4 modular apps plus the
  # example model the original PyMuPDF extraction pass covered -- see this
  # file's own PROVENANCE note above), or it could be an extraction miss.
  # Worth re-running the extraction against the pinned
  # threagile/threagile:0.9.1 image to confirm one way or the other.
  code-backdooring:
    title: "Code Backdooring"
    description: >
      For each build-pipeline component Code Backdooring risks might arise
      where attackers compromise the build-pipeline in order to let backdoored
      artifacts be shipped into production. Aside from direct code backdooring
      this includes backdooring of dependencies and even of more lower-level
      build infrastructure, like backdooring compilers (similar to what the
      XcodeGhost malware did) or dependencies.
    impact: >
      If this risk remains unmitigated, attackers might be able to execute
      code on and completely takeover production environments.
    risk_assessment: >
      The risk rating depends on the confidentiality and integrity rating of
      the code being handled and deployed as well as the placement/calling of
      this technical asset on/from the internet.
    false_positives: >
      When the build-pipeline and sourcecode-repo is not exposed to the
      internet and considered fully trusted (which implies that all accessing
      clients are also considered fully trusted in terms of their patch
      management and applied hardening, which must be equivalent to a managed
      developer client environment) this can be considered a false positive
      after individual review.

  container-baseimage-backdooring:
    title: "Container Base Image Backdooring"
    description: >
      When a technical asset is built using container technologies, Base Image
      Backdooring risks might arise where base images and other layers used
      contain vulnerable components or backdoors. See for example:
      https://techcrunch.com/2018/06/15/tainted-crypto-mining-containers-pulled-from-docker-hub/
    impact: >
      If this risk is unmitigated, attackers might be able to deeply persist
      in the target system by executing code in deployed containers.
    asvs: "V10 - Malicious Code Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets.
    false_positives: >
      Fully trusted (i.e. reviewed and cryptographically signed or similar)
      base images of containers can be considered as false positives after
      individual review.

  container-platform-escape:
    title: "Container Platform Escape"
    description: >
      Container platforms are especially interesting targets for attackers as
      they host big parts of a containerized runtime infrastructure. When not
      configured and operated with security best practices in mind, attackers
      might exploit a vulnerability inside an container and escape towards
      the platform as highly privileged users. These scenarios might give
      attackers capabilities to attack every other container as owning the
      container platform (via container escape attacks) equals to owning
      every container.
    impact: >
      If this risk is unmitigated, attackers which have successfully
      compromised a container (via other vulnerabilities) might be able to
      deeply persist in the target system by executing code in many deployed
      containers and the container platform itself.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset
      itself and of the data assets processed and stored.
    false_positives: >
      Container platforms not running parts of the target architecture can
      be considered as false positives after individual review.

  cross-site-request-forgery:
    title: "Cross-Site Request Forgery (CSRF)"
    description: >
      When a web application is accessed via web protocols Cross-Site Request
      Forgery (CSRF) risks might arise.
    impact: >
      If this risk remains unmitigated, attackers might be able to trick
      logged-in victim users into unwanted actions within the web application
      by visiting an attacker controlled web site.
    asvs: "V4 - Access Control Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the integrity rating of the data sent across
      the communication link.
    false_positives: >
      Web applications passing the authentication sate via custom headers
      instead of cookies can eventually be false positives. Also when the web
      application is not accessed via a browser-like component (i.e not by a
      human user initiating the request that gets passed through all
      components until it reaches the web application) this can be considered
      a false positive.

  cross-site-scripting:
    title: "Cross-Site Scripting (XSS)"
    description: >
      For each web application Cross-Site Scripting (XSS) risks might arise.
      In terms of the overall risk level take other applications running on
      the same domain into account as well.
    impact: >
      If this risk remains unmitigated, attackers might be able to access
      individual victim sessions and steal or modify user data.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the data processed or
      stored in the web application.
    false_positives: >
      When the technical asset is not accessed via a browser-like component
      (i.e not by a human user initiating the request that gets passed through
      all components until it reaches the web application) this can be
      considered a false positive.

  dos-risky-access-across-trust-boundary:
    title: "DoS-risky Access Across Trust-Boundary"
    description: >
      Assets accessed across trust boundaries with critical or
      mission-critical availability rating are more prone to Denial-of-Service
      (DoS) risks.
    impact: >
      If this risk remains unmitigated, attackers might be able to disturb the
      availability of important parts of the system.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html"
    risk_assessment: >
      Matching technical assets with availability rating of critical or higher
      are at low risk. When the availability rating is mission-critical and
      neither a VPN nor IP filter for the incoming data-flow nor redundancy
      for the asset is applied, the risk-rating is considered medium.
    false_positives: >
      When the accessed target operations are not time- or resource-consuming.

  ldap-injection:
    title: "LDAP-Injection"
    description: >
      When an LDAP server is accessed LDAP-Injection risks might arise. The
      risk rating depends on the sensitivity of the LDAP server itself and of
      the data assets processed or stored.
    impact: >
      If this risk remains unmitigated, attackers might be able to modify LDAP
      queries and access more data from the LDAP server than allowed.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the LDAP server itself and
      of the data assets processed or stored.
    false_positives: >
      LDAP server queries by search values not consisting of parts
      controllable by the caller can be considered as false positives after
      individual review.

  missing-authentication:
    title: "Missing Authentication"
    description: >
      Technical assets (especially multi-tenant systems) should authenticate
      incoming requests when the asset processes or stores sensitive data.
    impact: >
      If this risk is unmitigated, attackers might be able to access or modify
      sensitive data in an unauthenticated way.
    asvs: "V2 - Authentication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating (medium or high) depends on the sensitivity of the data
      sent across the communication link. Monitoring callers are exempted from
      this risk.
    false_positives: >
      Technical assets which do not process requests regarding functionality
      or data linked to end-users (customers) can be considered as false
      positives after individual review.

  missing-authentication-second-factor:
    title: "Missing Two-Factor Authentication (2FA)"
    description: >
      Technical assets (especially multi-tenant systems) should authenticate
      incoming requests with two-factor (2FA) authentication when the asset
      processes or stores highly sensitive data (in terms of confidentiality,
      integrity, and availability) and is accessed by humans.
    impact: >
      If this risk is unmitigated, attackers might be able to access or modify
      highly sensitive data without strong authentication.
    asvs: "V2 - Authentication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"
    risk_assessment: "medium"
    false_positives: >
      Technical assets which do not process requests regarding functionality
      or data linked to end-users (customers) can be considered as false
      positives after individual review.

  missing-build-infrastructure:
    title: "Missing Build Infrastructure"
    description: >
      The modeled architecture does not contain a build infrastructure
      (devops-client, sourcecode-repo, build-pipeline, etc.), which might be
      the risk of a model missing critical assets (and thus not seeing their
      risks). If the architecture contains custom-developed parts, the
      pipeline where code gets developed and built needs to be part of the
      model.
    impact: >
      If this risk is unmitigated, attackers might be able to exploit risks
      unseen in this threat model due to critical build infrastructure
      components missing in the model.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the highest sensitivity of the in-scope
      assets running custom-developed parts.
    false_positives: >
      Models not having any custom-developed parts can be considered as false
      positives after individual review.

  missing-cloud-hardening:
    title: "Missing Cloud Hardening"
    description: >
      Cloud components should be hardened according to the cloud vendor best
      practices. This affects their configuration, auditing, and further
      areas.
    impact: >
      If this risk is unmitigated, attackers might access cloud components in
      an unintended way.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored.
    false_positives: >
      Cloud components not running parts of the target architecture can be
      considered as false positives after individual review.

  missing-file-validation:
    title: "Missing File Validation"
    description: >
      When a technical asset accepts files, these input files should be
      strictly validated about filename and type.
    impact: >
      If this risk is unmitigated, attackers might be able to provide
      malicious files to the application.
    asvs: "V12 - File and Resources Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored.
    false_positives: >
      Fully trusted (i.e. cryptographically signed or similar) files can be
      considered as false positives after individual review.

  missing-hardening:
    title: "Missing Hardening"
    description: >
      Technical assets with a Relative Attacker Attractiveness (RAA) value of
      55 % or higher should be explicitly hardened taking best practices and
      vendor hardening guides into account.
    impact: >
      If this risk remains unmitigated, attackers might be able to easier
      attack high-value targets.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the data processed or
      stored in the technical asset.
    false_positives: "Usually no false positives."

  missing-identity-propagation:
    title: "Missing Identity Propagation"
    description: >
      Technical assets (especially multi-tenant systems), which usually
      process data for endusers should authorize every request based on the
      identity of the enduser when the data flow is authenticated (i.e.
      non-public). For DevOps usages at least a technical-user authorization
      is required.
    impact: >
      If this risk is unmitigated, attackers might be able to access or modify
      foreign data after a successful compromise of a component within the
      system due to missing resource-based authorization checks.
    asvs: "V4 - Access Control Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating (medium or high) depends on the confidentiality,
      integrity, and availability rating of the technical asset.
    false_positives: >
      Technical assets which do not process requests regarding functionality
      or data linked to end-users (customers) can be considered as false
      positives after individual review.

  missing-identity-provider-isolation:
    title: "Missing Identity Provider Isolation"
    description: >
      Highly sensitive identity provider assets and their identity
      datastores should be isolated from other assets by their own network
      segmentation trust-boundary (execution-environment boundaries do not
      count as network isolation).
    impact: >
      If this risk is unmitigated, attackers successfully attacking other
      components of the system might have an easy path towards highly
      sensitive identity provider assets and their identity datastores, as
      they are not separated by network segmentation.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      Default is high impact. The impact is increased to very-high when the
      asset missing the trust-boundary protection is rated as
      strictly-confidential or mission-critical.
    false_positives: >
      When all assets within the network segmentation trust-boundary are
      hardened and protected to the same extend as if all were identity
      providers with data of highest sensitivity.

  missing-identity-store:
    title: "Missing Identity Store"
    description: >
      The modeled architecture does not contain an identity store, which might
      be the risk of a model missing critical assets (and thus not seeing
      their risks).
    impact: >
      If this risk is unmitigated, attackers might be able to exploit risks
      unseen in this threat model in the identity provider/store that is
      currently missing in the model.
    asvs: "V2 - Authentication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the enduser-identity
      authorized technical assets and their data assets processed and stored.
    false_positives: >
      Models only offering data/services without any real authentication need
      can be considered as false positives after individual review.

  missing-network-segmentation:
    title: "Missing Network Segmentation"
    description: >
      Highly sensitive assets and/or datastores residing in the same network
      segment than other lower sensitive assets (like webservers or content
      management systems etc.) should be better protected by a network
      segmentation trust-boundary.
    impact: >
      If this risk is unmitigated, attackers successfully attacking other
      components of the system might have an easy path towards more valuable
      targets, as they are not separated by network segmentation.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      Default is low risk. The risk is increased to medium when the asset
      missing the trust-boundary protection is rated as strictly-confidential
      or mission-critical.
    false_positives: >
      When all assets within the network segmentation trust-boundary are
      hardened and protected to the same extend as if all were
      containing/processing highly sensitive data.

  missing-vault:
    title: "Missing Vault (Secret Storage)"
    description: >
      In order to avoid the risk of secret leakage via config files (when
      attacked through vulnerabilities being able to read files like
      Path-Traversal and others), it is best practice to use a separate
      hardened process with proper authentication, authorization, and audit
      logging to access config secrets (like credentials, private keys, client
      certificates, etc.). This component is usually some kind of Vault.
    impact: >
      If this risk is unmitigated, attackers might be able to easier steal
      config secrets (like credentials, private keys, client certificates,
      etc.) once a vulnerability to access files is present and exploited.
    asvs: "V6 - Stored Cryptography Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored.
    false_positives: >
      Models where no technical assets have any kind of sensitive config data
      to protect can be considered as false positives after individual review.

  missing-vault-isolation:
    title: "Missing Vault Isolation"
    description: >
      Highly sensitive vault assets and their datastores should be isolated
      from other assets by their own network segmentation trust-boundary
      (execution-environment boundaries do not count as network isolation).
    impact: >
      If this risk is unmitigated, attackers successfully attacking other
      components of the system might have an easy path towards highly
      sensitive vault assets and their datastores, as they are not separated
      by network segmentation.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      Default is medium impact. The impact is increased to high when the asset
      missing the trust-boundary protection is rated as strictly-confidential
      or mission-critical.
    false_positives: >
      When all assets within the network segmentation trust-boundary are
      hardened and protected to the same extend as if all were vaults with
      data of highest sensitivity.

  missing-waf:
    title: "Missing Web Application Firewall (WAF)"
    description: >
      To have a first line of filtering defense, security architectures with
      web-services or web-applications should include a WAF in front of them.
      Even though a WAF is not a replacement for security (all components must
      be secure even without a WAF) it adds another layer of defense to the
      overall system by delaying some attacks and having easier attack
      alerting through it.
    impact: >
      If this risk is unmitigated, attackers might be able to apply standard
      attack pattern tests at great speed without any filtering.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Virtual_Patching_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored.
    false_positives: >
      Targets only accessible via WAFs or reverse proxies containing a WAF
      component (like ModSecurity) can be considered as false positives after
      individual review.

  mixed-targets-on-shared-runtime:
    title: "Mixed Targets on Shared Runtime"
    description: >
      Different attacker targets (like frontend and backend/datastore
      components) should not be running on the same shared (underlying)
      runtime.
    impact: >
      If this risk is unmitigated, attackers successfully attacking other
      components of the system might have an easy path towards more valuable
      targets, as they are running on the same shared runtime.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating (low or medium) depends on the confidentiality,
      integrity, and availability rating of the technical asset running on the
      shared runtime.
    false_positives: >
      When all assets running on the shared runtime are hardened and protected
      to the same extend as if all were containing/processing highly sensitive
      data.

  path-traversal:
    title: "Path-Traversal"
    description: >
      When a filesystem is accessed Path-Traversal or Local-File-Inclusion
      (LFI) risks might arise. The risk rating depends on the sensitivity of
      the technical asset itself and of the data assets processed or stored.
    impact: >
      If this risk is unmitigated, attackers might be able to read sensitive
      files (configuration data, key/credential files, deployment files,
      business data files, etc.) from the filesystem of affected components.
    asvs: "V12 - File and Resources Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the data stored inside the
      technical asset.
    false_positives: >
      File accesses by filenames not consisting of parts controllable by the
      caller can be considered as false positives after individual review.

  push-instead-of-pull-deployment:
    title: "Push instead of Pull Deployment"
    description: >
      When comparing push-based vs. pull-based deployments from a security
      perspective, pull-based deployments improve the overall security of the
      deployment targets. Every exposed interface of a production system to
      accept a deployment increases the attack surface of the production
      system, thus a pull-based approach exposes less attack surface relevant
      interfaces.
    impact: >
      If this risk is unmitigated, attackers might have more potential target
      vectors for attacks, as the overall attack surface is unnecessarily
      increased.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the highest sensitivity of the deployment
      targets running custom-developed parts.
    false_positives: >
      Communication links that are not deployment paths can be considered as
      false positives after individual review.

  search-query-injection:
    title: "Search-Query Injection"
    description: >
      When a search engine server is accessed Search-Query Injection risks
      might arise. See for example
      https://github.com/veracode-research/solr-injection and
      https://github.com/veracode-research/solr-injection/blob/master/slides/DEFCON-27-Michael-Stepankin-Apache-Solr-Injection.pdf
      for more details (here related to Solr, but in general showcasing the
      topic of search query injections).
    impact: >
      If this risk remains unmitigated, attackers might be able to read more
      data from the search index and eventually further escalate towards a
      deeper system penetration via code executions.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the search engine server
      itself and of the data assets processed or stored.
    false_positives: >
      Server engine queries by search values not consisting of parts
      controllable by the caller can be considered as false positives after
      individual review.

  service-registry-poisoning:
    title: "Service Registry Poisoning"
    description: >
      When a service registry used for discovery of trusted service
      endpoints Service Registry Poisoning risks might arise.
    impact: >
      If this risk remains unmitigated, attackers might be able to poison
      the service registry with malicious service endpoints or malicious
      lookup and config data leading to breach of sensitive data.
    asvs: "V10 - Malicious Code Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical assets
      accessing the service registry as well as the data assets processed or
      stored.
    false_positives: >
      Service registries not used for service discovery can be considered as
      false positives after individual review.

  server-side-request-forgery:
    title: "Server-Side Request Forgery (SSRF)"
    description: >
      When a server system (i.e. not a client) is accessing other server
      systems via typical web protocols Server-Side Request Forgery (SSRF) or
      Local-File-Inclusion (LFI) or Remote-File-Inclusion (RFI) risks might
      arise.
    impact: >
      If this risk is unmitigated, attackers might be able to access sensitive
      services or files of network-reachable components by modifying outgoing
      calls of affected components.
    asvs: "V12 - File and Resources Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating (low or medium) depends on the sensitivity of the data
      assets receivable via web protocols from targets within the same network
      trust-boundary as well on the sensitivity of the data assets receivable
      via web protocols from the target asset itself. Also for cloud-based
      environments the exploitation impact is at least medium, as cloud
      backend services can be attacked via SSRF.
    false_positives: >
      Servers not sending outgoing web requests can be considered as false
      positives after review.

  sql-nosql-injection:
    title: "SQL/NoSQL-Injection"
    description: >
      When a database is accessed via database access protocols
      SQL/NoSQL-Injection risks might arise. The risk rating depends on the
      sensitivity technical asset itself and of the data assets processed or
      stored.
    impact: >
      If this risk is unmitigated, attackers might be able to modify SQL/NoSQL
      queries to steal and modify data and eventually further escalate towards
      a deeper system penetration via code executions.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the data stored inside the
      database.
    false_positives: >
      Database accesses by queries not consisting of parts controllable by the
      caller can be considered as false positives after individual review.

  unchecked-deployment:
    title: "Unchecked Deployment"
    description: >
      For each build-pipeline component Unchecked Deployment risks might arise
      when the build-pipeline does not include established DevSecOps
      best-practices. DevSecOps best-practices scan as part of CI/CD pipelines
      for vulnerabilities in source- or byte-code, dependencies, container
      layers, and dynamically against running test systems. There are several
      open-source and commercial tools existing in the categories DAST, SAST,
      and IAST.
    impact: >
      If this risk remains unmitigated, vulnerabilities in custom-developed
      software or their dependencies might not be identified during continuous
      deployment cycles.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the highest rating of the technical assets
      and data assets processed by deployment-receiving targets.
    false_positives: >
      When the build-pipeline does not build any software components it can be
      considered a false positive after individual review.

  unencrypted-asset:
    title: "Unencrypted Technical Assets"
    description: >
      Due to the confidentiality rating of the technical asset itself and/or
      the processed data assets this technical asset must be encrypted. The
      risk rating depends on the sensitivity technical asset itself and of the
      data assets stored.
    impact: >
      If this risk is unmitigated, attackers might be able to access
      unencrypted data when successfully compromising sensitive components.
    asvs: "V6 - Stored Cryptography Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
    risk_assessment: >
      Depending on the confidentiality rating of the stored data-assets either
      medium or high risk.
    false_positives: >
      When all sensitive data stored within the asset is already fully
      encrypted on document or data level.

  unencrypted-communication:
    title: "Unencrypted Communication"
    description: >
      Due to the confidentiality and/or integrity rating of the data assets
      transferred over the communication link this connection must be
      encrypted.
    impact: >
      If this risk is unmitigated, network attackers might be able to to
      eavesdrop on unencrypted sensitive data sent between components.
    asvs: "V9 - Communication Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html"
    risk_assessment: >
      Depending on the confidentiality rating of the transferred data-assets
      either medium or high risk.
    false_positives: >
      When all sensitive data sent over the communication link is already
      fully encrypted on document or data level. Also intra-container/pod
      communication can be considered false positive when container
      orchestration platform handles encryption.

  unguarded-access-from-internet:
    title: "Unguarded Access From Internet"
    description: >
      Internet-exposed assets must be guarded by a protecting service,
      application, or reverse-proxy.
    impact: >
      If this risk is unmitigated, attackers might be able to directly attack
      sensitive systems without any hardening components in-between due to
      them being directly exposed on the internet.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The matching technical assets are at low risk. When either the
      confidentiality rating is strictly-confidential or the integrity rating
      is mission-critical, the risk-rating is considered medium. For assets
      with RAA values higher than 40 % the risk-rating increases.
    false_positives: >
      When other means of filtering client requests are applied equivalent of
      reverse-proxy, waf, or gateway components.

  unguarded-direct-datastore-access:
    title: "Unguarded Direct Datastore Access"
    description: >
      Datastores accessed across trust boundaries must be guarded by some
      protecting service or application.
    impact: >
      If this risk is unmitigated, attackers might be able to directly attack
      sensitive datastores without any protecting components in-between.
    asvs: "V1 - Architecture, Design and Threat Modeling Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"
    risk_assessment: >
      The matching technical assets are at low risk. When either the
      confidentiality rating is strictly-confidential or the integrity rating
      is mission-critical, the risk-rating is considered medium. For assets
      with RAA values higher than 40 % the risk-rating increases.
    false_positives: >
      When the caller is considered fully trusted as if it was part of the
      datastore itself.

  untrusted-deserialization:
    title: "Untrusted Deserialization"
    description: >
      When a technical asset accepts data in a specific serialized form (like
      Java or .NET serialization), Untrusted Deserialization risks might
      arise. See
      https://christian-schneider.net/JavaDeserializationSecurityFAQ.html for
      more details.
    impact: >
      If this risk is unmitigated, attackers might be able to execute code on
      target systems by exploiting untrusted deserialization endpoints.
    asvs: "V5 - Validation, Sanitization and Encoding Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored.
    false_positives: >
      Fully trusted (i.e. cryptographically signed or similar) data
      deserialized can be considered as false positives after individual
      review.

  xml-external-entity:
    title: "XML External Entity (XXE)"
    description: >
      When a technical asset accepts data in XML format, XML External Entity
      (XXE) risks might arise.
    impact: >
      If this risk is unmitigated, attackers might be able to read sensitive
      files (configuration data, key/credential files, deployment files,
      business data files, etc.) form the filesystem of affected components
      and/or access sensitive services or files of other components.
    asvs: "V14 - Configuration Verification Requirements"
    cheat_sheet: "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
    risk_assessment: >
      The risk rating depends on the sensitivity of the technical asset itself
      and of the data assets processed and stored. Also for cloud-based
      environments the exploitation impact is at least medium, as cloud
      backend services can be attacked via SSRF (and XXE vulnerabilities are
      often also SSRF vulnerabilities).
    false_positives: >
      Fully trusted (i.e. cryptographically signed or similar) XML data can be
      considered as false positives after individual review.

