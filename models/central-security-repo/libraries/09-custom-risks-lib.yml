  # --- 4.1 INPUT HANDLING AND INJECTION ---
  Server-Side Template Injection and RCE:
    id: dynamic-code-rce
    baseline_likelihood: likely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'The application executes dynamic code, expressions, or templates built from user-supplied input, which creates a server-side template injection vector.'
    impact: 'If this risk remains unmitigated, an attacker can achieve remote code execution and fully compromise the container running the application.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
    action: 'Sandbox script execution, and use logic-less templates.'
    mitigation: >-
      Avoid dynamic `eval()` functions entirely.

      If dynamic execution is absolutely required, run the logic in a strictly isolated,
