  Server-Side PDF Generation Injection:
    id: pdf-generation-injection
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The asset generates PDFs on the server by rendering HTML templates with a headless browser or an HTML-to-PDF library. During rendering, that library can resolve attacker-supplied URLs or file paths.'
    impact: 'If this risk remains unmitigated, an attacker can use injected HTML or CSS to read local files, or to reach the cloud metadata endpoint, from the rendering process.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    action: 'Disable JavaScript execution and external resource loading in the PDF renderer, and sanitize all user-supplied content before inserting it into a template.'
    mitigation: >-
      Disable JavaScript execution in the PDF renderer's configuration (for wkhtmltopdf,
      --disable-javascript, and for Puppeteer, javascript=false).

      Disable external resource loading (for wkhtmltopdf, --no-background and
      --disable-local-file-access).

      Sanitize all user-supplied content with a strict HTML sanitizer (for example, DOMPurify)
      before inserting it into the PDF template, and allow only a safe subset of formatting tags.

      Run the PDF renderer in a network-isolated sandbox with no outbound connectivity and no
      filesystem access beyond the template directory.

      Apply the same IMDS blocking controls as for SSRF.
