    finding_class: control-not-evidenced
    description: 'The application allows the installation of third-party marketplace plugins that execute code directly within the application''s core process.'
    impact: 'If this risk remains unmitigated, a malicious or supply-chain-compromised plugin runs with the full privileges of the application, which enables a complete compromise.'
    asvs: V10 - Malicious Code
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Third_Party_Javascript_Management_Cheat_Sheet.html
    action: 'Establish and enforce a cryptographically signed plugin allow-list, and disable end-user self-service plugin installation entirely.'
    mitigation: >-
      Maintain a centrally managed, AO-approved allow-list of permitted plugins, verified by vendor
      code signing.

      Disable end-user plugin installation through platform policy.

      Require a security review and a SAST scan of all plugin code before a plugin is admitted to
      the allow-list.

      Where the platform supports it, run plugins in a sandboxed context with a restricted API
      surface.

      Audit the installed plugins against the allow-list periodically, and alert on unauthorized
      additions.
    references: DoD DevSecOps Reference Architecture; NIST SP 800-53 CM-7 (Least Functionality); NIST SP 800-53 SA-12 (Supply Chain Protection)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical if end users or administrators can install plugins without vetting. However, it is High if installation requires elevated privilege but no code review gate exists.'
    false_positives: 'All installed plugins are developed internally, cryptographically signed by an internal PKI, and have passed a mandatory security review. In other words, no third-party marketplace plugins are present.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 829
    detection_logic: 'Audit the application''s installed plugin registry on a schedule, and alert on any plugin that is not in the approved allow-list. Additionally, monitor the application process''s network connections for unexpected outbound destinations that may indicate a plugin exfiltrating data. Finally, enable plugin activity logging in the application if the platform supports it.'
