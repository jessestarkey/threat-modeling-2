  # --- 9.1 INFRASTRUCTURE: BACKUP AND DR ---
  Backup Integrity and Recovery Assurance Gap:
    id: backup-integrity-recovery-gap
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The asset is flagged as requiring backup for DR and COOP. However, the backups'' integrity, encryption, access control, and recovery testing have not been verified.'
    impact: 'If this risk remains unmitigated, a ransomware attack or an infrastructure failure can result in permanent data loss, because the backups'' actual recoverability was never confirmed.'
    asvs: V9 - Communications / V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: 'Verify the backups'' encryption, access isolation, and geographic separation, and conduct a documented recovery test against the defined RTO and RPO targets.'
    mitigation: >-
      Encrypt all backups at rest with FIPS-validated cryptography, and store the keys separately
      from the backup data (for example, Azure Backup with a CMK in Key Vault).

      Store backups in a geographically separate Azure region, in a storage account that only the
      backup service principal can access, and not the application workload identities.

      Implement immutable backup storage (Azure Backup soft delete with a lock) to prevent deletion
      by ransomware.

      Conduct and document a full recovery test at least annually, validating the actual RTO and RPO
      against the documented targets.

      Alert on backup job failures within one hour.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 CP-10 (Information System Recovery); DoD COOP requirements; Azure Backup security baseline
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for an asset that stores CUI, where the backup procedures have never been tested, or where the backup storage is co-located with or accessible from the primary environment.'
    false_positives: 'The backups'' encryption, geographic separation, access isolation, and recovery testing are all documented in the COOP plan, and they have been validated within the current ATO period.'
    function: operations
    stride: tampering
    cwe: 693
    detection_logic: 'Monitor the Azure Backup job status, and alert on any job failure within the defined backup window. Additionally, audit the backup storage account''s access policies to verify that no production workload identity has write access. Finally, schedule annual recovery test exercises, and track their completion in the POA&M.'
    risks_identified: {}

  Backup Administrative Privilege Separation Gap:
    id: backup-admin-privilege-separation-gap
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'Either (1) backup platform administrators share an identity with production administrators, or (2) destructive backup operations are not protected by dual authorization.'
    impact: 'If this risk remains unmitigated, a single compromised production admin account can delete the very backups meant to recover from that compromise.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: 'Ensure that backup administration is a role distinct from production administration, and require dual authorization and step-up authentication for any destructive backup operation.'
    mitigation: >-
      Assign backup platform administration to a role held by individuals who do not also hold
      production administrative access to the same workload.

      Require a second approver and step-up MFA specifically for destructive operations, namely
      deleting a backup, shortening retention, disabling a job, or removing an immutability lock.

      Routine backup operations, such as creating a backup or running a restore test, do not need
      this.

      Alert on every destructive backup operation, regardless of who performs it.
