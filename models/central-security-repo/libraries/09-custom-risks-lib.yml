    finding_class: control-not-evidenced
    description: 'This self-managed physical host has an out-of-band management controller (BMC, iDRAC, iLO, or IPMI) that has not been confirmed as hardened. The controller runs its own processor and network stack, independent of the host operating system.'
    impact: 'If this risk remains unmitigated, a default or weak BMC credential grants an attacker remote control of the host that the operating system cannot see, including the ability to reimage the host remotely.'
