    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any self-managed asset with an external routing adjacency and no RPKI route origin validation.'
    false_positives: 'The asset is tagged mgmt:self-managed-network-hardened, which confirms that RPKI route origin validation and ROA registration are in place for this asset''s routing adjacencies. Additionally, this finding does not apply to assets with no self-managed external routing, or where routing is provided by the enterprise-managed landing zone. The finding is raised once per network trust boundary that holds unhardened self-managed assets. Specifically, it lands on that boundary''s edge asset (a gateway, load balancer, reverse proxy, WAF, network encryptor, or IDS/IPS) where one is modeled, and otherwise on the first such asset by id.'
    function: architecture
    stride: spoofing
    cwe: 346
    risks_identified: {}

  # --- 3.2 CROSS-DOMAIN SOLUTION (CDS) INTERFACES ---
  # Risks cover the low-side application's interface with an external,
  # UCDMO-approved CDS. The CDS itself is outside the ATO boundary.
  #
  # ── TAG: cds:low-side-submitter ───────────────────────────────────────
  'CDS: Classification Marking Validation Bypass':
    id: cds-marking-validation-bypass
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'Before submitting content to the CDS for low-to-high transfer, the application validates that classification markings exist. However, it cannot verify that those markings are correct.'
    impact: 'If this risk remains unmitigated, incorrectly classified content can reach the CDS and result in a formal data spill.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Enforce schema validation at every API ingestion point, and validate marking values against an approved controlled-vocabulary allowlist.'
    mitigation: >-
      Enforce classification marking validation as server-side middleware on every ingestion
      endpoint, not only at the UI layer. Specifically, validate marking values against an approved
      controlled-vocabulary allowlist, requiring an exact match rather than only a non-null value.

      Reject and log any submission whose markings are absent, malformed, or outside the approved
      vocabulary.

      Gate writes to the broker queue on successful validation, so that content cannot reach the
      queue until validation passes.

      Include the validation result and the marking value in the transfer audit log.
    references: DoD CUI Registry; NIST SP 800-53 SI-10 (Information Input Validation); ICD 710 (Classification Management)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any low-to-high transfer path, since the application is the last validation point before content reaches the CDS.'
    false_positives: 'Three conditions hold: (1) marking validation is enforced at the server-side API layer on every ingestion path, (2) values are validated against a hardcoded, approved vocabulary allowlist, and (3) no direct queue write access exists that bypasses the application.'
    function: architecture
    stride: information-disclosure
    cwe: 345
    detection_logic: 'Monitor transfer submission logs for marking field values outside the approved vocabulary. Additionally, alert on any direct broker queue write that does not originate from the validated application ingestion path. Finally, include the schema validation pass or fail status in every transfer audit record.'
    risks_identified: {}

  'CDS: Misclassification and Insufficient Transfer Audit Trail':
    id: cds-misclassification-audit-gap
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'Classification correctness on the low-to-high transfer path is a human judgment that the application cannot enforce technically. Thus, the application''s main contribution to spillage prevention is the completeness of the audit trail it produces.'
    impact: 'If this risk remains unmitigated, an incomplete or tampered audit trail prevents a spillage event from being reconstructed or attributed after the fact.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: 'Implement a complete, tamper-evident transfer audit trail that captures the full submission context, and forward it to a write-once SIEM.'
    mitigation: >-
      Generate an immutable audit record for every transfer submission. The record contains the
      authenticated user identity, the submission timestamp, the content identifier, the asserted
      classification marking, the schema validation result, the CDS submission status, and the CDS
      response code.

      Forward these records to a write-once SIEM that the application cannot modify.

      Implement anomaly detection on transfer patterns, and alert on atypical submission volumes,
      atypical content types, or marking values that are inconsistent with a user's historical
      pattern.

      Require re-authentication before bulk transfer submissions.
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 AU-9 (Protection of Audit Information); DoD Insider Threat Program; ICD 710
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High, since the audit trail is the primary compensating control for misclassification risk. If the audit trail is absent, the residual risk rises to Critical.'
    false_positives: 'Three conditions hold: (1) transfer audit records capture the full submission context, (2) the records are forwarded to a write-once SIEM, and (3) anomaly detection on transfer patterns is active and tuned.'
    function: operations
    stride: repudiation
    cwe: 778
    detection_logic: 'Monitor the transfer logs for four patterns, namely (1) submission volumes that are atypical relative to the user''s baseline, (2) marking values that are inconsistent with the user''s historical pattern, (3) submissions outside normal working hours, and (4) bulk submissions immediately preceded by privilege changes.'
    risks_identified: {}

  # ── TAG: cds:low-side-receiver ────────────────────────────────────────
  'CDS: Unsafe Processing of CDS-Sourced Inbound Content':
    id: cds-unsafe-inbound-content
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The receiving application processes CDS-approved content from the high side with less rigorous validation than it applies to data supplied directly by users. However, CDS approval reflects releasability, not whether the content is safe to parse.'
    impact: 'If this risk remains unmitigated, an approved document can still exploit a parser vulnerability or poison the receiving application''s data store.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Apply the same input validation and malware scanning to CDS-sourced content as to any other externally sourced data.'
    mitigation: >-
      Process all inbound CDS content through the same validation pipeline as direct user uploads.
      That pipeline includes content-type verification, malware scanning, format-specific parser
      hardening (XXE disabled, macros disabled, and JavaScript disabled in PDF renderers), and file
      extension allow-listing.

      Do not grant CDS-sourced content elevated trust, and do not bypass input validation based on
      where the transfer came from.

      Log every inbound content receipt with its content identifier, type, size, and validation
      result.

      Alert on validation failures for CDS-sourced content.
    references: NIST SP 800-53 SI-3 (Malicious Code Protection); NIST SP 800-53 SI-10 (Information Input Validation); DoD CDS implementation guidance
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for an application that parses complex file formats (Office, PDF, or XML). However, it is Medium for an application that consumes structured, schema-validated data from the CDS.'
    false_positives: 'All inbound CDS content passes through the same validation and malware scanning pipeline as direct user uploads, with no bypass based on the CDS transfer origin.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 20
    detection_logic: 'Monitor the validation results for inbound CDS content, and alert on failures, particularly mismatches between the declared and the actual content type. Additionally, track parser exceptions on CDS-sourced content as potential indicators of exploitation.'
    risks_identified: {}

  # ── TAG: cds:low-side-broker ──────────────────────────────────────────
  'CDS: Transfer Broker Unauthorized Write and Queue Injection':
    id: cds-broker-queue-injection
    baseline_likelihood: unlikely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The message broker that stages content between the application and the CDS interface is a critical security boundary. Direct write access to it bypasses the application''s own classification marking validation.'
    impact: 'If this risk remains unmitigated, injected content reaches the CDS or the receiving application without any application audit record of it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
    action: 'Restrict broker write access exclusively to the authenticated application service account, and enforce message integrity verification on dequeue.'
    mitigation: >-
      Restrict write access to every transfer queue to the application service account only, with no
      human accounts and no direct developer access.

      Similarly, restrict outbound queue read access to the CDS interface service account only.

      Sign each message for integrity at enqueue and verify the signature at dequeue to detect
      tampering.

      Enforce queue-level encryption at rest, and set an aggressive message TTL to minimize the
      staging window.

      Log every enqueue and dequeue event with the actor's identity, and alert on any enqueue from
      an identity other than the approved service account.
    references: NIST SP 800-53 SC-8 (Transmission Integrity); NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 AU-2 (Event Logging)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical, since unauthorized write access to the broker nullifies every application-layer control on the transfer path.'
    false_positives: 'Three conditions hold: (1) broker write access is restricted to the application service account and enforced at the queue policy level, (2) message integrity signing is implemented, and (3) queue access logs are forwarded to the SIEM, with alerting on unexpected write origins.'
    function: architecture
    stride: tampering
    cwe: 284
    detection_logic: 'Monitor the broker access logs for enqueue events from any identity other than the approved application service account. Additionally, alert on message integrity verification failures at dequeue. Finally, monitor for anomalies in queue depth that indicate bulk injection outside normal transfer patterns.'
    risks_identified: {}

  # ── TAG: cds:high-side-submitter ─────────────────────────────────────
  'CDS: Inadvertent Above-Releasable Content Inclusion in Downward Release':
    id: cds-above-releasable-content-inclusion
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'Content proposed for downward release through the CDS relies primarily on human review. However, human review can miss above-releasable material embedded in file metadata, revision history, or embedded objects.'
    impact: 'If this risk remains unmitigated, above-releasable content that passes the CDS filter constitutes a formal downward spill that requires incident response.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Enforce multi-layer sanitization before submission, and require explicit approval from the human release authority before content is queued for the CDS.'
    mitigation: >-
      Implement automated sanitization that strips metadata, revision history, tracked changes,
      embedded objects, and document properties before human review. However, sanitization alone is
      not sufficient, so explicit sign-off from the release authority (logged with identity and
      timestamp) must be a mandatory gate before content enters the downward transfer queue.

      Maintain an allowlist of approved content types, and reject any format that the sanitization
      tooling cannot fully process.

      Log every sanitization action and its result in the transfer audit record.

      Apply a secondary content inspection after sanitization as a defense-in-depth check.
    references: DoD CDS implementation guidance; ICD 710 (Classification Management); NIST SP 800-53 SI-12 (Information Management and Retention); DoD Manual 5200.01 (Information Security Program)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any automated or partially automated downward release workflow. The consequence of a miss is a classified spill, and no compensating control exists after content passes the CDS filter.'
    false_positives: 'All content undergoes multi-layer automated sanitization, followed by a mandatory review and approval from the human release authority, before it reaches the transfer queue. Additionally, both steps are fully audit-logged.'
    function: architecture
    stride: information-disclosure
    cwe: 212
    detection_logic: 'Audit the transfer submission logs for content that bypassed the sanitization or human review step. Additionally, monitor for bulk submission patterns that may indicate review fatigue or circumvention of the process. Finally, sample content after transfer, periodically inspecting the content received on the low side for residual above-releasable markers as a quality assurance check.'
    risks_identified: {}

  'CDS: Release Authority Bypass on High-Side Downward Transfer':
    id: cds-release-authority-bypass
    baseline_likelihood: unlikely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The high-side submission workflow requires approval from the release authority before content is queued for downward transfer. However, this approval gate can potentially be bypassed through flaws in the workflow logic, direct broker writes, or privilege escalation.'
    impact: 'If this risk remains unmitigated, unreviewed content can reach the CDS without ever passing the mandatory human judgment of the release authority.'
    asvs: V4 - Access Control / V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: 'Enforce release authority approval as a server-side gate on every downward transfer submission path. Additionally, restrict high-side broker write access to the approval-gated application workflow only.'
    mitigation: >-
      Enforce release authority approval as server-side middleware on every submission ingestion
      path, not only on the primary UI workflow.

      Restrict write access to the high-side transfer broker queue exclusively to the application
      service account that runs after approval is confirmed.

      Validate an approval token at queue write time. Specifically, each queue write must carry a
      cryptographically signed approval token that is verified before the message is accepted.

      Log every release authority decision with the approver's identity, the timestamp, the content
      identifier, and the approval outcome.

      Alert on any queue write that is not accompanied by a valid approval token.
    references: DoD CDS implementation guidance; NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 AU-2 (Event Logging); ICD 710 (Classification Management)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical, since no compensating control exists downstream of a release authority bypass. Content that reaches the CDS without approval has not been reviewed for releasability.'
    false_positives: 'Three conditions hold: (1) every submission path enforces approval gating at the server-side middleware layer, (2) high-side broker write access is restricted to the post-approval application service account, and (3) approval tokens are cryptographically verified at queue write time.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 841
    detection_logic: 'Monitor the high-side broker queue write logs for messages that lack valid approval tokens. Additionally, alert on any submission API path that does not route through the approval middleware. Finally, audit the approval workflow for race conditions by monitoring the time between approval events and queue write events.'
    risks_identified: {}

  'CDS: Malicious Insider Abuse of Authorized Release Privileges':
    id: cds-malicious-insider-release-abuse
    baseline_likelihood: unlikely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'A cleared individual who legitimately holds submitter access or release authority can knowingly use that access to move content that they know is not authorized for release. In this case, no technical control is bypassed.'
    impact: 'If this risk remains unmitigated, an authorized insider can cause an unauthorized disclosure that is identical in consequence to any other downward spill, with no compensating technical control available afterward.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    action: 'Enforce two-person integrity on high-side release authority, so that the submitter and the approver are different individuals. Additionally, deploy behavioral analytics on submission patterns to surface deviations from an individual''s baseline before a release occurs.'
    mitigation: >-
      Separate the submitter and release authority roles, so that no individual holds both and the
      approval workflow technically prevents self-approval.

      Require dual authorization to release any content above a defined sensitivity threshold, so
      that a single insider cannot complete a release alone.

      Monitor submission volume, timing, sensitivity, and deviation from each individual's baseline
      with user and entity behavior analytics (UEBA), since deliberately malicious content is built
      to pass content filters.

      Correlate submission anomalies with the insider threat program's other indicators, such as
      adverse personnel actions or an upcoming separation.

      Scope submitter and approver access to the content domains that each role requires, and rotate
      personnel in the release authority role periodically.
    references: DoDD 5205.16 (The DoD Insider Threat Program); National Insider Threat Policy and Minimum Standards (implementing EO 13587); NIST SP 800-53 AC-5 (Separation of Duties); NIST SP 800-53 PM-12 (Insider Threat Program); NIST SP 800-53 AU-6 (Audit Record Review, Analysis, and Reporting)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at High. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any high-side submitter or release authority role, regardless of how well the technical sanitization and approval workflow is implemented. In other words, this risk is independent of those controls rather than a failure mode of them. Thus, application-layer controls alone cannot fully mitigate it, and it requires integration with the organization''s insider threat program.'
    false_positives: 'Four conditions hold: (1) separation of duties is enforced between the submitter and release authority roles, with no individual holding both, (2) two-person integrity is required to release sensitive content, (3) UEBA-based behavioral monitoring is deployed on submission activity, and (4) submission-pattern anomalies are correlated with the organization''s insider threat program.'
    function: architecture
    stride: information-disclosure
    cwe: 654
    detection_logic: 'Monitor for submission patterns that deviate from an individual''s historical baseline, such as unusual volume, timing outside normal working hours, content sensitivity inconsistent with the role, or submissions shortly before a known separation date. Additionally, alert on any release approved without a distinct second reviewer when dual authorization is configured. Finally, correlate CDS submission activity with the other insider threat indicators available to the organization''s insider threat program (for example, adverse HR actions, or anomalous data staging or access patterns on the high-side network before a submission).'
    risks_identified: {}

  # ── TAG: cds:high-side-receiver ───────────────────────────────────────
  'CDS: Low-to-High Content Integrity and Influence Risk':
    id: cds-low-to-high-influence
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The high-side receiver processes content from the low side that the CDS validates as authorized for ingestion, but not as accurate. Thus, a compromised low-side system could send subtly manipulated data that appears legitimate.'
    impact: 'If this risk remains unmitigated, corrupted data ingested into the high-side environment can compromise the integrity of the analysis or decisions that depend on it, without triggering any content-inspection alert.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Implement independent high-side validation of the integrity of inbound low-side content, and maintain anomaly detection on inbound data patterns.'
    mitigation: >-
      Apply schema validation and business logic checks to all inbound low-side content on the high
      side, rather than treating CDS approval as a guarantee of data integrity.

      Implement anomaly detection on inbound data patterns (statistical outliers, unexpected value
      ranges, or structural deviations from the baseline) that may indicate manipulation.

      Maintain a data provenance chain by logging the low-side source identity, the submission
      timestamp, and the content hash for every inbound transfer.

      For high-confidence, mission-critical data feeds, verify the data out of band against a
      secondary source where one is available.
    references: NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-53 AU-10 (Non-Repudiation); DoD CDS implementation guidance
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a high-side system that makes operational or analytical decisions based on low-side data feeds. However, it is Medium for a system where low-side data is advisory or is cross-referenced against independent high-side sources.'
    false_positives: 'Inbound low-side data is treated as untrusted. Specifically, it undergoes independent schema validation, anomaly detection, and provenance logging before it is used in any high-side analytical or operational workflow.'
    function: architecture
    stride: tampering
    cwe: 345
    detection_logic: 'Monitor inbound low-side data for statistical anomalies relative to historical baselines. Additionally, alert on content that passes CDS inspection but fails high-side schema validation or business logic checks. Finally, keep audit records of the provenance of each inbound transfer for forensic reconstruction.'
    risks_identified: {}

