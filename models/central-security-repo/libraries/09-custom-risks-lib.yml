  Missing Privacy Impact Assessment:
    id: missing-privacy-impact-assessment
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset processes or stores PII on individuals, but no current Privacy Impact Assessment documents what is collected, why, and how it is protected, as required by Section 208 of the E-Government Act of 2002.'
    impact: 'If this risk remains unmitigated, privacy risks in the system''s actual design go unreviewed until an incident, audit, or FOIA request forces the question, at which point remediation is far more disruptive than a documented assessment would have been.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Document a Privacy Impact Assessment for this system covering what PII is collected, the legal authority for collecting it, how it is used and shared, retention, and safeguards, and reassess it whenever PII handling changes materially.
    mitigation: Complete a Privacy Impact Assessment (PIA) per the sponsoring agency's PIA template and Section 208 of the E-Government Act of 2002, documenting what PII this asset collects, the legal authority for collecting it, how it is used and shared, retention, and the safeguards protecting it. Route the PIA through the organization's Senior Agency Official for Privacy (or equivalent) for review and publication where publicly releasable. Reassess and update the PIA whenever the system's PII collection, use, or sharing changes materially, not on a fixed calendar alone.
    references: E-Government Act of 2002, Section 208 (Privacy Impact Assessments); OMB Circular A-130; DoD Instruction 5400.16 (DoD Privacy Impact Assessment Guidance)
    risk_assessment: High for any asset processing PII with no current PIA on file, or a PIA that predates a material change to what PII is collected or how it is used.
    false_positives: The asset is tagged data:pia-documented confirming a current Privacy Impact Assessment covers this asset's actual PII collection, use, and sharing, and has been reviewed since the last material change.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Missing Data Provenance and Lineage Chain-of-Custody:
    id: missing-data-provenance-chain
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Data ingested from an external or upstream source has no origin register or append-only provenance record checked at the point of consumption.'
    impact: 'If this risk remains unmitigated, a substituted or tampered source is indistinguishable from a legitimate one, since there is nothing to compare it against.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
    action: Establish an origin register for every external feed this asset ingests, and enforce a provenance/integrity check (hash manifest, signed manifest, or equivalent) at consumption time before the data is trusted downstream.
    mitigation: Maintain an append-only provenance log recording the source identity, transfer timestamp, and content hash for every batch or record ingested from an external feed. Verify the hash (or a cryptographic signature, where the upstream source supports one) at consumption time and reject or quarantine any batch that fails verification. Do not allow the ingest pipeline itself to be the sole authority for what was received — the provenance log must be written by a component the ingest pipeline cannot silently rewrite.
    references: NIST SP 800-53 SR-4 (Provenance); NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-161 (Cybersecurity Supply Chain Risk Management Practices)
    risk_assessment: High for any pipeline ingesting external or third-party data that feeds a decision, a model, or a downstream mission system, where no origin/integrity record exists.
    false_positives: The ingest pipeline verifies a cryptographic signature or hash manifest against each batch at consumption time and writes the result to a provenance log the pipeline itself cannot modify.
    function: architecture
    stride: tampering
    risks_identified: {}

  Data Loss Prevention Egress Path Blind Spot:
    id: dlp-egress-blind-spot
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'One or more of this asset''s data egress paths -- bulk export, attachment, or file transfer -- is not inspected against data classification labels before content leaves.'
    impact: 'If this risk remains unmitigated, a malicious insider or compromised account can move CUI out through a legitimate export feature without triggering any control.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Route every bulk-export, attachment, and outbound file-transfer path through the enterprise DLP inspection point before content leaves the asset's boundary.
    mitigation: Inspect outbound content at every egress path (export endpoint, email-sending integration, upload-to-external-destination feature) against the enterprise DLP engine's classification-aware policy before the transfer completes. Where DLP inspection cannot be inserted inline, log the full content manifest of every bulk export to the SIEM so post-hoc review is possible. Treat an export feature added after the DLP policy was last reviewed as out of compliance until the policy is extended to cover it.
    references: NIST SP 800-53 AC-4 (Information Flow Enforcement); NIST SP 800-53 SC-7(10) (Boundary Protection — Prevent Exfiltration); DoDI 8500.01 (Cybersecurity)
    risk_assessment: High for any asset with a bulk-export, attachment, or external-transfer feature that is not covered by the enterprise DLP policy.
    false_positives: All identified egress paths for this asset are enumerated in the DLP policy and confirmed to route through classification-aware inspection before content leaves.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

