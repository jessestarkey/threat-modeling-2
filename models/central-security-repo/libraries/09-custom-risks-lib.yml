  #
  # --- 5.2 MAESTRO GAP COVERAGE (L3, L5, L6, L7) ---

  # --- 5.3 AI OPERATIONAL AND DEPLOYMENT HARDENING GAPS ---
  # Operational controls for fielding and running AI systems that a technique or layer catalog does
  # not capture.
  AI Output Path to OT or Safety-Critical Actuation Without Human Gate:
    id: ai-ot-actuation-boundary-gap
    baseline_likelihood: possible
    baseline_impact: high
    finding_class: weakness-shown
    description: 'This AI system''s output has a path to an operational technology actuator or a safety-critical process, with no technical human authorization gate in between that the AI cannot bypass.'
    impact: 'If this risk remains unmitigated, a model failure, whether a hallucination, a prompt injection, or adversarial manipulation, can directly trigger a physical-world safety incident with no human decision point to catch it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: 'Insert a technical human authorization gate, which the AI system cannot bypass, between any AI-generated output and OT or safety-critical actuation. Additionally, document a standing policy that prohibits fully autonomous safety-relevant decisions.'
    mitigation: >-
      Architect the actuation path so that the AI system's output is a proposal, routed to a human
      approver through a channel that the AI system itself cannot complete or bypass. In other
      words, the gate must not be a UI element that the AI system could theoretically also be
      granted access to.

      Maintain a documented, enforced policy that lists the prohibited autonomous use cases
      (autonomous safety decisions, autonomous mission-critical control, and unsupervised process
      changes). This policy should be checked at system intake and design review, rather than left
      to individual deployment teams to assess for themselves.
    references: NIST AI RMF (GOVERN 1.2, MANAGE 2.3); MAESTRO L6 (Security and Compliance); IEC 61508 (Functional Safety) where applicable to the actuated process
    risk_assessment: 'Likelihood starts at Possible, and impact starts at High. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any AI system whose output reaches an OT actuator or a safety-critical process through any path that an unbypassable human gate does not mediate.'
    false_positives: 'Either (1) the AI system''s output is strictly advisory, with no technical path to actuation, or (2) every actuation path is confirmed to route through a human approval gate that the AI system cannot complete or bypass.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 1426
    risks_identified: {}

  Offline or Air-Gapped Model Package Integrity Gap:
    id: air-gapped-model-package-integrity-gap
    baseline_likelihood: unlikely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'A model destined for a disconnected enclave is verified as a single signed package only at the point of initial transfer, rather than at every load.'
    impact: 'If this risk remains unmitigated, a substituted or tampered model artifact inside the enclave has no external signal to catch it. In other words, nothing short of per-load cryptographic verification can detect it.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: 'Assemble the model (its weights, tokenizer, configuration, and manifest) into a single signed package, and verify that package against a pinned key on every load inside the disconnected enclave, not only at transfer time.'
    mitigation: >-
      Package the complete model artifact set, namely the weights, the tokenizer, the configuration,
      and a manifest that lists the hash of each component.

      Sign the package with a key held outside the disconnected enclave's own administrative
      control.

      Verify the signature at every model load inside the enclave, not only once when the package
      first arrives, so that a substitution introduced after transfer is still caught.

      Keep the signing key's custody chain outside the enclave, so that an insider within the
      enclave cannot re-sign a tampered package.
    references: NIST SP 800-53 SR-4 (Provenance); NIST SP 800-218 (Secure Software Development Framework); NIST AI RMF (MANAGE 2.3)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at High. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any model delivered into a disconnected or air-gapped enclave without per-load signature verification against an externally held key.'
    false_positives: 'The asset is tagged ai:model-package-signed, which confirms that the model package is signed with an externally held key and verified at every load, not only at transfer time.'
    function: architecture
    stride: tampering
    cwe: 494
    risks_identified: {}

  Ungoverned Third-Party Foundation Model API Dependency:
    id: ungoverned-third-party-model-api
    baseline_likelihood: likely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This asset sends requests to a vendor-hosted foundation model API with three gaps: (1) no restriction on which data classifications may be transmitted, (2) no confirmed opt-out from training use, and (3) no recurring review of the vendor''s security posture.'
    impact: 'If this risk remains unmitigated, sending CUI to the vendor API can constitute a disclosure of data to a third party that the organization does not control.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Third_Party_Javascript_Management_Cheat_Sheet.html
    action: 'Restrict which data classifications may be transmitted to this vendor model API, including RAG-retrieved context. Additionally, confirm that a training-use opt-out term is on file, vault and rotate the API key as an internal secret, and review the vendor''s security posture on a recurring cadence.'
    mitigation: >-
      Implement a technical or procedural gate that restricts which classifications of content may
      be sent to this vendor API. That gate must cover content retrieved by a RAG pipeline and
      passed along with the prompt, not only the user's direct input.

      Confirm and retain the vendor's contractual training-use opt-out (the vendor does not use
      submitted content to train its own models) as a condition of use.

      Treat the API key with the same vaulting and rotation discipline as any internal credential,
      rather than as a static value embedded in configuration.

      Schedule a recurring review of the vendor's SOC 2 report, subprocessor list, and incident
      notification terms.
    references: NIST AI RMF (GOVERN 6.1, MAP 4.1); NIST SP 800-53 SA-9 (External System Services); DoD Cloud Computing SRG (for vendor authorization level)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any asset that transmits CUI-adjacent or classification-sensitive content, directly or through RAG context, to a vendor model API with no data-transmission restriction or confirmed training-use opt-out.'
    false_positives: 'The asset is tagged ai:vendor-model-governed, which confirms four things: (1) a classification restriction on data transmission is enforced, (2) a training-use opt-out is on file, (3) the API key is vaulted and rotated as an internal secret, and (4) the vendor''s security posture is reviewed on a recurring cadence.'
