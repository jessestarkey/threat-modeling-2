  # OWASP-anchored AI categories that read tags.
  Unexpected Code Execution and Weak Sandbox:
    id: ai-unexpected-code-execution
    baseline_likelihood: likely
    baseline_impact: high
    finding_class: weakness-shown
    description: 'This AI agent or tool server runs code on its own host, whether that is code the model writes, code a tool returns, or commands built from model output. Thus, whatever steers the model can choose what executes.'
    impact: 'If this risk remains unmitigated, a prompt injection or a poisoned input becomes arbitrary code execution with the asset''s own privileges and network reach, including any credentials available to it.'
    asvs: V15 - Secure Coding and Architecture
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: 'Run every piece of model-produced or tool-returned code in an isolated, ephemeral sandbox that has no credentials, no network access by default, and strict resource limits.'
    mitigation: >-
      Execute generated or returned code only in an isolated, ephemeral sandbox (a separate microVM,
      or a hardened container with seccomp or AppArmor and no host mounts) that holds no credentials
      and has no network access unless a specific allow-list requires it.

      Enforce CPU, memory, time, and output limits.

      Never pass model output to eval, exec, or a shell within the agent's own process.

      Require human approval before code with side effects runs outside the sandbox.

      Log every execution together with the prompt that produced it.
    references: OWASP Top 10 for Agentic Applications 2026 ASI05 (Unexpected Code Execution); OWASP Agentic Skills Top 10 2026 AST06 (Weak Isolation); MITRE ATLAS AML.T0040, AML.T0054, AML.T0037; CWE-94, CWE-78, CWE-77; NIST SP 800-53 CM-7, SC-7, SC-39 (mappings via the OWASP GenAI Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at High. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical when generated code runs in the agent''s own process, or on a host with credentials or network reach. However, it is High when the code runs in a container that is not hardened or not ephemeral.'
    false_positives: 'This finding fires on any asset tagged ai:code-execution. Likelihood is one level higher when the asset''s machine is physical (that is, no VM, container, or serverless boundary), whereas a missing machine value gets no step. Once execution in an isolated, credential-free, network-restricted, ephemeral sandbox is confirmed, dispose of the asset''s finding through risk_tracking.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 94
    detection_logic: 'Identify every path where model output or tool results are executed. Then, confirm that each path runs in an isolated, ephemeral sandbox without credentials or default network access. Finally, test each path with a prompt-injected payload that attempts file, network, and credential access.'
    risks_identified: {}
  Unvetted Agent Skills and Instructions:
    id: ai-unvetted-agent-skills
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This agent loads skills, namely packaged instructions, manifests, and scripts that tell it how to orchestrate its tools, from sources that are not vetted, pinned, or scanned. Thus, a malicious, tampered, or drifted skill becomes part of how the agent behaves.'
    impact: 'If this risk remains unmitigated, a malicious skill can direct the agent to exfiltrate data, misuse its tools, or follow an attacker''s instructions with the agent''s own permissions. Furthermore, this applies across every deployment that loads the skill.'
    asvs: V15 - Secure Coding and Architecture
    cheat_sheet: https://owasp.org/www-project-agentic-skills-top-10/
    action: 'Load agent skills only from an approved, pinned, and scanned internal catalogue, and review each skill''s instructions and permissions before it is enabled.'
    mitigation: >-
      Maintain an internal catalogue of approved skills, and load skills only from it, pinned to
      exact reviewed versions with hash verification and with no automatic updates.

      Before approval, review each skill's instructions, metadata, and bundled scripts for embedded
      instructions, over-broad permissions, and network calls, and scan any bundled code.

      Grant each skill only the tools it needs.

      Re-review a skill on every update, and keep an inventory of which skills each agent loads.
    references: OWASP Agentic Skills Top 10 2026 AST01 (Malicious Skills), AST04 (Insecure Metadata), AST05 (Untrusted External Instructions), AST08 (Poor Scanning), AST10 (Cross-Platform Reuse); MITRE ATLAS AML.T0115 (Publish Poisoned AI Artifacts); MAESTRO layers 3, 4, 6 and 7; CWE-829, CWE-494 (mappings via the OWASP GenAI Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any agent that loads skills from public or unvetted sources, or that updates skills automatically, especially when it has write-capable tools.'
    false_positives: 'This finding fires on any asset tagged ai:skills-enabled, unless the asset is also tagged ai:skills-vetted. That second tag confirms that skills load only from an approved, pinned, and scanned catalogue, with a review before each is enabled.'
    function: architecture
