  Email Header Injection and Sending Abuse:
    id: email-header-injection
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The asset constructs outbound email from user-supplied input without sanitizing the recipient or header fields. As a result, it allows CRLF-based header injection.'
    impact: 'If this risk remains unmitigated, an attacker can redirect mail to unintended recipients, or turn the application into an open relay for spam and phishing.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Validate and sanitize every user-supplied value used to construct email, and enforce SPF, DKIM, and DMARC on the sending domain.'
    mitigation: >-
      Strip or reject CRLF sequences (\r\n, \r, and \n) from every user-supplied value used in email
      headers before constructing the message.

      Use a well-maintained email library that encodes headers safely, rather than building raw SMTP
      messages through string concatenation.

      Validate recipient addresses against an allowlist or a strict RFC 5322 format check, and
      reject addresses that contain special characters.

      Enforce SPF, DKIM, and DMARC (p=reject) on the sending domain.

      Log all outbound email with the sender identity, recipient, and subject for audit.
    references: NIST SP 800-53 SI-10 (Information Input Validation); NIST SP 800-53 SC-7; CWE-93 (CRLF Injection)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium for an application that sends transactional email with partially user-controlled content. However, it rises to High if arbitrary recipient addresses can be injected, or if the sending domain has no DMARC enforcement.'
    false_positives: 'All email recipient addresses are drawn exclusively from a pre-validated internal directory, with no user-supplied address input. In other words, user input only influences the email body, which is sanitized before insertion.'
    function: architecture
    stride: spoofing
    cwe: 93
    detection_logic: 'Test every email-triggering endpoint by injecting CRLF sequences into user-controlled fields (such as the name, subject, or message), and verify that the resulting email headers contain no injected values. Additionally, verify DMARC enforcement by querying the sending domain''s DNS TXT record for p=reject. Finally, monitor outbound email volume for anomalous spikes that may indicate relay abuse.'
