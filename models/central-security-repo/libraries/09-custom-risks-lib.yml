  GraphQL Introspection, Query Depth, and Authorization Gaps:
    id: graphql-security-gaps
    baseline_likelihood: likely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The asset exposes a GraphQL API with three gaps: (1) introspection is enabled in production, (2) query depth is not limited, and (3) authorization checks may not extend to individual fields or mutations.'
    impact: 'If this risk remains unmitigated, introspection reveals the full schema, which accelerates further attacks. Additionally, a single deeply nested query can exhaust backend resources.'
    asvs: V4 - Access Control / V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
    action: 'Disable introspection in production, enforce limits on query depth and complexity, and apply field-level authorization to every sensitive resolver.'
    mitigation: >-
      Disable GraphQL introspection in production, and allow it only in non-production environments.

      Limit query depth (to a maximum of five to seven levels), and analyze query complexity with
      hard per-request limits.

      Disable query batching, or apply strict per-batch limits.

      Apply authorization checks at the resolver level for every sensitive field, rather than
      relying solely on type-level access controls.

      Implement query cost analysis and rate limiting keyed to the authenticated user's identity.

      Log every GraphQL operation with the full query for SOC analysis.
    references: OWASP GraphQL Cheat Sheet; NIST SP 800-53 SC-5 (DoS Protection); NIST SP 800-53 AC-3 (Access Enforcement)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High if introspection is enabled in production, or if query depth and complexity limits are absent. However, it is Medium when introspection is disabled and depth limits are enforced, but field-level authorization has not been audited.'
    false_positives: 'Three conditions hold, and they are documented with test evidence: (1) introspection is disabled in production, (2) query depth and complexity limits are enforced, and (3) every resolver has been audited for field-level authorization coverage.'
    function: architecture
    stride: information-disclosure
    cwe: 200
    detection_logic: 'Test for introspection by sending a standard __schema query, and verify that it is rejected in production. Next, attempt deeply nested queries, and verify that they are rejected before execution. Finally, test field-level authorization by requesting sensitive fields with a low-privilege token, and verify that they return an authorization error rather than null or empty data.'
