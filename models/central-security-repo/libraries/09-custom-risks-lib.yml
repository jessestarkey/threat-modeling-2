    cwe: 212
    risks_identified: {}

  Released Dataset Re-Identification Risk:
    id: dataset-reidentification-risk
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'A dataset slated for release has been de-identified. However, it has never been tested against a motivated-intruder re-identification attempt that uses auxiliary data an adversary could reasonably access.'
    impact: 'If this risk remains unmitigated, a dataset believed to be anonymized can be re-identified after release, which constitutes a privacy disclosure.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/User_Privacy_Protection_Cheat_Sheet.html
    action: 'Before release, run a motivated-intruder re-identification test against the de-identified dataset using realistic auxiliary data, and document the result as part of the release approval.'
    mitigation: >-
      Before release, conduct a re-identification risk assessment that follows the NIST SP 800-188
      methodology. Specifically, (1) attempt re-identification with auxiliary data that an adversary
      could plausibly obtain, (2) quantify the proportion of records at risk, and (3) apply
      additional statistical disclosure limitation (generalization, suppression, or k-anonymity and
      differential privacy techniques) until the residual risk is acceptable to the data owner.

      Re-run the assessment before later releases if the dataset is updated, or if a new plausible
      auxiliary source becomes available.
