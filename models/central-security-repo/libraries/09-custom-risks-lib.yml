  Ungoverned Third-Party Foundation Model API Dependency:
    id: ungoverned-third-party-model-api
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset sends requests to a vendor-hosted foundation model API with no restriction on which data classifications may be transmitted, no confirmed training-use opt-out, and no recurring review of the vendor''s security posture.'
    impact: 'If this risk remains unmitigated, sending CUI to the vendor API can constitute a data disclosure to a third party the organization does not control.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Third_Party_Javascript_Management_Cheat_Sheet.html
    action: Restrict which data classifications may be transmitted to this vendor model API (including RAG-retrieved context), confirm a training-use opt-out term is on file, vault and rotate the API key as an internal secret, and review the vendor's security posture on a recurring cadence.
    mitigation: 'Implement a technical or procedural gate restricting what classification of content — including content retrieved by a RAG pipeline and passed along with the prompt, not only the user''s direct input — may be sent to this vendor API. Confirm and retain the vendor''s contractual training-use opt-out (the vendor does not use submitted content to train its own models) as a condition of use. Treat the API key with the same vaulting and rotation discipline as any internal credential, not a static value embedded in configuration. Schedule a recurring review of the vendor''s SOC 2 report, subprocessor list, and incident notification terms.'
    references: NIST AI RMF (GOVERN 6.1, MAP 4.1); NIST SP 800-53 SA-9 (External System Services); DoD Cloud Computing SRG (for vendor authorization level)
    risk_assessment: Critical for any asset transmitting CUI-adjacent or classification-sensitive content (directly or via RAG context) to a vendor model API with no data-transmission restriction or confirmed training-use opt-out.
    false_positives: The asset is tagged ai:vendor-model-governed confirming a data-transmission classification restriction is enforced, a training-use opt-out is on file, the API key is vaulted/rotated as an internal secret, and vendor security posture is reviewed on a recurring cadence.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  AI-Generated Decision Support Without Verification Signal:
    id: ai-overreliance-misinformation
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset presents AI-generated output to a human as input to a consequential decision, with no confidence indicator, citation/provenance, or mandatory verification step to help the human catch a confidently wrong (hallucinated) answer.'
    impact: 'If this risk remains unmitigated, a human decision-maker can act on a fluent, confident, but factually wrong AI output -- misclassifying data, misreporting status, or authorizing an action based on a fabricated summary of CUI -- with no built-in signal distinguishing a well-grounded answer from a hallucinated one.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Surface a confidence indicator, source citation, or provenance trail alongside AI-generated output feeding any consequential decision, and require explicit human verification before the decision is finalized.
    mitigation: Attach source citations or retrieval provenance to AI-generated output wherever the underlying answer is grounded in retrieved content, so a reviewer can check the answer against its source directly. Surface a calibrated confidence or uncertainty indicator rather than presenting every answer with uniform, confident phrasing. For decisions above a defined consequence threshold, require an explicit human acknowledgment step that the output has been checked against an independent source before the decision is recorded as final. Periodically sample production outputs feeding real decisions against ground truth to measure actual hallucination rate in context, not just in a lab benchmark.
    references: OWASP LLM09:2025 (Misinformation); NIST AI RMF (MEASURE 2.7, MANAGE 2.3); MAESTRO L6 (Security and Compliance)
    risk_assessment: High where the AI output directly informs a consequential decision (classification, compliance status, operational action) with no citation or confidence signal. Medium where output is advisory in a low-stakes context or already paired with partial provenance.
    false_positives: The asset is tagged ai:output-confidence-disclosed confirming AI-generated output feeding decisions carries citations, confidence indicators, or a mandatory human-verification step before the decision is finalized.
    function: operations
    stride: tampering
    risks_identified: {}

