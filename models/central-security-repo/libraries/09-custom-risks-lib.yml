  Malicious Archive Processing (Zip Slip and Decompression Bombs):
    id: malicious-file-parsing
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The application extracts or decompresses user-supplied archives (for example, ZIP, TAR, or GZIP). Such archives can carry entries whose paths escape the extraction directory (zip slip), or entries that expand to exhaust disk and memory (decompression bombs).'
    impact: 'If this risk remains unmitigated, a crafted archive can overwrite files outside the extraction directory, including code or configuration that the application later loads. Alternatively, it can take the service down by exhausting disk or memory.'
    asvs: V12 - File and Resources
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
    action: 'Before extracting, validate every archive entry''s resolved path against the extraction directory, and cap the total expanded size, the entry count, and the compression ratio.'
    mitigation: >-
      Resolve each archive entry's canonical path, and reject any entry that falls outside the
      target directory, as well as any absolute path or symlink.

      Enforce limits on the total uncompressed size, the number of entries, the nesting depth, and
      the compression ratio while streaming, and abort as soon as any limit is exceeded.

      Extract into a dedicated, size-limited, non-executable location with least-privilege file
      permissions.
    references: CWE-22 (Path Traversal, zip slip); CWE-409 (Improper Handling of Highly Compressed Data); NIST SP 800-53 SI-10 (Information Input Validation)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High if the application parses untrusted B2B or external user files.'
    false_positives: 'The application never extracts or decompresses user-supplied archives. XML external entities and generic file validation, by contrast, are covered by Threagile''s built-in xml-external-entity and missing-file-validation rules, which read the asset''s native data_formats_accepted. Thus, this category covers only archive extraction, which those rules do not.'
    function: architecture
    stride: tampering
    cwe: 22
    detection_logic: 'Use SAST to flag archive extraction code that writes entries without canonicalizing their paths against the target directory, or that has no size, entry-count, or ratio limits. Additionally, test the upload path with a crafted archive containing a traversal entry (for example, ../../evil) and with a high-ratio decompression bomb, and verify that both are rejected without writing outside the extraction directory or exhausting resources.'
