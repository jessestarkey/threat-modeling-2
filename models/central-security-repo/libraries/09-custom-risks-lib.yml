# ==============================================================================
# CUSTOM IL5 RISK DEFINITIONS: 09-custom-risks-lib.yml
# ==============================================================================
# Authoritative content for every custom (non-Threagile-native) risk category
# that inject_risks.py can inject into a model's individual_risk_categories,
# keyed by the same tag triggers documented in 03-tags-lib.yml.
#
# USAGE:
#   inject_risks.py loads this file and scans each technical asset's `tags`
#   list against its own hardcoded if-chain, injecting a deep copy of the
#   matching entry below into individual_risk_categories, then recording one
#   risks_identified entry per matching asset.
#
#   Each entry MUST include an (empty) `risks_identified: {}` map — the
#   loader hard-fails at startup if any entry is missing it.
#
# ADDING A NEW RISK:
#   1. Add an entry below with: id, description, impact, asvs, cheat_sheet,
#      action, mitigation, references, risk_assessment, false_positives,
#      function, stride, risks_identified: {}
#   2. If it's triggered by a new tag, document that tag in 03-tags-lib.yml.
#   3. Wire an `if 'tag:name' in tags: inject("<this entry's key>", "<short
#      title>", "<severity>")` line into the tag-scanning loop in
#      inject_risks.py.
#
# STRUCTURE:
#   Entries are grouped into sections numbered `D.S` (domain D, section S
#   within it, `# --- D.S NAME ---`), under 10 numbered `# DOMAIN D: NAME`
#   banners — purely for human navigation, in both cases: neither the
#   numbering nor the domain grouping has any runtime effect; Threagile
#   and inject_risks.py only ever look up an entry by its dict key, never
#   by position. Domains are named, ORDERED, and NESTED after SABER
#   (github.com's security-framework repo, an internal DoD-oriented
#   reference we ran a gap analysis against): its chapter sequence is
#   Identity, Device and Infrastructure, Network and Environment,
#   Application, AI, Data, Detection, Response, Recovery, Governance,
#   Risk, Compliance, and ours tracks it domain-for-domain in the same
#   order, with one deliberate omission: SABER's own org-level Compliance
#   chapter, and most of its Governance chapter, are absent (that content
#   is org-level, not per-asset, and was screened out during the gap
#   analysis rather than represented as a near-empty domain here) --
#   domain 10 below is still named Governance, matching SABER's own short
#   name, but is scoped narrowly to the one governance-flavored slice that
#   *is* per-asset and did survive the gap analysis: risk acceptance and
#   policy exceptions. Cross-Domain Solutions and Software Supply Chain
#   are sections, not domains of their own — nested inside Network and
#   Environment and Application respectively, matching exactly where
#   SABER's own document nests them (CDS as outcome NE-2.10 inside
#   04-saber-network-and-environment.md; supply-chain content inside
#   05-saber-application.md) rather than being pulled out as standalone
#   domains the way an earlier pass here had them. Secrets and
#   Cryptography sits under Data (6.2), not Application, for the same
#   reason: SABER's own encryption/key-management content (DA-2/DA-3)
#   lives in 07-saber-data.md, not its Application chapter, even though
#   an earlier pass here had filed it under Application by habit:
#     1  Identity ........................... 1.1-1.2
#     2  Device and Infrastructure ........... 2.1-2.2
#     3  Network and Environment ............. 3.1-3.2 (3.1 self-managed segmentation, 3.2 CDS)
#     4  Application .......................... 4.1-4.5 (4.5 software supply chain / CI-CD)
#     5  Artificial Intelligence .............. 5.1-5.3
#     6  Data ................................ 6.1-6.2 (6.1 governance/lifecycle, 6.2 secrets/crypto)
#     7  Detection ............................ 7.1
#     8  Response ............................. 8.1
#     9  Recovery ............................. 9.1
#     10 Governance ........................... 10.1 (risk acceptance and policy exceptions only)
#
#   Sections 1.1, 1.2, 2.2, and 3.1 each carry a small cluster of entries
#   triggered by an mgmt:self-managed-* tag rather than firing on every
#   app: identity/PAM/hardware/network content that's a platform-inherited
#   control for an app in the enterprise-managed landing zone (excluded
#   from firing by default) but a real per-asset gap for an app that
#   manages that infrastructure itself. See 03-tags-lib.yml's
#   "SELF-MANAGED INFRASTRUCTURE TAGS" section for the full mgmt:* family.
# ==============================================================================

custom_risk_definitions:
  # #############################################################################
  # DOMAIN 1: IDENTITY
  # #############################################################################

  # --- 1.1 AUTHENTICATION AND IDENTITY ---
  'Policy Exception: Local Authentication':
    id: policy-exception-local-auth
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This application maintains a local credential store that bypasses the enterprise identity provider and mandatory MFA enforcement.'
    impact: 'If this risk remains unmitigated, the local store becomes a backdoor that can be brute-forced or credential-stuffed independent of enterprise conditional access policies.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    action: Ensure formal AO risk acceptance is on file.
    mitigation: The local account must have a complex, vault-generated password rotated every 30 days. IP restrictions must limit access to the login endpoint.
    references: DoD Identity, Credential, and Access Management (ICAM)
    risk_assessment: High risk of unauthorized access.
    false_positives: None. This is an explicit policy waiver.
    function: architecture
    stride: spoofing
    risks_identified: {}

  Insecure Password Reset and Credential Recovery:
    id: insecure-password-reset
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The asset''s self-service password reset flow uses predictable or reusable reset tokens, excessive token lifetimes, or responses that reveal whether an email address is registered.'
    impact: 'If this risk remains unmitigated, an attacker can take over accounts without knowing the current password, or enumerate valid accounts to target with further attacks.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
    action: Use cryptographically random tokens with short expiry, enforce single-use invalidation, and derive reset URLs from a configured base URL only.
    mitigation: Generate password reset tokens using a cryptographically secure random number generator with at least 128 bits of entropy. Invalidate the token immediately on first use. Set token expiry to 15 minutes or less. Return identical responses for registered and unregistered addresses to prevent enumeration — implement consistent timing using a dummy hash operation for unregistered addresses. Derive the reset link base URL from a hardcoded configuration value, never from the HTTP Host or X-Forwarded-Host header. Require re-authentication via MFA after password reset before accessing sensitive functionality.
    references: NIST SP 800-63B (Digital Identity Guidelines); OWASP Forgot Password Cheat Sheet; NIST SP 800-53 IA-5 (Authenticator Management)
    risk_assessment: High for custom-implemented reset flows. Medium for reset flows built on a maintained authentication framework where token generation and invalidation are handled by the library.
    false_positives: Credential recovery is fully delegated to the enterprise IdP (e.g., Entra ID self-service password reset) with no custom reset token issuance or validation in the application.
    function: architecture
    stride: spoofing
    detection_logic: Request password resets for the same account in rapid succession and verify that only the most recently issued token is valid. Verify that a used token cannot be reused. Test for host header injection by sending a reset request with a modified Host header and verifying the reset email contains the configured base URL, not the injected host. Test for account enumeration by comparing response time and body for registered vs. unregistered addresses.
    risks_identified: {}

  OAuth 2.0 and OIDC Implementation Vulnerabilities:
    id: oauth-oidc-vulnerabilities
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset issues or validates OAuth 2.0/OIDC tokens with implementation weaknesses such as unvalidated redirect URIs, a missing or unchecked state parameter, or improper JWT signature algorithm handling.'
    impact: 'If this risk remains unmitigated, an attacker can intercept authorization codes, replay tokens, or forge arbitrary tokens to gain authenticated access as another user.'
    asvs: V3 - Session Management / V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/OAuth2_Cheat_Sheet.html
    action: Audit authorization callback redirect_uri validation, state parameter enforcement, token audience validation, and JWT algorithm handling.
    mitigation: Enforce exact-match redirect_uri validation — no wildcards, no partial path matches. Require and validate the state parameter on all authorization responses to prevent CSRF. Use authorization code flow with PKCE for all clients; never use implicit flow. Validate JWT audience (aud) claim against the expected service identifier on every token verification. Explicitly specify the expected algorithm in JWT validation — never accept alg:none or derive the algorithm from the token header. Use short-lived access tokens (15 minutes or less) with refresh token rotation.
    references: OWASP OAuth 2.0 Security Best Current Practice (draft-ietf-oauth-security-topics); NIST SP 800-63C (Federation and Assertions); DoD ICAM Reference Design
    risk_assessment: High for assets acting as authorization servers or custom token validation middleware. Medium for assets that are pure OIDC relying parties consuming tokens from a well-configured upstream IdP.
    false_positives: Asset delegates all OAuth/OIDC handling to a hardened upstream IdP (e.g., Entra ID, Okta) with no custom token issuance or validation logic — the asset only consumes pre-validated identity assertions.
    function: architecture
    stride: spoofing
    detection_logic: Run OAuth-specific DAST tests (e.g., OWASP ZAP OAuth scanner, Burp Suite OAuth extension) against all authorization endpoints. Verify redirect_uri enforcement by attempting registration and use of variant URIs. Test JWT validation by submitting tokens with alg:none and algorithm-confused signatures. Monitor authorization server logs for redirect_uri mismatch attempts.
    risks_identified: {}

  SAML Assertion Vulnerabilities:
    id: saml-assertion-vulnerabilities
    baseline_likelihood: likely
    baseline_impact: high
    description: 'The asset processes SAML assertions from an external identity provider with XML-parsing weaknesses that can allow a submitted assertion to be altered, replayed, or misattributed to a different user.'
    impact: 'If this risk remains unmitigated, an attacker can forge or replay a SAML assertion to authenticate as any user, including administrators, without valid credentials.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/SAML_Security_Cheat_Sheet.html
    action: Use a hardened SAML library with XSW protection, validate all assertion constraints, and disable XXE in the XML parser.
    mitigation: 'Use a well-maintained SAML library that provides XSW protection (e.g., python3-saml, OneLogin SAML, Spring Security SAML with XSW patches applied). Disable XXE and DTD processing in the XML parser used for SAML document parsing. Validate all assertion constraints: NotBefore/NotOnOrAfter timestamps, Recipient URL, AudienceRestriction, and InResponseTo (replay prevention). Sanitize the NameID value before use as a username — strip XML comments and normalize whitespace. Log all SAML assertion processing events including validation failures.'
    references: OWASP SAML Security Cheat Sheet; NIST SP 800-63C (Federation); DoD ICAM Reference Design; CVE-2017-11427 (SAML comment injection)
    risk_assessment: High for custom or lightly-maintained SAML SP implementations. Medium for well-maintained SAML library implementations where XSW protection and constraint validation have been verified.
    false_positives: SAML processing is fully delegated to a hardened platform IdP integration (e.g., Azure AD SAML app with no custom assertion processing code) — the application does not parse or validate SAML XML directly.
    function: architecture
    stride: spoofing
    detection_logic: Test for XSW vulnerabilities using SAMLRaider (Burp Suite extension) against all SAML assertion endpoints. Test for XXE by injecting a DOCTYPE declaration into a SAML request and monitoring for outbound DNS or HTTP requests. Verify that assertions with invalid Recipient, expired timestamps, or mismatched AudienceRestriction are rejected.
    risks_identified: {}

  # Insecure Session Management and Hardcoded Credentials and Secrets Sprawl have been ported
  # into the jessestarkey/threagile fork as native script rules (pkg/risks/scripts/*.yaml):
  # Insecure Session Management via the frontend_related technology attribute, Secrets Sprawl
  # via the vault attribute for self-exclusion plus a residual read of the data:credential tag
  # (DataAsset has no native "this is credential-shaped data" concept). Removed here rather than
  # left duplicated. See docs/risk-methodology.md for the full rationale.

  Missing Token Binding on Session and Refresh Tokens:
    id: missing-token-binding
    baseline_likelihood: likely
    baseline_impact: high
    description: 'This asset issues session or refresh tokens as bearer artifacts, usable by whoever holds them, rather than binding them to the client that obtained them via proof-of-possession.'
    impact: 'If this risk remains unmitigated, a captured token can be replayed from any host with no further credential needed, defeating even phishing-resistant authentication performed before the token was stolen.'
    asvs: V3 - Session Management
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
    action: Bind session and refresh tokens to the issuing client using DPoP or mutual TLS, so a captured token cannot be replayed from a different host.
    mitigation: Implement OAuth 2.0 Demonstrating Proof of Possession (DPoP) or mutual TLS client certificate binding for session and refresh tokens, so the resource server can verify the presenter of the token is the same client the token was issued to. Reject a syntactically valid token presented without the matching proof of possession. Where the identity provider does not yet support proof-of-possession tokens, treat this as a documented gap rather than an unstated assumption of bearer-token safety.
    references: RFC 9449 (OAuth 2.0 Demonstrating Proof of Possession); NIST SP 800-63B (Digital Identity Guidelines, Authenticator Assurance Level requirements); NIST SP 800-53 SC-23 (Session Authenticity)
    risk_assessment: Critical for any asset issuing bearer session/refresh tokens with no proof-of-possession binding, particularly where the asset also enforces phishing-resistant primary authentication that a bearer-token replay would otherwise bypass.
    false_positives: The asset is tagged ops:token-binding-enforced confirming session and refresh tokens are bound to the issuing client via DPoP or mutual TLS.
    function: architecture
    stride: spoofing
    risks_identified: {}

  OAuth Illicit Consent Grant via Malicious Application Registration:
    id: oauth-illicit-consent-grant
    baseline_likelihood: likely
    baseline_impact: high
    description: 'This asset''s OAuth authorization server allows a user to grant a third-party application delegated API access with no admin-consent gate or scope review.'
    impact: 'If this risk remains unmitigated, an attacker can register a malicious application and phish a user into granting it persistent API access that survives a password reset.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/OAuth2_Cheat_Sheet.html
    action: Require administrator consent for any application requesting high-privilege delegated scopes, and block user self-service consent grants to unverified or newly registered applications.
    mitigation: Configure the authorization server/IdP to require administrator review and consent for applications requesting high-privilege scopes (mail read/send, files, directory data), rather than permitting individual users to self-consent. Restrict user self-service consent to a curated allow-list of verified publishers where the platform supports it. Monitor and alert on new OAuth application registrations and consent grants, particularly grants of broad scope to newly registered or unverified applications. Periodically review and revoke consent grants to applications no longer in active use.
    references: NIST SP 800-53 AC-3 (Access Enforcement); MITRE ATT&CK T1550.001 (Application Access Token); Microsoft/industry guidance on illicit consent grant attacks
    risk_assessment: Critical for any authorization server/IdP permitting unrestricted user self-service consent to high-privilege scopes with no administrator review.
    false_positives: The asset is tagged ops:oauth-consent-governed confirming administrator consent is required for high-privilege scope requests and user self-service consent is restricted to a verified-publisher allow-list.
    function: architecture
    stride: spoofing
    risks_identified: {}

  Self-Managed Directory Tier-0 Infrastructure Compromise:
    id: self-managed-directory-tier0-compromise
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'This asset relies on a self-managed directory service that does not inherit the enterprise identity team''s Tier-0 hardening, leaving it exposed to attacks such as unconstrained delegation, AdminSDHolder tampering, or an unrotated krbtgt credential.'
    impact: 'If this risk remains unmitigated, compromise of the directory''s Tier-0 infrastructure lets an attacker forge authentication for any identity it manages, with persistence that survives ordinary password resets.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Active_Directory_Security_Cheat_Sheet.html
    action: Audit this directory for unconstrained delegation, AdminSDHolder tampering, missing SID filtering on trusts, and unsigned LDAP, and rotate krbtgt credential material using the required two-pass procedure.
    mitigation: Eliminate unconstrained Kerberos delegation in favor of constrained or resource-based constrained delegation. Audit and alert on AdminSDHolder ACL changes. Enable SID filtering on every cross-forest/cross-domain trust this directory participates in. Require LDAP signing and channel binding, rejecting unsigned binds. Rotate the krbtgt account password twice in sequence (a single rotation is insufficient — the account retains two valid password versions) on a recurring schedule and immediately after any suspected compromise.
    references: NIST SP 800-53 IA-5 (Authenticator Management); NIST SP 800-53 AC-6 (Least Privilege); MITRE ATT&CK T1558 (Steal or Forge Kerberos Tickets)
    risk_assessment: Critical for any self-managed directory instance where these controls have not been audited, since this framework's enterprise identity Tier-0 hardening does not extend to infrastructure the app team operates itself.
    false_positives: The asset is tagged mgmt:self-managed-identity-hardened confirming unconstrained delegation, AdminSDHolder tampering, trust SID filtering, and LDAP signing have been audited, and krbtgt rotation follows the required two-pass procedure. Not applicable if this asset authenticates exclusively through the enterprise-managed identity tenant.
    function: architecture
    stride: spoofing
    risks_identified: {}

  Self-Managed Certificate Authority Template Privilege Escalation:
    id: self-managed-ca-template-escalation
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'This asset relies on a self-managed certificate authority with an enrollment template that lets a low-privileged requester supply its own subject name.'
    impact: 'If this risk remains unmitigated, a low-privileged requester can obtain a certificate asserting a privileged identity, bypassing authentication for every system that trusts this CA.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Active_Directory_Security_Cheat_Sheet.html
    action: Audit every certificate template on this CA for subject-name enrollee control, and remove or restrict any template permitting a low-privileged requester to specify a privileged subject name.
    mitigation: Review every enrollment template's permissions and the CA's `EDITF_ATTRIBUTESUBJECTALTNAME2` flag for enrollee-suppliable subject names. Restrict enrollment on any template that grants a broad principal group (e.g., Domain Users) enrollment rights combined with client authentication EKU and enrollee-suppliable subject name. Require manager approval or issuance-policy-gated enrollment for any template capable of producing a certificate usable for authentication as a privileged identity.
    references: NIST SP 800-53 SC-17 (Public Key Infrastructure Certificates); MITRE ATT&CK T1649 (Steal or Forge Authentication Certificates)
    risk_assessment: Critical for any self-managed CA with at least one enrollment template permitting enrollee-controlled subject names combined with broad enrollment rights.
    false_positives: The asset is tagged mgmt:self-managed-identity-hardened confirming every enrollment template has been audited against ESC1-class misconfiguration. Not applicable if this asset relies exclusively on the enterprise-managed PKI.
    function: architecture
    stride: spoofing
    risks_identified: {}

  Self-Managed Hybrid Identity Synchronization Server Compromise:
    id: self-managed-hybrid-sync-compromise
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'This asset runs a self-managed hybrid identity synchronization server that holds working credentials for both the on-premises directory and the cloud identity tenant it bridges.'
    impact: 'If this risk remains unmitigated, compromise of the sync server lets an attacker pivot between the on-premises directory and the cloud tenant, bypassing tier separation designed around each side individually.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Active_Directory_Security_Cheat_Sheet.html
    action: Administer this hybrid sync server with the same Tier-0 rigor as the directory infrastructure it bridges — not as ordinary application infrastructure.
    mitigation: Restrict administrative access to the hybrid sync server to the same privileged-access tier as the directory infrastructure it connects to, not to general application/infrastructure administrators. Monitor the server for credential-extraction attempts (it typically holds a highly privileged service account on both sides of the bridge). Isolate it on a management network segment distinct from general application infrastructure, and patch it on an accelerated cadence given its Tier-0-equivalent blast radius.
    references: NIST SP 800-53 AC-6 (Least Privilege); NIST SP 800-53 SC-7 (Boundary Protection); MITRE ATT&CK T1556 (Modify Authentication Process)
    risk_assessment: Critical for any hybrid identity sync server administered without Tier-0-equivalent access restriction and network isolation.
    false_positives: The asset is tagged mgmt:self-managed-identity-hardened confirming this server is administered at Tier-0 rigor, network-isolated from general application infrastructure, and monitored for credential extraction.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  # --- 1.2 AUTHORIZATION ---
  # Broken Object-Level Authorization (BOLA/IDOR), Broken Function-Level Authorization (BFLA),
  # Broken Object Property Level Authorization (Mass Assignment), and Multi-Tenant Data Isolation
  # Failure have been ported into the jessestarkey/threagile fork as native script rules
  # (pkg/risks/scripts/*.yaml): the first three via the request_serving_api technology
  # attribute, multi-tenant isolation via the native TechnicalAsset.MultiTenant field. Removed
  # here rather than left duplicated. See docs/risk-methodology.md for the full rationale.

  Exposed Administrative Interface Without Hardened Access Controls:
    id: exposed-admin-panel
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The asset exposes an administrative interface reachable with standard application authentication alone, with no additional access control such as IP restriction, a separate factor, or server-side enforcement of role checks.'
    impact: 'If this risk remains unmitigated, compromise of an admin session yields control over all application data, user accounts, and configuration.'
    asvs: V4 - Access Control
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: Restrict admin interface access to an IP-allowlisted management network segment and require a separate, elevated authentication factor.
    mitigation: Restrict admin interface access to an approved IP range (management VNET, Bastion subnet, or privileged access workstation range) enforced at the NSG or Ingress layer — not just application-layer RBAC. Require a separate, elevated authentication step (e.g., step-up MFA, PIV re-authentication) for admin access even for users already authenticated to the application. Serve the admin interface on a separate subdomain or port to enable distinct WAF policy and access logging. Ensure all admin server-side endpoints enforce the same role checks as the UI — never rely on UI hiding as an authorization control. Audit all admin panel access events to a tamper-evident SIEM.
    references: NIST SP 800-53 AC-6 (Least Privilege); NIST SP 800-53 AC-17 (Remote Access); DISA Application Security STIG
    risk_assessment: High for admin panels accessible on the same domain as the user-facing application without IP restriction. Critical if admin functionality is accessible to any authenticated user without an explicit admin role check.
    false_positives: Admin interface is served on a separate internal-only domain with NSG-enforced IP restriction to a privileged access workstation range and requires a separate MFA step-up authentication — confirmed in the network architecture documentation.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Attempt to access known admin URL patterns (/admin, /manage, /console, /dashboard) with a standard user token and verify access is denied with 403. Verify NSG rules restrict the admin endpoint to the approved IP range. Monitor admin panel access logs for access from IP addresses outside the approved management range.
    risks_identified: {}

  Third-Party Vendor Remote Support Access Lifecycle Gap:
    id: vendor-remote-support-access-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This asset grants a third-party vendor''s support engineer remote access that is not scoped to a specific support case and does not deactivate automatically when the case closes.'
    impact: 'If this risk remains unmitigated, vendor access can remain active long after the support engagement ends, as a standing external access path an attacker who compromises the vendor could reuse.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html
    action: Scope vendor remote support access to a specific, time-bound support case and deactivate it automatically at case closure or a defined expiry, whichever comes first.
    mitigation: Grant vendor remote support access through a mechanism that is scoped to a specific support case identifier and expires automatically (either at a defined time limit or when the linked case is closed) rather than requiring a manual deactivation step. Log all vendor remote access sessions to the SIEM distinctly from internal administrative access, so vendor access is independently reviewable. Periodically audit for any vendor access grant with no associated open support case.
    references: NIST SP 800-53 AC-17 (Remote Access); NIST SP 800-53 SA-9 (External System Services); NIST SP 800-53 PS-7 (External Personnel Security)
    risk_assessment: High for any asset granting vendor remote support access with no case-bound scope or automatic expiry.
    false_positives: The asset is tagged ops:vendor-access-case-bound confirming vendor remote support access is scoped to a specific support case with automatic expiry.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  Standing Privileged Access with No Administrative Tiering:
    id: standing-privileged-access-no-tiering
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'Privileged roles on this self-managed asset are held continuously rather than activated just-in-time, with no administrative-tiering separation preventing a high-privilege credential from authenticating out of a general-purpose workstation.'
    impact: 'If this risk remains unmitigated, compromise of any ordinary endpoint an administrator uses is sufficient to capture a standing high-privilege credential.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html
    action: Implement just-in-time privilege activation for administrative roles on this asset, and restrict authentication of high-tier credentials to a dedicated, hardened privileged access workstation tier.
    mitigation: Replace standing administrative role assignment with just-in-time activation (time-bound, approval-gated elevation) so a credential is privileged only for the duration of an active task. Establish administrative tiering (at minimum, separating the highest-privilege tier from general-purpose endpoints) and technically prevent high-tier credentials from authenticating outside their designated tier — not merely a policy expectation.
    references: NIST SP 800-53 AC-6(1) (Least Privilege — Authorize Access to Security Functions); NIST SP 800-53 AC-2(6) (Dynamic Privilege Management); Microsoft/industry privileged access tiering guidance
    risk_assessment: Critical for any self-managed asset with standing (non-JIT) high-privilege role assignment and no administrative tiering.
    false_positives: The asset is tagged mgmt:self-managed-pam-hardened confirming just-in-time privilege activation and administrative tiering are both enforced. Not applicable if privileged access to this asset is governed by the enterprise PAM program.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  Privileged Session Credential Disclosure Without Vaulting or Brokering:
    id: privileged-session-credential-disclosure
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Shared administrative credentials for this self-managed asset are disclosed directly to administrators rather than checked out from a vault and brokered through a session that never reveals the secret.'
    impact: 'If this risk remains unmitigated, a disclosed shared credential can be retained or reused outside any brokered session, and rotating it after personnel turnover requires identifying every system it was ever used against.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    action: Broker administrative access to shared credentials through a session that checks out and rotates the secret without disclosing it to the human operator.
    mitigation: Route administrative access to shared credentials (appliance/hypervisor/database engine/out-of-band controller logins) through a privileged access management broker that checks out the credential for the session duration, rotates it after use, and never displays the underlying secret to the operator. Where brokering isn't yet available for a given asset class, treat direct credential disclosure as a documented gap with a compensating control (individual named accounts where the platform supports them) rather than an unstated assumption.
    references: NIST SP 800-53 IA-5 (Authenticator Management); NIST SP 800-53 AC-6 (Least Privilege)
    risk_assessment: High for any self-managed asset where shared administrative credentials are disclosed directly rather than brokered through a vaulted session.
    false_positives: The asset is tagged mgmt:self-managed-pam-hardened confirming administrative access to shared credentials is brokered through a vaulted session with no direct disclosure. Not applicable if privileged access to this asset is governed by the enterprise PAM program.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  Break-Glass Emergency Access Circular Dependency or Untested Procedure:
    id: break-glass-circular-dependency-untested
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'Break-glass emergency access for this self-managed asset either depends on the primary identity platform it is meant to provide emergency access around, or has never actually been exercised.'
    impact: 'If this risk remains unmitigated, the break-glass procedure can fail during the exact primary-platform outage or compromise scenario it was designed for.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Emergency_Access_Cheat_Sheet.html
    action: Ensure break-glass credentials for this asset do not depend on the primary identity platform for storage or retrieval, and exercise the break-glass procedure on a recurring schedule.
    mitigation: Store break-glass credentials in a vault or safe with an access path independent of the primary identity platform being protected against, so a primary-platform outage or compromise does not also block emergency access. Exercise the actual break-glass procedure (not a tabletop review) on a recurring schedule, updating the documented steps with anything the exercise reveals is missing or outdated.
    references: NIST SP 800-53 CP-2 (Contingency Plan); NIST SP 800-53 IA-5 (Authenticator Management)
    risk_assessment: High for any self-managed asset whose break-glass access depends on the primary identity platform, or whose break-glass procedure has not been exercised within the current ATO period.
    false_positives: The asset is tagged mgmt:self-managed-pam-hardened confirming break-glass credentials have an access path independent of the primary identity platform and the procedure has been exercised within the current ATO period. Not applicable if this asset relies on the enterprise PAM/break-glass program.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  # #############################################################################
  # DOMAIN 2: DEVICE AND INFRASTRUCTURE
  # #############################################################################

  # --- 2.1 INFRASTRUCTURE: CONTAINERS ---
  # Untrusted Container Image Supply Chain, Mutable Container Filesystem,
  # Missing Network Micro-Segmentation, Dangerous Container Linux
  # Capabilities, and Container Orchestrator Control-Plane Audit Logging
  # Gap (further below) have been ported into the jessestarkey/threagile
  # fork as native script rules (pkg/risks/scripts/*.yaml), triggered off
  # the native `machine` field instead of a tag. Removed here rather than
  # left duplicated. See docs/risk-methodology.md for the full rationale.
  # Container Runs as Root (Policy Exception) stays here -- it's a
  # tag-presence-triggered policy waiver, a different shape of content.

  Container Runs as Root (Policy Exception):
    id: container-runs-as-root
    baseline_likelihood: very-likely
    baseline_impact: high
    description: 'This container executes as the root user or with elevated Linux capabilities rather than the least privilege its function requires.'
    impact: 'If this risk remains unmitigated, an attacker who compromises the container has a substantially easier path to escalate privileges on the underlying node.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html
    action: Ensure formal AO risk acceptance is on file.
    mitigation: Compensating controls must be strictly enforced via admission-controller policy (Azure Policy for AKS / OPA Gatekeeper) — scope the waiver to the exact workload it applies to rather than a namespace-wide exception, drop every Linux capability not explicitly required even while running as root, and apply a restrictive seccomp/AppArmor profile to narrow the syscall surface a root process can actually reach.
    references: DISA Kubernetes STIG; NIST SP 800-53 AC-6 (Least Privilege); DoD Container Hardening Guide
    risk_assessment: High risk of container breakout and full node compromise if the container is also internet-reachable or processes untrusted input — root inside the container removes the last layer between a code-execution bug and privilege escalation on the host.
    false_positives: None. This is an explicit policy waiver.
    function: operations
    stride: elevation-of-privilege
    detection_logic: 'Query the cluster (kubectl get pods -o json) for containers whose securityContext omits runAsNonRoot: true or explicitly sets runAsUser: 0. Confirm a matching exception:runs-as-root waiver and AO acceptance record exists for every match.'
    risks_identified: {}

  # --- 2.2 INFRASTRUCTURE: VIRTUAL MACHINES AND PHYSICAL HARDWARE ---
  # Missing Endpoint Security Agents, Unhardened OS / Missing Patch
  # Management, Unencrypted Virtual Disk, and Media Sanitization
  # Procedure Gap have been ported into the jessestarkey/threagile fork
  # as native script rules (pkg/risks/scripts/*.yaml), triggered off the
  # native `machine` field instead of a tag. Removed here rather than
  # left duplicated. See docs/risk-methodology.md for the full rationale.
  # 'Policy Exception: Direct Admin Access' stays here -- it's a
  # tag-presence-triggered policy waiver, a different shape of content.

  'Policy Exception: Direct Admin Access':
    id: policy-exception-direct-admin-access
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The virtual machine has direct administrative ports exposed rather than routed through a bastion host or just-in-time access.'
    impact: 'If this risk remains unmitigated, the VM is continuously exposed to brute-force, credential-stuffing, and exploitation attempts against its remote management service.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    action: Ensure formal AO risk acceptance is on file.
    mitigation: Compensating controls must include strict Network Security Group (NSG) source-IP allowlisting scoped to a known management range (never 0.0.0.0/0), mandatory MFA on the remote-management credential, and a break-glass credential rotation schedule. A just-in-time access broker or bastion host remains the preferred fix over this waiver where feasible.
    references: NIST SP 800-53 AC-17 (Remote Access); DISA OS STIGs; DoD Cloud Computing SRG
    risk_assessment: High risk of unauthorized administrative access.
    false_positives: None. This is an explicit policy waiver.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Scan Network Security Groups (NSGs) for rules allowing inbound port 22 or 3389 from broadly scoped subnets.
    risks_identified: {}

  Self-Managed Out-of-Band Management Controller Compromise:
    id: self-managed-bmc-compromise
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'This self-managed physical host''s out-of-band management controller (BMC/iDRAC/iLO/IPMI) has not been confirmed hardened, and runs its own processor and network stack independent of the host OS.'
    impact: 'If this risk remains unmitigated, a default or weak BMC credential grants an attacker remote, OS-invisible control of the host, including the ability to remotely reimage it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.html
    action: Replace default BMC credentials, disable unneeded BMC services, and bind BMC network access to an isolated management network segment.
    mitigation: Change default BMC/iDRAC/iLO/IPMI/Redfish credentials on every physical host before it enters service, and rotate them on the same schedule as other privileged credentials. Disable unused BMC services and interfaces (legacy IPMI over LAN where Redfish is available, unused virtual media features). Place BMC network interfaces on an isolated out-of-band management network with no route from general application traffic, reachable only from a dedicated administrative path.
    references: NIST SP 800-53 CM-6 (Configuration Settings); NIST SP 800-53 SC-7 (Boundary Protection); CIS Benchmarks (Server/BMC hardening)
    risk_assessment: Critical for any self-managed physical host whose BMC has not been confirmed to use non-default credentials and isolated network placement.
    false_positives: The asset is tagged mgmt:self-managed-hardware-hardened confirming BMC credentials are non-default and rotated, unused services are disabled, and network access is isolated to a dedicated management segment. Not applicable to virtual/cloud-provisioned compute with no accessible BMC layer.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  Self-Managed Below-OS Firmware Persistence Gap:
    id: self-managed-firmware-persistence-gap
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'This self-managed physical host''s patch management covers only the operating system, leaving UEFI/BIOS, TPM, and other below-OS firmware unpatched.'
    impact: 'If this risk remains unmitigated, a firmware-level implant persists across a full OS reimage and is invisible to any OS-level integrity check.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.html
    action: Extend patch management to firmware (UEFI/BIOS, TPM, BMC, option-ROM) on this physical host, tracked and patched on a defined cadence independent of OS patching.
    mitigation: Inventory the firmware version of every below-OS component on this host (UEFI/BIOS, TPM, BMC, option-ROMs on network/storage controllers) and subscribe to the hardware vendor's firmware security advisories. Patch firmware on a defined cadence separate from OS patch management, since it is not covered by the same tooling. Where the platform supports it, enable firmware-level attestation so a below-OS modification is detectable rather than silently persistent.
    references: NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-193 (Platform Firmware Resiliency Guidelines)
    risk_assessment: Critical for any self-managed physical host with no firmware patch tracking independent of OS patch management.
    false_positives: The asset is tagged mgmt:self-managed-hardware-hardened confirming firmware across UEFI/BIOS, TPM, BMC, and option-ROMs is inventoried and patched on a defined cadence. Not applicable to virtual/cloud-provisioned compute where firmware is the cloud provider's responsibility.
    function: operations
    stride: tampering
    risks_identified: {}

  Self-Managed Boot Integrity Bypass:
    id: self-managed-boot-integrity-bypass
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This self-managed physical host has no secure boot or measured-boot attestation confirmed, so its boot-chain integrity is unverifiable.'
    impact: 'If this risk remains unmitigated, a tampered bootloader or bootkit survives indefinitely and produces no signal to any control that only runs after the OS has loaded.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.html
    action: Enable secure boot and TPM-backed measured-boot attestation on this physical host, and verify attestation results before trusting the host's post-boot state.
    mitigation: Enable UEFI Secure Boot to reject unsigned or improperly signed bootloaders and kernels. Enable TPM-backed measured boot so each boot stage's hash is recorded and can be remotely attested, and integrate attestation verification into the host's admission to the fleet (a host that fails attestation should not be trusted with workload placement). Treat a host with secure boot disabled or no TPM as non-compliant rather than a silently accepted gap.
    references: NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-155 (BIOS Integrity Measurement Guidelines)
    risk_assessment: High for any self-managed physical host with secure boot disabled or no TPM-backed measured-boot attestation.
    false_positives: The asset is tagged mgmt:self-managed-hardware-hardened confirming secure boot is enabled and TPM-backed measured-boot attestation is verified. Not applicable to virtual/cloud-provisioned compute where boot-chain integrity is the cloud provider's responsibility.
    function: architecture
    stride: tampering
    risks_identified: {}

  # #############################################################################
  # DOMAIN 3: NETWORK AND ENVIRONMENT
  # #############################################################################

  # --- 3.1 NETWORK SEGMENTATION AND PERIMETER (SELF-MANAGED) ---
  # Applies only to assets tagged mgmt:self-managed-network -- for an
  # asset in the enterprise-managed landing zone, macro/micro
  # segmentation, wireless admission, and external routing are inherited
  # platform controls, not something a per-app model can meaningfully
  # answer differently (see CLAUDE.md's platform-vs-app-actionable split).
  # These risks exist for the case that split explicitly carves out: an
  # asset whose network architecture the application team configures and
  # owns itself.
  No Macro or Micro-Segmentation of Self-Managed Network:
    id: self-managed-network-no-segmentation
    baseline_likelihood: likely
    baseline_impact: high
    description: 'This asset''s self-managed network permits workload-to-workload traffic by default rather than restricting it to an explicit, allow-listed baseline.'
    impact: 'If this risk remains unmitigated, compromise of a single host on the network gives an attacker unrestricted reachability to every other host on it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
    action: Map this network's actual required communication paths and implement default-deny macro- and micro-segmentation permitting only that mapped baseline.
    mitigation: Document the actual required communication paths between tiers and workloads, then implement default-deny segmentation (firewall/NSG/NACL rules or equivalent) permitting only that mapped baseline — deny-all as the starting posture, with explicit allow rules added only as justified. Place internet-facing services, administrative planes, and sensitive data stores in distinct network segments from each other and from lower-trust systems, not sharing a flat network.
    references: NIST SP 800-53 SC-7 (Boundary Protection); NIST SP 800-207 (Zero Trust Architecture)
    risk_assessment: Critical for any self-managed network with no mapped, default-deny segmentation between trust tiers.
    false_positives: The asset is tagged mgmt:self-managed-network-hardened confirming default-deny macro- and micro-segmentation is implemented against a documented communication baseline. Not applicable to assets in the enterprise-managed landing zone, where segmentation is a platform-inherited control.
    function: architecture
    stride: elevation-of-privilege
    risks_identified: {}

  Rogue Access Point and Evil-Twin Credential Harvesting on Self-Managed Wireless:
    id: self-managed-rogue-ap-credential-harvesting
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This asset''s self-managed wireless network has no confirmed detection for a rogue access point impersonating its own SSID.'
    impact: 'If this risk remains unmitigated, a nearby evil-twin access point can harvest client credentials directly over the air, bypassing every wired-side control.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Wireless_Security_Cheat_Sheet.html
    action: Deploy rogue access point / evil-twin detection for this self-managed wireless network, and require mutual authentication (e.g., EAP-TLS or a certificate-validated method) that resists credential harvesting by an impersonating access point.
    mitigation: Deploy wireless intrusion detection capable of identifying rogue/impersonating access points broadcasting this network's SSID, alerting the SOC on detection. Require a wireless authentication method with mutual/server certificate validation (EAP-TLS, or PEAP/EAP-TTLS with certificate pinning) so a client can detect and reject an impersonating access point rather than a credential-harvesting method that any access point broadcasting the right SSID can capture.
    references: NIST SP 800-53 SC-40 (Wireless Link Protection); NIST SP 800-153 (Guidelines for Securing WLANs)
    risk_assessment: High for any self-managed wireless network with no rogue access point detection and a wireless authentication method vulnerable to credential harvesting by an impersonating access point.
    false_positives: The asset is tagged mgmt:self-managed-network-hardened confirming rogue access point detection is active and wireless authentication resists credential harvesting. Not applicable to assets with no self-managed wireless network, or where wireless is provided by the enterprise-managed landing zone.
    function: operations
    stride: spoofing
    risks_identified: {}

  Missing Route Origin Validation on Self-Managed External Routing:
    id: self-managed-missing-rpki-route-validation
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This asset''s self-managed external routing has no route origin authorization or RPKI validation confirmed.'
    impact: 'If this risk remains unmitigated, an accepted bogus route announcement can redirect this asset''s traffic onto an attacker-influenced path with no firewall rule ever triggered.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.html
    action: Enable RPKI-based route origin validation on this asset's external routing adjacencies, and register route origin authorizations for its advertised prefixes.
    mitigation: Register Route Origin Authorizations (ROAs) for every prefix this asset originates, and enable RPKI-based route origin validation on external routing adjacencies to reject invalid announcements. Apply prefix and max-prefix filtering on peering sessions as a defense-in-depth backstop against both malicious hijacks and operational route leaks.
    references: NIST SP 800-53 SC-7 (Boundary Protection); RFC 6480 (RPKI); NIST SP 800-189 (Resilient Interdomain Traffic Exchange)
    risk_assessment: High for any self-managed asset with an external routing adjacency and no RPKI route origin validation.
    false_positives: The asset is tagged mgmt:self-managed-network-hardened confirming RPKI route origin validation and ROA registration are in place for this asset's routing adjacencies. Not applicable to assets with no self-managed external routing, or where routing is provided by the enterprise-managed landing zone.
    function: architecture
    stride: spoofing
    risks_identified: {}

  # --- 3.2 CROSS-DOMAIN SOLUTION (CDS) INTERFACES ---
  # Risks cover the low-side application's interface with an external,
  # UCDMO-approved CDS. The CDS itself is outside the ATO boundary.
  #
  # ── TAG: cds:low-side-submitter ───────────────────────────────────────
  'CDS: Classification Marking Validation Bypass':
    id: cds-marking-validation-bypass
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'The application validates that classification markings exist before submitting content to the CDS for low-to-high transfer, but cannot verify that those markings are correct.'
    impact: 'If this risk remains unmitigated, incorrectly classified content can reach the CDS and result in a formal data spill.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Enforce schema validation at every API ingestion point and validate marking values against an approved controlled vocabulary allowlist.
    mitigation: Enforce classification marking validation as server-side middleware on every ingestion endpoint — not only at the UI layer. Validate marking values against an approved controlled vocabulary allowlist (exact match, not just non-null presence). Reject and log any submission where markings are absent, malformed, or outside the approved vocabulary. Gate broker queue writes on successful validation — content must not reach the queue until validation passes. Include the validation result and marking value in the transfer audit log.
    references: DoD CUI Registry; NIST SP 800-53 SI-10 (Information Input Validation); ICD 710 (Classification Management)
    risk_assessment: Critical for any low-to-high transfer path. The application is the last validation point before content reaches the CDS.
    false_positives: Marking validation is enforced at the server-side API layer on every ingestion path, values are validated against a hardcoded approved vocabulary allowlist, and no direct queue write access exists that bypasses the application.
    function: architecture
    stride: information-disclosure
    detection_logic: Monitor transfer submission logs for marking field values outside the approved vocabulary. Alert on any direct broker queue write events not originating from the validated application ingestion path. Include schema validation pass/fail status in all transfer audit records.
    risks_identified: {}

  'CDS: Misclassification and Insufficient Transfer Audit Trail':
    id: cds-misclassification-audit-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Classification correctness on the low-to-high transfer path is a human judgment the application cannot technically enforce, so its main contribution to spillage prevention is the completeness of the audit trail it produces.'
    impact: 'If this risk remains unmitigated, an incomplete or tampered audit trail prevents a spillage event from being reconstructed or attributed after the fact.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Implement a complete, tamper-evident transfer audit trail capturing full submission context and forward to a write-once SIEM.
    mitigation: 'Generate an immutable audit record for every transfer submission containing: authenticated user identity, submission timestamp, content identifier, asserted classification marking, schema validation result, CDS submission status, and CDS response code. Forward to a write-once SIEM the application cannot modify. Implement anomaly detection on transfer patterns — alert on atypical submission volumes, atypical content types, or marking values inconsistent with a user''s historical pattern. Require re-authentication before bulk transfer submissions.'
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 AU-9 (Protection of Audit Information); DoD Insider Threat Program; ICD 710
    risk_assessment: High. The audit trail is the primary compensating control for misclassification risk. Its absence elevates residual risk to Critical.
    false_positives: Transfer audit records capture full submission context, are forwarded to a write-once SIEM, and anomaly detection on transfer patterns is active and tuned.
    function: operations
    stride: information-disclosure
    detection_logic: 'Monitor transfer logs for: atypical submission volumes relative to user baseline; marking values inconsistent with a user''s historical pattern; submissions outside normal working hours; bulk submissions immediately preceded by privilege changes.'
    risks_identified: {}

  # ── TAG: cds:low-side-receiver ────────────────────────────────────────
  'CDS: Unsafe Processing of CDS-Sourced Inbound Content':
    id: cds-unsafe-inbound-content
    baseline_likelihood: likely
    baseline_impact: high
    description: 'The receiving application processes CDS-approved content from the high side with less rigorous validation than it would apply to directly user-supplied data, even though CDS approval reflects releasability, not safety for parsing.'
    impact: 'If this risk remains unmitigated, an approved document can still exploit a parser vulnerability or poison the receiving application''s data store.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Apply the same input validation and malware scanning to CDS-sourced content as to any other externally-sourced data.
    mitigation: 'Process all inbound CDS content through the same validation pipeline as direct user uploads: content-type verification, malware scanning, format-specific parser hardening (XXE disabled, macros disabled, JavaScript disabled in PDF renderers), and file extension allow-listing. Do not grant CDS-sourced content elevated trust or bypass input validation based on transfer origin. Log all inbound content receipt events with content identifier, type, size, and validation result. Alert on validation failures for CDS-sourced content.'
    references: NIST SP 800-53 SI-3 (Malicious Code Protection); NIST SP 800-53 SI-10 (Information Input Validation); DoD CDS implementation guidance
    risk_assessment: High for applications parsing complex file formats (Office, PDF, XML). Medium for applications consuming structured schema-validated data from the CDS.
    false_positives: All inbound CDS content passes through the same validation and malware scanning pipeline as direct user uploads with no bypass based on CDS transfer origin.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Monitor inbound CDS content validation results and alert on failures — particularly format mismatches between declared and actual content type. Track parser exceptions on CDS-sourced content as potential exploitation indicators.
    risks_identified: {}

  # ── TAG: cds:low-side-broker ──────────────────────────────────────────
  'CDS: Transfer Broker Unauthorized Write and Queue Injection':
    id: cds-broker-queue-injection
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The message broker staging content between the application and the CDS interface is a critical security boundary; direct write access to it bypasses the application''s own classification marking validation.'
    impact: 'If this risk remains unmitigated, injected content reaches the CDS or the receiving application with no application audit record of it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
    action: Restrict broker write access exclusively to the authenticated application service account and enforce message integrity verification on dequeue.
    mitigation: Restrict write access to all transfer queues to the application service account only — no human accounts, no direct developer access. Restrict outbound queue read access to the CDS interface service account only. Apply message-level integrity signing at enqueue and verify at dequeue to detect tampering. Enforce queue-level encryption at rest. Set aggressive message TTL to minimize the staging window. Log all enqueue and dequeue events with actor identity. Alert on any enqueue event from an identity other than the approved service account.
    references: NIST SP 800-53 SC-8 (Transmission Integrity); NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 AU-2 (Event Logging)
    risk_assessment: Critical. Unauthorized broker write access nullifies all application-layer controls on the transfer path.
    false_positives: Broker write access is restricted to the application service account enforced at the queue policy level, message integrity signing is implemented, and queue access logs are forwarded to the SIEM with alerting on unexpected write origins.
    function: architecture
    stride: tampering
    detection_logic: Monitor broker access logs for enqueue events from any identity other than the approved application service account. Alert on message integrity verification failures at dequeue. Monitor queue depth anomalies indicating bulk injection outside normal transfer patterns.
    risks_identified: {}

  # ── TAG: cds:high-side-submitter ─────────────────────────────────────
  'CDS: Inadvertent Above-Releasable Content Inclusion in Downward Release':
    id: cds-above-releasable-content-inclusion
    baseline_likelihood: very-likely
    baseline_impact: very-high
    description: 'Content proposed for downward release via the CDS relies primarily on human review, which can miss above-releasable material embedded in file metadata, revision history, or embedded objects.'
    impact: 'If this risk remains unmitigated, above-releasable content that passes the CDS filter constitutes a formal downward spill requiring incident response.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Enforce multi-layer pre-submission sanitization and require explicit human release authority approval before content is queued for the CDS.
    mitigation: Implement automated sanitization that strips metadata, revision history, tracked changes, embedded objects, and document properties before human review. Require explicit release authority sign-off (logged with identity and timestamp) as a mandatory gate before content enters the downward transfer queue — sanitization alone is not sufficient. Maintain an approved content type allowlist and reject any format the sanitization tooling cannot fully process. Log all sanitization actions and their results in the transfer audit record. Apply secondary content inspection after sanitization as a defense-in-depth check.
    references: DoD CDS implementation guidance; ICD 710 (Classification Management); NIST SP 800-53 SI-12 (Information Management and Retention); DoD Manual 5200.01 (Information Security Program)
    risk_assessment: Critical for any automated or partially-automated downward release workflow. The consequence of a miss is a classified spill — there is no compensating control after content passes the CDS filter.
    false_positives: All content undergoes multi-layer automated sanitization followed by mandatory human release authority review and approval before reaching the transfer queue, with full audit logging of both steps.
    function: architecture
    stride: information-disclosure
    detection_logic: Audit transfer submission logs for content that bypassed the sanitization or human review step. Monitor for bulk submission patterns that may indicate review fatigue or process circumvention. Implement post-transfer sampling — periodically inspect low-side received content for residual above-releasable markers as a quality assurance check.
    risks_identified: {}

  'CDS: Release Authority Bypass on High-Side Downward Transfer':
    id: cds-release-authority-bypass
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The high-side submission workflow requires release authority approval before content is queued for downward transfer, and this approval gate can potentially be bypassed through workflow logic flaws, direct broker writes, or privilege escalation.'
    impact: 'If this risk remains unmitigated, unreviewed content can reach the CDS without ever passing the mandatory human release-authority judgment.'
    asvs: V4 - Access Control / V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: Enforce release authority approval as a server-side gate on every downward transfer submission path and restrict high-side broker write access to the approval-gated application workflow only.
    mitigation: Enforce release authority approval as server-side middleware on every submission ingestion path — not only on the primary UI workflow. Restrict write access to the high-side transfer broker queue exclusively to the application service account that runs after approval is confirmed. Implement approval token validation at queue write time — the queue write must carry a cryptographically signed approval token that is verified before the message is accepted. Log every release authority decision with the approver identity, timestamp, content identifier, and approval outcome. Alert on any queue write event not accompanied by a valid approval token.
    references: DoD CDS implementation guidance; NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 AU-2 (Event Logging); ICD 710 (Classification Management)
    risk_assessment: Critical. There is no compensating control downstream of a release authority bypass — content that reaches the CDS without approval has not been reviewed for releasability.
    false_positives: Every submission path enforces approval gating at the server-side middleware layer, high-side broker write access is restricted to the post-approval application service account, and approval tokens are cryptographically verified at queue write time.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Monitor high-side broker queue write logs for messages lacking valid approval tokens. Alert on any submission API call path that does not route through the approval middleware. Audit the approval workflow for race conditions by monitoring the time delta between approval events and queue write events.
    risks_identified: {}

  'CDS: Malicious Insider Abuse of Authorized Release Privileges':
    id: cds-malicious-insider-release-abuse
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'A cleared individual who legitimately holds submitter access or release authority can knowingly use that access to move content they know is not authorized for release, with no technical control bypassed.'
    impact: 'If this risk remains unmitigated, an authorized insider can cause an unauthorized disclosure identical in consequence to any other downward spill, with no compensating technical control available afterward.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    action: Enforce two-person integrity on high-side release authority (submitter and approver must be different individuals) and deploy behavioral analytics on submission patterns to surface deviations from an individual's baseline before release occurs.
    mitigation: Enforce separation of duties between the submitter role and the release authority role — no individual should hold both, and the approval workflow should technically prevent self-approval. Require two-person integrity (dual authorization) for release of any content above a defined sensitivity threshold, so a single insider cannot complete a release unilaterally even with full legitimate access. Deploy user and entity behavior analytics (UEBA) on submission activity — volume, timing, content sensitivity, and deviation from an individual's historical baseline — as a detection layer independent of content inspection, since deliberately malicious content is by definition designed to pass content-based filters. Integrate with the organization's insider threat program so submission-pattern anomalies are correlated against other insider threat indicators (e.g., adverse personnel actions, upcoming separation) rather than evaluated in isolation. Apply least-privilege and need-to-know scoping so submitter/approver access is granted only for the specific content domains an individual's role actually requires, limiting the blast radius of any one compromised or malicious account. Periodically rotate personnel in the release authority role.
    references: DoDD 5205.16 (The DoD Insider Threat Program); National Insider Threat Policy and Minimum Standards (implementing EO 13587); NIST SP 800-53 AC-5 (Separation of Duties); NIST SP 800-53 PM-12 (Insider Threat Program); NIST SP 800-53 AU-6 (Audit Record Review, Analysis, and Reporting)
    risk_assessment: Critical for any high-side submitter or release authority role, regardless of how well the technical sanitization and approval workflow is implemented — this risk is orthogonal to those controls rather than a failure mode of them. Cannot be fully mitigated by application-layer controls alone; requires organizational insider threat program integration.
    false_positives: Separation of duties is enforced between the submitter and release authority roles with no individual holding both, two-person integrity is required for release of sensitive content, UEBA-based behavioral monitoring is deployed on submission activity, and submission-pattern anomalies are correlated with the organization's insider threat program.
    function: architecture
    stride: information-disclosure
    detection_logic: Monitor for submission-pattern deviations from an individual's historical baseline — unusual volume, timing outside normal working hours, content sensitivity inconsistent with role, or submissions shortly before a known separation date. Alert on any release approved without a distinct second-party reviewer when dual authorization is configured. Correlate CDS submission activity with other insider threat indicators available to the organization's insider threat program (e.g., adverse HR actions, anomalous data staging or access patterns on the high-side network prior to submission).
    risks_identified: {}

  # ── TAG: cds:high-side-receiver ───────────────────────────────────────
  'CDS: Low-to-High Content Integrity and Influence Risk':
    id: cds-low-to-high-influence
    baseline_likelihood: likely
    baseline_impact: high
    description: 'The high-side receiver processes content from the low side that the CDS validates as authorized for ingestion but does not validate for accuracy, so a compromised low-side system could send subtly manipulated data that appears legitimate.'
    impact: 'If this risk remains unmitigated, corrupted data ingested into the high-side environment can compromise the integrity of analysis or decisions that depend on it, without triggering any content-inspection alert.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Implement independent high-side validation of inbound low-side content integrity and maintain anomaly detection on inbound data patterns.
    mitigation: Apply schema validation and business logic checks to all inbound low-side content on the high side — do not treat CDS approval as a guarantee of data integrity. Implement anomaly detection on inbound data patterns (statistical outliers, unexpected value ranges, structural deviations from baseline) that may indicate manipulation. Maintain a data provenance chain — log the low-side source identity, submission timestamp, and content hash for every inbound transfer. For high-confidence mission-critical data feeds, implement out-of-band verification against a secondary source where available.
    references: NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-53 AU-10 (Non-Repudiation); DoD CDS implementation guidance
    risk_assessment: High for high-side systems that make operational or analytical decisions based on low-side data feeds. Medium for systems where low-side data is advisory or cross-referenced against independent high-side sources.
    false_positives: Inbound low-side data is treated as untrusted and undergoes independent schema validation, anomaly detection, and provenance logging before being used in any high-side analytical or operational workflow.
    function: architecture
    stride: tampering
    detection_logic: Monitor inbound low-side data for statistical anomalies relative to historical baselines. Alert on content that passes CDS inspection but fails high-side schema validation or business logic checks. Maintain audit records of inbound transfer provenance for forensic reconstruction.
    risks_identified: {}

  # ── TAG: cds:high-side-broker ─────────────────────────────────────────
  'CDS: High-Side Transfer Broker Unauthorized Access and Queue Tampering':
    id: cds-high-side-broker-tampering
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The high-side message broker staging content for the CDS interface is a critical security boundary; unauthorized write access to its outbound queue bypasses the release authority and sanitization gates.'
    impact: 'If this risk remains unmitigated, injected content can reach the CDS for downward release without ever passing through the controls meant to review it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Microservices_Security_Cheat_Sheet.html
    action: Restrict high-side broker write access exclusively to the post-approval application service account and enforce message integrity signing on all queue operations.
    mitigation: Restrict write access to the high-side outbound transfer queue exclusively to the application service account that operates after release authority approval is confirmed — no human accounts, no developer access, no other service accounts. Apply message-level integrity signing at enqueue and verify at dequeue. Restrict outbound queue read access to the CDS interface service account only. Set aggressive message TTL on both queues to minimize the staging window for above-releasable content. Log all enqueue and dequeue events with actor identity. Alert immediately on any queue write from an unexpected identity.
    references: NIST SP 800-53 SC-8 (Transmission Integrity); NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 AU-2 (Event Logging); DoD CDS implementation guidance
    risk_assessment: Critical. Unauthorized write access to the high-side outbound queue nullifies all release authority and sanitization controls on the downward transfer path.
    false_positives: Write access to the high-side outbound queue is restricted to the post-approval service account enforced at the queue policy level, message integrity signing is implemented, and all queue access events are logged and alerted on anomalous writes.
    function: architecture
    stride: tampering
    detection_logic: Monitor high-side broker queue write logs for any enqueue event from an identity other than the approved post-approval service account. Alert on message integrity verification failures at dequeue. Monitor queue depth for anomalous accumulation that may indicate staged bulk content awaiting submission outside the normal workflow.
    risks_identified: {}

  # ── TRANSFER INTERFACE COVERT CHANNEL (fires per CDS submitter/receiver) ─
  'CDS: Transfer Interface Covert Channel Exposure':
    id: cds-transfer-interface-covert-channel
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'A covert channel -- timing, storage, or feedback-based -- can carry information across a CDS transfer interface without passing through the CDS content filter or being authorized by transfer policy.'
    impact: 'If this risk remains unmitigated, a low-bandwidth but persistent exfiltration or signaling path exists that content inspection alone cannot detect.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Implement transfer rate normalization on the CDS interface to degrade timing channel bandwidth, and restrict CDS response signals to binary approved/rejected with no timing information an observer could correlate.
    mitigation: Implement transfer rate normalization on the CDS interface (fixed inter-transfer intervals or jitter injection) to degrade timing channel bandwidth. Restrict CDS response signals to binary approved/rejected with no timing information that could be correlated by an observer. Apply statistical analysis to transfer patterns to detect non-random timing that may indicate covert signaling. Normalize or strip approved metadata fields (filenames, timestamps, page/record counts) that are not operationally required, to close storage-channel avenues.
    references: NIST SP 800-53 SC-31 (Covert Channel Analysis); DoD CDS implementation guidance; UCDMO CDS baseline requirements
    risk_assessment: High for timing and storage channels on any CDS submitter or receiver interface — low bandwidth but persistent and hard to detect through content inspection alone.
    false_positives: Covert channel analysis has been formally conducted and documented per NIST SP 800-53 SC-31 for this interface, confirming transfer rate normalization, binary-only CDS response signaling, and metadata normalization are implemented.
    function: architecture
    stride: information-disclosure
    detection_logic: Monitor transfer inter-arrival times for non-random patterns using statistical tests (chi-squared, entropy analysis) that may indicate timing channel use. Audit approved metadata fields for unnecessary precision or variability that could carry a storage channel payload.
    risks_identified: {}

  # #############################################################################
  # DOMAIN 4: APPLICATION
  # #############################################################################

  # --- 4.1 INPUT HANDLING AND INJECTION ---
  Server-Side Template Injection and RCE:
    id: dynamic-code-rce
    baseline_likelihood: very-likely
    baseline_impact: very-high
    description: 'The application executes dynamic code, expressions, or templates built from user-supplied input, creating a server-side template injection vector.'
    impact: 'If this risk remains unmitigated, an attacker can achieve remote code execution and full compromise of the container running the application.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
    action: Sandbox script execution and utilize logic-less templates.
    mitigation: Strictly avoid dynamic `eval()` functions. If dynamic execution is absolutely required, run the logic within a strictly isolated, unprivileged sandbox container (e.g., gVisor) with zero network egress.
    references: DoD DevSecOps Reference Architecture
    risk_assessment: Critical risk if raw user input is evaluated directly as code or templates.
    false_positives: Input is strictly validated against a hardcoded, safe regex allow-list before any backend processing.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Utilize robust SAST/DAST tools in the CI/CD pipeline to specifically flag unsafe execution functions.
    risks_identified: {}

  Malicious File Parsing and XXE:
    id: malicious-file-parsing
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The application parses complex user-uploaded files such as XML, PDF, or ZIP archives, which can carry XXE, path traversal, or decompression-bomb payloads.'
    impact: 'If this risk remains unmitigated, a crafted file can cause server-side request forgery, unauthorized file reads, or denial of service.'
    asvs: V12 - File and Resources
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
    action: Implement secure XML parsing and strict file type validation.
    mitigation: Disable external entity resolution (DTD) in all XML parsers. Use strict allow-lists for MIME types and utilize an ICAP-integrated antivirus scanner for all uploads before processing.
    references: NIST SP 800-53 SI-3 (Malicious Code Protection)
    risk_assessment: High if parsing untrusted B2B or external user files.
    false_positives: 'The application only stores files blindly in blob storage without actively parsing their internal contents. NOTE: Threagile''s built-in ''xml-external-entity'' rule may generate a partially overlapping finding on assets with XML data flows, and its built-in ''missing-file-validation'' rule fires on the same file-accepting assets more generically (filename/type validation only); this entry provides broader coverage including Zip Bomb and LFI vectors and fires on the feature:file-upload-processing tag regardless of data flow modeling completeness.'
    function: architecture
    stride: tampering
    detection_logic: Scan source code via SAST for insecure XML parser configurations and monitor WAF logs for standard XXE payloads.
    risks_identified: {}

  Insecure Deserialization:
    id: insecure-deserialization
    baseline_likelihood: very-likely
    baseline_impact: very-high
    description: 'The asset deserializes objects from user-supplied or externally sourced data using a mechanism capable of instantiating arbitrary objects, such as Java native serialization or Python pickle.'
    impact: 'If this risk remains unmitigated, a crafted serialized payload can execute a gadget chain achieving remote code execution with the application''s own privileges.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    action: Replace unsafe deserialization with data-format-based deserialization (JSON, Protobuf) or implement strict type filtering before any object construction.
    mitigation: 'Replace Java native serialization, .NET BinaryFormatter, and Python pickle for user-controlled data with safe data formats (JSON with a schema validator, Protocol Buffers, MessagePack with type constraints). If native serialization cannot be eliminated immediately: implement a deserialization filter (Java 9+ ObjectInputFilter, .NET SerializationBinder) that whitelists only expected class types and rejects all others. Run applications using deserializing code in a hardened sandbox with no outbound network access and minimal filesystem permissions to limit post-exploitation impact. Ensure agent-based RASP controls flag deserialization activity.'
    references: 'OWASP Top 10: A08:2021 (Software and Data Integrity Failures); NIST SP 800-53 SI-10 (Information Input Validation); CWE-502'
    risk_assessment: Critical for Java applications using ObjectInputStream or .NET applications using BinaryFormatter on externally-sourced data. High for Python/Ruby applications using pickle/Marshal on user-controlled input.
    false_positives: 'All deserialization of externally-sourced data uses type-safe formats (JSON, Protobuf) with schema validation — no native object serialization formats are accepted from user-controlled input. NOTE: Threagile''s built-in ''deserialization-of-untrusted-data'' rule may generate an overlapping finding if data flows are fully modeled; this injected risk provides coverage when the data flow model is sparse.'
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Run SAST rules targeting unsafe deserialization calls (ObjectInputStream, BinaryFormatter, pickle.loads, Marshal.load, YAML.load) in the CI/CD pipeline. Monitor Java application logs for ClassNotFoundException or InvalidClassException which may indicate probing with malformed gadget chains. Deploy a Java agent (e.g., SerialKiller) to intercept and log all deserialization events in production.
    risks_identified: {}

  Server-Side PDF Generation Injection:
    id: pdf-generation-injection
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset generates PDFs server-side by rendering HTML templates with a headless browser or HTML-to-PDF library, which can resolve attacker-supplied URLs or file paths during rendering.'
    impact: 'If this risk remains unmitigated, injected HTML or CSS can be used to read local files or reach the cloud metadata endpoint from the rendering process.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    action: Disable JavaScript execution and external resource loading in the PDF renderer and sanitize all user-supplied content before template insertion.
    mitigation: 'Disable JavaScript execution in the PDF renderer configuration (wkhtmltopdf: --disable-javascript; Puppeteer: set javascript=false). Disable external resource loading (--no-background, --disable-local-file-access for wkhtmltopdf). Sanitize all user-supplied content with a strict HTML sanitizer (e.g., DOMPurify) before insertion into the PDF template — allow only a safe subset of formatting tags. Run the PDF renderer process in a network-isolated sandbox with no outbound connectivity and no access to the filesystem beyond the template directory. Apply the same IMDS blocking controls as for SSRF.'
    references: NIST SP 800-53 SC-7 (Boundary Protection); NIST SP 800-53 SI-10 (Information Input Validation); Azure IMDS security guidance
    risk_assessment: High for renderers with JavaScript enabled that incorporate unsanitized user content. Medium for renderers with JavaScript disabled but external URL loading enabled.
    false_positives: The PDF renderer runs in a fully network-isolated sandbox with JavaScript and external resource loading disabled, and all user-supplied content is sanitized with a vetted HTML sanitizer before template insertion.
    function: architecture
    stride: information-disclosure
    detection_logic: Test PDF generation endpoints by injecting SSRF payloads into user-controlled fields (iframe pointing to IMDS URL, external image URL to a collaborator server). Verify the renderer is network-isolated by attempting to render a template that fetches an external URL and confirming no outbound request is made. Monitor the PDF renderer process for unexpected outbound network connections.
    risks_identified: {}

  Email Header Injection and Sending Abuse:
    id: email-header-injection
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The asset constructs outbound email from user-supplied input without sanitizing recipient or header fields, allowing CRLF-based header injection.'
    impact: 'If this risk remains unmitigated, an attacker can redirect mail to unintended recipients or turn the application into an open relay for spam and phishing.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Validate and sanitize all user-supplied values used in email construction and enforce SPF/DKIM/DMARC on the sending domain.
    mitigation: "Strip or reject CRLF sequences (\r\n, \r, \n) from all user-supplied values used in email headers before constructing the message. Use a well-maintained email library that handles header encoding safely rather than building raw SMTP messages via string concatenation. Validate recipient addresses against an allowlist or strict RFC 5322 format check — reject addresses containing special characters. Enforce SPF, DKIM, and DMARC (p=reject) on the sending domain. Log all outbound email with sender identity, recipient, and subject for audit."
    references: NIST SP 800-53 SI-10 (Information Input Validation); NIST SP 800-53 SC-7; CWE-93 (CRLF Injection)
    risk_assessment: Medium for applications sending transactional email with partial user-controlled content. Escalates to High if arbitrary recipient addresses can be injected or if the sending domain has no DMARC enforcement.
    false_positives: All email recipient addresses are drawn exclusively from a pre-validated internal directory with no user-supplied address input — user input only influences email body content which is sanitized before insertion.
    function: architecture
    stride: spoofing
    detection_logic: Test all email-triggering endpoints by injecting CRLF sequences into user-controlled fields (name, subject, message) and verifying the resulting email headers do not contain injected values. Verify DMARC enforcement by querying the sending domain's DNS TXT record for p=reject. Monitor outbound email volume for anomalous spikes that may indicate relay abuse.
    risks_identified: {}

  Webhook Signature Verification Bypass:
    id: webhook-signature-bypass
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset receives inbound webhook callbacks and acts on their payload without verifying a cryptographic signature on the request.'
    impact: 'If this risk remains unmitigated, anyone who knows the endpoint URL can send a fabricated payload and trigger business logic with attacker-controlled data.'
    asvs: V13 - API and Web Service
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
    action: Implement HMAC-SHA256 signature verification on all inbound webhook payloads before processing.
    mitigation: Verify the HMAC-SHA256 (or provider-specified) signature on every inbound webhook request before performing any business logic. Use a constant-time comparison function to prevent timing oracle attacks against the signature check. Reject requests with missing, malformed, or expired timestamps (replay prevention). Validate that the webhook source IP is within the provider's documented egress range as a defense-in-depth layer. Log all signature verification failures and alert on elevated failure rates.
    references: NIST SP 800-53 SC-8 (Transmission Confidentiality and Integrity); NIST SP 800-53 SI-10 (Information Input Validation)
    risk_assessment: High for webhooks that trigger write operations, financial transactions, or account management actions. Medium for read-only notification webhooks where the worst case is a spurious notification.
    false_positives: The webhook endpoint is protected by mutual TLS client certificate authentication with the sending system's certificate pinned — no HMAC signature is needed because the transport layer provides equivalent integrity assurance.
    function: architecture
    stride: spoofing
    detection_logic: Test webhook endpoints by sending requests without a signature header, with an invalid signature, and with a replayed valid signature outside the allowed timestamp window — all should be rejected with 401/403. Monitor webhook ingestion logs for signature verification failures and alert on failure rate spikes.
    risks_identified: {}

  Bulk Import/Export Data Abuse:
    id: bulk-import-export-abuse
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset supports bulk data import or export without per-record authorization checks or bounded scope, exposing it to formula injection, mass overwrite, and unbounded data exposure.'
    impact: 'If this risk remains unmitigated, a low-privilege user can export an entire dataset beyond what individual record access would allow, or overwrite authoritative records at scale.'
    asvs: V5 - Validation, Sanitization and Encoding / V4 - Access Control
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/CSV_Injection_Prevention_Cheat_Sheet.html
    action: Sanitize all exported cell values against formula injection, enforce per-user scope on export queries, and enforce authorization checks on bulk import operations.
    mitigation: Sanitize all string values written to CSV/Excel exports by prefixing dangerous leading characters (=, +, -, @, tab, carriage return) with a single quote or space. Enforce per-user data scope on all export queries — apply the same row-level security as individual record access, never export the full table. Implement hard size limits on both import and export operations with pagination. Require re-authentication or MFA confirmation before bulk export of CUI. Log all bulk export operations with the requesting user identity, timestamp, and record count.
    references: OWASP CSV Injection; NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 SC-5 (DoS Protection)
    risk_assessment: High for export operations on CUI datasets without per-user scoping. Medium for import operations with authorization checks. Escalates to Critical if export is available to unauthenticated or low-privilege users.
    false_positives: Export operations enforce row-level security identical to individual record access, all exported string values are sanitized against formula injection, and export size is bounded by a hard per-request limit.
    function: architecture
    stride: information-disclosure
    detection_logic: Test export endpoints by requesting exports with a low-privilege token and verifying the result set does not include records beyond the token's authorized scope. Submit import files containing formula injection payloads and verify they are sanitized in subsequent exports. Monitor export API calls for unusually large result sets relative to the requesting user's normal access pattern.
    risks_identified: {}

  GraphQL Introspection, Query Depth, and Authorization Gaps:
    id: graphql-security-gaps
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The asset exposes a GraphQL API with production introspection enabled, no query-depth limiting, and authorization checks that may not extend to individual fields or mutations.'
    impact: 'If this risk remains unmitigated, introspection reveals the full schema to accelerate further attacks, and a single deeply nested query can exhaust backend resources.'
    asvs: V4 - Access Control / V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
    action: Disable introspection in production, enforce query depth and complexity limits, and apply field-level authorization to all sensitive resolvers.
    mitigation: Disable GraphQL introspection in production environments — allow only in non-production. Implement query depth limiting (maximum 5-7 levels) and query complexity analysis with hard limits per request. Disable query batching or apply strict per-batch limits. Apply authorization checks at the resolver level for every sensitive field — do not rely solely on type-level access controls. Implement query cost analysis and rate limiting keyed to the authenticated user identity. Log all GraphQL operations with the full query for SOC analysis.
    references: OWASP GraphQL Cheat Sheet; NIST SP 800-53 SC-5 (DoS Protection); NIST SP 800-53 AC-3 (Access Enforcement)
    risk_assessment: High if introspection is enabled in production or if query depth/complexity limits are absent. Medium with introspection disabled and depth limits enforced but field-level authorization not audited.
    false_positives: Introspection is disabled in production, query depth and complexity limits are enforced, and all resolvers have been audited for field-level authorization coverage — documented with test evidence.
    function: architecture
    stride: information-disclosure
    detection_logic: Test for introspection by sending a standard __schema query and verifying it is rejected in production. Attempt deeply nested queries and verify they are rejected before execution. Test field-level authorization by requesting sensitive fields with a low-privilege token and verifying they return an authorization error rather than null or empty data.
    risks_identified: {}

  # --- 4.2 APPLICATION FEATURE RISKS ---
  Search Index Abuse and Data Exposure:
    id: search-index-abuse
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The application relies on a search index such as Elasticsearch or Solr for query functionality, and index-level authorization may not be strictly enforced.'
    impact: 'If this risk remains unmitigated, an attacker can craft queries that bypass application-layer access controls to scrape data or exhaust backend resources.'
    asvs: V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    action: Enforce strict query sanitization, pagination, and index-level RBAC.
    mitigation: Do not expose the raw search API to users. Abstract all search requests through an application-layer proxy that enforces rate-limiting, strict query timeouts (to prevent DoS), and filters the results based on the user's explicit permissions before returning data.
    references: NIST SP 800-53 SC-5 (Denial of Service Protection)
    risk_assessment: High risk if the raw search endpoint is exposed or if queries are unbounded.
    false_positives: The search index only contains public, non-sensitive data.
    function: architecture
    stride: information-disclosure
    detection_logic: Monitor database/index performance metrics for long-running or computationally expensive queries. Implement SAST to verify query sanitization.
    risks_identified: {}

  WebSocket Origin Validation and Authentication Gaps:
    id: websocket-security-gaps
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset uses persistent WebSocket connections without validating the Origin header on the upgrade handshake or revalidating session state on individual messages.'
    impact: 'If this risk remains unmitigated, a malicious page on another origin can hijack an authenticated WebSocket connection and read or send messages as the victim.'
    asvs: V13 - API and Web Service
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    action: Validate the Origin header on WebSocket upgrade requests, require explicit token-based authentication, and enforce wss:// only.
    mitigation: Validate the Origin header on all WebSocket upgrade requests against a strict allowlist of permitted origins — reject connections from unexpected origins. Require an explicit authentication token (not relying solely on cookies) passed in the initial handshake or first message, and validate it server-side. Periodically re-validate the session token for long-lived connections (e.g., every 15 minutes). Enforce wss:// (TLS) for all WebSocket connections — reject plain ws:// upgrade requests. Implement per-connection message rate limiting.
    references: NIST SP 800-53 SC-8 (Transmission Integrity); OWASP HTML5 Security Cheat Sheet; CWE-346 (Origin Validation Error)
    risk_assessment: Medium for read-only WebSocket endpoints. Escalates to High for endpoints processing write operations or streaming CUI to the client.
    false_positives: WebSocket upgrade requests validate the Origin header against a strict allowlist, require explicit token-based authentication independent of cookies, and all connections use wss://.
    function: architecture
    stride: spoofing
    detection_logic: Test WebSocket upgrade endpoints by sending requests with a modified Origin header from a different domain and verifying the connection is rejected. Verify that ws:// (non-TLS) upgrade requests are rejected. Test session expiry handling by establishing a WebSocket connection, invalidating the session server-side, and verifying subsequent messages are rejected.
    risks_identified: {}

  Background Job Parameter Injection and Authorization Bypass:
    id: background-job-security
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset processes background jobs whose parameters originate from earlier user input, without re-validating the user''s authorization at execution time.'
    impact: 'If this risk remains unmitigated, a job can execute with permissions the user no longer holds, or with parameters altered by anyone with access to the queue.'
    asvs: V4 - Access Control / V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: Re-validate user permissions at job execution time, not only at enqueue time, and restrict queue write access to the application service account only.
    mitigation: Re-validate the originating user's current permissions when a job is dequeued and executed — do not assume permissions granted at enqueue time are still valid. Store the minimum necessary parameters in job payloads — avoid storing CUI or credentials in job queue messages; reference them by ID and fetch at execution time with fresh authorization checks. Restrict queue write access to the application service account only — no direct user or external access to the job queue. Sanitize job parameters for injection before constructing any downstream queries or commands. Implement job payload signing to detect parameter tampering in transit.
    references: NIST SP 800-53 AC-3 (Access Enforcement); CWE-367 (TOCTOU Race Condition); NIST SP 800-53 AU-3 (Audit Record Content)
    risk_assessment: Medium for background jobs processing non-CUI data. Escalates to High for jobs performing bulk CUI operations, cross-tenant actions, or executing with elevated service account privileges.
    false_positives: All background jobs re-validate user permissions at execution time, job queues are accessible only to the application service account, and no CUI is stored in job payloads.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Test TOCTOU by enqueuing a job with a user token, revoking the user's permissions before the job executes, and verifying the job is rejected at execution time. Attempt to write directly to the job queue with a non-service-account credential and verify it is rejected. Monitor job execution logs for authorization failures that may indicate parameter injection attempts.
    risks_identified: {}

  Application Cache Poisoning and Sensitive Data Persistence:
    id: cache-poisoning-data-persistence
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The asset uses an application-level cache to serve responses, with cache keys that may not incorporate every parameter affecting the response, or a cache server reachable without authentication.'
    impact: 'If this risk remains unmitigated, one user''s cached response -- including sensitive data -- can be served to a different user, or a cache server can be read or written directly by anyone on the internal network.'
    asvs: V8 - Data Protection / V13 - API
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cache_Poisoning_Prevention_Cheat_Sheet.html
    action: Include all response-influencing parameters in cache keys, enforce authentication on cache servers, and apply CUI-appropriate TTLs.
    mitigation: Include all request parameters that influence the response (user ID, tenant ID, role, content-type) in cache key construction — never cache user-specific responses under user-agnostic keys. Require authentication (Redis AUTH with a strong password or Azure Cache for Redis with Entra ID auth) on all cache server connections. Apply network micro-segmentation to restrict cache server access to only the application pods that require it. Set TTLs on all cache entries containing user data — do not cache CUI without a TTL of 15 minutes or less. Never cache responses containing session tokens, credentials, or CUI at a shared cache layer — use client-side or private caches for sensitive per-user data.
    references: NIST SP 800-53 SC-28 (Protection of Information at Rest); NIST SP 800-53 AC-3 (Access Enforcement); OWASP Cache Poisoning
    risk_assessment: High for Redis/Memcached instances without authentication accessible to multiple application pods. Critical if session tokens or CUI are cached at the shared layer without proper key scoping.
    false_positives: Cache server requires authentication, is network-restricted to only authorized application pods, cache keys include all user- and tenant-scoping parameters, and no CUI or session data is stored at the shared cache layer.
    function: architecture
    stride: information-disclosure
    detection_logic: Scan internal network for unauthenticated Redis/Memcached ports (6379, 11211) accessible from application pods. Test cache key scoping by making the same request as two different users and verifying the responses are not interchangeable. Inspect cache TTL configuration for entries containing sensitive data and alert on TTL-less entries.
    risks_identified: {}

  Unauthorized Marketplace Plugin:
    id: unauthorized-marketplace-plugin
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'The application allows installation of third-party marketplace plugins that execute code directly within the application''s core process.'
    impact: 'If this risk remains unmitigated, a malicious or supply-chain-compromised plugin runs with the full privilege of the application, enabling complete compromise.'
    asvs: V10 - Malicious Code
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Third_Party_Javascript_Management_Cheat_Sheet.html
    action: Establish and enforce a cryptographically signed plugin allow-list; disable end-user self-service plugin installation entirely.
    mitigation: Maintain a centrally managed, AO-approved allow-list of permitted plugins verified by vendor code signing. Disable end-user plugin installation via platform policy. Require security review and SAST scan of all plugin code before admission to the allow-list. Enforce plugin execution in a sandboxed context with restricted API surface where the platform supports it. Audit installed plugins periodically against the allow-list and alert on unauthorized additions.
    references: DoD DevSecOps Reference Architecture; NIST SP 800-53 CM-7 (Least Functionality); NIST SP 800-53 SA-12 (Supply Chain Protection)
    risk_assessment: Critical if end-user or admin plugin installation is permitted without vetting. High if installation requires elevated privilege but no code review gate exists.
    false_positives: All installed plugins are internally developed, cryptographically signed by an internal PKI, and have passed mandatory security review — no third-party marketplace plugins are present.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Audit the application's installed plugin registry on a scheduled basis and alert on any plugin not present in the approved allow-list. Monitor application process network connections for unexpected outbound destinations that may indicate exfiltrating plugin behavior. Enable application-level plugin activity logging if the platform supports it.
    risks_identified: {}

  VDI Clipboard Data Exfiltration:
    id: vdi-clipboard-data-exfiltration
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This asset''s VDI session allows clipboard redirection between the remote session and the local endpoint, a channel most network-layer DLP controls do not inspect.'
    impact: 'If this risk remains unmitigated, a malicious insider can exfiltrate data through the clipboard without generating any network-layer alert.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    action: Disable clipboard redirection in AVD host pool RDP properties and enforce via Azure Policy.
    mitigation: Set the AVD host pool RDP property `redirectclipboard:i:0` to disable clipboard redirection. Enforce this configuration via Azure Policy to prevent drift. Restrict local resource redirection (drives, printers, USB) to GFE devices only using Conditional Access device compliance policies. Enable AVD connection diagnostics and forward to the SIEM for session activity monitoring.
    references: NIST SP 800-53 AC-19 (Access Control for Mobile Devices); NIST SP 800-53 AC-3 (Access Enforcement); DoD Zero Trust Reference Architecture
    risk_assessment: High for deployments permitting non-GFE or personally-owned device access to AVD sessions containing CUI. Medium if access is restricted to GFE devices with Defender for Endpoint enrolled.
    false_positives: Clipboard redirection is disabled at the host pool level and enforced by Azure Policy with no active exceptions on file.
    function: operations
    stride: information-disclosure
    detection_logic: Enable AVD host diagnostics and forward WVDConnections and WVDCheckpoints logs to the SIEM. Alert on sessions originating from devices not meeting Conditional Access compliance requirements. Monitor Microsoft Defender for Endpoint clipboard activity telemetry on enrolled GFE endpoints for anomalous copy volume from VDI process contexts.
    risks_identified: {}

  # Mishandling of Exceptional Conditions has been ported into the jessestarkey/threagile fork
  # as a native script rule (pkg/risks/scripts/mishandling-exceptional-conditions.yaml),
  # triggered off the frontend_related/backend_related technology attributes. Removed here
  # rather than left duplicated. See docs/risk-methodology.md for the full rationale.

  # --- 4.3 API AND SERVICE EXPOSURE ---
  Public API Abuse and Asymmetric DoS:
    id: public-api-abuse
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The application exposes an internet-facing API without rate limiting, pagination, or computational throttling.'
    impact: 'If this risk remains unmitigated, an attacker can degrade service, exhaust database resources, or drive up cloud consumption costs.'
    asvs: V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
    action: Enforce API Gateway rate limiting and pagination.
    mitigation: Implement strict rate limiting (e.g., token-bucket algorithm) at the Ingress or API Gateway layer. Require robust authentication and enforce hard limits on database query response sizes.
    references: NIST SP 800-53 SC-5 (Denial of Service Protection)
    risk_assessment: Medium risk of availability disruption during high-volume events.
    false_positives: API is shielded by an upstream enterprise API Gateway that successfully handles rate limits.
    function: operations
    stride: denial-of-service
    detection_logic: Monitor Azure App Gateway or Nginx Ingress metrics for anomalous high-frequency requests from individual IPs or bearer tokens.
    risks_identified: {}

  Improper API Inventory Management:
    id: improper-api-inventory-management
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The API surface includes undocumented, deprecated, or non-production (beta/staging/debug) endpoints or versions that remain reachable but fall outside the organization''s current inventory, documentation, and patch/monitoring scope.'
    impact: 'If this risk remains unmitigated, an old API version retains the vulnerabilities and weaker controls of whatever state it was frozen in, while receiving none of the monitoring, patching, or rate-limiting applied to the current version -- and because it isn''t inventoried, nobody notices it''s still reachable.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html
    action: Maintain a current, authoritative inventory of every API version and environment reachable from the internet, and formally decommission -- not just stop documenting -- any version no longer in active use.
    mitigation: 'Maintain a single authoritative API inventory (e.g. an API gateway''s own registered-route list, or a dedicated API catalog tool) as the source of truth for what''s actually deployed and reachable -- not a wiki page that drifts from reality. Require every API version to carry an explicit sunset/decommission date at the time a newer version ships, and enforce it: the old version returns 410 Gone or is removed from the ingress, not just left running unmonitored. Extend the same rate-limiting, WAF, and monitoring coverage applied to the current API version to every other reachable version. Periodically scan the organization''s own internet-facing IP ranges and DNS records for API endpoints not present in the authoritative inventory.'
    references: 'OWASP API Security Top 10: API9:2023 (Improper Inventory Management); NIST SP 800-53 CM-8 (System Component Inventory); NIST SP 800-53 CA-7 (Continuous Monitoring)'
    risk_assessment: Medium as a standalone structural gap; escalates sharply once any deprecated version is confirmed to carry a control the current version has since fixed (a removed rate limit, a patched vulnerability, weaker authentication), since that gap is now silently exploitable.
    false_positives: A single authoritative API inventory exists, every reachable version is present in it, and every deprecated version has been formally decommissioned (returns 410 Gone or is removed from the ingress) rather than merely undocumented.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Run an external attack-surface scan against the organization's own registered IP ranges/subdomains and diff discovered API endpoints/versions against the authoritative inventory; flag anything reachable but not inventoried. Audit the API gateway's routing configuration for registered routes with no corresponding entry in current API documentation.
    risks_identified: {}

  Unrestricted Access to Sensitive Business Flows:
    id: business-flow-abuse
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset implements a multi-step business process valuable enough to be worth automating or abusing at scale -- bulk account creation, ticket or inventory scalping, loan or claim application submission, bulk coupon redemption -- without a control distinguishing legitimate human usage from automated abuse of the flow itself. Distinct from Public API Abuse and Asymmetric DoS, which is about raw request volume/compute exhaustion regardless of what the request does; this is about the business value of the specific flow being automated at scale even at ordinary request rates.'
    impact: 'If this risk remains unmitigated, an adversary can automate a legitimate business process at a volume and speed no human user could achieve, extracting business value (inventory, credentials, approved applications) the flow was never designed to yield at scale.'
    asvs: V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    action: Identify which business flows on this asset are sensitive enough to warrant anti-automation controls, and apply bot detection, behavioral analysis, or step-up friction to each one specifically.
    mitigation: 'Identify this asset''s sensitive business flows (account creation, checkout, application submission, bulk redemption) separately from its general API surface, since generic rate limiting alone does not stop a low-and-slow distributed automation campaign. Apply flow-specific controls: CAPTCHA or proof-of-work at flow entry, device/behavioral fingerprinting to detect non-human interaction patterns, velocity limits scoped to the specific flow (not just the API as a whole), and step-up authentication for the highest-value flows. Monitor for completion-rate and timing anomalies characteristic of automation (near-instant form completion, identical inter-request timing) rather than relying on volume alone.'
    references: 'OWASP API Security Top 10: API6:2023 (Unrestricted Access to Sensitive Business Flows); OWASP Automated Threats to Web Applications (OAT); NIST SP 800-53 SC-5 (Denial of Service Protection)'
    risk_assessment: High for any publicly-reachable flow with direct business value (inventory, credential issuance, financial approval) and no anti-automation control distinct from generic rate limiting.
    false_positives: Every identified sensitive business flow on this asset has a flow-specific anti-automation control (CAPTCHA, behavioral fingerprinting, flow-scoped velocity limits, or step-up authentication) confirmed active, distinct from generic API rate limiting.
    function: architecture
    stride: denial-of-service
    detection_logic: Monitor flow completion timing and velocity per identity/session for patterns inconsistent with human interaction (near-instant completion, suspiciously uniform inter-request timing, abnormal completion-to-abandonment ratios). Run bot-detection/behavioral-fingerprinting tooling against the flow's entry point specifically.
    risks_identified: {}

  Unsafe Consumption of APIs:
    id: unsafe-api-consumption
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset sends requests to an external, third-party API and trusts the response content and schema without validation, treating "came from a legitimate external API" as equivalent to "safe to consume." Distinct from Server-Side Request Forgery, which is about this asset''s own request being hijacked to reach an unintended target; this is about the response from an intended, legitimate target being trusted without verification.'
    impact: 'If this risk remains unmitigated, a compromised, misconfigured, or simply buggy upstream API can inject unexpected data shapes, oversized payloads, or malicious content directly into this asset''s own processing logic, since no boundary exists between "external API response" and "trusted internal data."'
    asvs: V13 - API and Web Service
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: Apply the same schema validation, size limits, and content sanitization to every external API response this asset consumes that would be applied to direct user input.
    mitigation: 'Validate every external API response against an explicit, versioned schema before using its content -- never deserialize directly into internal objects without validation. Apply response size and depth limits to prevent resource exhaustion from an oversized or maliciously nested payload. Treat redirects and TLS certificates from the external API with the same scrutiny as the response body -- do not blindly follow redirects. Apply timeouts and circuit-breaking so a slow or unresponsive upstream API cannot cascade into this asset''s own availability. Sanitize any response content that will be rendered, logged, or passed to a downstream system exactly as if it were direct user input, since from this asset''s perspective it originates outside its own trust boundary.'
    references: 'OWASP API Security Top 10: API10:2023 (Unsafe Consumption of APIs); NIST SP 800-53 SI-10 (Information Input Validation)'
    risk_assessment: Medium as a standalone structural gap; escalates to High if the consumed API is a soft or unauthenticated third-party integration whose own security posture this organization cannot verify.
    false_positives: Every external API response is validated against an explicit schema with size/depth limits enforced, and response content is sanitized identically to direct user input before use.
    function: architecture
    stride: tampering
    detection_logic: Audit integration code for direct deserialization of external API responses without schema validation. Monitor for anomalous response sizes, depths, or processing latency from each external API dependency as a signal of upstream compromise or malfunction.
    risks_identified: {}

  Missing Web Application Firewall on Internet-Facing Asset:
    id: missing-waf-internet-facing
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'This internet-facing asset has no Web Application Firewall with a managed ruleset in its ingress path.'
    impact: 'If this risk remains unmitigated, the application relies entirely on its own application-layer controls, with no network-layer blocking of common injection and protocol-level attacks.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Virtual_Patching_Cheat_Sheet.html
    action: Deploy a WAF with a managed ruleset in Prevention mode in the ingress path for all internet-facing assets.
    mitigation: Deploy Azure Application Gateway WAF v2 or Azure Front Door WAF in Prevention mode with the OWASP 3.2 or Microsoft-managed DRS ruleset enabled. Configure WAF to log all detected requests to the SIEM. Enable bot protection rules. Tune custom rules to reduce false positives before enabling Prevention mode. Tag the ingress asset with ops:waf-enabled once WAF is confirmed in the ingress path and configured in Prevention mode.
    references: NIST SP 800-53 SC-7 (Boundary Protection); NIST SP 800-53 SI-3 (Malicious Code Protection); DoD Cloud Computing SRG; Azure WAF best practices
    risk_assessment: Medium as a standalone finding. Escalates to High when combined with other injection or input-validation findings on the same asset, as WAF absence removes the compensating control that would otherwise reduce their exploitability.
    false_positives: Asset is tagged ops:waf-enabled confirming a WAF with a managed ruleset in Prevention mode is deployed and confirmed in the ingress path.
    function: architecture
    stride: tampering
    detection_logic: Verify Azure Application Gateway or Front Door resource configuration via Azure Resource Graph query — check WAF policy assignment and mode. Alert via Azure Policy on any internet-facing Application Gateway without an associated WAF policy in Prevention mode.
    risks_identified: {}

  Dangling DNS Record and Subdomain Takeover:
    id: dangling-dns-subdomain-takeover
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'This internet-facing asset''s DNS record points at a cloud resource that is not reconciled against that resource''s actual live state.'
    impact: 'If this risk remains unmitigated, a deprovisioned resource''s name becomes reclaimable, letting an attacker stand up content or a certificate under the organization''s own trusted subdomain.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/DNS_Security_Cheat_Sheet.html
    action: Reconcile this asset's DNS records against live resource state on a recurring basis, and remove any DNS record for a resource that has been deprovisioned or renamed.
    mitigation: Maintain an inventory of every DNS record pointing at a cloud-managed resource, and reconcile it against actual live resource state on a recurring schedule (e.g., via cloud provider APIs) — not only at the time a resource is decommissioned, since that is exactly the step that gets missed. Remove the DNS record as part of the same change that deprovisions or renames the underlying resource, not as a separate follow-up task. Where the platform supports it, use a DNS record type that fails closed (resolves to nothing) rather than remaining claimable when its target is gone.
    references: NIST SP 800-53 SC-20 (Secure Name/Address Resolution Service); OWASP Testing Guide (Subdomain Takeover)
    risk_assessment: High for any internet-facing asset with DNS records that are not reconciled against live resource state on a recurring schedule.
    false_positives: The asset is tagged ops:dns-record-reconciled confirming its DNS records are reconciled against live resource state on a recurring schedule.
    function: operations
    stride: spoofing
    risks_identified: {}

