  # --- 7.1 DETECTION ---
  API Abuse and Enumeration Logging Gap:
    id: api-abuse-enumeration-logging-gap
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This public API endpoint does not log the request patterns that indicate enumeration or abuse, such as sequential probing of object IDs or repeated authorization failures from one caller.'
    impact: 'If this risk remains unmitigated, an attacker who paces requests below the rate limit produces no throttling event and remains invisible to the SOC.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: 'Log quota and rate-limit rejections, sequences of object-ID requests, and repeated authorization failures per caller on this endpoint. Then, forward them to the SIEM, correlated by caller identity.'
    mitigation: >-
      Emit a distinct log event for (1) every rate-limit or quota rejection, (2) every authorization
      failure, and (3) every request that touches an object-identifier parameter.

      Tag each event with the calling identity, namely the API key, the token subject, or the source
      IP where the request is unauthenticated.

      Forward these events to the SIEM, and build a correlation rule that flags a single caller
      crossing a threshold of authorization failures, or of sequential or randomized object-ID
      requests, within a rolling window. That threshold should sit well below the volume that would
      trigger a rate-limit block.
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 SI-4 (System Monitoring); OWASP API Security Top 10 (API4:2023 Unrestricted Resource Consumption, API1:2023 Broken Object Level Authorization)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any public API where object identifiers are part of the request path or body, and where no correlation rule exists for per-caller authorization failures or object enumeration.'
    false_positives: 'The endpoint logs rate-limit rejections, authorization failures, and object-ID request patterns with correlation by caller identity. Additionally, a SIEM detection rule is confirmed to be active against that log stream.'
    function: operations
    stride: repudiation
    cwe: 778
    risks_identified: {}

  Network Intrusion Detection and Traffic Anomaly Blind Spot:
    id: network-ids-blind-spot
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This internet-reachable asset has no network-based intrusion detection or traffic-anomaly monitoring that observes the traffic crossing its trust boundary.'
    impact: 'If this risk remains unmitigated, an attacker''s network-layer reconnaissance, exploitation attempts, and command-and-control traffic pass without generating any alert for the SOC to act on.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: 'Deploy network-based intrusion detection (NIDS or NDR), or equivalent traffic-anomaly monitoring, on this asset''s ingress and egress path, with alerts to the SOC on detection.'
    mitigation: >-
      Deploy a network intrusion detection system or a network detection and response (NDR)
      capability that observes all of this asset's ingress and egress traffic, whether inline or
      through traffic mirroring or a TAP.

      Tune it with signatures and behavioral baselines that suit the protocols this asset actually
      serves.

      Forward its alerts to the SIEM, and define an escalation path to the SOC.

      Tag the asset net:ids-monitored once coverage is confirmed and actively alerting.
    references: NIST SP 800-53 SI-4 (System Monitoring); NIST SP 800-53 AU-2 (Event Logging); DoD Zero Trust Reference Architecture (Network and Environment pillar)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any internet-facing or internet-reachable asset with no network-based detection observing its ingress and egress traffic.'
    false_positives: 'The asset is tagged net:ids-monitored, which confirms that network-based intrusion detection or NDR coverage is deployed and actively alerting on the traffic path to and from this asset.'
    function: operations
    stride: repudiation
    cwe: 778
    detection_logic: 'Confirm that the NIDS or NDR sensor placement covers every ingress and egress path of the asset, with no unmonitored network segment. Then, validate that alerting is live by running a benign test that triggers a signature, and confirm that an alert visible to the SOC fires.'
