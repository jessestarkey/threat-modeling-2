  Direct Prompt Injection and Jailbreak:
    id: ai-direct-prompt-injection
    baseline_likelihood: very-likely
    baseline_impact: medium
    finding_class: weakness-shown
    description: 'The asset accepts free-form natural language input from users and forwards it to an LLM. Thus, an adversary can use that input to override the system prompt, or to bypass safety guardrails through roleplay, encoding tricks, or adversarial prompt crafting.'
    impact: 'If this risk remains unmitigated, an adversary can extract secrets from the system prompt and bypass content guardrails. Furthermore, if the model has tool access, the adversary can coerce it into unauthorized actions.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: 'Deploy an inline prompt injection classifier, and enforce strict separation between the instruction and data channels.'
    mitigation: >-
      Screen every model call with a prompt injection classifier (such as LlamaGuard or Azure AI
      Content Safety Prompt Shields).

      Separate the instruction channel (the system prompt) from user content with delimited XML or
      JSON wrappers.

      Treat the system prompt as a secret, and never echo it in errors or outputs.

      Monitor for obfuscation (base64, Unicode homoglyphs, and token smuggling), and rate-limit each
      user to slow enumeration.

      Route requests through an AI guardrail that screens inputs and outputs and fails closed when
      it errors or times out, and test it against known bypass and obfuscation techniques.
    references: OWASP LLM Top 10 2026 LLM01 (Prompt Injection); MITRE ATLAS AML.T0051.000 (Direct Prompt Injection), AML.T0054 (LLM Jailbreak), AML.T0056 (Extract LLM System Prompt), AML.T0057 (LLM Data Leakage), AML.T0062 (Discover LLM Hallucinations), AML.T0065 (LLM Prompt Crafting), AML.T0068 (LLM Prompt Obfuscation), AML.T0069 (Discover LLM System Information); OWASP LLM01:2025, LLM02:2025
    risk_assessment: 'Likelihood starts at Very Likely, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical when the model has tool or plugin access. However, it is High for an information-only deployment that handles CUI.'
    false_positives: 'The asset passes user input to a fully isolated, stateless model with no tool access and no system prompt containing privileged data. Additionally, likelihood is one level lower when an ai-guardrails asset is on the request path. That is the case when (1) this asset calls the guardrail to screen traffic, or (2) the guardrail calls this asset and every other non-monitoring caller is also a guardrail.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 1427
    detection_logic: 'Monitor the inference logs for anomalous instruction patterns, such as role-switch phrases, ''ignore previous instructions'', or base64 payloads. Additionally, alert on model outputs that echo back apparent system prompt text, or that produce unusually long, structured responses to short inputs.'
    risks_identified: {}

  Indirect Prompt Injection and Goal Hijack:
    id: ai-indirect-prompt-injection
    baseline_likelihood: very-likely
    baseline_impact: medium
    finding_class: weakness-shown
    description: 'The asset retrieves or processes third-party or user-controlled content that an LLM later interprets. Thus, an adversary can embed instructions in that content to hijack the model''s behavior.'
    impact: 'If this risk remains unmitigated, an adversary can exfiltrate session data or user context, pivot to connected tool actions, or persist an attack across future sessions, all without the user''s awareness.'
    asvs: V5 - Validation, Sanitization and Encoding
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
