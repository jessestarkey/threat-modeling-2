  # ── TRANSFER INTERFACE COVERT CHANNEL (fires per CDS submitter/receiver) ─
  'CDS: Transfer Interface Covert Channel Exposure':
    id: cds-transfer-interface-covert-channel
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'A covert channel, whether timing-based, storage-based, or feedback-based, can carry information across a CDS transfer interface without passing through the CDS content filter or being authorized by the transfer policy.'
    impact: 'If this risk remains unmitigated, a low-bandwidth but persistent exfiltration or signaling path exists that content inspection alone cannot detect.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Implement transfer rate normalization on the CDS interface to degrade the bandwidth of timing channels. Additionally, restrict CDS response signals to a binary approved or rejected result, with no timing information that an observer could correlate.'
    mitigation: >-
      Implement transfer rate normalization on the CDS interface, using fixed inter-transfer
      intervals or jitter injection, to degrade the bandwidth of timing channels.

      Restrict CDS response signals to a binary approved or rejected result, with no timing
      information that an observer could correlate.

      Apply statistical analysis to transfer patterns to detect non-random timing that may indicate
      covert signaling.

      To close storage-channel avenues, normalize or strip approved metadata fields (such as
      filenames, timestamps, and page or record counts) that are not operationally required.
    references: NIST SP 800-53 SC-31 (Covert Channel Analysis); DoD CDS implementation guidance; UCDMO CDS baseline requirements
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for timing and storage channels on any CDS submitter or receiver interface. Though these channels have low bandwidth, they are persistent and hard to detect through content inspection alone.'
    false_positives: 'A covert channel analysis has been formally conducted and documented for this interface (NIST SP 800-53 SC-31). The analysis confirms that transfer rate normalization, binary-only CDS response signaling, and metadata normalization are implemented.'
    function: architecture
    stride: information-disclosure
    cwe: 514
    detection_logic: 'Monitor transfer inter-arrival times for non-random patterns with statistical tests (for example, chi-squared or entropy analysis) that may indicate use of a timing channel. Additionally, audit the approved metadata fields for unnecessary precision or variability that could carry a storage-channel payload.'
    risks_identified: {}

