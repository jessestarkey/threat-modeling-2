  Labeler and Human-in-the-Loop Overexposure:
    id: ai-labeler-overexposure
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'People outside the system''s normal access, such as data labelers, annotation contractors, red-teamers, or human-in-the-loop reviewers, see raw training data, prompts, or outputs from this asset. Often, they do so through third-party platforms, and without the clearance, need-to-know, or handling controls that the data requires.'
    impact: 'If this risk remains unmitigated, a workforce that the system''s owners do not control views, copies, or leaks sensitive records, CUI, or personal data outside the boundary the data was confined to.'
    asvs: V14 - Data Protection
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: 'Minimize and redact what labelers and reviewers see. Additionally, allow access only to personnel with the clearance and need-to-know that the data requires, and only on controlled platforms.'
    mitigation: >-
      Redact, mask, or synthesize sensitive fields before data reaches labelers or reviewers, and
      send only the records that each task needs.

      Use labeling and review platforms inside an environment accredited for the data, with no
      download, copy, or screenshot capability where possible.

      Restrict access to personnel with the required clearance and need-to-know, under agreements
      that bind them to the data's handling rules.

      Log all access, and audit it.
    references: OWASP GenAI Data Security 2026 DSGAI19 (Human-in-Loop and Labeler Overexposure); MITRE ATLAS AML.T0036 (Data from Information Repositories); MAESTRO layers 2, 6 and 7; CWE-285, CWE-359; NIST SP 800-53 PS-3, AC-21, SA-9 (mappings via the OWASP GenAI Security Crosswalk 2026-Q3, https://github.com/GenAI-Security-Project/crosswalk)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High when CUI or classified-adjacent data reaches labelers or reviewers without a matching clearance, or through a third-party platform outside the accredited environment.'
    false_positives: 'This finding fires on any asset tagged ai:human-labeling. Once redaction before labeling, an accredited platform, and clearance-matched access are confirmed, dispose of the asset''s finding through risk_tracking.'
