    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: Apply least-privilege access control, encryption at rest, and cryptographic integrity verification to all dataset storage.
    mitigation: Enforce strict RBAC on dataset store access — limit write access to authenticated pipeline service accounts only. Encrypt all datasets at rest with FIPS-validated cryptography. Maintain cryptographic hashes for all dataset files and verify on read. Log all read and write access to dataset artifacts. Apply DLP controls on data egress paths from the dataset store.
    references: MITRE ATLAS AML.T0019 (Publish Poisoned Datasets), AML.T0025 (Exfiltration via Cyber Means), AML.T0035 (AI Artifact Collection), AML.T0036 (Data from Information Repositories), AML.T0037 (Data from Local System), AML.T0059 (Erode Dataset Integrity); NIST AI RMF MAP 2.3, NIST SP 800-53 AU-9
    risk_assessment: High if the dataset store contains CUI training samples. Medium for de-identified or synthetic datasets.
