  'ATLAS: AI Agent Orchestration Hijack and Persistence':
    id: atlas-agent-orchestration-hijack
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'The AI agent orchestration layer that plans tasks and dispatches tool calls is the highest-value target in an agentic system, and can be poisoned, reconfigured, or hijacked to invoke tools or deploy rogue sub-agents.'
    impact: 'If this risk remains unmitigated, a compromised orchestrator gives an adversary persistent, automated access to every tool and data source the agent can reach.'
