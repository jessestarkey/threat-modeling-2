  Improper API Inventory Management:
    id: improper-api-inventory-management
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The API surface includes endpoints or versions that remain reachable but fall outside the organization''s current inventory, documentation, and patching and monitoring scope. Specifically, these are undocumented, deprecated, or non-production (beta, staging, or debug) endpoints or versions.'
    impact: 'If this risk remains unmitigated, an old API version keeps the vulnerabilities and weaker controls of the state it was frozen in. At the same time, it receives none of the monitoring, patching, or rate limiting applied to the current version. Furthermore, because it is not inventoried, nobody notices that it is still reachable.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html
    action: 'Maintain a current, authoritative inventory of every API version and environment that is reachable from the internet. Additionally, formally decommission any version that is no longer in active use, rather than only ceasing to document it.'
    mitigation: >-
      Use one authoritative inventory (such as the API gateway's registered routes or an API
      catalog) as the source of truth for what is deployed and reachable, rather than a wiki page
      that drifts.

      Give every API version an enforced sunset date when a newer version ships, after which it
      returns 410 Gone or is removed from the ingress.

      Extend the rate limiting, WAF, and monitoring of the current version to every other reachable
      version.

      Scan the organization's internet-facing IP ranges and DNS records periodically for API
      endpoints missing from the inventory.
    references: 'OWASP API Security Top 10: API9:2023 (Improper Inventory Management); NIST SP 800-53 CM-8 (System Component Inventory); NIST SP 800-53 CA-7 (Continuous Monitoring)'
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium as a standalone structural gap. However, it rises sharply once any deprecated version is confirmed to lack a control that the current version has since fixed (such as a removed rate limit, a patched vulnerability, or weaker authentication), since that gap is then silently exploitable.'
    false_positives: 'Three conditions hold: (1) a single, authoritative API inventory exists, (2) every reachable version appears in it, and (3) every deprecated version has been formally decommissioned (it returns 410 Gone or is removed from the ingress) rather than merely undocumented.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 1059
    detection_logic: 'Run an external attack-surface scan against the organization''s own registered IP ranges and subdomains, compare the discovered API endpoints and versions against the authoritative inventory, and flag anything that is reachable but not inventoried. Additionally, audit the API gateway''s routing configuration for registered routes that have no corresponding entry in the current API documentation.'
    risks_identified: {}

  Unrestricted Access to Sensitive Business Flows:
    id: business-flow-abuse
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This asset implements a multi-step business process that is valuable enough to automate or abuse at scale, such as bulk account creation, ticket or inventory scalping, loan or claim submission, or bulk coupon redemption. However, it has no control that distinguishes legitimate human use from automated abuse of the flow itself. This differs from Public API Abuse and Asymmetric DoS, which concerns raw request volume and compute exhaustion regardless of what the request does. Instead, this category concerns the business value of a specific flow being automated at scale, even at ordinary request rates.'
    impact: 'If this risk remains unmitigated, an adversary can automate a legitimate business process at a volume and speed that no human user could achieve. As a result, the adversary extracts business value (such as inventory, credentials, or approved applications) that the flow was never designed to yield at scale.'
    asvs: V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    action: 'Identify which business flows on this asset are sensitive enough to warrant anti-automation controls, and apply bot detection, behavioral analysis, or step-up friction to each of them specifically.'
    mitigation: >-
      Identify this asset's sensitive business flows (such as account creation, checkout,
      application submission, or bulk redemption) separately from its general API surface, since
      generic rate limiting alone does not stop a low-and-slow, distributed automation campaign.

      Apply flow-specific controls, namely (1) a CAPTCHA or proof-of-work at the flow's entry, (2)
      device and behavioral fingerprinting to detect non-human interaction patterns, (3) velocity
      limits scoped to the specific flow rather than to the API as a whole, and (4) step-up
      authentication for the highest-value flows.

      Monitor for the completion-rate and timing anomalies that characterize automation (for
      example, near-instant form completion or identical inter-request timing), rather than relying
      on volume alone.
    references: 'OWASP API Security Top 10: API6:2023 (Unrestricted Access to Sensitive Business Flows); OWASP Automated Threats to Web Applications (OAT); NIST SP 800-53 SC-5 (Denial of Service Protection)'
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the asset''s availability rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any publicly reachable flow that has direct business value (such as inventory, credential issuance, or financial approval) and no anti-automation control beyond generic rate limiting.'
    false_positives: 'Every identified sensitive business flow on this asset has a confirmed, active, flow-specific anti-automation control (a CAPTCHA, behavioral fingerprinting, flow-scoped velocity limits, or step-up authentication) that is distinct from generic API rate limiting.'
    function: architecture
    stride: denial-of-service
    cwe: 799
    detection_logic: 'Monitor each identity''s or session''s flow completion timing and velocity for patterns that are inconsistent with human interaction, such as near-instant completion, suspiciously uniform inter-request timing, or abnormal ratios of completion to abandonment. Additionally, run bot-detection or behavioral-fingerprinting tooling against the flow''s entry point specifically.'
    risks_identified: {}

  Unsafe Consumption of APIs:
    id: unsafe-api-consumption
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This asset sends requests to an external, third-party API and trusts the response''s content and schema without validation. In other words, it treats a response from a legitimate external API as safe to consume. This differs from Server-Side Request Forgery, where the asset''s own request is hijacked to reach an unintended target. Instead, this category concerns trusting the response from an intended, legitimate target without verifying it.'
    impact: 'If this risk remains unmitigated, a compromised, misconfigured, or simply buggy upstream API can inject unexpected data shapes, oversized payloads, or malicious content directly into this asset''s processing logic, since no boundary exists between external API responses and trusted internal data.'
    asvs: V13 - API and Web Service
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    action: 'Apply the same schema validation, size limits, and content sanitization to every external API response that this asset consumes as would be applied to direct user input.'
    mitigation: >-
      Validate every external API response against an explicit, versioned schema before use, and
      never deserialize it directly into internal objects.

      Limit response size and nesting depth to prevent resource exhaustion.

      Validate the API's TLS certificates, and do not follow its redirects blindly.

      Apply timeouts and circuit breaking, so that a slow upstream API cannot degrade this asset's
      availability.

      Sanitize any response content that is rendered, logged, or passed downstream exactly as direct
      user input, since it originates outside this asset's trust boundary.
    references: 'OWASP API Security Top 10: API10:2023 (Unsafe Consumption of APIs); NIST SP 800-53 SI-10 (Information Input Validation)'
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium as a standalone structural gap. However, it rises to High if the consumed API is a loosely governed or unauthenticated third-party integration whose security posture this organization cannot verify.'
    false_positives: 'Every external API response is validated against an explicit schema, with size and depth limits enforced. Additionally, response content is sanitized in the same way as direct user input before use.'
    function: architecture
    stride: tampering
    cwe: 20
    detection_logic: 'Audit the integration code for direct deserialization of external API responses without schema validation. Additionally, monitor each external API dependency for anomalous response sizes, depths, or processing latency, since these can signal an upstream compromise or malfunction.'
    risks_identified: {}

  Dangling DNS Record and Subdomain Takeover:
    id: dangling-dns-subdomain-takeover
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This internet-facing asset''s DNS record points at a cloud resource, but the record is not reconciled against that resource''s actual live state.'
    impact: 'If this risk remains unmitigated, the name of a deprovisioned resource becomes reclaimable. Thus, an attacker can stand up content or a certificate under the organization''s own trusted subdomain.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://learn.microsoft.com/en-us/azure/security/fundamentals/subdomain-takeover
    action: 'Reconcile this asset''s DNS records against the live state of their resources on a recurring basis, and remove any DNS record for a resource that has been deprovisioned or renamed.'
    mitigation: >-
      Maintain an inventory of every DNS record that points at a cloud-managed resource, and
      reconcile it against the actual live state of those resources on a recurring schedule (for
      example, through the cloud provider's APIs).

      Reconciling only when a resource is decommissioned is not enough, since that is exactly the
      step that gets missed.

      Remove the DNS record in the same change that deprovisions or renames the underlying resource,
      rather than in a separate follow-up task.

      Where the platform supports it, use a DNS record type that fails closed (resolves to nothing)
      rather than one that remains claimable when its target is gone.
    references: NIST SP 800-53 SC-20 (Secure Name/Address Resolution Service); OWASP Testing Guide (Subdomain Takeover)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any internet-facing asset whose DNS records are not reconciled against the live state of their resources on a recurring schedule.'
    false_positives: 'The asset is tagged ops:dns-record-reconciled, which confirms that its DNS records are reconciled against the live state of their resources on a recurring schedule.'
    function: operations
    stride: spoofing
    cwe: 672
    risks_identified: {}

