  WebSocket Origin Validation and Authentication Gaps:
    id: websocket-security-gaps
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The asset uses persistent WebSocket connections without validating the Origin header on the upgrade handshake, or without revalidating the session state on individual messages.'
    impact: 'If this risk remains unmitigated, a malicious page on another origin can hijack an authenticated WebSocket connection, and then read or send messages as the victim.'
    asvs: V13 - API and Web Service
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    action: 'Validate the Origin header on WebSocket upgrade requests, require explicit token-based authentication, and enforce wss:// only.'
    mitigation: >-
      Validate the Origin header on every WebSocket upgrade request against a strict allowlist of
      permitted origins, and reject connections from unexpected origins.

      Require an explicit authentication token, rather than relying solely on cookies, in the
      initial handshake or the first message, and validate that token on the server.

      For long-lived connections, re-validate the session token periodically (for example, every 15
      minutes).

      Enforce wss:// (TLS) for every WebSocket connection, and reject plain ws:// upgrade requests.

      Implement per-connection message rate limiting.
    references: NIST SP 800-53 SC-8 (Transmission Integrity); OWASP HTML5 Security Cheat Sheet; CWE-346 (Origin Validation Error)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium for a read-only WebSocket endpoint. However, it rises to High for an endpoint that processes write operations or streams CUI to the client.'
    false_positives: 'Three conditions hold: (1) WebSocket upgrade requests validate the Origin header against a strict allowlist, (2) they require explicit token-based authentication that is independent of cookies, and (3) every connection uses wss://.'
    function: architecture
    stride: spoofing
    cwe: 1385
    detection_logic: 'Test the WebSocket upgrade endpoints by sending requests with an Origin header from a different domain, and verify that the connection is rejected. Additionally, verify that ws:// (non-TLS) upgrade requests are rejected. Finally, test session expiry by establishing a WebSocket connection, invalidating the session on the server, and verifying that later messages are rejected.'
    risks_identified: {}

  Permissive CORS and Missing Browser Framing/Content Policy:
    id: permissive-cors-framing-policy
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This browser-facing asset has at least one of two gaps. Either (1) its CORS policy reflects arbitrary origins with credentials allowed, or (2) its rendered pages lack a restrictive Content-Security-Policy frame-ancestors (or X-Frame-Options) directive.'
    impact: 'If this risk remains unmitigated, a hostile site can read this asset''s authenticated API responses cross-origin. Alternatively, it can overlay the asset''s UI to capture clicks on privileged actions (clickjacking, or UI redressing) without the victim''s awareness.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html
    action: 'Restrict CORS to an explicit allow-list of trusted origins, with credentials disabled for cross-origin requests. Additionally, enforce a restrictive Content-Security-Policy frame-ancestors directive on every rendered page.'
    mitigation: >-
      Replace a reflected or wildcard Access-Control-Allow-Origin with an explicit allow-list of
      trusted origins, and never combine a wildcard origin with Access-Control-Allow-Credentials.

      Set a restrictive Content-Security-Policy frame-ancestors directive (or the legacy
      X-Frame-Options header) on every page that can perform a privileged action. That directive
      should permit framing only from origins that genuinely need to embed the page, and from none
      by default.

      Treat this as a response-header configuration that is distinct from CSRF protection.
      Specifically, CORS and framing policy govern cross-origin reads and UI embedding, whereas CSRF
      tokens separately address forged requests that look same-origin.
    references: OWASP Top 10:2025 A02; CWE-942; CWE-1021; MITRE CAPEC-103, CAPEC-111
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium for any browser-facing asset with a permissive CORS policy, or with no frame-ancestors or X-Frame-Options directive. However, it rises to High where a privileged, state-changing action is reachable from a framed page or a page readable cross-origin.'
    false_positives: 'The asset is tagged ops:cors-csp-hardened, which confirms two things: (1) CORS is restricted to an explicit allow-list, with credentials disabled for cross-origin requests, and (2) a restrictive frame-ancestors or X-Frame-Options directive is enforced on every rendered page.'
    function: architecture
    stride: spoofing
    cwe: 942
    detection_logic: 'Send a cross-origin request with an untrusted Origin header and credentials, and confirm that it is rejected rather than reflected. Then, load a privileged page inside an iframe from an untrusted origin, and confirm that the browser blocks rendering under the frame-ancestors or X-Frame-Options policy.'
    risks_identified: {}

  Background Job Parameter Injection and Authorization Bypass:
    id: background-job-security
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The asset processes background jobs whose parameters originate from earlier user input, without re-validating the user''s authorization when the job executes.'
    impact: 'If this risk remains unmitigated, a job can execute with permissions that the user no longer holds, or with parameters altered by anyone who has access to the queue.'
    asvs: V4 - Access Control / V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: 'Re-validate user permissions when a job executes, not only when it is enqueued, and restrict queue write access to the application service account only.'
    mitigation: >-
      Re-validate the originating user's current permissions when a job is dequeued and executed,
      rather than assuming that the permissions granted at enqueue time are still valid.

      Store only the minimum necessary parameters in job payloads. Specifically, avoid storing CUI
      or credentials in job queue messages, and instead reference them by ID and fetch them at
      execution time with fresh authorization checks.

      Restrict queue write access to the application service account only, with no direct user or
      external access to the job queue.

      Sanitize job parameters against injection before building any downstream queries or commands.

      Sign job payloads to detect parameter tampering in transit.
    references: NIST SP 800-53 AC-3 (Access Enforcement); CWE-367 (TOCTOU Race Condition); NIST SP 800-53 AU-3 (Audit Record Content)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium for a background job that processes non-CUI data. However, it rises to High for a job that performs bulk CUI operations or cross-tenant actions, or that executes with elevated service account privileges.'
    false_positives: 'Three conditions hold: (1) every background job re-validates user permissions at execution time, (2) the job queues are accessible only to the application service account, and (3) no CUI is stored in job payloads.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 863
    detection_logic: 'Test for a time-of-check to time-of-use (TOCTOU) gap by enqueuing a job with a user token, revoking that user''s permissions before the job executes, and verifying that the job is rejected at execution time. Additionally, attempt to write directly to the job queue with a credential other than the service account''s, and verify that the write is rejected. Finally, monitor the job execution logs for authorization failures that may indicate parameter injection attempts.'
