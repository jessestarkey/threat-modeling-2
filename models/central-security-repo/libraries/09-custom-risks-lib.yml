  Webhook Signature Verification Bypass:
    id: webhook-signature-bypass
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'The asset receives inbound webhook callbacks and acts on their payloads without verifying a cryptographic signature on the request.'
    impact: 'If this risk remains unmitigated, anyone who knows the endpoint URL can send a fabricated payload and trigger business logic with attacker-controlled data.'
    asvs: V13 - API and Web Service
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
    action: 'Implement HMAC-SHA256 signature verification on every inbound webhook payload before processing it.'
    mitigation: >-
      Verify the HMAC-SHA256 signature (or the provider-specified signature) on every inbound
      webhook request before performing any business logic.

      Use a constant-time comparison function, so that the signature check cannot serve as a timing
      oracle.

      Reject requests with missing, malformed, or expired timestamps to prevent replay.

      As a defense-in-depth layer, validate that the webhook's source IP is within the provider's
      documented egress range.

      Log every signature verification failure, and alert on elevated failure rates.
    references: NIST SP 800-53 SC-8 (Transmission Confidentiality and Integrity); NIST SP 800-53 SI-10 (Information Input Validation)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a webhook that triggers write operations, financial transactions, or account management actions. However, it is Medium for a read-only notification webhook, where the worst case is a spurious notification.'
    false_positives: 'The webhook endpoint is protected by mutual TLS client certificate authentication, with the sending system''s certificate pinned. In this case, no HMAC signature is needed, because the transport layer provides an equivalent integrity assurance.'
    function: architecture
    stride: spoofing
    cwe: 347
    detection_logic: 'Test the webhook endpoints with three kinds of requests, namely (1) a request with no signature header, (2) a request with an invalid signature, and (3) a replayed valid signature outside the allowed timestamp window. All three should be rejected with a 401 or 403. Additionally, monitor the webhook ingestion logs for signature verification failures, and alert on spikes in the failure rate.'
