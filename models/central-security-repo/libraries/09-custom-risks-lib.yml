  # --- 10.1 POLICY EXCEPTIONS ---
  'Policy Exception: Cleartext Internal Transit':
    id: policy-exception-cleartext-internal
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This component transmits data in plaintext over the internal network.'
    impact: 'If this risk remains unmitigated, an attacker who breaches the internal network can sniff sensitive data or credentials in transit.'
    asvs: V9 - Communications
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
    action: Ensure formal AO risk acceptance is on file.
    mitigation: Compensating controls must include strict network micro-segmentation and IPsec/WireGuard at the host transport layer if possible.
    references: DoD Zero Trust Reference Architecture
    risk_assessment: Medium risk of internal data interception.
    false_positives: None. This is an explicit policy waiver.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  EOL Component in ATO Boundary:
    id: eol-component-ato-boundary
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'A software component within the ATO boundary has reached end-of-life and no longer receives security patches from its vendor.'
    impact: 'If this risk remains unmitigated, the component accumulates unpatched CVEs indefinitely, and any newly discovered vulnerability in it is effectively a zero-day for as long as it remains in the boundary.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: Ensure formal AO risk acceptance is on file and a remediation timeline is documented in the POA&M.
    mitigation: 'Establish an immediate upgrade path to a supported version. If upgrade is not immediately feasible, implement compensating controls: network-isolate the EOL component to the minimum required connectivity, deploy WAF/RASP protections in front of it, increase monitoring fidelity for exploitation indicators, and document the risk acceptance with a hard deadline in the POA&M. Remove the component from the ATO boundary via architecture change if upgrade is infeasible within the POA&M window.'
    references: DISA Application Security and Development STIG; NIST SP 800-53 SI-2 (Flaw Remediation); DoD RMF Process Guide
    risk_assessment: High. Severity escalates to Critical if the EOL component has active CVEs with public exploits and is internet-accessible or handles CUI directly.
    false_positives: None. This is an explicit policy exception. AO risk acceptance must be on file.
    function: operations
    stride: elevation-of-privilege
    detection_logic: Integrate SCA tooling (e.g., OWASP Dependency-Check, Grype, Snyk) into the CI/CD pipeline with EOL version database checks. Subscribe to vendor EOL announcement feeds and NVD CVE notifications for all components in the SBOM. Query Azure Advisor and Microsoft Defender for Cloud for EOL runtime and OS version alerts.
    risks_identified: {}

