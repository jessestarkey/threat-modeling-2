  Over-Privileged Workload Identity and Cloud Control-Plane Pivot:
    id: overprivileged-workload-identity
    baseline_likelihood: likely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'This asset''s managed identity, service principal, or Kubernetes service account is over-privileged in one of two ways. First, it may hold role assignments wider than its function needs, such as subscription- or resource-group-scoped Contributor or Owner, or wildcard data-plane roles. Second, its credential or token may be reachable through the cloud instance metadata service, or through an automounted service-account token, from code that an attacker could influence.'
    impact: 'If this risk remains unmitigated, compromising the workload turns directly into cloud control-plane access. Specifically, the attacker can create credentials, assign roles, or read every vault and store that the identity''s role assignment can reach, whether or not the application itself was the actual target.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    action: 'Scope this workload identity''s role assignments to only the specific resources and actions its function requires. Then, confirm that its credential or token endpoint is not reachable from code outside this asset''s own trust boundary.'
    mitigation: >-
      Replace broad subscription- or resource-group-scoped role assignments (Contributor, Owner, or
      wildcard data-plane roles) with custom roles scoped to the exact resources and actions that
      this workload actually needs.

      Where the platform supports it, prefer workload-identity federation over a long-lived
      service-principal secret.

      Restrict access to the cloud instance metadata service (IMDS), or to the automounted
      Kubernetes service-account token, to the specific code paths that need it. It should not be
      reachable from general request-handling code (for example, through an unpatched SSRF path) or
      from every pod in a namespace by default.

      Review the identity's actual role usage against its assignments periodically, and remove
      unused grants.
    references: NIST SP 800-53 AC-6 (Least Privilege); MITRE ATT&CK T1078.004, T1098.001, T1098.003, T1552.005, T1548.005
    risk_assessment: 'Likelihood starts at Likely, and impact starts at High. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any workload identity that holds subscription-wide, resource-group-wide, or wildcard data-plane roles with no documented least-privilege review. The same applies to one whose credential endpoint is reachable from code outside its own trust boundary.'
    false_positives: 'The asset is tagged mgmt:workload-identity-least-privilege, which confirms two things: (1) its role assignments are scoped to only the specific resources and actions its function requires, with no subscription-wide, resource-group-wide, or wildcard data-plane roles, and (2) its credential or token endpoint is not reachable from code outside this asset''s own trust boundary.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 250
    detection_logic: 'Audit the identity''s actual role assignments against its documented function, and flag any subscription-scoped, resource-group-scoped, or wildcard data-plane role. Additionally, review the network and code paths that could reach the instance metadata service, or an automounted service-account token, from outside this asset''s own trust boundary.'
