    references: OWASP LLM Top 10 2026 LLM01 (Prompt Injection); OWASP Top 10 for Agentic Applications 2026 ASI01 (Agent Goal Hijack); OWASP Agentic Skills Top 10 2026 AST05 (Untrusted External Instructions); OWASP GenAI Data Security 2026 DSGAI09 (Multimodal Cross-Channel Leakage, for cross-modal payloads); MITRE ATLAS AML.T0051.001 (Indirect Prompt Injection), AML.T0051.002 (Triggered), AML.T0066 (Retrieval Content Crafting), AML.T0067 (Trusted Output Components Manipulation), AML.T0073 (Impersonation), AML.T0074 (Masquerading), AML.T0093 (Prompt Infiltration via Public-Facing App), AML.T0094 (Delay Execution); OWASP LLM01:2025
    risk_assessment: 'Likelihood starts at Very Likely, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical in any agentic or RAG deployment that processes untrusted third-party content and has tool-use or write capabilities.'
    false_positives: 'External content always passes through a fully controlled sanitization pipeline, and the LLM has neither tool access nor the ability to render active content. On an agent orchestrator, the finding fires only when the agent reads content, namely through an outgoing link to a vector store, RAG pipeline, feature store, tool server, multi-agent gateway, or anything external or out of scope. Additionally, likelihood is one level lower when an ai-guardrails asset is on the request path. That is the case when (1) this asset calls the guardrail to screen traffic, or (2) the guardrail calls this asset and every other non-monitoring caller is also a guardrail.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 1427
    detection_logic: 'Trace which external documents entered each LLM context window. Additionally, flag tool calls that the human user''s turn did not explicitly initiate. Finally, alert on model outputs that contain base64 strings, external URLs outside an approved allowlist, or markdown image tags.'
