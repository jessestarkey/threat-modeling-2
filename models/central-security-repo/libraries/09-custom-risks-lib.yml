  On-Device Model Extraction Resistance Gap:
    id: on-device-model-extraction-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This model is fielded onto edge or embedded hardware an adversary could gain physical custody of, but runs outside a trusted execution environment or secure enclave.'
    impact: 'If this risk remains unmitigated, physical custody of the device yields the full model to an adversary with no detection or revocation possible afterward.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Mobile_Application_Security_Cheat_Sheet.html
    action: Deploy models to edge/embedded devices only within a Trusted Execution Environment or secure enclave, encrypted at rest, with debug/side-channel access disabled on production hardware.
    mitigation: Host model weights within a hardware-backed TEE or secure enclave on the device (e.g., ARM TrustZone, a dedicated security chip) rather than in general-purpose storage or memory reachable by the device's main OS. Encrypt model artifacts at rest on the device, with the decryption key never persisted outside the enclave. Disable JTAG/debug interfaces and other side-channel access paths on production hardware builds.
    references: NIST AI RMF (MANAGE 2.3); MAESTRO L1 (Foundation Models) / L6 (Security and Compliance); NIST SP 800-53 SC-28 (Protection of Information at Rest)
    risk_assessment: High for any model deployed to edge/embedded hardware an adversary could physically obtain, where the model does not run within a TEE/secure enclave.
    false_positives: The asset is tagged ai:secure-enclave-protected confirming the model runs and is encrypted within a hardware-backed TEE/secure enclave on the device, with debug interfaces disabled.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Offline or Air-Gapped Model Package Integrity Gap:
    id: air-gapped-model-package-integrity-gap
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'A model destined for a disconnected enclave is not verified as a single signed package at every load, only at the point of initial transfer.'
    impact: 'If this risk remains unmitigated, a substituted or tampered model artifact sitting inside the enclave has no external signal to catch it and no way to be detected short of per-load cryptographic verification.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: Assemble the model (weights, tokenizer, config, manifest) into a single signed package verified against a pinned key on every load inside the disconnected enclave, not only at transfer time.
    mitigation: Package the complete model artifact set (weights, tokenizer, configuration, and a manifest listing hashes of each component) and sign the package with a key held outside the disconnected enclave's own administrative control. Verify the signature at every model load inside the enclave — not only once when the package first arrives — so a substitution introduced after transfer is still caught. Maintain the signing key's custody chain outside the enclave to prevent an enclave insider from re-signing a tampered package.
    references: NIST SP 800-53 SR-4 (Provenance); NIST SP 800-218 (Secure Software Development Framework); NIST AI RMF (MANAGE 2.3)
    risk_assessment: Critical for any model delivered into a disconnected/air-gapped enclave without per-load signature verification against an externally-held key.
    false_positives: The asset is tagged ai:model-package-signed confirming the model package is signed with an externally-held key and verified at every load, not only at transfer time.
    function: architecture
    stride: tampering
    risks_identified: {}

