# ==============================================================================
# CUSTOM IL5 RISK DEFINITIONS: 09-custom-risks-lib.yml
# ==============================================================================
# This library holds every custom risk category that inject_risks.py can add
# to a model, triggered by the tags documented in 03-tags-lib.yml.
#
# USAGE:
#   inject_risks.py loads this file, checks each technical asset's tags in its
#   own code, and adds a copy of each matching entry to the model's
#   custom_risk_categories, with one risks_identified entry per matching
#   asset. Each entry must include an empty `risks_identified: {}` map, since
#   the loader fails at startup without it.
#
# ADDING A NEW RISK:
#   1. Add an entry with id, baseline_likelihood, baseline_impact,
#      finding_class (weakness-shown or control-not-evidenced), description,
#      impact, asvs, cheat_sheet, action, mitigation, references,
#      risk_assessment (opening with the calibrated scoring sentence, see
#      test_calibration.py), false_positives, function, stride, cwe,
#      detection_logic, and risks_identified: {}.
#   2. Document any new trigger tag in 03-tags-lib.yml.
#   3. Add an `if 'tag:name' in tags: inject("<entry key>", "<short title>")`
#      line to inject_risks.py's tag loop. inject()'s optional third argument
#      is a one-level likelihood step, not a severity.
#   4. Add the category to the calibration table in docs/risk-methodology.md
#      and to test_calibration.py's APPROVED and APPROVED_DIMENSION maps.
#
# STRUCTURE:
#   Entries are grouped into sections (`# --- D.S NAME ---`) under ten
#   `# FOCUS AREA D: NAME` banners. The numbering is for navigation, since
#   inject_risks.py looks entries up by key, although generate_report.py reads
#   the banners to group the report by focus area.
#
#   The focus areas follow SABER's chapters, in order: Identity, Device and
#   Infrastructure, Network and Environment, Application, AI, Data, Detection,
#   Response, Recovery, and Governance. SABER's Compliance chapter and most of
#   its Governance chapter are organization-level rather than per asset, so
#   they are left out, and Governance here covers only risk acceptance and
#   policy exceptions. Sections sit where SABER nests their content: the CDS
#   under Network and Environment (NE-2.10), software supply chain under
#   Application, and secrets and cryptography under Data (DA-2, DA-3).
#     1  Identity ........................... 1.1-1.2
#     2  Device and Infrastructure ........... 2.1-2.2
#     3  Network and Environment ............. 3.1-3.2 (3.1 self-managed segmentation, 3.2 CDS)
#     4  Application .......................... 4.1-4.5 (4.5 software supply chain and CI/CD)
#     5  Artificial Intelligence .............. 5.1-5.3
#     6  Data ................................ 6.1-6.2 (6.1 governance and lifecycle, 6.2 secrets and crypto)
#     7  Detection ............................ 7.1
#     8  Response ............................. 8.1
#     9  Recovery ............................. 9.1
#     10 Governance ........................... 10.1 (risk acceptance and policy exceptions only)
#
#   Sections 1.1, 1.2, 2.2, and 3.1 each hold a few entries triggered by an
#   mgmt:self-managed-* tag. For an app in the enterprise landing zone, those
#   identity, PAM, hardware, and network controls are inherited, while for an
#   app that runs that infrastructure itself they are real per-asset gaps (see
#   03-tags-lib.yml, "SELF-MANAGED INFRASTRUCTURE TAGS").
# ==============================================================================

custom_risk_definitions:
  # #############################################################################
  # FOCUS AREA 1: IDENTITY
  # #############################################################################

  # --- 1.1 AUTHENTICATION AND IDENTITY ---
  'Policy Exception: Local Authentication':
    id: policy-exception-local-auth
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: weakness-shown
    description: 'This application maintains a local credential store, such as a vendor break-glass account, that bypasses the enterprise identity provider. As a result, conditional access, central deprovisioning, and session controls do not apply to it. Missing MFA on its login path, however, is a separate finding raised by the built-in missing-authentication-second-factor rule.'
    impact: 'If this risk remains unmitigated, the local store becomes a backdoor that an attacker can brute-force or credential-stuff outside enterprise conditional access. Additionally, an account removed from the identity provider can still sign in here.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    action: 'Ensure that a formal AO risk acceptance is on file.'
    mitigation: >-
      The local account must have a complex, vault-generated password that is rotated every 30 days.

      IP restrictions must limit access to the login endpoint.
    references: DoD Identity, Credential, and Access Management (ICAM)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is a High risk of unauthorized access.'
    false_positives: 'None, since this is an explicit policy waiver.'
    function: architecture
    stride: spoofing
    cwe: 308
    risks_identified: {}

  Insecure Password Reset and Credential Recovery:
    id: insecure-password-reset
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The asset''s self-service password reset flow has at least one of three weaknesses: (1) predictable or reusable reset tokens, (2) excessive token lifetimes, or (3) responses that reveal whether an email address is registered.'
    impact: 'If this risk remains unmitigated, an attacker can take over accounts without knowing the current password. Furthermore, an attacker can enumerate valid accounts to target with further attacks.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
    action: 'Use cryptographically random tokens with a short expiry, and enforce single-use invalidation. Additionally, derive reset URLs from a configured base URL only.'
    mitigation: >-
      Generate password reset tokens with a cryptographically secure random number generator that
      provides at least 128 bits of entropy.

      Invalidate each token immediately on first use, and set its expiry to 15 minutes or less.

      To prevent enumeration, return identical responses for registered and unregistered addresses,
      and keep the timing consistent by running a dummy hash operation for unregistered addresses.

      Derive the reset link's base URL from a hardcoded configuration value, never from the HTTP
      Host or X-Forwarded-Host header.

      Require re-authentication through MFA after a password reset before the user can access
      sensitive functionality.
    references: NIST SP 800-63B (Digital Identity Guidelines); OWASP Forgot Password Cheat Sheet; NIST SP 800-53 IA-5 (Authenticator Management)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a custom-implemented reset flow. However, it is Medium for a reset flow built on a maintained authentication framework, where the library handles token generation and invalidation.'
    false_positives: 'Credential recovery is fully delegated to the enterprise IdP (for example, Entra ID self-service password reset), and the application neither issues nor validates its own reset tokens.'
    function: architecture
    stride: spoofing
    cwe: 640
    detection_logic: 'Request several password resets for the same account in rapid succession, and verify that only the most recently issued token is valid. Next, verify that a used token cannot be reused. To test for host header injection, send a reset request with a modified Host header and verify that the reset email contains the configured base URL rather than the injected host. Finally, test for account enumeration by comparing the response time and body for registered and unregistered addresses.'
    risks_identified: {}

  OAuth 2.0 and OIDC Implementation Vulnerabilities:
    id: oauth-oidc-vulnerabilities
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The asset issues or validates OAuth 2.0/OIDC tokens with implementation weaknesses, such as unvalidated redirect URIs, a missing or unchecked state parameter, or improper handling of the JWT signature algorithm.'
    impact: 'If this risk remains unmitigated, an attacker can intercept authorization codes, replay tokens, or forge arbitrary tokens to gain authenticated access as another user.'
    asvs: V3 - Session Management / V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/OAuth2_Cheat_Sheet.html
    action: 'Audit four areas of the authorization flow, namely redirect_uri validation on the callback, state parameter enforcement, token audience validation, and JWT algorithm handling.'
    mitigation: >-
      Enforce exact-match redirect_uri validation, with no wildcards and no partial path matches.

      Require and validate the state parameter on all authorization responses to prevent CSRF.

      Use the authorization code flow with PKCE for all clients, and never use the implicit flow.

      On every token verification, validate the JWT audience (aud) claim against the expected
      service identifier.

      Specify the expected algorithm explicitly in JWT validation, and never accept alg:none or
      derive the algorithm from the token header.

      Use short-lived access tokens (15 minutes or less) with refresh token rotation.
    references: OWASP OAuth 2.0 Security Best Current Practice (draft-ietf-oauth-security-topics); NIST SP 800-63C (Federation and Assertions); DoD ICAM Reference Design
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for an asset acting as an authorization server or as custom token validation middleware. However, it is Medium for an asset that is a pure OIDC relying party consuming tokens from a well-configured upstream IdP.'
    false_positives: 'The asset delegates all OAuth/OIDC handling to a hardened upstream IdP (for example, Entra ID or Okta) and has no custom token issuance or validation logic. In other words, the asset only consumes identity assertions that have already been validated.'
    function: architecture
    stride: spoofing
    cwe: 287
    detection_logic: 'Run OAuth-specific DAST tests (for example, the OWASP ZAP OAuth scanner or the Burp Suite OAuth extension) against all authorization endpoints. Then, verify redirect_uri enforcement by attempting to register and use variant URIs. Additionally, test JWT validation by submitting tokens with alg:none and with algorithm-confused signatures. Finally, monitor the authorization server''s logs for redirect_uri mismatch attempts.'
    risks_identified: {}

  SAML Assertion Vulnerabilities:
    id: saml-assertion-vulnerabilities
    baseline_likelihood: unlikely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'The asset processes SAML assertions from an external identity provider with XML-parsing weaknesses. These weaknesses can allow a submitted assertion to be altered, replayed, or misattributed to a different user.'
    impact: 'If this risk remains unmitigated, an attacker can forge or replay a SAML assertion to authenticate as any user, including administrators, without valid credentials.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/SAML_Security_Cheat_Sheet.html
    action: 'Use a hardened SAML library with XML Signature Wrapping (XSW) protection, validate every assertion constraint, and disable XXE in the XML parser.'
    mitigation: >-
      Use a well-maintained SAML library that provides XSW protection (for example, python3-saml,
      OneLogin SAML, or Spring Security SAML with the XSW patches applied).

      Disable XXE and DTD processing in the XML parser used for SAML documents.

      Validate every assertion constraint, namely the NotBefore and NotOnOrAfter timestamps, the
      Recipient URL, the AudienceRestriction, and InResponseTo (for replay prevention).

      Before using the NameID value as a username, sanitize it by stripping XML comments and
      normalizing whitespace.

      Log every SAML assertion processing event, including validation failures.
    references: OWASP SAML Security Cheat Sheet; NIST SP 800-63C (Federation); DoD ICAM Reference Design; CVE-2017-11427 (SAML comment injection)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at High. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a custom or lightly maintained SAML SP implementation. However, it is Medium for a well-maintained SAML library implementation where XSW protection and constraint validation have been verified.'
    false_positives: 'SAML processing is fully delegated to a hardened platform IdP integration (for example, an Azure AD SAML app with no custom assertion processing code), so the application does not parse or validate SAML XML directly.'
    function: architecture
    stride: spoofing
    cwe: 347
    detection_logic: 'Test for XSW vulnerabilities with SAMLRaider (a Burp Suite extension) against every SAML assertion endpoint. Additionally, test for XXE by injecting a DOCTYPE declaration into a SAML request and monitoring for outbound DNS or HTTP requests. Finally, verify that the asset rejects assertions with an invalid Recipient, an expired timestamp, or a mismatched AudienceRestriction.'
    risks_identified: {}

  Missing Token Binding on Session and Refresh Tokens:
    id: missing-token-binding
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This asset issues session or refresh tokens as bearer artifacts, which means whoever holds a token can use it. In other words, the asset does not bind its tokens to the client that obtained them through proof-of-possession.'
    impact: 'If this risk remains unmitigated, a captured token can be replayed from any host with no further credential. Thus, it defeats even phishing-resistant authentication performed before the token was stolen.'
    asvs: V3 - Session Management
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
    action: 'Bind session and refresh tokens to the issuing client with DPoP or mutual TLS, so that a captured token cannot be replayed from a different host.'
    mitigation: >-
      Implement OAuth 2.0 Demonstrating Proof of Possession (DPoP) or mutual TLS client certificate
      binding for session and refresh tokens. This allows the resource server to verify that the
      client presenting a token is the same client it was issued to.

      Reject any syntactically valid token that is presented without the matching proof of
      possession.

      Where the identity provider does not yet support proof-of-possession tokens, document this as
      a known gap rather than leaving bearer-token safety as an unstated assumption.
    references: RFC 9449 (OAuth 2.0 Demonstrating Proof of Possession); NIST SP 800-63B (Digital Identity Guidelines, Authenticator Assurance Level requirements); NIST SP 800-53 SC-23 (Session Authenticity)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any asset issuing bearer session or refresh tokens with no proof-of-possession binding. This applies particularly where the asset also enforces phishing-resistant primary authentication, which a bearer-token replay would otherwise bypass.'
    false_positives: 'The asset is tagged ops:token-binding-enforced, which confirms that its session and refresh tokens are bound to the issuing client through DPoP or mutual TLS.'
    function: architecture
    stride: spoofing
    cwe: 294
    risks_identified: {}

  OAuth Illicit Consent Grant via Malicious Application Registration:
    id: oauth-illicit-consent-grant
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This asset''s OAuth authorization server allows a user to grant a third-party application delegated API access without an admin-consent gate or a scope review.'
    impact: 'If this risk remains unmitigated, an attacker can register a malicious application and phish a user into granting it persistent API access. Furthermore, that access survives a password reset.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/OAuth2_Cheat_Sheet.html
    action: 'Require administrator consent for any application that requests high-privilege delegated scopes. Additionally, block user self-service consent grants to unverified or newly registered applications.'
    mitigation: >-
      Configure the authorization server or IdP to require administrator review and consent for
      applications that request high-privilege scopes (for example, mail read and send, files, or
      directory data), rather than letting individual users consent for themselves.

      Where the platform supports it, restrict user self-service consent to a curated allow-list of
      verified publishers.

      Monitor and alert on new OAuth application registrations and consent grants, particularly
      broad-scope grants to newly registered or unverified applications.

      Review consent grants periodically and revoke those for applications no longer in active use.
    references: NIST SP 800-53 AC-3 (Access Enforcement); MITRE ATT&CK T1550.001 (Application Access Token); Microsoft/industry guidance on illicit consent grant attacks
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any authorization server or IdP that permits unrestricted user self-service consent to high-privilege scopes with no administrator review.'
    false_positives: 'The asset is tagged ops:oauth-consent-governed, which confirms two things: (1) high-privilege scope requests require administrator consent, and (2) user self-service consent is restricted to a verified-publisher allow-list.'
    function: architecture
    stride: spoofing
    cwe: 285
    risks_identified: {}

  Self-Managed Directory Tier-0 Infrastructure Compromise:
    id: self-managed-directory-tier0-compromise
    baseline_likelihood: possible
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'This asset relies on a self-managed directory service that does not inherit the enterprise identity team''s Tier-0 hardening. As a result, it is exposed to attacks such as abuse of unconstrained delegation, AdminSDHolder tampering, or use of an unrotated krbtgt credential.'
    impact: 'If this risk remains unmitigated, compromise of the directory''s Tier-0 infrastructure lets an attacker forge authentication for any identity that the directory manages. Additionally, that persistence survives ordinary password resets.'
    asvs: V2 - Authentication
    cheat_sheet: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
    action: 'Audit this directory for unconstrained delegation, AdminSDHolder tampering, missing SID filtering on trusts, and unsigned LDAP. Then, rotate the krbtgt credential material using the required two-pass procedure.'
    mitigation: >-
      Replace unconstrained Kerberos delegation with constrained or resource-based constrained
      delegation.

      Audit and alert on changes to the AdminSDHolder ACL, and enable SID filtering on every
      cross-forest and cross-domain trust that this directory participates in.

      Require LDAP signing and channel binding, and reject unsigned binds.

      Rotate the krbtgt account password twice in sequence on a recurring schedule, and immediately
      after any suspected compromise. A single rotation is insufficient, because the account retains
      two valid password versions.
    references: NIST SP 800-53 IA-5 (Authenticator Management); NIST SP 800-53 AC-6 (Least Privilege); MITRE ATT&CK T1558 (Steal or Forge Kerberos Tickets)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at High. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any self-managed directory instance where these controls have not been audited, since this framework''s enterprise identity Tier-0 hardening does not extend to infrastructure that the app team operates itself.'
    false_positives: 'The asset is tagged mgmt:self-managed-identity-hardened, which confirms that unconstrained delegation, AdminSDHolder tampering, trust SID filtering, and LDAP signing have been audited, and that krbtgt rotation follows the required two-pass procedure. Additionally, this finding does not apply if the asset authenticates exclusively through the enterprise-managed identity tenant.'
    function: architecture
    stride: spoofing
    cwe: 269
    risks_identified: {}

  Self-Managed Certificate Authority Template Privilege Escalation:
    id: self-managed-ca-template-escalation
    baseline_likelihood: likely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'This asset relies on a self-managed certificate authority with an enrollment template that lets a low-privileged requester supply its own subject name.'
    impact: 'If this risk remains unmitigated, a low-privileged requester can obtain a certificate that asserts a privileged identity. Thus, the requester bypasses authentication for every system that trusts this CA.'
    asvs: V2 - Authentication
    cheat_sheet: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
    action: 'Audit every certificate template on this CA for enrollee control of the subject name. Then, remove or restrict any template that lets a low-privileged requester specify a privileged subject name.'
    mitigation: >-
      Review the permissions on every enrollment template, as well as the CA's
      `EDITF_ATTRIBUTESUBJECTALTNAME2` flag, for enrollee-suppliable subject names.

      Restrict enrollment on any template that combines three properties: (1) enrollment rights for
      a broad principal group (for example, Domain Users), (2) the client authentication EKU, and
      (3) an enrollee-suppliable subject name.

      Require manager approval or issuance-policy-gated enrollment for any template that can produce
      a certificate usable for authentication as a privileged identity.
    references: NIST SP 800-53 SC-17 (Public Key Infrastructure Certificates); MITRE ATT&CK T1649 (Steal or Forge Authentication Certificates)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at High. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any self-managed CA with at least one enrollment template that combines enrollee-controlled subject names with broad enrollment rights.'
    false_positives: 'The asset is tagged mgmt:self-managed-identity-hardened, which confirms that every enrollment template has been audited against ESC1-class misconfiguration. Additionally, this finding does not apply if the asset relies exclusively on the enterprise-managed PKI.'
    function: architecture
    stride: spoofing
    cwe: 269
    risks_identified: {}

  Self-Managed Hybrid Identity Synchronization Server Compromise:
    id: self-managed-hybrid-sync-compromise
    baseline_likelihood: possible
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'This asset runs a self-managed hybrid identity synchronization server, which holds working credentials for both the on-premises directory and the cloud identity tenant that it bridges.'
    impact: 'If this risk remains unmitigated, compromise of the sync server lets an attacker pivot between the on-premises directory and the cloud tenant. In doing so, the attacker bypasses tier separation that was designed around each side individually.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model
    action: 'Administer this hybrid sync server with the same Tier-0 rigor as the directory infrastructure it bridges, rather than as ordinary application infrastructure.'
    mitigation: >-
      Restrict administrative access to the hybrid sync server to the same privileged-access tier as
      the directory infrastructure it connects to, rather than to general application or
      infrastructure administrators.

      Monitor the server for credential-extraction attempts, since it typically holds a highly
      privileged service account on both sides of the bridge.

      Isolate it on a management network segment that is distinct from general application
      infrastructure.

      Patch it on an accelerated cadence, given its Tier-0-equivalent blast radius.
    references: NIST SP 800-53 AC-6 (Least Privilege); NIST SP 800-53 SC-7 (Boundary Protection); MITRE ATT&CK T1556 (Modify Authentication Process)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at High. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any hybrid identity sync server that is administered without Tier-0-equivalent access restriction and network isolation.'
    false_positives: 'The asset is tagged mgmt:self-managed-identity-hardened, which confirms that this server is (1) administered with Tier-0 rigor, (2) network-isolated from general application infrastructure, and (3) monitored for credential extraction.'
    function: operations
    stride: elevation-of-privilege
    cwe: 522
    risks_identified: {}

  # --- 1.2 AUTHORIZATION ---

  Exposed Administrative Interface Without Hardened Access Controls:
    id: exposed-admin-panel
    baseline_likelihood: possible
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'The asset exposes an administrative interface that is reachable with standard application authentication alone. In other words, no additional network or authentication barrier, such as an IP restriction or a separate elevated factor, protects it. Server-side role checks on admin functions, by contrast, belong to the broken-function-level-authorization rule.'
    impact: 'If this risk remains unmitigated, the compromise of an admin session yields control over all application data, user accounts, and configuration.'
    asvs: V4 - Access Control
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: 'Restrict access to the admin interface to an IP-allowlisted management network segment, and require a separate, elevated authentication factor.'
    mitigation: >-
      Restrict access to the admin interface to an approved IP range (the management VNET, the
      Bastion subnet, or the privileged access workstation range), enforced at the NSG or Ingress
      layer rather than only through application-layer RBAC.

      Require a separate, elevated authentication step (for example, step-up MFA or PIV
      re-authentication) for admin access, even for users who are already authenticated to the
      application.

      Serve the admin interface on a separate subdomain or port, so that it can carry its own WAF
      policy and access logging.

      Audit every admin panel access event to a tamper-evident SIEM.
    references: NIST SP 800-53 AC-6 (Least Privilege); NIST SP 800-53 AC-17 (Remote Access); DISA Application Security STIG
    risk_assessment: 'Likelihood starts at Possible, and impact starts at High. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for an admin panel that is accessible on the same domain as the user-facing application without IP restriction. Furthermore, it is Critical if the admin interface is reachable from the internet with single-factor authentication.'
    false_positives: 'The admin interface is served on a separate, internal-only domain, with NSG-enforced IP restriction to a privileged access workstation range and a separate MFA step-up authentication. This must be confirmed in the network architecture documentation.'
    function: architecture
    stride: elevation-of-privilege
    cwe: 284
    detection_logic: 'Attempt to access known admin URL patterns (/admin, /manage, /console, /dashboard) with a standard user token, and verify that access is denied with a 403. Next, verify that the NSG rules restrict the admin endpoint to the approved IP range. Finally, monitor the admin panel''s access logs for access from IP addresses outside the approved management range.'
    risks_identified: {}

  Third-Party Vendor Remote Support Access Lifecycle Gap:
    id: vendor-remote-support-access-gap
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This asset grants a third-party vendor''s support engineer remote access that is not scoped to a specific support case and does not deactivate automatically when the case closes.'
    impact: 'If this risk remains unmitigated, vendor access can remain active long after the support engagement ends. It then becomes a standing external access path that an attacker who compromises the vendor could reuse.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html
    action: 'Scope vendor remote support access to a specific, time-bound support case, and deactivate it automatically at case closure or at a defined expiry, whichever comes first.'
    mitigation: >-
      Grant vendor remote support access through a mechanism that is scoped to a specific support
      case identifier and that expires automatically, either at a defined time limit or when the
      linked case is closed, rather than one that relies on a manual deactivation step.

      Log every vendor remote access session to the SIEM separately from internal administrative
      access, so that vendor access can be reviewed independently.

      Audit periodically for any vendor access grant with no associated open support case.
    references: NIST SP 800-53 AC-17 (Remote Access); NIST SP 800-53 SA-9 (External System Services); NIST SP 800-53 PS-7 (External Personnel Security)
