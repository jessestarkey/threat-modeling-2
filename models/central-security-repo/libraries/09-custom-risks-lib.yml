  'ATLAS: LLM Inference API Abuse, Cost Harvesting, and Model Extraction':
    id: atlas-inference-api-abuse
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The asset exposes an LLM or model inference API that can be systematically queried to extract a functional copy of the model, infer training data membership, or harvest disproportionate compute.'
    impact: 'If this risk remains unmitigated, model extraction undermines IP protection, membership inference can constitute a data breach, and cost harvesting drives unauthorized cloud spend.'
    asvs: V11 - Business Logic
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Apply output perturbation, query rate limiting, and anomalous query pattern detection on all inference endpoints.
    mitigation: Enforce strict per-user and per-token query rate limits and hard compute budgets. Add calibrated output perturbation (top-k sampling noise, confidence score truncation) to degrade model extraction signal. Monitor for systematic grid-search query patterns characteristic of model extraction. Require authenticated access with short-lived tokens. Log all inference requests with user identity for audit and anomaly detection.
    references: MITRE ATLAS AML.T0005 (Create Proxy AI Model), AML.T0024 (Exfiltration via AI Inference API — T0024.000-.002), AML.T0029 (Denial of AI Service), AML.T0034 (Cost Harvesting — T0034.000-.001), AML.T0040 (AI Model Inference API Access), AML.T0047 (AI-Enabled Product or Service), AML.T0063 (Discover AI Model Outputs), AML.T0077 (LLM Response Rendering); NIST AI RMF GOVERN 6.2
    risk_assessment: High for externally accessible endpoints serving proprietary models trained on CUI. Medium for internal-only endpoints.
    false_positives: Inference API is internal-only, accessible exclusively to authenticated service accounts, and the underlying model contains no sensitive training data.
    function: architecture
    stride: information-disclosure
    detection_logic: Monitor inference logs for statistical patterns consistent with extraction (systematic input sweeps, near-boundary probing, anomalously high per-user query volume). Alert on resource consumption spikes. Track per-session query diversity and flag low-entropy repetitive probing.
    risks_identified: {}

  # Distinct from atlas-inference-api-abuse above: that category is about
  # extraction/cost-harvesting signal (a sophisticated adversary probing to
  # steal the model or its data), while this one is about plain volumetric
  # resource exhaustion -- no extraction sophistication required, just
  # unmetered request/context/output volume denying service to legitimate
  # users. OWASP LLM10:2025 and ATLAS AML.T0029 cover this as its own
  # concern distinct from LLM10's sibling extraction/IP-theft entries.
  'ATLAS: Unbounded AI Resource Consumption and Denial of Service':
    id: atlas-unbounded-ai-consumption
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'The asset exposes an LLM or model inference API with no enforced limit on request volume, concurrency, or per-request context/output size, letting a single caller or small set of callers exhaust compute capacity and deny service to legitimate users.'
    impact: 'If this risk remains unmitigated, an adversary -- or an unintentionally runaway legitimate client -- can degrade or fully deny inference service to legitimate users and drive unbounded compute/cloud spend, since each request can consume disproportionate GPU/CPU time relative to its cost to send.'
    asvs: V11 - Business Logic
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Enforce per-user/per-session rate limits, concurrency caps, and maximum context/output token budgets on every inference endpoint.
    mitigation: Apply hard per-user and per-API-key request-rate and concurrency limits at the gateway in front of the inference endpoint, not only inside application logic a direct caller could bypass. Cap maximum input context length and maximum output token count per request, and reject or truncate requests that exceed the limit rather than queuing them. Apply adaptive throttling that degrades gracefully (reduced throughput) rather than failing open under load. Monitor per-user and aggregate compute consumption with alerting on sustained anomalous volume. Apply a hard autoscaling ceiling to prevent a single abusive client from driving uncontrolled cloud spend.
    references: MITRE ATLAS AML.T0029 (Denial of AI Service); OWASP LLM10:2025 (Unbounded Consumption); NIST AI RMF MANAGE 2.3
    risk_assessment: High for externally accessible, unauthenticated or loosely-authenticated endpoints with no gateway-level throttling. Medium for internal-only endpoints or those already behind a general-purpose API gateway with some rate limiting.
    false_positives: The asset is tagged ai:resource-budget-enforced confirming per-user rate limits, concurrency caps, and context/output token budgets are enforced at the gateway layer.
    function: architecture
    stride: denial-of-service
    detection_logic: Monitor per-user and aggregate request volume, token consumption, and compute time against expected baselines. Alert on sustained throughput from a single identity or small set of identities disproportionate to typical usage. Track queue depth and request latency percentiles for degradation signals consistent with resource exhaustion.
    risks_identified: {}

  'ATLAS: AI Model Supply Chain Compromise and Model Manipulation':
    id: atlas-model-supply-chain
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The asset loads or serves trained model artifacts from external or shared registries, which can be compromised at the weights, container, or dependency level.'
    impact: 'If this risk remains unmitigated, a backdoored model artifact can achieve remote code execution on the serving host or produce systematically manipulated outputs that pass standard evaluation.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: Establish model artifact provenance verification as a mandatory CI/CD gate and ban Pickle-based model formats.
    mitigation: Source all model artifacts exclusively from a private, access-controlled registry. Enforce cryptographic digest pinning (SHA-256) for all model files. Use safetensors format instead of Pickle-based formats (.pt, .pkl) to eliminate deserialization RCE surface. Scan all model archives for embedded executable code using tools such as picklescan. Run behavioral diff against a known-good checkpoint before promoting to production. Restrict write access to model serving directories.
    references: MITRE ATLAS AML.T0010 (AI Supply Chain Compromise — T0010.001-.004), AML.T0011.000 (Unsafe AI Artifacts), AML.T0018 (Manipulate AI Model — T0018.000-.002), AML.T0043.004 (Insert Backdoor Trigger), AML.T0076 (Corrupt AI Model); NIST AI RMF GOVERN 1.6
    risk_assessment: Critical if loading Pickle-format weights from public registries or shared internal registries without digest pinning.
    false_positives: Model artifact is fully internally trained, stored in a private registry with strict access control, uses safetensors format, and is digest-pinned.
    function: architecture
    stride: tampering
    detection_logic: Verify SHA-256 digest of each model file in the CI/CD pipeline against a pinned manifest. Run picklescan on all model archives before any deserialization. Monitor model serving process for anomalous network egress on startup.
    risks_identified: {}

  'ATLAS: Training Data Poisoning and Model Backdoor Insertion':
    id: atlas-training-data-poisoning
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'The training or fine-tuning pipeline ingests data from sources an adversary may be able to write to, such as public datasets, web scrapes, or user feedback loops.'
    impact: 'If this risk remains unmitigated, a model can be backdoored to behave maliciously on specific trigger inputs while appearing benign on standard evaluations.'
    asvs: V8 - Data Protection
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Establish a data provenance and integrity chain for all training corpora and perform adversarial behavioral testing before every model promotion.
    mitigation: Maintain a signed, immutable data manifest for all training inputs. Apply statistical outlier detection to identify anomalous label distributions prior to training. Run a behavioral evaluation on an independently curated adversarial holdout set specifically targeting backdoor triggers before every model promotion. Apply differential privacy mechanisms during fine-tuning. Scrub CUI, PII, and credentials from training data using automated PII detection pipelines before fine-tuning.
    references: MITRE ATLAS AML.T0020 (Poison Training Data), AML.T0024.000 (Infer Training Data Membership), AML.T0031 (Erode AI Model Integrity), AML.T0043.004 (Insert Backdoor Trigger), AML.T0057 (LLM Data Leakage), AML.T0059 (Erode Dataset Integrity); NIST AI RMF MAP 2.3
    risk_assessment: High for pipelines with continuous learning, RLHF, or human-feedback-driven fine-tuning. Medium for static, one-time training on a controlled corpus.
    false_positives: Training data is entirely internally generated, cryptographically signed, scrubbed of CUI, and has never been sourced from an external or user-controlled origin.
    function: architecture
    stride: tampering
    detection_logic: Implement automated data validation pipelines that flag statistical anomalies in label distributions. Conduct post-training behavioral testing on an adversarial holdout set designed to surface backdoor triggers. Run membership inference probes against the trained model to assess CUI memorization risk before promotion.
    risks_identified: {}

  'ATLAS: AI Training Dataset Exfiltration and Integrity Attack':
    id: atlas-dataset-store-attack
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The authoritative dataset store for training or evaluation is a high-value target for both integrity attacks and exfiltration by anyone with access to it.'
    impact: 'If this risk remains unmitigated, exfiltration of training data constitutes a formal data spill, and integrity compromise permanently poisons downstream models until rebuilt from a known-good state.'
