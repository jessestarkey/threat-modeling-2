  Media Downgrading Procedure Gap:
    id: media-downgrade-procedure-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'Media moved from a higher-classification enclave to a lower one is handled under a generic sanitization procedure, rather than a distinct, verified downgrading process.'
    impact: 'If this risk remains unmitigated, residual higher-classification content that survives an incomplete downgrade is disclosed directly into a lower-classification environment.'
    asvs: V8 - Data Protection
    cheat_sheet: https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final
    action: 'Apply a documented, independently verified downgrading procedure, distinct from routine media destruction, to any media or dataset moved to a lower-classification enclave (NIST SP 800-53 MP-8).'
    mitigation: >-
      Document a downgrading procedure that is separate from the standard media sanitization and
      disposal procedure. The procedure covers three steps: (1) a content review for residual
      higher-classification material, (2) technical sanitization of any metadata or embedded
      artifacts (such as document properties, deleted but recoverable content, and thumbnails), and
      (3) independent verification by a second reviewer before the media or dataset is released to
      the lower enclave.

      Log every downgrade action with the reviewer's identity and the verification result.
    references: NIST SP 800-53 MP-8 (Media Downgrading); NIST SP 800-53 MP-6 (Media Sanitization); CNSSI 1253; DoD 5200.01 (DoD Information Security Program)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any asset that downgrades media or datasets from high to low without a documented, independently verified procedure that is distinct from routine disposal.'
    false_positives: 'A documented downgrading procedure with independent second-reviewer verification is in place, distinct from the routine media sanitization procedure, and a per-transaction log evidences it.'
    function: architecture
