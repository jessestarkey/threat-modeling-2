  # jessestarkey/threagile fork as a native script rule
  # (pkg/risks/scripts/data-store-audit-detection-gap.yaml), triggered off the native
  # TechnicalAsset.Type == datastore field instead of the storage:persistent/storage:vault
  # tags. Removed here rather than left duplicated. See docs/risk-methodology.md for the full
  # rationale.

  # --- 6.2 SECRETS AND CRYPTOGRAPHY ---
  FIPS Non-Compliant Cryptography:
    id: fips-non-compliant-cryptography
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This asset performs cryptographic operations without confirmed use of a FIPS-validated module.'
    impact: 'If this risk remains unmitigated, the finding independently blocks IL5 authorization regardless of the underlying algorithm''s strength.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: Verify FIPS 140-2/3 validated module usage for all cryptographic operations on this asset and document the certificate number in the SSP.
    mitigation: 'For AKS nodes: enable FIPS mode on the node pool (`--enable-fips-image` in Azure CLI) to restrict the OS to FIPS-validated OpenSSL. For application-layer crypto: verify that the runtime''s crypto provider uses a CMVP-validated module (e.g., BoringCrypto for Go, OpenSSL in FIPS mode for Python/Java). For TLS termination: confirm that the ingress controller or load balancer cipher suite configuration excludes non-FIPS algorithms (RC4, 3DES, MD5). Document the CMVP certificate number for each validated module in the SSP.'
    references: DoD Cloud Computing SRG IL5; NIST CMVP (https://csrc.nist.gov/projects/cryptographic-module-validation-program); FIPS 140-3
    risk_assessment: High risk to ATO. FIPS non-compliance at a TLS termination point or encryption-at-rest boundary is typically a CAT II finding under DoD STIGs.
    false_positives: Asset handles only publicly releasable, non-CUI data with no confidentiality requirement, confirmed by data classification review — or FIPS validated module usage is documented in the SSP with a valid CMVP certificate number.
    function: architecture
    stride: information-disclosure
    detection_logic: 'Run DISA STIG compliance scans (ACAS/Nessus) targeting cryptographic configuration checks. For AKS: verify node pool FIPS status via `az aks nodepool show --query fipsEnabled`. For application crypto: use SAST rules to flag crypto library imports that are not FIPS-validated variants.'
    risks_identified: {}

  Deprecated TLS Versions and Weak Cipher Suites:
    id: deprecated-tls-weak-ciphers
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'This TLS termination asset supports deprecated protocol versions or weak cipher suites exploitable via known attacks such as POODLE or SWEET32.'
    impact: 'If this risk remains unmitigated, a network-positioned adversary can decrypt protected traffic or perform a protocol downgrade attack.'
    asvs: V9 - Communications
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/TLS_Cipher_String_Cheat_Sheet.html
    action: Restrict TLS configuration to TLS 1.2 minimum (TLS 1.3 preferred) and an approved FIPS-compatible cipher suite list.
    mitigation: 'Configure TLS to support TLS 1.2 and TLS 1.3 only — explicitly disable TLS 1.0, TLS 1.1, and SSL 3.0. Restrict cipher suites to those providing forward secrecy (ECDHE key exchange) and strong symmetric ciphers (AES-128-GCM, AES-256-GCM, CHACHA20-POLY1305). Disable RC4, 3DES, NULL, EXPORT, and anonymous DH cipher suites. For Azure Application Gateway and Front Door: apply a predefined TLS policy of AppGwSslPolicy20220101S or equivalent. Verify configuration with automated TLS scanning on every deployment.'
    references: DISA Application Security and Development STIG V5R3 (APSC-DV-002010, APSC-DV-002030); NIST SP 800-52r2 (Guidelines for TLS); NSA/CISA TLS Best Practices
    risk_assessment: Medium (CAT II STIG finding). Escalates to High if the asset is internet-facing and TLS 1.0/1.1 is enabled for compatibility with legacy clients.
    false_positives: TLS configuration has been audited and confirmed to support only TLS 1.2+ with an approved cipher suite list, documented in the SSP with the scan output as evidence.
    function: architecture
    stride: information-disclosure
    detection_logic: Run testssl.sh or sslyze against all TLS endpoints in the CI/CD pipeline and fail the build on detection of deprecated protocols or weak ciphers. Integrate Azure Security Center TLS recommendations into the compliance dashboard. Schedule quarterly TLS configuration scans via ACAS/Nessus.
    risks_identified: {}

  # Key Storage and Ownership Hardening Gap, Key Rotation and Escrow Neglect, and Key
  # Management Separation-of-Duties Violation have been ported into the jessestarkey/threagile
  # fork as native script rules (pkg/risks/scripts/*.yaml), triggered off the native vault
  # technology attribute instead of the storage:vault tag. Removed here rather than left
  # duplicated. See docs/risk-methodology.md for the full rationale.

  # #############################################################################
  # DOMAIN 7: DETECTION
  # #############################################################################

  # --- 7.1 DETECTION ---
  # Relocated from API and Service Exposure and Infrastructure:
  # Containers (now 5.3 and 2.1), where they originally lived alongside
  # the asset-class entries they extend -- moved here so Detection has
  # its own domain, mirroring SABER's split between Detection and
  # Response (08-saber-detection.md / 09-saber-response.md), which our
  # earlier merged "Detection and Incident Response" banner didn't
  # reflect. No id, tag, or trigger logic changed -- inject_risks.py
  # looks these up by dict key, not file position.
  API Abuse and Enumeration Logging Gap:
    id: api-abuse-enumeration-logging-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This public API endpoint does not log the request patterns that indicate enumeration or abuse, such as sequential object-ID probing or repeated authorization failures from one caller.'
    impact: 'If this risk remains unmitigated, an attacker pacing requests below the rate limit produces no throttling event and remains invisible to the SOC.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Log quota/rate-limit rejections, object-ID request sequences, and repeated per-caller authorization failures on this endpoint, and forward them to the SIEM with correlation by caller identity.
    mitigation: Emit a distinct log event for every rate-limit/quota rejection, every authorization failure, and every request touching an object-identifier parameter, tagged with the calling identity (API key, token subject, or source IP where unauthenticated). Forward these to the SIEM and build a correlation rule that flags a single caller crossing a threshold of authorization failures or sequential/randomized object-ID requests within a rolling window — well below the volume that would trigger a rate-limit block.
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 SI-4 (System Monitoring); OWASP API Security Top 10 (API4:2023 Unrestricted Resource Consumption, API1:2023 Broken Object Level Authorization)
    risk_assessment: High for any public API where object identifiers are part of the request path/body and no correlation rule exists for per-caller authorization-failure or object-enumeration patterns.
    false_positives: The endpoint logs rate-limit rejections, authorization failures, and object-ID request patterns with caller-identity correlation, and a SIEM detection rule is confirmed active against that log stream.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  # Container Orchestrator Control-Plane Audit Logging Gap has been ported into the
  # jessestarkey/threagile fork as a native script rule
  # (pkg/risks/scripts/cluster-control-plane-audit-gap.yaml), triggered off the native
  # `machine == container` field instead of a tag. Removed here rather than left duplicated.
  # See docs/risk-methodology.md for the full rationale.

  Network Intrusion Detection and Traffic Anomaly Blind Spot:
    id: network-ids-blind-spot
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This internet-reachable asset has no network-based intrusion detection or traffic-anomaly monitoring observing traffic crossing its trust boundary.'
    impact: 'If this risk remains unmitigated, an attacker''s network-layer reconnaissance, exploitation attempts, and command-and-control traffic pass without generating any alert for the SOC to act on.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Deploy network-based intrusion detection (NIDS/NDR) or equivalent traffic-anomaly monitoring on the ingress/egress path for this asset, alerting the SOC on detection.
    mitigation: Deploy a network intrusion detection system or network detection-and-response (NDR) capability positioned to observe all ingress/egress traffic for this asset — inline or via traffic mirroring/TAP — tuned with signatures and behavioral baselines appropriate to the protocols this asset actually serves. Forward alerts to the SIEM and define an escalation path to the SOC. Tag the asset net:ids-monitored once coverage is confirmed and actively alerting.
    references: NIST SP 800-53 SI-4 (System Monitoring); NIST SP 800-53 AU-2 (Event Logging); DoD Zero Trust Reference Architecture (Network and Environment pillar)
    risk_assessment: High for any internet-reachable or zone:dmz asset with no network-based detection observing its ingress/egress traffic.
    false_positives: The asset is tagged net:ids-monitored confirming network-based intrusion detection or NDR coverage is deployed and actively alerting on the traffic path to and from this asset.
    function: operations
    stride: information-disclosure
    detection_logic: Confirm NIDS/NDR sensor placement covers 100% of the asset's ingress/egress paths (no unmonitored network segment), and validate alerting is live by running a benign signature-triggering test and confirming a SOC-visible alert fires.
    risks_identified: {}

  # Baseline Security Event Logging and SIEM Forwarding Gap has been ported into the
  # jessestarkey/threagile fork as a native script rule
  # (pkg/risks/scripts/baseline-security-event-logging-gap.yaml), triggered off the
  # frontend_related/backend_related technology attributes instead of APP_TIER_TAGS. Removed
  # here rather than left duplicated. See docs/risk-methodology.md for the full rationale.

  # #############################################################################
  # DOMAIN 8: RESPONSE
  # #############################################################################

  # --- 8.1 INCIDENT-RESPONSE READINESS ---
  Undocumented Incident Containment Disposition:
    id: undocumented-containment-disposition
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'A business-critical or mission-critical asset has no documented answer to whether it may be automatically isolated during a suspected compromise or requires human approval first.'
    impact: 'If this risk remains unmitigated, response to an active incident is delayed by an ad hoc approval decision, or the asset is isolated in a way that causes unintended operational impact.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Document, for this asset, whether automated containment/isolation is permitted, requires human approval, or is prohibited, and record that disposition where the incident response team can find it during an active incident.
    mitigation: For every asset tagged business-critical or mission-critical, record a containment disposition (auto-isolation permitted / human approval required / auto-isolation prohibited) in the asset's own documentation or the incident response runbook, decided in advance by the asset owner together with the response team — not improvised during an incident. Where auto-isolation is prohibited (e.g., a safety-relevant or highly available system), document the manual containment procedure to use instead.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: High for any business-critical or mission-critical asset with no documented containment disposition.
    false_positives: A containment disposition for this asset is documented in the incident response runbook and was agreed by both the asset owner and the response team.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Undocumented Credential Blast Radius for Incident-Driven Rotation:
    id: undocumented-credential-blast-radius
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'If this asset''s credentials were compromised, there is no inventory sufficient to identify and rotate every consumer of them without an improvised discovery effort during the response itself.'
    impact: 'If this risk remains unmitigated, a credential missed during rotation because it was never inventoried gives an adversary a return path after an incident is declared contained.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    action: Maintain an inventory of every credential/secret this asset consumes or issues, sufficient to support a complete rotation without an extended outage during incident response.
    mitigation: Maintain a current inventory (manual or, preferably, generated from the secrets broker/vault's own access records) of every credential and secret this asset consumes, and every downstream system that trusts a credential this asset issues. Ensure the rotation procedure for each can be executed without an extended service outage, so a full rotation is operationally feasible to actually perform during incident response rather than being skipped under time pressure.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-53 IA-5 (Authenticator Management); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: High for any asset holding or issuing credentials where no consumer inventory exists to support a complete post-compromise rotation.
    false_positives: A current credential/secret consumer inventory exists for this asset and rotation of every entry has been exercised (not merely documented) within the current ATO period.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  Untested Incident Response Plan:
    id: untested-incident-response-plan
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This business-critical or mission-critical asset falls under an incident response plan that has never been exercised through a tabletop or live-fire drill, only documented.'
    impact: 'If this risk remains unmitigated, roles, escalation paths, and technical procedures assumed to work during an actual incident are tested for the first time under real pressure, when gaps are most costly to discover.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Conduct a tabletop or live-fire incident response exercise covering this asset's likely compromise scenarios on a recurring schedule, and update the plan with anything the exercise reveals is missing or outdated.
    mitigation: Schedule a recurring incident response exercise (tabletop at minimum, live-fire where feasible) that walks through a realistic compromise scenario for this asset — detection, containment, eradication, recovery, and stakeholder notification — using only the documented plan rather than institutional knowledge. Involve every role the plan assigns responsibilities to, not just the security team. Record findings and update the plan before the next ATO renewal.
    references: NIST SP 800-53 IR-3 (Incident Response Testing); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: High for any business-critical or mission-critical asset whose incident response plan has not been exercised within the current ATO period.
    false_positives: The asset is tagged ir:plan-tested confirming a tabletop or live-fire incident response exercise covering this asset has been conducted within the current ATO period.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  DFARS 252.204-7012 72-Hour Cyber Incident Reporting Gap:
    id: dfars-breach-notification-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This business-critical or mission-critical asset has no documented procedure identifying the contract-mandated cyber incident reporting timeline or the party responsible for executing it.'
    impact: 'If this risk remains unmitigated, a genuine incident is discovered without a clear owner or timeline for DoD-mandated reporting, risking a missed 72-hour reporting window and the contractual and legal consequences that follow.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Document the cyber incident reporting procedure required by this system's contract (e.g., DFARS 252.204-7012's 72-hour DIBNet reporting requirement for a covered contractor information system), naming the party responsible for executing it.
    mitigation: Identify which contracts covering this asset carry DFARS 252.204-7012 (or an equivalent DoD cyber incident reporting clause), and document the exact reporting timeline, the DIBNet submission process, and the specific role responsible for initiating it once an incident affecting covered defense information is confirmed. Rehearse the reporting step itself (not just detection/containment) during incident response exercises so the 72-hour clock is a practiced procedure, not a first-time scramble.
    references: DFARS 252.204-7012 (Safeguarding Covered Defense Information and Cyber Incident Reporting); NIST SP 800-53 IR-6 (Incident Reporting); NIST SP 800-171
    risk_assessment: High for any business-critical or mission-critical asset covered by a DFARS 252.204-7012 clause with no documented reporting procedure or owner.
    false_positives: The asset is tagged ir:breach-notification-procedure-documented confirming a documented reporting procedure identifies the contract-mandated timeline and the responsible party, and the procedure has been rehearsed.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Forensic Evidence Chain-of-Custody Gap:
    id: forensic-chain-of-custody-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This business-critical or mission-critical asset has no documented procedure for acquiring, logging, and transferring forensic evidence during an incident affecting it.'
    impact: 'If this risk remains unmitigated, evidence collected during an incident cannot be shown to be unaltered or continuously accounted for, undermining its use in legal proceedings, contract disputes, or a defensible after-action record.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Document a forensic evidence-handling procedure for this asset covering acquisition, custody logging, storage, and transfer, and assign ownership of executing it during an incident.
    mitigation: Establish a documented forensic evidence-handling procedure covering how evidence relevant to this asset (disk/memory images, logs, network captures) is acquired, hashed at acquisition time, logged in a continuous custody record (who held it, when, why), stored, and transferred — modeled on standard forensic chain-of-custody practice. Assign a named role responsible for executing this procedure during an incident, distinct from whoever performs containment, so evidence handling isn't improvised under pressure.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-86 (Guide to Integrating Forensic Techniques into Incident Response)
    risk_assessment: High for any business-critical or mission-critical asset with no documented forensic evidence-handling procedure.
    false_positives: The asset is tagged ir:evidence-handling-documented confirming a documented forensic evidence-handling procedure (acquisition, custody log, storage, transfer) exists and names a responsible role.
    function: operations
    stride: repudiation
    risks_identified: {}

  # #############################################################################
  # DOMAIN 9: RECOVERY
  # #############################################################################

  # --- 9.1 INFRASTRUCTURE: BACKUP AND DR ---
  Backup Integrity and Recovery Assurance Gap:
    id: backup-integrity-recovery-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'The asset is flagged as requiring backup for DR/COOP, but backup integrity, encryption, access control, or recovery testing has not been verified.'
    impact: 'If this risk remains unmitigated, a ransomware attack or infrastructure failure can result in permanent data loss because the backup''s actual recoverability was never confirmed.'
    asvs: V9 - Communications / V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: Verify backup encryption, access isolation, geographic separation, and conduct a documented recovery test against defined RTO/RPO targets.
    mitigation: Encrypt all backups at rest using FIPS-validated cryptography with keys stored separately from the backup data (Azure Backup with CMK in Key Vault). Store backups in a geographically separate Azure region to a storage account accessible only to the backup service principal — not to application workload identities. Implement immutable backup storage (Azure Backup soft delete + lock) to prevent deletion by ransomware. Conduct and document a full recovery test at least annually, validating actual RTO/RPO against documented targets. Alert on backup job failures within 1 hour.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 CP-10 (Information System Recovery); DoD COOP requirements; Azure Backup security baseline
    risk_assessment: High for assets storing CUI where backup procedures have never been tested or where backup storage is co-located with or accessible from the primary environment.
    false_positives: Backup encryption, geographic separation, access isolation, and recovery testing are all documented in the COOP plan and have been validated within the current ATO period.
    function: operations
    stride: information-disclosure
    detection_logic: Monitor Azure Backup job status and alert on any job failure within the defined backup window. Audit backup storage account access policies to verify no production workload identities have write access. Schedule annual recovery test exercises and track completion in the POA&M.
    risks_identified: {}

  Backup Administrative Privilege Separation Gap:
    id: backup-admin-privilege-separation-gap
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'Backup platform administrators share identity with production administrators, or destructive backup operations are not protected by dual authorization.'
    impact: 'If this risk remains unmitigated, a single compromised production admin account can delete the backups meant to recover from that same compromise.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: Ensure backup administration is a distinct role from production administration, and require dual authorization plus step-up authentication for any destructive backup operation.
    mitigation: Assign backup platform administration to a role held by individuals who do not also hold production administrative access to the same workload. Require a second approver and step-up MFA for destructive operations specifically (delete backup, shorten retention, disable job, remove immutability lock) — routine backup operations (create, restore-test) do not need this. Alert on any destructive backup operation regardless of who performs it.
    references: NIST SP 800-53 AC-6(1) (Least Privilege — Authorize Access to Security Functions); NIST SP 800-53 CP-9(7) (Dual Authorization for Deletion)
    risk_assessment: Critical for any asset where the same identity or role holds both production administrative access and destructive backup permissions.
    false_positives: Backup administration is confirmed to be a distinct role from production administration, and destructive backup operations require dual authorization and step-up authentication, verified by an access review within the current ATO period.
    function: operations
    stride: tampering
    risks_identified: {}

  Backup Immutability Not Enforced:
    id: backup-immutability-not-enforced
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The backup store uses a retention lock a sufficiently privileged account can shorten or remove, rather than a compliance-mode lock no account can alter before the retention period expires.'
    impact: 'If this risk remains unmitigated, a privileged account -- including one obtained by an attacker -- can delete backups within the stated retention window.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Enable a compliance-mode (not governance-mode) immutability lock on the backup store, verified to be irreversible by any account for the duration of the retention period.
    mitigation: Enable immutable backup storage in compliance mode (e.g., Azure Backup vault immutability with the "immutable and cannot be reverted" setting locked, not merely enabled) so that no account, including the backup vault's own owner, can shorten retention or delete backups before expiry. Verify this by attempting to disable the lock with a fully privileged test account in a non-production vault and confirming the platform refuses the operation.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 SI-4(24) (Indicators of Compromise); CISA Ransomware Guide (Immutable Backup Storage)
    risk_assessment: Critical for any asset whose backup store's immutability lock can be disabled or shortened by any account, including its own administrators.
    false_positives: The backup store's immutability lock is confirmed to be in compliance mode (irreversible by any account, including the vault's own owner, for the retention period), verified by a test of the lock itself rather than by policy documentation alone.
    function: operations
    stride: tampering
    risks_identified: {}

  Backup Encryption Key Rotation and Retention Mismatch:
    id: backup-key-rotation-retention-mismatch
    baseline_likelihood: unlikely
    baseline_impact: low
    description: 'This asset''s backup encryption keys have no documented rotation cadence tied to the longest retention period any backup copy carries.'
    impact: 'If this risk remains unmitigated, a key rotated without regard to retention leaves older backups permanently undecryptable, invisible until a restore from them is attempted.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html
    action: Register backup encryption keys with a documented rotation cadence that accounts for the longest retention period of any backup copy encrypted with them, and retain superseded key versions for the life of backups that depend on them.
    mitigation: Track which key version encrypted each backup generation, and retain (rather than destroy) a superseded key version until every backup encrypted with it has passed its retention period. Where the backup platform supports envelope encryption with a rotating data-encryption key under a stable key-encryption key, prefer that pattern so key rotation does not require re-encrypting or invalidating existing backups.
    references: NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57 Part 1 (Key Management — General); NIST SP 800-53 CP-9 (Information System Backup)
    risk_assessment: High for any asset with a documented key rotation cadence that does not explicitly account for its backup retention period, or no documented cadence at all.
    false_positives: Backup encryption key rotation is documented and confirmed to retain superseded key versions for the life of every backup they encrypted, or the backup platform uses envelope encryption that decouples key rotation from existing backup decryptability.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Recovery Objective Definition Gap:
    id: recovery-objective-definition-gap
    baseline_likelihood: likely
    baseline_impact: low
    description: 'This asset has no documented RTO/RPO derived from its criticality tier, or its declared figures have never been validated against an actual restore test.'
    impact: 'If this risk remains unmitigated, an actual incident reveals the asset''s true recovery time and data-loss window for the first time, when the gap can no longer be closed quietly.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Document an RTO and RPO for this asset derived from its business-criticality tier, and validate both figures against the result of an actual restore test.
    mitigation: Assign an RTO and RPO to this asset based on its business-criticality tier (Threagile's business_criticality/availability rating), documented in the COOP plan. Validate both figures against the measured duration and data-loss window of an actual restore test — not an estimate — and revise the documented target if the test result exceeds it, rather than leaving a target on record that the asset has never actually met.
    references: NIST SP 800-53 CP-2 (Contingency Plan); NIST SP 800-53 CP-10 (Information System Recovery and Reconstitution); DoD COOP requirements
    risk_assessment: Medium, escalating to High for business-critical or mission-critical assets with no validated RTO/RPO.
    false_positives: An RTO and RPO are documented for this asset and have been validated against the measured result of an actual restore test within the current ATO period.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Untested Restoration Procedure:
    id: untested-restoration-procedure
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Backups for this asset pass integrity checks, but no restoration has actually been performed using only the written procedure rather than institutional knowledge.'
    impact: 'If this risk remains unmitigated, an incomplete or outdated restoration procedure is discovered during an actual incident, at the worst possible time to discover it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Perform a full restoration of this asset from a real stored backup, using only the written restoration procedure, on a recurring schedule.
    mitigation: Conduct a restoration exercise at least annually (more frequently for business-critical/mission-critical assets) in which a person other than the backup job's original author executes the documented restoration procedure against a real stored backup into an isolated environment, and validates the restored system actually functions. Update the written procedure with anything the exercise revealed was missing, undocumented, or dependent on tribal knowledge.
    references: NIST SP 800-53 CP-4 (Contingency Plan Testing); NIST SP 800-53 CP-9 (Information System Backup)
    risk_assessment: High for any business-critical or mission-critical asset whose restoration procedure has not been exercised, by someone other than its author, within the current ATO period.
    false_positives: A full restoration exercise using only the written procedure, performed by someone other than the procedure's author, has been completed successfully within the current ATO period.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Unsupported or SaaS Service Backup Gap:
    id: unsupported-saas-backup-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset is a SaaS tenant or vendor-hosted service the enterprise backup platform cannot enroll, with no export job routing its data into enterprise-controlled storage.'
    impact: 'If this risk remains unmitigated, the asset has no recovery path at all if the vendor tenant is deleted, compromised, or becomes unavailable.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Configure a native export mechanism or a purpose-built export job to route this asset's data into enterprise-controlled backup storage on a recurring schedule, independent of the vendor's own in-tenant retention.
    mitigation: Identify whether the vendor/SaaS platform provides a native data-export API or scheduled export feature, and route that export into enterprise-controlled storage under the same immutability and access-isolation controls as other backups. Where no native export exists, build a purpose-written export job against the vendor's API. Do not accept the vendor's own in-tenant retention, recycle bin, or version history as satisfying this control — it remains inside the vendor's control plane and does not survive tenant-level compromise or deletion.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 SA-9 (External System Services)
    risk_assessment: High for any SaaS or vendor-hosted asset with no independent, enterprise-controlled backup export configured.
    false_positives: The asset is tagged ops:saas-export-configured confirming a native or purpose-built export job routes its data into enterprise-controlled backup storage on a recurring schedule, independent of the vendor's own in-tenant retention.
    function: operations
    stride: denial-of-service
    risks_identified: {}

