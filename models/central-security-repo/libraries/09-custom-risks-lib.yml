    finding_class: control-not-evidenced
    description: 'The backup store uses a retention lock that a sufficiently privileged account can shorten or remove. In other words, it is not a compliance-mode lock, which no account can alter before the retention period expires.'
    impact: 'If this risk remains unmitigated, a privileged account, including one obtained by an attacker, can delete backups within the stated retention window.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://www.cisa.gov/stopransomware/ransomware-guide
    action: 'Enable a compliance-mode (not governance-mode) immutability lock on the backup store, and verify that no account can reverse it for the duration of the retention period.'
    mitigation: >-
      Enable immutable backup storage in compliance mode, so that no account, including the backup
      vault's own owner, can shorten retention or delete backups before they expire. For example, in
      Azure Backup, the vault immutability setting "immutable and cannot be reverted" must be
      locked, not merely enabled.

      Verify this by attempting to disable the lock with a fully privileged test account in a
      non-production vault, and confirm that the platform refuses the operation.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 SI-4(24) (Indicators of Compromise); CISA Ransomware Guide (Immutable Backup Storage)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Critical for any asset whose backup store has an immutability lock that any account, including the store''s own administrators, can disable or shorten.'
    false_positives: 'The backup store''s immutability lock is confirmed to be in compliance mode, meaning no account, including the vault''s own owner, can reverse it during the retention period. Additionally, this is verified by a test of the lock itself, rather than by policy documentation alone.'
    function: operations
    stride: tampering
    cwe: 284
    risks_identified: {}

  Backup Encryption Key Rotation and Retention Mismatch:
    id: backup-key-rotation-retention-mismatch
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This asset''s backup encryption keys have no documented rotation cadence tied to the longest retention period of any backup copy.'
    impact: 'If this risk remains unmitigated, a key that is rotated without regard to retention leaves older backups permanently undecryptable. Furthermore, the problem stays invisible until someone attempts a restore from those backups.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html
    action: 'Register the backup encryption keys with a documented rotation cadence that accounts for the longest retention period of any backup copy they encrypt. Additionally, retain superseded key versions for the life of the backups that depend on them.'
    mitigation: >-
      Track which key version encrypted each backup generation, and retain, rather than destroy, a
      superseded key version until every backup it encrypted has passed its retention period.

      Where the backup platform supports envelope encryption, with a rotating data-encryption key
      under a stable key-encryption key, prefer that pattern, so that key rotation does not require
      re-encrypting or invalidating existing backups.
    references: NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57 Part 1 (Key Management — General); NIST SP 800-53 CP-9 (Information System Backup)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any asset whose documented key rotation cadence does not explicitly account for its backup retention period, or that has no documented cadence at all.'
    false_positives: 'Either (1) backup encryption key rotation is documented and confirmed to retain superseded key versions for the life of every backup they encrypted, or (2) the backup platform uses envelope encryption, which decouples key rotation from the decryptability of existing backups.'
    function: operations
    stride: information-disclosure
    cwe: 1008
    risks_identified: {}

  Recovery Objective Definition Gap:
    id: recovery-objective-definition-gap
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This asset has no documented RTO and RPO derived from its criticality tier, or its declared figures have never been validated against an actual restore test.'
    impact: 'If this risk remains unmitigated, an actual incident reveals the asset''s true recovery time and data-loss window for the first time, when the gap can no longer be closed quietly.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://www.cisa.gov/stopransomware/ransomware-guide
    action: 'Document an RTO and an RPO for this asset, derived from its criticality tier, and validate both figures against the result of an actual restore test.'
    mitigation: >-
      Assign an RTO and an RPO to this asset based on its criticality tier (the model's
      mission_criticality and the asset's own availability rating), and document them in the COOP
      plan.

      Validate both figures against the measured duration and data-loss window of an actual restore
      test, not an estimate.

      If the test result exceeds a documented target, revise the target, rather than leaving on
      record a target that the asset has never actually met.
    references: NIST SP 800-53 CP-2 (Contingency Plan); NIST SP 800-53 CP-10 (Information System Recovery and Reconstitution); DoD COOP requirements
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s availability rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium. However, it rises to High for an asset in a mission-essential or mission-critical system with no validated RTO and RPO.'
    false_positives: 'An RTO and an RPO are documented for this asset, and they have been validated against the measured result of an actual restore test within the current ATO period.'
    function: operations
    stride: denial-of-service
    cwe: 1059
    risks_identified: {}

  Untested Restoration Procedure:
    id: untested-restoration-procedure
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'Backups for this asset pass integrity checks. However, no one has actually performed a restoration using only the written procedure, rather than institutional knowledge.'
    impact: 'If this risk remains unmitigated, an incomplete or outdated restoration procedure is discovered during an actual incident, which is the worst possible time to discover it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://www.cisa.gov/stopransomware/ransomware-guide
    action: 'Perform a full restoration of this asset from a real stored backup on a recurring schedule, using only the written restoration procedure.'
    mitigation: >-
      Conduct a restoration exercise at least annually, and more often in mission-essential and
      mission-critical systems.

      In the exercise, a person other than the backup job's original author follows the documented
      restoration procedure to restore a real stored backup into an isolated environment, and then
      validates that the restored system actually functions.

      Update the written procedure with anything that the exercise revealed to be missing,
      undocumented, or dependent on tribal knowledge.
    references: NIST SP 800-53 CP-4 (Contingency Plan Testing); NIST SP 800-53 CP-9 (Information System Backup)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s availability rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any asset in a mission-essential or mission-critical system whose restoration procedure has not been exercised, by someone other than its author, within the current ATO period.'
    false_positives: 'A full restoration exercise, using only the written procedure and performed by someone other than the procedure''s author, has been completed successfully within the current ATO period.'
    function: operations
    stride: denial-of-service
    cwe: 1059
    risks_identified: {}

  Unsupported or SaaS Service Backup Gap:
    id: unsupported-saas-backup-gap
    baseline_likelihood: unlikely
    baseline_impact: high
    finding_class: control-not-evidenced
    description: 'This asset is a SaaS tenant or a vendor-hosted service that the enterprise backup platform cannot enroll, and no export job routes its data into enterprise-controlled storage.'
    impact: 'If this risk remains unmitigated, the asset has no recovery path at all if the vendor tenant is deleted, compromised, or becomes unavailable.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://www.cisa.gov/stopransomware/ransomware-guide
    action: 'Configure a native export mechanism, or a purpose-built export job, that routes this asset''s data into enterprise-controlled backup storage on a recurring schedule, independent of the vendor''s own in-tenant retention.'
    mitigation: >-
      Identify whether the vendor or SaaS platform provides a native data-export API or a scheduled
      export feature. If it does, route that export into enterprise-controlled storage under the
      same immutability and access-isolation controls as other backups. If it does not, build a
      purpose-written export job against the vendor's API.

      Do not accept the vendor's own in-tenant retention, recycle bin, or version history as
      satisfying this control, since it remains inside the vendor's control plane and does not
      survive a compromise or deletion of the tenant.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 SA-9 (External System Services)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at High. Impact then steps on the asset''s availability rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any SaaS or vendor-hosted asset with no independent, enterprise-controlled backup export configured.'
    false_positives: 'The asset is tagged ops:saas-export-configured, which confirms that a native or purpose-built export job routes its data into enterprise-controlled backup storage on a recurring schedule, independent of the vendor''s own in-tenant retention.'
    function: operations
    stride: denial-of-service
    cwe: 1008
    risks_identified: {}

