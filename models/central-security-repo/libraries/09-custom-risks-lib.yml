    mitigation: >-
      Wrap all external content in delimited, data-only markers, and instruct the model that this
      content is data rather than commands.

      Screen retrieved content with a content safety classifier before it enters the context window.

      Require human confirmation before any tool action that externally sourced context initiates.

      Filter responses for exfiltration patterns, such as base64 payloads, suspicious URLs, and
