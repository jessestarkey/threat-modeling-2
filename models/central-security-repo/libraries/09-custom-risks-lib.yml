  Search Index Abuse and Data Exposure:
    id: search-index-abuse
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The application relies on a search index, such as Elasticsearch or Solr, for its query functionality. However, index-level authorization may not be strictly enforced.'
    impact: 'If this risk remains unmitigated, an attacker can craft queries that bypass application-layer access controls, either to scrape data or to exhaust backend resources.'
    asvs: V11 - Business Logic
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    action: 'Enforce strict query sanitization, pagination, and index-level RBAC.'
    mitigation: >-
      Do not expose the raw search API to users.

      Instead, route every search request through an application-layer proxy that (1) enforces rate
      limiting, (2) applies strict query timeouts to prevent DoS, and (3) filters the results by the
      user's explicit permissions before returning any data.
    references: NIST SP 800-53 SC-5 (Denial of Service Protection)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is a High risk if the raw search endpoint is exposed, or if queries are unbounded.'
    false_positives: 'The search index contains only public, non-sensitive data.'
