  Agent Memory and Context Poisoning:
    id: ai-agent-memory-poisoning
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The AI agent maintains persistent memory or session state across turns. Thus, an adversary can poison or silently alter that memory to change the model''s conversational context.'
    impact: 'If this risk remains unmitigated, an adversary can keep influence over the agent''s behavior indefinitely, and establish persistence that survives an agent restart.'
    asvs: V8 - Data Protection
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: 'Apply integrity controls to all persisted agent memory, and enforce strict access control on the paths that write to memory.'
    mitigation: >-
      Sign or hash every persisted memory entry cryptographically, and verify its integrity before
      loading it.

      Restrict write access to the memory stores to the authenticated agent runtime only.

      Validate memory content on load, and flag entries that contain instruction-like language.

      Log every memory write and modification.

      Expire session memory, and enforce periodic re-authentication of the memory state.
    references: MITRE ATLAS AML.T0080 (AI Agent Context Poisoning — T0080.000 Memory, T0080.001 Thread), AML.T0081 (Modify AI Agent Configuration), AML.T0092 (Manipulate User LLM Chat History); OWASP Top 10 for Agentic Applications 2026 ASI06 (Memory and Context Poisoning)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a persistent-memory agentic system with continuity across sessions. However, it is Medium for memory that lives only within a session, with no persistence across sessions.'
    false_positives: 'The agent uses only context-window memory, with no external persistence layer, and discards that memory entirely at the end of the session. Additionally, likelihood is one level higher when the memory store is written from outside its trust boundary, namely when it is internet-facing or has a non-readonly incoming link from another boundary.'
    function: architecture
    stride: tampering
    cwe: 345
    detection_logic: 'Audit the memory store''s write logs. Additionally, alert on memory entries that are created or modified outside authenticated agent runtime sessions. Finally, monitor for memory entries that contain the syntactic patterns characteristic of prompt injection (for example, instruction-like imperative sentences or role-switch phrases).'
    risks_identified: {}

