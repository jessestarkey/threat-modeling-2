  Bulk Import/Export Data Abuse:
    id: bulk-import-export-abuse
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The asset supports bulk data import or export without per-record authorization checks or a bounded scope. Thus, it is exposed to formula injection, mass overwrites, and unbounded data exposure.'
    impact: 'If this risk remains unmitigated, a low-privilege user can export an entire dataset, well beyond what individual record access would allow. Alternatively, the user can overwrite authoritative records at scale.'
    asvs: V5 - Validation, Sanitization and Encoding / V4 - Access Control
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
    action: 'Sanitize every exported cell value against formula injection, enforce per-user scope on export queries, and enforce authorization checks on bulk import operations.'
    mitigation: >-
      Sanitize every string value written to a CSV or Excel export by prefixing dangerous leading
      characters (=, +, -, @, tab, and carriage return) with a single quote or a space.

      Enforce per-user data scope on every export query by applying the same row-level security as
      individual record access, and never export the full table.

      Implement hard size limits, with pagination, on both import and export operations.

      Require re-authentication or MFA confirmation before a bulk export of CUI.

      Log every bulk export with the requesting user's identity, the timestamp, and the record
      count.
    references: OWASP CSV Injection; NIST SP 800-53 AC-3 (Access Enforcement); NIST SP 800-53 SC-5 (DoS Protection)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for an export of a CUI dataset without per-user scoping, and Medium for an import operation with authorization checks. However, it rises to Critical if export is available to unauthenticated or low-privilege users.'
    false_positives: 'Three conditions hold: (1) export operations enforce row-level security identical to individual record access, (2) every exported string value is sanitized against formula injection, and (3) export size is bounded by a hard per-request limit.'
    function: architecture
    stride: information-disclosure
    cwe: 862
    detection_logic: 'Test the export endpoints by requesting an export with a low-privilege token, and verify that the result set includes no records beyond that token''s authorized scope. Additionally, submit import files that contain formula injection payloads, and verify that those payloads are sanitized in later exports. Finally, monitor export API calls for result sets that are unusually large relative to the requesting user''s normal access pattern.'
