  Media Downgrading Procedure Gap:
    id: media-downgrade-procedure-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'Media moved from a higher-classification enclave to a lower one is handled under a generic sanitization procedure rather than a distinct, verified downgrading process.'
    impact: 'If this risk remains unmitigated, residual higher-classification content surviving an incomplete downgrade is disclosed directly into a lower-classification environment.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Apply a documented, independently verified downgrading procedure — distinct from routine media destruction — to any media or dataset moved to a lower classification enclave, per NIST SP 800-53 MP-8.
    mitigation: Document a downgrading procedure separate from the standard media sanitization/disposal procedure, covering content review for residual higher-classification material, technical sanitization of any metadata or embedded artifacts (document properties, deleted-but-recoverable content, thumbnails), and independent verification by a second reviewer before the media or dataset is released to the lower enclave. Log every downgrade action with the reviewer identity and verification result.
    references: NIST SP 800-53 MP-8 (Media Downgrading); NIST SP 800-53 MP-6 (Media Sanitization); CNSSI 1253; DoD 5200.01 (DoD Information Security Program)
    risk_assessment: Critical for any asset performing high-to-low media or dataset downgrading without a documented, independently verified procedure distinct from routine disposal.
    false_positives: A documented downgrading procedure with independent second-reviewer verification is in place and evidenced by a per-transaction log, distinct from the routine media sanitization procedure.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Released Dataset Re-Identification Risk:
    id: dataset-reidentification-risk
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'A dataset slated for release has been de-identified but never tested against a motivated-intruder re-identification attempt using auxiliary data an adversary could reasonably access.'
    impact: 'If this risk remains unmitigated, a dataset believed to be anonymized can be re-identified after release, constituting a privacy disclosure.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Run a motivated-intruder re-identification test against the de-identified dataset using realistic auxiliary data before release, and document the result as part of the release approval.
    mitigation: Before release, conduct a re-identification risk assessment following NIST SP 800-188 methodology — attempt re-identification using auxiliary data an adversary could plausibly obtain, quantify the proportion of records at risk, and apply additional statistical disclosure limitation (generalization, suppression, k-anonymity/differential privacy techniques) until the residual risk is acceptable to the data owner. Re-run the assessment if the dataset is updated or if a new plausible auxiliary source becomes available before subsequent releases.
    references: NIST SP 800-188 (De-Identification of Government Datasets); NIST SP 800-53 SI-12 (Information Management and Retention)
    risk_assessment: High for any dataset containing PII or CUI-adjacent personal attributes released externally or broadly shared without a documented re-identification test.
    false_positives: A motivated-intruder re-identification test following NIST SP 800-188 has been conducted and documented for this specific release, with residual risk formally accepted by the data owner.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Missing Data Rights Management on Released Files:
    id: missing-data-rights-management
    baseline_likelihood: likely
    baseline_impact: low
    description: 'A file released beyond its originating boundary carries no persistent rights binding that travels with the copy.'
    impact: 'If this risk remains unmitigated, the releasing organization has no technical means to restrict, expire, or revoke access to a released copy after the fact.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Apply the enterprise rights-management capability (persistent encryption bound to identity/policy, with revocation support) to files released outside the originating boundary, rather than relying on recipient-side policy alone.
    mitigation: Route file releases through the enterprise Information Rights Management / Enterprise Digital Rights Management capability so the exported file remains encrypted and bound to an access policy the releasing organization controls, including expiration and revocation, independent of where the copy is subsequently stored. Reserve unprotected release for cases where the recipient system cannot honor rights-managed content and document that exception.
    references: NIST SP 800-53 AC-21 (Information Sharing); NIST SP 800-53 SC-28 (Protection of Information at Rest); DoD Enterprise Rights Management guidance
    risk_assessment: Medium, escalating to High for CUI releases to external or lower-trust recipients where no revocation capability exists once the file has left the boundary.
    false_positives: Released files are routed through an enterprise rights-management capability providing persistent, revocable access control, or the release is to a fully trusted internal recipient under the same authorization boundary.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

