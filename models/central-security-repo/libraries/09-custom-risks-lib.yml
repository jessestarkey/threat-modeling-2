  # --- 6.2 SECRETS AND CRYPTOGRAPHY ---
  FIPS Non-Compliant Cryptography:
    id: fips-non-compliant-cryptography
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This asset performs cryptographic operations without confirmed use of a FIPS-validated module.'
    impact: 'If this risk remains unmitigated, the finding independently blocks IL5 authorization, regardless of the underlying algorithm''s strength.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: 'Verify that every cryptographic operation on this asset uses a FIPS 140-2 or 140-3 validated module, and document the certificate number in the SSP.'
    mitigation: >-
      For AKS nodes, enable FIPS mode on the node pool (`--enable-fips-image` in the Azure CLI),
      which restricts the operating system to FIPS-validated OpenSSL.

      For application-layer cryptography, verify that the runtime's crypto provider uses a
      CMVP-validated module (for example, BoringCrypto for Go, or OpenSSL in FIPS mode for Python
      and Java).

      For TLS termination, confirm that the cipher suite configuration of the ingress controller or
      load balancer excludes non-FIPS algorithms (RC4, 3DES, and MD5).

      Document the CMVP certificate number of each validated module in the SSP.
    references: DoD Cloud Computing SRG IL5; NIST CMVP (https://csrc.nist.gov/projects/cryptographic-module-validation-program); FIPS 140-3
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is a High risk to the ATO. Specifically, FIPS non-compliance at a TLS termination point or an encryption-at-rest boundary is typically a CAT II finding under the DoD STIGs.'
    false_positives: 'Either (1) the asset handles only publicly releasable, non-CUI data with no confidentiality requirement, confirmed by a data classification review, or (2) the use of a FIPS-validated module is documented in the SSP with a valid CMVP certificate number.'
    function: architecture
    stride: information-disclosure
    cwe: 1240
    detection_logic: 'Run DISA STIG compliance scans (ACAS or Nessus) that target the cryptographic configuration checks. For AKS, verify the node pool''s FIPS status with `az aks nodepool show --query fipsEnabled`. Finally, for application cryptography, use SAST rules to flag imports of crypto libraries that are not FIPS-validated variants.'
    risks_identified: {}

  Deprecated TLS Versions and Weak Cipher Suites:
    id: deprecated-tls-weak-ciphers
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This TLS termination asset supports deprecated protocol versions or weak cipher suites that known attacks, such as POODLE or SWEET32, can exploit.'
    impact: 'If this risk remains unmitigated, a network-positioned adversary can decrypt protected traffic or perform a protocol downgrade attack.'
    asvs: V9 - Communications
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/TLS_Cipher_String_Cheat_Sheet.html
    action: 'Restrict the TLS configuration to a minimum of TLS 1.2 (with TLS 1.3 preferred) and to an approved, FIPS-compatible cipher suite list.'
    mitigation: >-
      Configure TLS to support only TLS 1.2 and TLS 1.3, and explicitly disable TLS 1.0, TLS 1.1,
      and SSL 3.0.

      Restrict cipher suites to those that provide forward secrecy (ECDHE key exchange) and strong
      symmetric ciphers (AES-128-GCM, AES-256-GCM, and CHACHA20-POLY1305).

      Disable the RC4, 3DES, NULL, EXPORT, and anonymous DH cipher suites.

      For Azure Application Gateway and Front Door, apply the predefined TLS policy
      AppGwSslPolicy20220101S or an equivalent.

      Verify the configuration with automated TLS scanning on every deployment.
    references: DISA Application Security and Development STIG V5R3 (APSC-DV-002010, APSC-DV-002030); NIST SP 800-52r2 (Guidelines for TLS); NSA/CISA TLS Best Practices
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is Medium, which corresponds to a CAT II STIG finding. However, it rises to High if the asset is internet-facing and TLS 1.0 or 1.1 is enabled for compatibility with legacy clients.'
    false_positives: 'The TLS configuration has been audited and confirmed to support only TLS 1.2 or later with an approved cipher suite list. Additionally, this is documented in the SSP, with the scan output as evidence.'
    function: architecture
    stride: information-disclosure
    cwe: 327
    detection_logic: 'Run testssl.sh or sslyze against every TLS endpoint in the CI/CD pipeline, and fail the build when it detects deprecated protocols or weak ciphers. Additionally, integrate the Azure Security Center TLS recommendations into the compliance dashboard. Finally, schedule quarterly TLS configuration scans through ACAS or Nessus.'
