  # --- 8.1 INCIDENT-RESPONSE READINESS ---
  Undocumented Incident Containment Disposition:
    id: undocumented-containment-disposition
    baseline_likelihood: unlikely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'An asset in a mission-essential or mission-critical system has no documented containment disposition. Specifically, nothing records whether the asset may be isolated automatically during a suspected compromise, or whether isolation requires human approval first.'
    impact: 'If this risk remains unmitigated, the response to an active incident stalls while someone makes an ad hoc approval decision. Alternatively, the asset is isolated in a way that causes unintended operational impact.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://csrc.nist.gov/pubs/sp/800/61/r2/final
    action: 'Document whether automated containment of this asset is (1) permitted, (2) permitted only with human approval, or (3) prohibited. Then, record that disposition where the incident response team can find it during an active incident.'
    mitigation: >-
      Record a containment disposition for every asset in a model rated mission-essential or
      mission-critical, as well as for every internet-reachable, policy-exception, or cross-domain
      asset. The disposition is one of three options, namely auto-isolation permitted, human
      approval required, or auto-isolation prohibited.

      The asset owner and the response team should decide it together in advance and record it in
      the asset's documentation or the incident response runbook, rather than improvising it during
      an incident.

      Where auto-isolation is prohibited, such as for a safety-relevant or high-availability system,
      document the manual containment procedure to use instead.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Medium. Impact then steps on the asset''s availability rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any asset in a mission-essential or mission-critical system with no documented containment disposition.'
    false_positives: 'A containment disposition for this asset is documented in the incident response runbook, and both the asset owner and the response team have agreed to it.'
    function: operations
    stride: denial-of-service
    cwe: 1059
    risks_identified: {}

