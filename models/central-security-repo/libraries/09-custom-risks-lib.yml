  Missing Privacy Impact Assessment:
    id: missing-privacy-impact-assessment
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This asset processes or stores PII on individuals. However, no current Privacy Impact Assessment documents what is collected, why, and how it is protected, as Section 208 of the E-Government Act of 2002 requires.'
    impact: 'If this risk remains unmitigated, privacy risks in the system''s actual design go unreviewed until an incident, an audit, or a FOIA request forces the question. At that point, remediation is far more disruptive than a documented assessment would have been.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/User_Privacy_Protection_Cheat_Sheet.html
    action: 'Document a Privacy Impact Assessment for this system that covers what PII is collected, the legal authority for collecting it, how it is used and shared, its retention, and its safeguards. Additionally, reassess it whenever the handling of PII changes materially.'
    mitigation: >-
      Complete a Privacy Impact Assessment (PIA) using the sponsoring agency's PIA template, as
      Section 208 of the E-Government Act of 2002 requires. The PIA documents what PII this asset
      collects, the legal authority for collecting it, how it is used and shared, its retention, and
      the safeguards that protect it.

      Route the PIA through the organization's Senior Agency Official for Privacy (or equivalent)
      for review, and for publication where it is publicly releasable.

      Reassess and update the PIA whenever the system's collection, use, or sharing of PII changes
      materially, rather than only on a fixed calendar.
    references: E-Government Act of 2002, Section 208 (Privacy Impact Assessments); OMB Circular A-130; DoD Instruction 5400.16 (DoD Privacy Impact Assessment Guidance)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any asset that processes PII with no current PIA on file, or with a PIA that predates a material change to what PII is collected or how it is used.'
    false_positives: 'The asset is tagged data:pia-documented, which confirms that a current Privacy Impact Assessment covers this asset''s actual collection, use, and sharing of PII, and that it has been reviewed since the last material change.'
    function: operations
    stride: information-disclosure
    cwe: 359
    risks_identified: {}

  Missing Data Provenance and Lineage Chain-of-Custody:
    id: missing-data-provenance-chain
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'Data ingested from an external or upstream source has no origin register or append-only provenance record that is checked at the point of consumption.'
    impact: 'If this risk remains unmitigated, a substituted or tampered source is indistinguishable from a legitimate one, since nothing exists to compare it against.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
    action: 'Establish an origin register for every external feed that this asset ingests. Additionally, enforce a provenance or integrity check (a hash manifest, a signed manifest, or an equivalent) at consumption time, before the data is trusted downstream.'
    mitigation: >-
      Maintain an append-only provenance log that records the source identity, the transfer
      timestamp, and the content hash of every batch or record ingested from an external feed.

      Verify the hash, or a cryptographic signature where the upstream source supports one, at
      consumption time, and reject or quarantine any batch that fails verification.

      The ingest pipeline must not be the sole authority on what was received. In other words, the
      provenance log must be written by a component that the ingest pipeline cannot silently
      rewrite.
    references: NIST SP 800-53 SR-4 (Provenance); NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-161 (Cybersecurity Supply Chain Risk Management Practices)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any pipeline that ingests external or third-party data feeding a decision, a model, or a downstream mission system, where no origin or integrity record exists.'
    false_positives: 'The ingest pipeline verifies a cryptographic signature or a hash manifest against each batch at consumption time. Additionally, it writes the result to a provenance log that the pipeline itself cannot modify.'
    function: architecture
    stride: tampering
    cwe: 345
    risks_identified: {}

  Data Loss Prevention Egress Path Blind Spot:
    id: dlp-egress-blind-spot
    baseline_likelihood: possible
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'At least one of this asset''s data egress paths, namely bulk export, attachments, or file transfer, is not inspected against data classification labels before content leaves.'
    impact: 'If this risk remains unmitigated, a malicious insider or a compromised account can move CUI out through a legitimate export feature without triggering any control.'
    asvs: V8 - Data Protection
    cheat_sheet: https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final
    action: 'Route every bulk-export, attachment, and outbound file-transfer path through the enterprise DLP inspection point before content leaves the asset''s boundary.'
    mitigation: >-
      Inspect outbound content at every egress path (an export endpoint, an email-sending
      integration, or an upload-to-external-destination feature) against the enterprise DLP engine's
      classification-aware policy before the transfer completes.

      Where DLP inspection cannot be inserted inline, log the full content manifest of every bulk
      export to the SIEM, so that a review after the fact is possible.

      Treat any export feature added after the DLP policy was last reviewed as out of compliance
      until the policy is extended to cover it.
    references: NIST SP 800-53 AC-4 (Information Flow Enforcement); NIST SP 800-53 SC-7(10) (Boundary Protection — Prevent Exfiltration); DoDI 8500.01 (Cybersecurity)
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any asset with a bulk-export, attachment, or external-transfer feature that the enterprise DLP policy does not cover.'
    false_positives: 'Every identified egress path for this asset is listed in the DLP policy and confirmed to route through classification-aware inspection before content leaves.'
