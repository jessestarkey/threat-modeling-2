  Application Cache Poisoning and Sensitive Data Persistence:
    id: cache-poisoning-data-persistence
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'The asset serves responses from an application-level cache with one of two weaknesses. Either (1) its cache keys may not include every parameter that affects the response, or (2) its cache server is reachable without authentication.'
    impact: 'If this risk remains unmitigated, one user''s cached response, including sensitive data, can be served to a different user. Alternatively, anyone on the internal network can read or write the cache server directly.'
    asvs: V8 - Data Protection / V13 - API
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Web_Cache_Security_Cheat_Sheet.html
    action: 'Include every response-influencing parameter in cache keys, enforce authentication on cache servers, and apply TTLs that are appropriate for CUI.'
    mitigation: >-
      Include every parameter that influences the response (such as the user ID, tenant ID, role,
      and content type) in the cache key, and never cache user-specific responses under
      user-agnostic keys.

      Require authentication on every cache connection (Redis AUTH or Entra ID authentication), and
      restrict network access to the application pods that need it.

      Set a TTL on every entry that holds user data, and keep CUI cached for no longer than 15
      minutes.

      Never cache responses that contain session tokens, credentials, or CUI in a shared layer, and
      use private caches for sensitive per-user data.
    references: NIST SP 800-53 SC-28 (Protection of Information at Rest); NIST SP 800-53 AC-3 (Access Enforcement); OWASP Cache Poisoning
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a Redis or Memcached instance that has no authentication and is accessible to multiple application pods. Furthermore, it is Critical if session tokens or CUI are cached at the shared layer without proper key scoping.'
    false_positives: 'Four conditions hold: (1) the cache server requires authentication, (2) it is network-restricted to only the authorized application pods, (3) the cache keys include every user- and tenant-scoping parameter, and (4) no CUI or session data is stored at the shared cache layer.'
    function: architecture
    stride: information-disclosure
    cwe: 524
    detection_logic: 'Scan the internal network for unauthenticated Redis or Memcached ports (6379 and 11211) that are accessible from application pods. Additionally, test cache key scoping by making the same request as two different users, and verify that the responses are not interchangeable. Finally, inspect the cache TTL configuration for entries that contain sensitive data, and alert on entries without a TTL.'
    risks_identified: {}

