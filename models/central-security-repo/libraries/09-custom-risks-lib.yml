  'MAESTRO L6: AI-Powered Security Tooling Compromise':
    id: maestro-l6-security-ai-compromise
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'AI-powered defensive tools that make trust decisions and trigger automated responses are themselves adversarial targets, and their compromise has outsized consequences.'
    impact: 'If this risk remains unmitigated, a compromised security AI can suppress alerts for the attacker''s own activity, generate false incidents to overwhelm analysts, or pivot to other systems from a trusted context.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Apply the same adversarial threat modeling to AI security tools as to the systems they protect.
    mitigation: Maintain an independent, non-AI detection layer as a backstop that the AI security tool cannot disable. Treat training and operational data fed to security AI as a high-value, integrity-protected asset. Implement adversarial robustness testing on security AI models before deployment and after significant retraining. Scope security AI agent permissions to advisory-only — alert generation, not automated response — unless human-in-the-loop approval is enforced for all response actions.
    references: MAESTRO L6 (Security and Compliance — Vertical Layer) — Security Agent Data Poisoning, Evasion of Security AI Agents, Compromised Security AI Agents, Bias in Security AI; NIST SP 800-53 SI-3, SI-7
    risk_assessment: Critical for any organization where an AI security tool has automated response authority (block, quarantine, disable). High for AI-assisted analysis tools with advisory-only scope.
    false_positives: The AI security tool is read-only and advisory with no automated response capability, and all actions require human approval via a separate, non-AI workflow.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Implement a parallel rule-based detection layer that operates independently of the AI security tool and alerts if their outputs diverge significantly. Monitor the security AI's own inference logs for anomalous input patterns. Periodically run known-malicious test scenarios against the security AI to verify detection (canary testing).
    risks_identified: {}

  'MAESTRO L7: Agent Ecosystem Identity, Impersonation, and Goal Manipulation':
    id: maestro-l7-agent-ecosystem-identity
    # Bumped from unlikely -- was rated a full tier below its own closest
    # peers by trigger population (ATLAS: AI Agent Orchestration Hijack and
    # Persistence, ATLAS: AI Agent Tool and Plugin Compromise -- both
    # `likely`, both fire on the same ai:multi-agent-boundary assets
    # alongside this one), with no principled reason identity spoofing/
    # impersonation at a trust boundary should be inherently rarer than
    # orchestration hijacking or tool/plugin compromise -- if anything it's
    # a more mechanically approachable attack pattern (forging a token or
    # identity claim is well-worn across all of security), not a rarer
    # one. The other `unlikely`-rated categories in this file share a trait
    # this one doesn't: they're about compromising a shared upstream/
    # infrastructure component (a model registry, a framework dependency,
    # an observability stack) -- a genuinely rarer class of attack -- while
    # this category is about spoofing/impersonation at a boundary, closer
    # in kind to its `likely`-rated orchestration/tool-compromise siblings.
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'At multi-agent trust boundaries where agents delegate tasks across identity domains, the absence of strong agent identity and authorization controls enables impersonation, goal manipulation, and repudiation.'
    impact: 'If this risk remains unmitigated, a malicious agent can impersonate a trusted one or alter another agent''s objectives, operating silently inside the system''s own trusted execution context.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Establish cryptographic agent identity and a non-repudiation audit trail for all cross-agent interactions before deploying multi-agent workflows.
    mitigation: Assign each agent a unique, cryptographically verifiable identity (DIDs or PKI-backed service accounts) and require mutual authentication for all agent-to-agent communication. Maintain a central agent registry with strict admission controls — require signed manifests for all registered agents and tool definitions. Implement rate limiting on agent identity issuance to detect Sybil attacks. Enforce immutability on deployed agent system prompts — any modification must go through an audited change management process. Log all agent-to-agent interactions with cryptographic non-repudiation. Implement name collision detection in MCP/tool registries.
    references: MAESTRO L7 (Agent Ecosystem) — Agent Impersonation, Agent Goal Manipulation, Sybil Attacks, Marketplace Manipulation, Repudiation; CSA AI NHI Survey 2025 (51% of orgs have no AI identity ownership); NIST SP 800-53 IA-9 (Service Identification and Authentication)
    risk_assessment: Critical for any multi-agent deployment where agents delegate tasks across trust boundaries. High for single-agent deployments that interact with externally registered tools or MCP servers.
    false_positives: Deployment uses only a single, fully isolated agent with no inter-agent communication, all tool definitions are hardcoded and version-pinned, and no external agent registry is consulted at runtime.
    function: architecture
    stride: spoofing
    detection_logic: Monitor agent registry for registrations or modifications outside the approved change window. Alert on anomalous spikes in agent identity issuance. Audit cross-agent interaction logs for identity mismatches between claimed and cryptographically verified agent identity. Run periodic canary interactions using known-good agent identities to verify impersonation detection.
    risks_identified: {}

  # --- 5.3 AI OPERATIONAL AND DEPLOYMENT HARDENING GAPS ---
  # Beyond standard ATLAS technique coverage and MAESTRO layer generalities
  # above -- specific operational controls for fielding and running AI
  # systems that a technique/layer catalog alone does not capture.
  AI Output Path to OT or Safety-Critical Actuation Without Human Gate:
    id: ai-ot-actuation-boundary-gap
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'This AI system''s output has a path to an operational technology actuator or safety-critical process with no technical, AI-unbypassable human authorization gate in between.'
    impact: 'If this risk remains unmitigated, a model failure -- hallucination, prompt injection, or adversarial manipulation -- can directly trigger a physical-world safety incident with no human decision point to catch it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Insert a technical, AI-system-unbypassable human authorization gate between any AI-generated output and OT/safety-critical actuation, and document a standing policy prohibiting fully autonomous safety-relevant decisions.
    mitigation: Architect the actuation path so the AI system's output is a proposal routed to a human approver through a channel the AI system itself has no ability to complete or bypass (not a UI element the AI system could theoretically also be granted access to). Maintain a documented, enforced policy listing prohibited autonomous use cases (autonomous safety decisions, autonomous mission-critical control, unsupervised process changes) checked at system intake/design review, not left to individual deployment teams to self-assess.
    references: NIST AI RMF (GOVERN 1.2, MANAGE 2.3); MAESTRO L6 (Security and Compliance); IEC 61508 (Functional Safety) where applicable to the actuated process
    risk_assessment: Critical for any AI system with output reaching an OT actuator or safety-critical process through any path not mediated by an unbypassable human gate.
    false_positives: AI system output is strictly advisory with no technical path to actuation, or every actuation path is confirmed to route through a human approval gate the AI system cannot complete or bypass.
    function: architecture
    stride: elevation-of-privilege
    risks_identified: {}

  Ungoverned Production System Prompt Change:
    id: ungoverned-system-prompt-change
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset''s production system prompt can be edited without version control, review, or injection-hardening requirements.'
    impact: 'If this risk remains unmitigated, an unreviewed prompt change can silently widen the model''s capability or remove a safety constraint, with no runtime signal for a filter or detector to catch.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Bring production system prompts under source control with mandatory review before deployment, and enforce explicit instruction-boundary/context-separation structure in every version.
    mitigation: Store system prompts as versioned artifacts in source control, requiring the same PR review and approval as application code before a change reaches production. Require every system prompt version to maintain explicit structural separation between system instructions, user input, and any retrieved/tool-returned content (clear delimiters, role-anchoring), reviewed as part of the change. Log which prompt version served each production request so an incident can be traced to the exact prompt in effect at the time.
    references: NIST AI RMF (GOVERN 1.5, MANAGE 4.1); OWASP Top 10 for LLM Applications (LLM01 Prompt Injection); NIST SP 800-53 CM-3 (Configuration Change Control)
    risk_assessment: High for any production LLM asset where the system prompt can be modified without version control and review.
    false_positives: The asset is tagged ai:system-prompt-governed confirming system prompts are version-controlled with mandatory review and enforce explicit instruction-boundary structure.
    function: operations
    stride: tampering
    risks_identified: {}

  On-Device Model Extraction Resistance Gap:
    id: on-device-model-extraction-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This model is fielded onto edge or embedded hardware an adversary could gain physical custody of, but runs outside a trusted execution environment or secure enclave.'
    impact: 'If this risk remains unmitigated, physical custody of the device yields the full model to an adversary with no detection or revocation possible afterward.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Mobile_Application_Security_Cheat_Sheet.html
    action: Deploy models to edge/embedded devices only within a Trusted Execution Environment or secure enclave, encrypted at rest, with debug/side-channel access disabled on production hardware.
    mitigation: Host model weights within a hardware-backed TEE or secure enclave on the device (e.g., ARM TrustZone, a dedicated security chip) rather than in general-purpose storage or memory reachable by the device's main OS. Encrypt model artifacts at rest on the device, with the decryption key never persisted outside the enclave. Disable JTAG/debug interfaces and other side-channel access paths on production hardware builds.
    references: NIST AI RMF (MANAGE 2.3); MAESTRO L1 (Foundation Models) / L6 (Security and Compliance); NIST SP 800-53 SC-28 (Protection of Information at Rest)
    risk_assessment: High for any model deployed to edge/embedded hardware an adversary could physically obtain, where the model does not run within a TEE/secure enclave.
    false_positives: The asset is tagged ai:secure-enclave-protected confirming the model runs and is encrypted within a hardware-backed TEE/secure enclave on the device, with debug interfaces disabled.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Offline or Air-Gapped Model Package Integrity Gap:
    id: air-gapped-model-package-integrity-gap
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'A model destined for a disconnected enclave is not verified as a single signed package at every load, only at the point of initial transfer.'
    impact: 'If this risk remains unmitigated, a substituted or tampered model artifact sitting inside the enclave has no external signal to catch it and no way to be detected short of per-load cryptographic verification.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: Assemble the model (weights, tokenizer, config, manifest) into a single signed package verified against a pinned key on every load inside the disconnected enclave, not only at transfer time.
    mitigation: Package the complete model artifact set (weights, tokenizer, configuration, and a manifest listing hashes of each component) and sign the package with a key held outside the disconnected enclave's own administrative control. Verify the signature at every model load inside the enclave — not only once when the package first arrives — so a substitution introduced after transfer is still caught. Maintain the signing key's custody chain outside the enclave to prevent an enclave insider from re-signing a tampered package.
    references: NIST SP 800-53 SR-4 (Provenance); NIST SP 800-218 (Secure Software Development Framework); NIST AI RMF (MANAGE 2.3)
    risk_assessment: Critical for any model delivered into a disconnected/air-gapped enclave without per-load signature verification against an externally-held key.
    false_positives: The asset is tagged ai:model-package-signed confirming the model package is signed with an externally-held key and verified at every load, not only at transfer time.
    function: architecture
    stride: tampering
    risks_identified: {}

  Missing Model Rollback and Kill-Switch Mechanism:
    id: missing-model-rollback-killswitch
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'There is no capability to revert this model-serving asset to a previously validated version, or cut traffic via a kill switch, without rerunning the full deployment pipeline.'
    impact: 'If this risk remains unmitigated, a model found to be compromised or badly regressed continues serving production traffic for the full duration of a redeployment cycle.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Implement a rollback mechanism that restores a previously validated model version within a defined recovery time, and a kill switch that can halt serving entirely with a defined safe-mode fallback.
    mitigation: Maintain the previous validated model version in a ready-to-serve state (not archived/cold storage) so traffic can be redirected to it without a full pipeline run, and define and test the actual recovery time this takes. Implement a kill switch — both an automated trigger (e.g., on an eval/canary failure) and a manual override — that halts serving and falls back to a defined safe mode (static response, degraded functionality, or full outage, whichever is safer for this use case) rather than continuing to serve a known-bad model.
    references: NIST AI RMF (MANAGE 2.2, MANAGE 4.1); MAESTRO L5 (Evaluation and Observability)
    risk_assessment: High for any production model-serving asset with no tested rollback path and no kill switch independent of the standard deployment pipeline.
    false_positives: The asset is tagged ai:rollback-capable confirming a tested rollback-within-recovery-time path and an independent kill switch with a defined safe-mode fallback exist.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  No Canary Prompt Testing Against Production Inference Endpoint:
    id: missing-canary-prompt-testing
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'There is no versioned suite of known-answer prompts run against the production inference endpoint on a recurring cadence to detect a silently swapped model, a disabled safety filter, or an unreviewed system prompt change.'
    impact: 'If this risk remains unmitigated, a disabled guardrail or a silently swapped model can persist for an extended period, since traffic-based monitoring alone has no independent baseline to compare against.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Run a versioned suite of fixed, known-answer canary prompts against the production inference endpoint on a recurring schedule, and alert on any deviation from the expected response class.
    mitigation: Build a versioned suite of canary prompts with known-acceptable response characteristics (including prompts specifically designed to verify safety guardrails are active) and execute it against the production endpoint on a defined schedule (e.g., hourly), independent of real user traffic. Alert immediately on any canary result outside its expected class, since this is one of the few signals that catches a silent model swap, a disabled guardrail, or an unreviewed system prompt change without waiting for a user-visible incident.
    references: NIST AI RMF (MEASURE 2.7, MANAGE 4.1); MAESTRO L5 (Evaluation and Observability)
    risk_assessment: High for any production inference endpoint with no recurring canary suite independent of real traffic monitoring.
    false_positives: The asset is tagged ai:canary-tested confirming a versioned canary prompt suite runs against the production endpoint on a recurring schedule with alerting on deviation.
    function: operations
    stride: tampering
    risks_identified: {}

  Untrusted Model Registry Source:
    id: untrusted-model-registry-source
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'This serving platform has loaded, or can load, a model whose registry host and artifact digest do not resolve to an approved internal registry.'
    impact: 'If this risk remains unmitigated, a model bypasses every certification, signing, and scanning gate the approved registry enforces, with no way for the serving platform to distinguish it from a properly vetted one.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: Restrict the serving platform to load models only from the approved internal registry, verified by registry host and artifact digest, and block direct loading from any other source.
    mitigation: Configure the serving platform's model-loading path to accept only artifacts whose registry host and digest match the approved internal registry's manifest — reject any load request referencing a public hub, a local filesystem path outside the registry sync location, or an unrecognized host. Treat a request to bypass this restriction (e.g., for rapid experimentation) as requiring the same review as a production deployment, not an informal exception.
    references: NIST SP 800-53 SR-4 (Provenance); NIST AI RMF (MANAGE 2.3); MAESTRO L6 (Security and Compliance) / L7 (Ecosystem)
    risk_assessment: Critical for any serving platform capable of loading a model from a source other than the approved internal registry.
    false_positives: The asset is tagged ai:registry-source-verified confirming the serving platform loads models only from the approved internal registry, verified by host and digest.
    function: architecture
    stride: tampering
    risks_identified: {}

  Training Script and Feature-Engineering Pipeline IP Exfiltration:
    id: training-script-ip-exfiltration
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Training scripts and feature-engineering pipelines lack the access restriction and egress monitoring applied to the model artifacts they produce, despite often being more valuable.'
    impact: 'If this risk remains unmitigated, exfiltration of the training methodology lets an adversary replicate or improve on the model while triggering none of the controls built to protect the weights.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
    action: Apply the same access restriction, encryption, and bulk-clone/egress monitoring to training scripts and feature-engineering pipelines as to model weight artifacts.
    mitigation: Restrict read/write access to training scripts and feature-engineering code to the named population that needs it, encrypt the repository at rest, and monitor for bulk-clone or high-volume export activity against it the same way an export path for model weights or CUI data would be monitored. Do not treat training code as ordinary application source code subject only to standard repository access controls, given its distinct value as reproducible model methodology.
    references: NIST SP 800-53 SR-4 (Provenance); NIST AI RMF (MANAGE 2.3); NIST SP 800-53 AC-4 (Information Flow Enforcement)
    risk_assessment: High for any training/feature-engineering repository with no access restriction or egress monitoring beyond standard source-control defaults.
    false_positives: The asset is tagged ai:training-code-protected confirming training scripts and feature-engineering code are access-restricted, encrypted at rest, and monitored for bulk-clone/export activity.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Hyperparameter Tampering Without Baseline Diffing:
    id: hyperparameter-tampering-no-baseline-diff
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'There is no diff of a training run''s actual applied hyperparameters against an approved baseline before the resulting model is promoted.'
    impact: 'If this risk remains unmitigated, an insider can bias what a model learns by changing a single hyperparameter, leaving no trace in the code and still passing standard evaluation.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Diff every promotion-bound training run's actual applied hyperparameters against an approved per-pipeline baseline before the resulting model is eligible for promotion.
    mitigation: Record the actual hyperparameters applied to every training run (not merely the config file as authored, but what was actually passed to the training job, since these can diverge) and diff them against an approved baseline for that pipeline before allowing promotion. Require a documented, reviewed justification for any deviation from baseline rather than allowing silent divergence. Retain the recorded hyperparameters alongside the resulting model artifact for later audit.
    references: NIST AI RMF (MANAGE 2.3, MEASURE 2.7); NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity)
    risk_assessment: High for any training pipeline promoting models with no recorded hyperparameter diff against an approved baseline.
    false_positives: The asset is tagged ai:hyperparameter-diffed confirming every promotion-bound run's actual applied hyperparameters are recorded and diffed against an approved baseline before promotion.
    function: operations
    stride: tampering
    risks_identified: {}

  Ungoverned Third-Party Foundation Model API Dependency:
    id: ungoverned-third-party-model-api
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset sends requests to a vendor-hosted foundation model API with no restriction on which data classifications may be transmitted, no confirmed training-use opt-out, and no recurring review of the vendor''s security posture.'
    impact: 'If this risk remains unmitigated, sending CUI to the vendor API can constitute a data disclosure to a third party the organization does not control.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Third_Party_Javascript_Management_Cheat_Sheet.html
    action: Restrict which data classifications may be transmitted to this vendor model API (including RAG-retrieved context), confirm a training-use opt-out term is on file, vault and rotate the API key as an internal secret, and review the vendor's security posture on a recurring cadence.
    mitigation: 'Implement a technical or procedural gate restricting what classification of content — including content retrieved by a RAG pipeline and passed along with the prompt, not only the user''s direct input — may be sent to this vendor API. Confirm and retain the vendor''s contractual training-use opt-out (the vendor does not use submitted content to train its own models) as a condition of use. Treat the API key with the same vaulting and rotation discipline as any internal credential, not a static value embedded in configuration. Schedule a recurring review of the vendor''s SOC 2 report, subprocessor list, and incident notification terms.'
    references: NIST AI RMF (GOVERN 6.1, MAP 4.1); NIST SP 800-53 SA-9 (External System Services); DoD Cloud Computing SRG (for vendor authorization level)
    risk_assessment: Critical for any asset transmitting CUI-adjacent or classification-sensitive content (directly or via RAG context) to a vendor model API with no data-transmission restriction or confirmed training-use opt-out.
    false_positives: The asset is tagged ai:vendor-model-governed confirming a data-transmission classification restriction is enforced, a training-use opt-out is on file, the API key is vaulted/rotated as an internal secret, and vendor security posture is reviewed on a recurring cadence.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  AI-Generated Decision Support Without Verification Signal:
    id: ai-overreliance-misinformation
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset presents AI-generated output to a human as input to a consequential decision, with no confidence indicator, citation/provenance, or mandatory verification step to help the human catch a confidently wrong (hallucinated) answer.'
    impact: 'If this risk remains unmitigated, a human decision-maker can act on a fluent, confident, but factually wrong AI output -- misclassifying data, misreporting status, or authorizing an action based on a fabricated summary of CUI -- with no built-in signal distinguishing a well-grounded answer from a hallucinated one.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Surface a confidence indicator, source citation, or provenance trail alongside AI-generated output feeding any consequential decision, and require explicit human verification before the decision is finalized.
    mitigation: Attach source citations or retrieval provenance to AI-generated output wherever the underlying answer is grounded in retrieved content, so a reviewer can check the answer against its source directly. Surface a calibrated confidence or uncertainty indicator rather than presenting every answer with uniform, confident phrasing. For decisions above a defined consequence threshold, require an explicit human acknowledgment step that the output has been checked against an independent source before the decision is recorded as final. Periodically sample production outputs feeding real decisions against ground truth to measure actual hallucination rate in context, not just in a lab benchmark.
    references: OWASP LLM09:2025 (Misinformation); NIST AI RMF (MEASURE 2.7, MANAGE 2.3); MAESTRO L6 (Security and Compliance)
    risk_assessment: High where the AI output directly informs a consequential decision (classification, compliance status, operational action) with no citation or confidence signal. Medium where output is advisory in a low-stakes context or already paired with partial provenance.
    false_positives: The asset is tagged ai:output-confidence-disclosed confirming AI-generated output feeding decisions carries citations, confidence indicators, or a mandatory human-verification step before the decision is finalized.
    function: operations
    stride: tampering
    risks_identified: {}

  # #############################################################################
  # DOMAIN 6: DATA
  # #############################################################################

  # --- 6.1 DATA GOVERNANCE AND LIFECYCLE ---
  Unclassified or Unscanned Data Store:
    id: unscanned-data-store
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'A persistent data store has never been run through an automated classification scan, so no sensitivity label attaches to the data it holds.'
    impact: 'If this risk remains unmitigated, downstream controls that depend on that label -- encryption tier, access policy, DLP, retention -- apply a default posture that may not match the data''s true sensitivity.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Enroll the data store in an automated discovery/classification scan and apply the resulting sensitivity labels before any classification-driven control is configured.
    mitigation: Run an automated classification/discovery scan (e.g., Microsoft Purview, Azure Information Protection scanner) against the store on a recurring schedule, not just at provisioning. Attach the resulting sensitivity labels to the asset's metadata so downstream controls (encryption tier, access policy, DLP, retention) can be driven by the label rather than by an assumption made at design time. Re-scan after any bulk import, migration, or schema change that could introduce new data categories.
    references: NIST SP 800-53 RA-2 (Security Categorization); DoDI 5200.48 (Controlled Unclassified Information); CNSSI 1253 (Security Categorization for National Security Systems)
    risk_assessment: High for any data store holding CUI or PII where no classification scan has ever been run or where the last scan predates the most recent significant data change.
    false_positives: The data store's contents have been scanned and labeled by an approved classification tool, and the scan is re-run on a documented recurring schedule tied to data change events.
    function: architecture
    stride: information-disclosure
    detection_logic: Query the classification tool's coverage report for this asset's storage account/database and alert if no scan has completed within the defined interval, or if the asset holds data but carries no sensitivity label at all.
    risks_identified: {}

  Missing Privacy Impact Assessment:
    id: missing-privacy-impact-assessment
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset processes or stores PII on individuals, but no current Privacy Impact Assessment documents what is collected, why, and how it is protected, as required by Section 208 of the E-Government Act of 2002.'
    impact: 'If this risk remains unmitigated, privacy risks in the system''s actual design go unreviewed until an incident, audit, or FOIA request forces the question, at which point remediation is far more disruptive than a documented assessment would have been.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Document a Privacy Impact Assessment for this system covering what PII is collected, the legal authority for collecting it, how it is used and shared, retention, and safeguards, and reassess it whenever PII handling changes materially.
    mitigation: Complete a Privacy Impact Assessment (PIA) per the sponsoring agency's PIA template and Section 208 of the E-Government Act of 2002, documenting what PII this asset collects, the legal authority for collecting it, how it is used and shared, retention, and the safeguards protecting it. Route the PIA through the organization's Senior Agency Official for Privacy (or equivalent) for review and publication where publicly releasable. Reassess and update the PIA whenever the system's PII collection, use, or sharing changes materially, not on a fixed calendar alone.
    references: E-Government Act of 2002, Section 208 (Privacy Impact Assessments); OMB Circular A-130; DoD Instruction 5400.16 (DoD Privacy Impact Assessment Guidance)
    risk_assessment: High for any asset processing PII with no current PIA on file, or a PIA that predates a material change to what PII is collected or how it is used.
    false_positives: The asset is tagged data:pia-documented confirming a current Privacy Impact Assessment covers this asset's actual PII collection, use, and sharing, and has been reviewed since the last material change.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Missing Data Provenance and Lineage Chain-of-Custody:
    id: missing-data-provenance-chain
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Data ingested from an external or upstream source has no origin register or append-only provenance record checked at the point of consumption.'
    impact: 'If this risk remains unmitigated, a substituted or tampered source is indistinguishable from a legitimate one, since there is nothing to compare it against.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Product_Design_Cheat_Sheet.html
    action: Establish an origin register for every external feed this asset ingests, and enforce a provenance/integrity check (hash manifest, signed manifest, or equivalent) at consumption time before the data is trusted downstream.
    mitigation: Maintain an append-only provenance log recording the source identity, transfer timestamp, and content hash for every batch or record ingested from an external feed. Verify the hash (or a cryptographic signature, where the upstream source supports one) at consumption time and reject or quarantine any batch that fails verification. Do not allow the ingest pipeline itself to be the sole authority for what was received — the provenance log must be written by a component the ingest pipeline cannot silently rewrite.
    references: NIST SP 800-53 SR-4 (Provenance); NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-161 (Cybersecurity Supply Chain Risk Management Practices)
    risk_assessment: High for any pipeline ingesting external or third-party data that feeds a decision, a model, or a downstream mission system, where no origin/integrity record exists.
    false_positives: The ingest pipeline verifies a cryptographic signature or hash manifest against each batch at consumption time and writes the result to a provenance log the pipeline itself cannot modify.
    function: architecture
    stride: tampering
    risks_identified: {}

  Data Loss Prevention Egress Path Blind Spot:
    id: dlp-egress-blind-spot
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'One or more of this asset''s data egress paths -- bulk export, attachment, or file transfer -- is not inspected against data classification labels before content leaves.'
    impact: 'If this risk remains unmitigated, a malicious insider or compromised account can move CUI out through a legitimate export feature without triggering any control.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Route every bulk-export, attachment, and outbound file-transfer path through the enterprise DLP inspection point before content leaves the asset's boundary.
    mitigation: Inspect outbound content at every egress path (export endpoint, email-sending integration, upload-to-external-destination feature) against the enterprise DLP engine's classification-aware policy before the transfer completes. Where DLP inspection cannot be inserted inline, log the full content manifest of every bulk export to the SIEM so post-hoc review is possible. Treat an export feature added after the DLP policy was last reviewed as out of compliance until the policy is extended to cover it.
    references: NIST SP 800-53 AC-4 (Information Flow Enforcement); NIST SP 800-53 SC-7(10) (Boundary Protection — Prevent Exfiltration); DoDI 8500.01 (Cybersecurity)
    risk_assessment: High for any asset with a bulk-export, attachment, or external-transfer feature that is not covered by the enterprise DLP policy.
    false_positives: All identified egress paths for this asset are enumerated in the DLP policy and confirmed to route through classification-aware inspection before content leaves.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Missing Data Retention and Disposition Schedule:
    id: missing-data-retention-schedule
    baseline_likelihood: likely
    baseline_impact: low
    description: 'The asset holds data with no documented retention period or disposition action tied to its classification type.'
    impact: 'If this risk remains unmitigated, sensitive holdings can be retained indefinitely with no owner for disposal, while records needed for a later investigation can be lost prematurely.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Document a retention period and a specific disposition action (not merely "delete") for each data/classification type this asset holds, and implement automated enforcement where the platform supports it.
    mitigation: Define a retention schedule per data classification/record type, sourced from the applicable NARA General Records Schedule or program-specific records disposition schedule, specifying both a minimum retention period and a required disposition action at expiry. Automate enforcement (lifecycle policies on the storage layer) wherever possible rather than relying on manual review. Ensure the schedule explicitly protects audit and provenance records for at least the minimum period required to support an incident investigation opened near the end of the retention window.
    references: NIST SP 800-53 SI-12 (Information Management and Retention); NIST SP 800-53 AU-11 (Audit Record Retention); NARA General Records Schedules
    risk_assessment: Medium, escalating to High where the unretained/over-retained data is CUI or where audit records needed for a pending investigation have already been disposed of.
    false_positives: A documented retention and disposition schedule exists for every data/classification type this asset holds, and disposition is enforced automatically or verified on a recurring audit cadence.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Media Downgrading Procedure Gap:
    id: media-downgrade-procedure-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'Media moved from a higher-classification enclave to a lower one is handled under a generic sanitization procedure rather than a distinct, verified downgrading process.'
    impact: 'If this risk remains unmitigated, residual higher-classification content surviving an incomplete downgrade is disclosed directly into a lower-classification environment.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Apply a documented, independently verified downgrading procedure — distinct from routine media destruction — to any media or dataset moved to a lower classification enclave, per NIST SP 800-53 MP-8.
    mitigation: Document a downgrading procedure separate from the standard media sanitization/disposal procedure, covering content review for residual higher-classification material, technical sanitization of any metadata or embedded artifacts (document properties, deleted-but-recoverable content, thumbnails), and independent verification by a second reviewer before the media or dataset is released to the lower enclave. Log every downgrade action with the reviewer identity and verification result.
    references: NIST SP 800-53 MP-8 (Media Downgrading); NIST SP 800-53 MP-6 (Media Sanitization); CNSSI 1253; DoD 5200.01 (DoD Information Security Program)
    risk_assessment: Critical for any asset performing high-to-low media or dataset downgrading without a documented, independently verified procedure distinct from routine disposal.
    false_positives: A documented downgrading procedure with independent second-reviewer verification is in place and evidenced by a per-transaction log, distinct from the routine media sanitization procedure.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Released Dataset Re-Identification Risk:
    id: dataset-reidentification-risk
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'A dataset slated for release has been de-identified but never tested against a motivated-intruder re-identification attempt using auxiliary data an adversary could reasonably access.'
    impact: 'If this risk remains unmitigated, a dataset believed to be anonymized can be re-identified after release, constituting a privacy disclosure.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Run a motivated-intruder re-identification test against the de-identified dataset using realistic auxiliary data before release, and document the result as part of the release approval.
    mitigation: Before release, conduct a re-identification risk assessment following NIST SP 800-188 methodology — attempt re-identification using auxiliary data an adversary could plausibly obtain, quantify the proportion of records at risk, and apply additional statistical disclosure limitation (generalization, suppression, k-anonymity/differential privacy techniques) until the residual risk is acceptable to the data owner. Re-run the assessment if the dataset is updated or if a new plausible auxiliary source becomes available before subsequent releases.
    references: NIST SP 800-188 (De-Identification of Government Datasets); NIST SP 800-53 SI-12 (Information Management and Retention)
    risk_assessment: High for any dataset containing PII or CUI-adjacent personal attributes released externally or broadly shared without a documented re-identification test.
    false_positives: A motivated-intruder re-identification test following NIST SP 800-188 has been conducted and documented for this specific release, with residual risk formally accepted by the data owner.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Missing Data Rights Management on Released Files:
    id: missing-data-rights-management
    baseline_likelihood: likely
    baseline_impact: low
    description: 'A file released beyond its originating boundary carries no persistent rights binding that travels with the copy.'
    impact: 'If this risk remains unmitigated, the releasing organization has no technical means to restrict, expire, or revoke access to a released copy after the fact.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Data_Classification_Cheat_Sheet.html
    action: Apply the enterprise rights-management capability (persistent encryption bound to identity/policy, with revocation support) to files released outside the originating boundary, rather than relying on recipient-side policy alone.
    mitigation: Route file releases through the enterprise Information Rights Management / Enterprise Digital Rights Management capability so the exported file remains encrypted and bound to an access policy the releasing organization controls, including expiration and revocation, independent of where the copy is subsequently stored. Reserve unprotected release for cases where the recipient system cannot honor rights-managed content and document that exception.
    references: NIST SP 800-53 AC-21 (Information Sharing); NIST SP 800-53 SC-28 (Protection of Information at Rest); DoD Enterprise Rights Management guidance
    risk_assessment: Medium, escalating to High for CUI releases to external or lower-trust recipients where no revocation capability exists once the file has left the boundary.
    false_positives: Released files are routed through an enterprise rights-management capability providing persistent, revocable access control, or the release is to a fully trusted internal recipient under the same authorization boundary.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Data Store Audit Logging and Anomalous Access Detection Gap:
    id: data-store-audit-detection-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'A data store has no operation-level audit logging and no detection tuned to abnormal access patterns such as bulk reads or connections from an unexpected principal.'
    impact: 'If this risk remains unmitigated, bulk exfiltration by a compromised or malicious authorized identity produces no anomalous signal and no forensic record.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Enable operation-level (read/write/delete/list) audit logging on the data store with the requesting identity attached, and apply anomaly detection tuned to bulk-read and abnormal-export patterns.
    mitigation: Enable data-plane audit logging on the store (e.g., Azure SQL Auditing, Storage Analytics logging, Key Vault diagnostic logs) capturing the operation, the requesting identity, and the object/record affected, forwarded to the central SIEM. Layer native or platform-provided anomaly detection (e.g., Microsoft Defender for Storage/SQL) tuned to flag bulk-read volume, access from a principal or location outside the established baseline, and access rate spikes. Treat detection tooling that only covers control-plane (management API) operations, not data-plane operations, as not meeting this control.
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 AU-6 (Audit Record Review, Analysis, and Reporting); NIST SP 800-53 SI-4 (System Monitoring)
    risk_assessment: High for any data store holding CUI where data-plane operations are not logged at the record/object level or where no anomaly detection is applied to access patterns.
    false_positives: Operation-level data-plane audit logging is enabled and forwarded to the SIEM, and anomaly detection tuned to bulk access patterns is confirmed active for this asset.
    function: operations
    stride: information-disclosure
    detection_logic: Alert on read/export volume from a single identity exceeding a rolling baseline by a defined multiple within a 1-hour window, and on any data-plane access from a principal or network location not previously observed for this asset.
    risks_identified: {}

  # --- 6.2 SECRETS AND CRYPTOGRAPHY ---
  FIPS Non-Compliant Cryptography:
    id: fips-non-compliant-cryptography
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This asset performs cryptographic operations without confirmed use of a FIPS-validated module.'
    impact: 'If this risk remains unmitigated, the finding independently blocks IL5 authorization regardless of the underlying algorithm''s strength.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: Verify FIPS 140-2/3 validated module usage for all cryptographic operations on this asset and document the certificate number in the SSP.
    mitigation: 'For AKS nodes: enable FIPS mode on the node pool (`--enable-fips-image` in Azure CLI) to restrict the OS to FIPS-validated OpenSSL. For application-layer crypto: verify that the runtime''s crypto provider uses a CMVP-validated module (e.g., BoringCrypto for Go, OpenSSL in FIPS mode for Python/Java). For TLS termination: confirm that the ingress controller or load balancer cipher suite configuration excludes non-FIPS algorithms (RC4, 3DES, MD5). Document the CMVP certificate number for each validated module in the SSP.'
    references: DoD Cloud Computing SRG IL5; NIST CMVP (https://csrc.nist.gov/projects/cryptographic-module-validation-program); FIPS 140-3
    risk_assessment: High risk to ATO. FIPS non-compliance at a TLS termination point or encryption-at-rest boundary is typically a CAT II finding under DoD STIGs.
    false_positives: Asset handles only publicly releasable, non-CUI data with no confidentiality requirement, confirmed by data classification review — or FIPS validated module usage is documented in the SSP with a valid CMVP certificate number.
    function: architecture
    stride: information-disclosure
    detection_logic: 'Run DISA STIG compliance scans (ACAS/Nessus) targeting cryptographic configuration checks. For AKS: verify node pool FIPS status via `az aks nodepool show --query fipsEnabled`. For application crypto: use SAST rules to flag crypto library imports that are not FIPS-validated variants.'
    risks_identified: {}

  Deprecated TLS Versions and Weak Cipher Suites:
    id: deprecated-tls-weak-ciphers
    baseline_likelihood: very-likely
    baseline_impact: medium
    description: 'This TLS termination asset supports deprecated protocol versions or weak cipher suites exploitable via known attacks such as POODLE or SWEET32.'
    impact: 'If this risk remains unmitigated, a network-positioned adversary can decrypt protected traffic or perform a protocol downgrade attack.'
    asvs: V9 - Communications
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/TLS_Cipher_String_Cheat_Sheet.html
    action: Restrict TLS configuration to TLS 1.2 minimum (TLS 1.3 preferred) and an approved FIPS-compatible cipher suite list.
    mitigation: 'Configure TLS to support TLS 1.2 and TLS 1.3 only — explicitly disable TLS 1.0, TLS 1.1, and SSL 3.0. Restrict cipher suites to those providing forward secrecy (ECDHE key exchange) and strong symmetric ciphers (AES-128-GCM, AES-256-GCM, CHACHA20-POLY1305). Disable RC4, 3DES, NULL, EXPORT, and anonymous DH cipher suites. For Azure Application Gateway and Front Door: apply a predefined TLS policy of AppGwSslPolicy20220101S or equivalent. Verify configuration with automated TLS scanning on every deployment.'
    references: DISA Application Security and Development STIG V5R3 (APSC-DV-002010, APSC-DV-002030); NIST SP 800-52r2 (Guidelines for TLS); NSA/CISA TLS Best Practices
    risk_assessment: Medium (CAT II STIG finding). Escalates to High if the asset is internet-facing and TLS 1.0/1.1 is enabled for compatibility with legacy clients.
    false_positives: TLS configuration has been audited and confirmed to support only TLS 1.2+ with an approved cipher suite list, documented in the SSP with the scan output as evidence.
    function: architecture
    stride: information-disclosure
    detection_logic: Run testssl.sh or sslyze against all TLS endpoints in the CI/CD pipeline and fail the build on detection of deprecated protocols or weak ciphers. Integrate Azure Security Center TLS recommendations into the compliance dashboard. Schedule quarterly TLS configuration scans via ACAS/Nessus.
    risks_identified: {}

  Key Storage and Ownership Hardening Gap:
    id: key-storage-ownership-hardening-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This secrets or key management asset holds consequential key material either generated only in software rather than a hardware-backed root of trust, or encrypted under a platform-managed key when policy requires a customer-managed one.'
    impact: 'If this risk remains unmitigated, a compromised host that generated a software-only key yields the key material directly, with no hardware boundary to cross.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html
    action: Generate and store consequential keys in an HSM-backed service (not software), and confirm the key ownership tier (customer-managed vs. platform-managed) matches this asset's data classification requirement.
    mitigation: Generate and store keys protecting CUI or signing/root credentials in a hardware-backed key vault (Azure Key Vault Premium/Managed HSM, or equivalent) rather than in application memory or a software keystore. Where policy requires customer control over key material for a given classification tier, provision the resource with a customer-managed key (CMK) in that hardware-backed vault rather than accepting the platform's default platform-managed key (PMK) — verify this per resource, since PMK is frequently the default and satisfies "encrypted at rest" scans without satisfying the ownership requirement.
    references: NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57 (Recommendation for Key Management); FIPS 140-3
    risk_assessment: High for any asset generating or holding keys protecting CUI in software rather than a hardware-backed vault, or where a classification tier requiring CMK is provisioned with a platform-managed key instead.
    false_positives: Consequential keys are generated and held in a hardware-backed key vault (HSM-backed), and the key ownership tier (CMK vs. PMK) has been verified against this asset's data classification requirement.
    function: architecture
    stride: information-disclosure
    risks_identified: {}

  Key Rotation and Escrow Neglect:
    id: key-rotation-escrow-neglect
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'Key rotation for this asset is manual and inconsistently performed, and no tested escrow or recovery procedure exists for a customer-managed key.'
    impact: 'If this risk remains unmitigated, a key that is never rotated has an ever-growing undetected exposure window, and an untested recovery procedure can mean permanent loss of access when it''s actually needed.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html
    action: Enforce a scheduled key rotation policy for this asset's keys, and test the escrow/recovery procedure for any customer-managed key at least annually.
    mitigation: Configure automated key rotation on a defined cadence (e.g., 90-180 days for data-encryption keys) rather than relying on manual rotation. For customer-managed keys, establish a documented escrow/recovery procedure (e.g., a split-knowledge backup, an HSM-to-HSM export under dual control) and actually exercise it — a full recovery drill, not a paper review — on a recurring schedule, since an unexercised procedure has the same failure mode as having none.
    references: NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57 Part 1 (Key Management — General)
    risk_assessment: High for customer-managed keys with no tested recovery procedure. Medium for manual-only rotation on platform-managed keys.
    false_positives: Key rotation is automated on a documented schedule, and the escrow/recovery procedure for any customer-managed key has been exercised (not merely documented) within the current ATO period.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Key Management Separation-of-Duties Violation:
    id: key-management-separation-of-duties-violation
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'A single identity can both perform key operations and administer or audit that same key vault''s access policy and activity log.'
    impact: 'If this risk remains unmitigated, a single compromised or malicious identity can both misuse a key and erase the trace of that misuse, with no independent party positioned to notice.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html
    action: Ensure no single identity holds both key-operation permissions and the ability to modify this key vault's own access policy or audit configuration.
    mitigation: Assign key vault management-plane permissions (create/rotate/delete keys, modify access policy) and data-plane permissions (use a key for cryptographic operations) to distinct roles held by different individuals. Route access-policy changes to the vault itself through a change process requiring a second approver. Forward the vault's audit log to a destination this vault's own administrators cannot delete or modify, so a key-management role change is independently visible.
    references: NIST SP 800-53 AC-5 (Separation of Duties); NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management)
    risk_assessment: High for any key vault where a single identity holds both key-operation and vault-administration/audit permissions.
    false_positives: Key-operation and vault-administration/audit permissions are held by distinct roles/individuals, verified by an access review within the current ATO period.
    function: architecture
    stride: elevation-of-privilege
    risks_identified: {}

  # #############################################################################
  # DOMAIN 7: DETECTION
  # #############################################################################

  # --- 7.1 DETECTION ---
  # Relocated from API and Service Exposure and Infrastructure:
  # Containers (now 5.3 and 2.1), where they originally lived alongside
  # the asset-class entries they extend -- moved here so Detection has
  # its own domain, mirroring SABER's split between Detection and
  # Response (08-saber-detection.md / 09-saber-response.md), which our
  # earlier merged "Detection and Incident Response" banner didn't
  # reflect. No id, tag, or trigger logic changed -- inject_risks.py
  # looks these up by dict key, not file position.
  API Abuse and Enumeration Logging Gap:
    id: api-abuse-enumeration-logging-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This public API endpoint does not log the request patterns that indicate enumeration or abuse, such as sequential object-ID probing or repeated authorization failures from one caller.'
    impact: 'If this risk remains unmitigated, an attacker pacing requests below the rate limit produces no throttling event and remains invisible to the SOC.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Log quota/rate-limit rejections, object-ID request sequences, and repeated per-caller authorization failures on this endpoint, and forward them to the SIEM with correlation by caller identity.
    mitigation: Emit a distinct log event for every rate-limit/quota rejection, every authorization failure, and every request touching an object-identifier parameter, tagged with the calling identity (API key, token subject, or source IP where unauthenticated). Forward these to the SIEM and build a correlation rule that flags a single caller crossing a threshold of authorization failures or sequential/randomized object-ID requests within a rolling window — well below the volume that would trigger a rate-limit block.
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 SI-4 (System Monitoring); OWASP API Security Top 10 (API4:2023 Unrestricted Resource Consumption, API1:2023 Broken Object Level Authorization)
    risk_assessment: High for any public API where object identifiers are part of the request path/body and no correlation rule exists for per-caller authorization-failure or object-enumeration patterns.
    false_positives: The endpoint logs rate-limit rejections, authorization failures, and object-ID request patterns with caller-identity correlation, and a SIEM detection rule is confirmed active against that log stream.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Container Orchestrator Control-Plane Audit Logging Gap:
    id: cluster-control-plane-audit-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The cluster''s audit policy is left at its default, which does not capture pod exec, port-forward, secret access, or admission-controller decisions.'
    impact: 'If this risk remains unmitigated, post-compromise lateral movement inside the cluster produces no audit trail for an incident responder to reconstruct.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html
    action: Deploy an explicit Kubernetes audit policy capturing exec/attach/port-forward, secret access, and admission-controller decisions at Request or RequestResponse level, forwarded to the SIEM.
    mitigation: 'Configure the API server audit policy to capture, at minimum, RequestResponse-level logging for pods/exec, pods/attach, pods/portforward subresources; secrets get/list/watch operations; and all admission webhook decisions (both ValidatingWebhookConfiguration and MutatingWebhookConfiguration). Forward the audit log to the central SIEM with retention matching the platform''s incident-response window. Tag the asset ops:cluster-audit-logging-enabled once the policy is deployed and confirmed forwarding.'
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 AU-12 (Audit Record Generation); CIS Kubernetes Benchmark (Control Plane Logging)
    risk_assessment: High for any cluster running the API server's default audit policy (or no audit policy) rather than one explicitly scoped to security-relevant subresources and admission decisions.
    false_positives: The asset is tagged ops:cluster-audit-logging-enabled confirming an explicit audit policy covering exec/attach/port-forward, secret access, and admission decisions is deployed and forwarding to the SIEM.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Network Intrusion Detection and Traffic Anomaly Blind Spot:
    id: network-ids-blind-spot
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This internet-reachable asset has no network-based intrusion detection or traffic-anomaly monitoring observing traffic crossing its trust boundary.'
    impact: 'If this risk remains unmitigated, an attacker''s network-layer reconnaissance, exploitation attempts, and command-and-control traffic pass without generating any alert for the SOC to act on.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Deploy network-based intrusion detection (NIDS/NDR) or equivalent traffic-anomaly monitoring on the ingress/egress path for this asset, alerting the SOC on detection.
    mitigation: Deploy a network intrusion detection system or network detection-and-response (NDR) capability positioned to observe all ingress/egress traffic for this asset — inline or via traffic mirroring/TAP — tuned with signatures and behavioral baselines appropriate to the protocols this asset actually serves. Forward alerts to the SIEM and define an escalation path to the SOC. Tag the asset net:ids-monitored once coverage is confirmed and actively alerting.
    references: NIST SP 800-53 SI-4 (System Monitoring); NIST SP 800-53 AU-2 (Event Logging); DoD Zero Trust Reference Architecture (Network and Environment pillar)
    risk_assessment: High for any internet-reachable or zone:dmz asset with no network-based detection observing its ingress/egress traffic.
    false_positives: The asset is tagged net:ids-monitored confirming network-based intrusion detection or NDR coverage is deployed and actively alerting on the traffic path to and from this asset.
    function: operations
    stride: information-disclosure
    detection_logic: Confirm NIDS/NDR sensor placement covers 100% of the asset's ingress/egress paths (no unmonitored network segment), and validate alerting is live by running a benign signature-triggering test and confirming a SOC-visible alert fires.
    risks_identified: {}

  Baseline Security Event Logging and SIEM Forwarding Gap:
    id: baseline-security-event-logging-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset does not capture and forward authentication failures, authorization denials, and input-validation rejections to the SIEM, beyond whatever narrower logging its own feature-specific detection risks already require.'
    impact: 'If this risk remains unmitigated, sustained probing, credential-stuffing, and authorization-bypass attempts against this asset produce no correlated signal, leaving the SOC blind to the buildup toward a successful compromise.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Emit a distinct log event for every authentication failure, authorization denial, and input-validation rejection this asset produces, tagged with the calling identity or source, and forward these to the SIEM.
    mitigation: Instrument the asset to emit a structured log event for every authentication failure, authorization denial, and input-validation rejection, each tagged with the calling identity (user, service account, API key, or source IP where unauthenticated) and timestamp. Forward these events to the central SIEM and build a correlation rule flagging a single identity or source crossing a threshold of failures within a rolling window. Tag the asset ops:security-event-logging-enabled once logging and forwarding are confirmed active.
    references: NIST SP 800-53 AU-2 (Event Logging); NIST SP 800-53 AU-6 (Audit Record Review, Analysis, and Reporting); NIST SP 800-53 SI-4 (System Monitoring)
    risk_assessment: High for any app:frontend-ui, app:backend-api, or app:async-worker asset with no baseline security-event logging forwarded to the SIEM.
    false_positives: The asset is tagged ops:security-event-logging-enabled confirming authentication failures, authorization denials, and input-validation rejections are captured and forwarded to the SIEM with active correlation rules.
    function: operations
    stride: information-disclosure
    detection_logic: Alert when a single identity or source crosses a defined threshold of authentication failures, authorization denials, or input-validation rejections within a rolling window, and monitor for the absence of expected security-event log volume as its own signal of a broken forwarding pipeline.
    risks_identified: {}

  # #############################################################################
  # DOMAIN 8: RESPONSE
  # #############################################################################

  # --- 8.1 INCIDENT-RESPONSE READINESS ---
  Undocumented Incident Containment Disposition:
    id: undocumented-containment-disposition
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'A business-critical or mission-critical asset has no documented answer to whether it may be automatically isolated during a suspected compromise or requires human approval first.'
    impact: 'If this risk remains unmitigated, response to an active incident is delayed by an ad hoc approval decision, or the asset is isolated in a way that causes unintended operational impact.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Document, for this asset, whether automated containment/isolation is permitted, requires human approval, or is prohibited, and record that disposition where the incident response team can find it during an active incident.
    mitigation: For every asset tagged business-critical or mission-critical, record a containment disposition (auto-isolation permitted / human approval required / auto-isolation prohibited) in the asset's own documentation or the incident response runbook, decided in advance by the asset owner together with the response team — not improvised during an incident. Where auto-isolation is prohibited (e.g., a safety-relevant or highly available system), document the manual containment procedure to use instead.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: High for any business-critical or mission-critical asset with no documented containment disposition.
    false_positives: A containment disposition for this asset is documented in the incident response runbook and was agreed by both the asset owner and the response team.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Undocumented Credential Blast Radius for Incident-Driven Rotation:
    id: undocumented-credential-blast-radius
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'If this asset''s credentials were compromised, there is no inventory sufficient to identify and rotate every consumer of them without an improvised discovery effort during the response itself.'
    impact: 'If this risk remains unmitigated, a credential missed during rotation because it was never inventoried gives an adversary a return path after an incident is declared contained.'
    asvs: V2 - Authentication
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    action: Maintain an inventory of every credential/secret this asset consumes or issues, sufficient to support a complete rotation without an extended outage during incident response.
    mitigation: Maintain a current inventory (manual or, preferably, generated from the secrets broker/vault's own access records) of every credential and secret this asset consumes, and every downstream system that trusts a credential this asset issues. Ensure the rotation procedure for each can be executed without an extended service outage, so a full rotation is operationally feasible to actually perform during incident response rather than being skipped under time pressure.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-53 IA-5 (Authenticator Management); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: High for any asset holding or issuing credentials where no consumer inventory exists to support a complete post-compromise rotation.
    false_positives: A current credential/secret consumer inventory exists for this asset and rotation of every entry has been exercised (not merely documented) within the current ATO period.
    function: operations
    stride: elevation-of-privilege
    risks_identified: {}

  Untested Incident Response Plan:
    id: untested-incident-response-plan
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This business-critical or mission-critical asset falls under an incident response plan that has never been exercised through a tabletop or live-fire drill, only documented.'
    impact: 'If this risk remains unmitigated, roles, escalation paths, and technical procedures assumed to work during an actual incident are tested for the first time under real pressure, when gaps are most costly to discover.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Conduct a tabletop or live-fire incident response exercise covering this asset's likely compromise scenarios on a recurring schedule, and update the plan with anything the exercise reveals is missing or outdated.
    mitigation: Schedule a recurring incident response exercise (tabletop at minimum, live-fire where feasible) that walks through a realistic compromise scenario for this asset — detection, containment, eradication, recovery, and stakeholder notification — using only the documented plan rather than institutional knowledge. Involve every role the plan assigns responsibilities to, not just the security team. Record findings and update the plan before the next ATO renewal.
    references: NIST SP 800-53 IR-3 (Incident Response Testing); NIST SP 800-61r2 (Computer Security Incident Handling Guide)
    risk_assessment: High for any business-critical or mission-critical asset whose incident response plan has not been exercised within the current ATO period.
    false_positives: The asset is tagged ir:plan-tested confirming a tabletop or live-fire incident response exercise covering this asset has been conducted within the current ATO period.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  DFARS 252.204-7012 72-Hour Cyber Incident Reporting Gap:
    id: dfars-breach-notification-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This business-critical or mission-critical asset has no documented procedure identifying the contract-mandated cyber incident reporting timeline or the party responsible for executing it.'
    impact: 'If this risk remains unmitigated, a genuine incident is discovered without a clear owner or timeline for DoD-mandated reporting, risking a missed 72-hour reporting window and the contractual and legal consequences that follow.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Document the cyber incident reporting procedure required by this system's contract (e.g., DFARS 252.204-7012's 72-hour DIBNet reporting requirement for a covered contractor information system), naming the party responsible for executing it.
    mitigation: Identify which contracts covering this asset carry DFARS 252.204-7012 (or an equivalent DoD cyber incident reporting clause), and document the exact reporting timeline, the DIBNet submission process, and the specific role responsible for initiating it once an incident affecting covered defense information is confirmed. Rehearse the reporting step itself (not just detection/containment) during incident response exercises so the 72-hour clock is a practiced procedure, not a first-time scramble.
    references: DFARS 252.204-7012 (Safeguarding Covered Defense Information and Cyber Incident Reporting); NIST SP 800-53 IR-6 (Incident Reporting); NIST SP 800-171
    risk_assessment: High for any business-critical or mission-critical asset covered by a DFARS 252.204-7012 clause with no documented reporting procedure or owner.
    false_positives: The asset is tagged ir:breach-notification-procedure-documented confirming a documented reporting procedure identifies the contract-mandated timeline and the responsible party, and the procedure has been rehearsed.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Forensic Evidence Chain-of-Custody Gap:
    id: forensic-chain-of-custody-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'This business-critical or mission-critical asset has no documented procedure for acquiring, logging, and transferring forensic evidence during an incident affecting it.'
    impact: 'If this risk remains unmitigated, evidence collected during an incident cannot be shown to be unaltered or continuously accounted for, undermining its use in legal proceedings, contract disputes, or a defensible after-action record.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Incident_Response_Cheat_Sheet.html
    action: Document a forensic evidence-handling procedure for this asset covering acquisition, custody logging, storage, and transfer, and assign ownership of executing it during an incident.
    mitigation: Establish a documented forensic evidence-handling procedure covering how evidence relevant to this asset (disk/memory images, logs, network captures) is acquired, hashed at acquisition time, logged in a continuous custody record (who held it, when, why), stored, and transferred — modeled on standard forensic chain-of-custody practice. Assign a named role responsible for executing this procedure during an incident, distinct from whoever performs containment, so evidence handling isn't improvised under pressure.
    references: NIST SP 800-53 IR-4 (Incident Handling); NIST SP 800-86 (Guide to Integrating Forensic Techniques into Incident Response)
    risk_assessment: High for any business-critical or mission-critical asset with no documented forensic evidence-handling procedure.
    false_positives: The asset is tagged ir:evidence-handling-documented confirming a documented forensic evidence-handling procedure (acquisition, custody log, storage, transfer) exists and names a responsible role.
    function: operations
    stride: repudiation
    risks_identified: {}

  # #############################################################################
  # DOMAIN 9: RECOVERY
  # #############################################################################

  # --- 9.1 INFRASTRUCTURE: BACKUP AND DR ---
  Backup Integrity and Recovery Assurance Gap:
    id: backup-integrity-recovery-gap
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'The asset is flagged as requiring backup for DR/COOP, but backup integrity, encryption, access control, or recovery testing has not been verified.'
    impact: 'If this risk remains unmitigated, a ransomware attack or infrastructure failure can result in permanent data loss because the backup''s actual recoverability was never confirmed.'
    asvs: V9 - Communications / V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    action: Verify backup encryption, access isolation, geographic separation, and conduct a documented recovery test against defined RTO/RPO targets.
    mitigation: Encrypt all backups at rest using FIPS-validated cryptography with keys stored separately from the backup data (Azure Backup with CMK in Key Vault). Store backups in a geographically separate Azure region to a storage account accessible only to the backup service principal — not to application workload identities. Implement immutable backup storage (Azure Backup soft delete + lock) to prevent deletion by ransomware. Conduct and document a full recovery test at least annually, validating actual RTO/RPO against documented targets. Alert on backup job failures within 1 hour.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 CP-10 (Information System Recovery); DoD COOP requirements; Azure Backup security baseline
    risk_assessment: High for assets storing CUI where backup procedures have never been tested or where backup storage is co-located with or accessible from the primary environment.
    false_positives: Backup encryption, geographic separation, access isolation, and recovery testing are all documented in the COOP plan and have been validated within the current ATO period.
    function: operations
    stride: information-disclosure
    detection_logic: Monitor Azure Backup job status and alert on any job failure within the defined backup window. Audit backup storage account access policies to verify no production workload identities have write access. Schedule annual recovery test exercises and track completion in the POA&M.
    risks_identified: {}

  Backup Administrative Privilege Separation Gap:
    id: backup-admin-privilege-separation-gap
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'Backup platform administrators share identity with production administrators, or destructive backup operations are not protected by dual authorization.'
    impact: 'If this risk remains unmitigated, a single compromised production admin account can delete the backups meant to recover from that same compromise.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
    action: Ensure backup administration is a distinct role from production administration, and require dual authorization plus step-up authentication for any destructive backup operation.
    mitigation: Assign backup platform administration to a role held by individuals who do not also hold production administrative access to the same workload. Require a second approver and step-up MFA for destructive operations specifically (delete backup, shorten retention, disable job, remove immutability lock) — routine backup operations (create, restore-test) do not need this. Alert on any destructive backup operation regardless of who performs it.
    references: NIST SP 800-53 AC-6(1) (Least Privilege — Authorize Access to Security Functions); NIST SP 800-53 CP-9(7) (Dual Authorization for Deletion)
    risk_assessment: Critical for any asset where the same identity or role holds both production administrative access and destructive backup permissions.
    false_positives: Backup administration is confirmed to be a distinct role from production administration, and destructive backup operations require dual authorization and step-up authentication, verified by an access review within the current ATO period.
    function: operations
    stride: tampering
    risks_identified: {}

  Backup Immutability Not Enforced:
    id: backup-immutability-not-enforced
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The backup store uses a retention lock a sufficiently privileged account can shorten or remove, rather than a compliance-mode lock no account can alter before the retention period expires.'
    impact: 'If this risk remains unmitigated, a privileged account -- including one obtained by an attacker -- can delete backups within the stated retention window.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Enable a compliance-mode (not governance-mode) immutability lock on the backup store, verified to be irreversible by any account for the duration of the retention period.
    mitigation: Enable immutable backup storage in compliance mode (e.g., Azure Backup vault immutability with the "immutable and cannot be reverted" setting locked, not merely enabled) so that no account, including the backup vault's own owner, can shorten retention or delete backups before expiry. Verify this by attempting to disable the lock with a fully privileged test account in a non-production vault and confirming the platform refuses the operation.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 SI-4(24) (Indicators of Compromise); CISA Ransomware Guide (Immutable Backup Storage)
    risk_assessment: Critical for any asset whose backup store's immutability lock can be disabled or shortened by any account, including its own administrators.
    false_positives: The backup store's immutability lock is confirmed to be in compliance mode (irreversible by any account, including the vault's own owner, for the retention period), verified by a test of the lock itself rather than by policy documentation alone.
    function: operations
    stride: tampering
    risks_identified: {}

  Backup Encryption Key Rotation and Retention Mismatch:
    id: backup-key-rotation-retention-mismatch
    baseline_likelihood: unlikely
    baseline_impact: low
    description: 'This asset''s backup encryption keys have no documented rotation cadence tied to the longest retention period any backup copy carries.'
    impact: 'If this risk remains unmitigated, a key rotated without regard to retention leaves older backups permanently undecryptable, invisible until a restore from them is attempted.'
    asvs: V6 - Cryptography
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Key_Management_Cheat_Sheet.html
    action: Register backup encryption keys with a documented rotation cadence that accounts for the longest retention period of any backup copy encrypted with them, and retain superseded key versions for the life of backups that depend on them.
    mitigation: Track which key version encrypted each backup generation, and retain (rather than destroy) a superseded key version until every backup encrypted with it has passed its retention period. Where the backup platform supports envelope encryption with a rotating data-encryption key under a stable key-encryption key, prefer that pattern so key rotation does not require re-encrypting or invalidating existing backups.
    references: NIST SP 800-53 SC-12 (Cryptographic Key Establishment and Management); NIST SP 800-57 Part 1 (Key Management — General); NIST SP 800-53 CP-9 (Information System Backup)
    risk_assessment: High for any asset with a documented key rotation cadence that does not explicitly account for its backup retention period, or no documented cadence at all.
    false_positives: Backup encryption key rotation is documented and confirmed to retain superseded key versions for the life of every backup they encrypted, or the backup platform uses envelope encryption that decouples key rotation from existing backup decryptability.
    function: operations
    stride: information-disclosure
    risks_identified: {}

  Recovery Objective Definition Gap:
    id: recovery-objective-definition-gap
    baseline_likelihood: likely
    baseline_impact: low
    description: 'This asset has no documented RTO/RPO derived from its criticality tier, or its declared figures have never been validated against an actual restore test.'
    impact: 'If this risk remains unmitigated, an actual incident reveals the asset''s true recovery time and data-loss window for the first time, when the gap can no longer be closed quietly.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Document an RTO and RPO for this asset derived from its business-criticality tier, and validate both figures against the result of an actual restore test.
    mitigation: Assign an RTO and RPO to this asset based on its business-criticality tier (Threagile's business_criticality/availability rating), documented in the COOP plan. Validate both figures against the measured duration and data-loss window of an actual restore test — not an estimate — and revise the documented target if the test result exceeds it, rather than leaving a target on record that the asset has never actually met.
    references: NIST SP 800-53 CP-2 (Contingency Plan); NIST SP 800-53 CP-10 (Information System Recovery and Reconstitution); DoD COOP requirements
    risk_assessment: Medium, escalating to High for business-critical or mission-critical assets with no validated RTO/RPO.
    false_positives: An RTO and RPO are documented for this asset and have been validated against the measured result of an actual restore test within the current ATO period.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Untested Restoration Procedure:
    id: untested-restoration-procedure
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'Backups for this asset pass integrity checks, but no restoration has actually been performed using only the written procedure rather than institutional knowledge.'
    impact: 'If this risk remains unmitigated, an incomplete or outdated restoration procedure is discovered during an actual incident, at the worst possible time to discover it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Perform a full restoration of this asset from a real stored backup, using only the written restoration procedure, on a recurring schedule.
    mitigation: Conduct a restoration exercise at least annually (more frequently for business-critical/mission-critical assets) in which a person other than the backup job's original author executes the documented restoration procedure against a real stored backup into an isolated environment, and validates the restored system actually functions. Update the written procedure with anything the exercise revealed was missing, undocumented, or dependent on tribal knowledge.
    references: NIST SP 800-53 CP-4 (Contingency Plan Testing); NIST SP 800-53 CP-9 (Information System Backup)
    risk_assessment: High for any business-critical or mission-critical asset whose restoration procedure has not been exercised, by someone other than its author, within the current ATO period.
    false_positives: A full restoration exercise using only the written procedure, performed by someone other than the procedure's author, has been completed successfully within the current ATO period.
    function: operations
    stride: denial-of-service
    risks_identified: {}

  Unsupported or SaaS Service Backup Gap:
    id: unsupported-saas-backup-gap
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'This asset is a SaaS tenant or vendor-hosted service the enterprise backup platform cannot enroll, with no export job routing its data into enterprise-controlled storage.'
    impact: 'If this risk remains unmitigated, the asset has no recovery path at all if the vendor tenant is deleted, compromised, or becomes unavailable.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Ransomware_Prevention_Best_Practices_Cheat_Sheet.html
    action: Configure a native export mechanism or a purpose-built export job to route this asset's data into enterprise-controlled backup storage on a recurring schedule, independent of the vendor's own in-tenant retention.
    mitigation: Identify whether the vendor/SaaS platform provides a native data-export API or scheduled export feature, and route that export into enterprise-controlled storage under the same immutability and access-isolation controls as other backups. Where no native export exists, build a purpose-written export job against the vendor's API. Do not accept the vendor's own in-tenant retention, recycle bin, or version history as satisfying this control — it remains inside the vendor's control plane and does not survive tenant-level compromise or deletion.
    references: NIST SP 800-53 CP-9 (Information System Backup); NIST SP 800-53 SA-9 (External System Services)
    risk_assessment: High for any SaaS or vendor-hosted asset with no independent, enterprise-controlled backup export configured.
    false_positives: The asset is tagged ops:saas-export-configured confirming a native or purpose-built export job routes its data into enterprise-controlled backup storage on a recurring schedule, independent of the vendor's own in-tenant retention.
    function: operations
    stride: denial-of-service
    risks_identified: {}

