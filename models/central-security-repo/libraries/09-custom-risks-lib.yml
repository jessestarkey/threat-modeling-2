  Overreliance and Human-Agent Trust Exploitation:
    id: ai-overreliance-trust-exploitation
    baseline_likelihood: likely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This asset presents AI-generated output to a human as input to a consequential decision. However, it provides no confidence indicator, citation or provenance, or mandatory verification step to help the human catch a confidently wrong (hallucinated) answer.'
    impact: 'If this risk remains unmitigated, a human decision-maker can act on a fluent and confident but factually wrong AI output, for example by misclassifying data, misreporting a status, or authorizing an action based on a fabricated summary of CUI. Furthermore, no built-in signal distinguishes a well-grounded answer from a hallucinated one.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: 'Surface a confidence indicator, a source citation, or a provenance trail alongside any AI-generated output that feeds a consequential decision. Additionally, require explicit human verification before the decision is finalized.'
    mitigation: >-
      Attach source citations or retrieval provenance to AI-generated output wherever the underlying
      answer is grounded in retrieved content, so that a reviewer can check the answer directly
      against its source.

      Surface a calibrated confidence or uncertainty indicator, rather than presenting every answer
      in uniformly confident phrasing.

      For decisions above a defined consequence threshold, require an explicit human acknowledgment
      that the output has been checked against an independent source before the decision is recorded
      as final.

      Periodically sample the production outputs that feed real decisions against ground truth, to
      measure the actual hallucination rate in context rather than only in a lab benchmark.
    references: OWASP LLM Top 10 2026 LLM07 (Misinformation; LLM09 in the 2025 list); OWASP Top 10 for Agentic Applications 2026 ASI09 (Human-Agent Trust Exploitation); OWASP GenAI Data Security 2026 DSGAI21 (Disinformation via Data Poisoning); NIST AI RMF (MEASURE 2.7, MANAGE 2.3); MAESTRO L6 (Security and Compliance)
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Low. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High where the AI output directly informs a consequential decision (such as a classification, a compliance status, or an operational action) with no citation or confidence signal. However, it is Medium where the output is advisory in a low-stakes context, or is already paired with partial provenance.'
    false_positives: 'The asset is tagged ai:output-confidence-disclosed, which confirms that AI-generated output feeding decisions carries citations, confidence indicators, or a mandatory human verification step before the decision is finalized.'
    function: operations
    stride: tampering
    cwe: 1426
