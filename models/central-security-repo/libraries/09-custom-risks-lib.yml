  'ATLAS: AI Model Registry Supply Chain and Reputation Attack':
    id: atlas-model-registry-supply-chain
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The model registry or artifact store is a centralized supply chain chokepoint that can be used to publish malware-embedded models, replace a trusted model version, or inflate reputation metrics.'
    impact: 'If this risk remains unmitigated, a malicious model artifact deployed via the registry can achieve remote code execution on the serving infrastructure.'
