    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a renderer that has JavaScript enabled and incorporates unsanitized user content. However, it is Medium for a renderer that has JavaScript disabled but external URL loading enabled.'
    false_positives: 'The PDF renderer runs in a fully network-isolated sandbox with JavaScript and external resource loading disabled. Additionally, all user-supplied content is sanitized with a vetted HTML sanitizer before it is inserted into a template.'
    function: architecture
    stride: information-disclosure
    cwe: 918
    detection_logic: 'Test the PDF generation endpoints by injecting SSRF payloads into user-controlled fields, such as an iframe pointing to the IMDS URL, or an external image URL that points to a collaborator server. Then, verify that the renderer is network-isolated by rendering a template that fetches an external URL and confirming that no outbound request is made. Finally, monitor the PDF renderer process for unexpected outbound network connections.'
