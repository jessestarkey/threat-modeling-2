      Deploy wireless intrusion detection that can identify rogue or impersonating access points
      broadcasting this network's SSID, and that alerts the SOC on detection.

      Require a wireless authentication method with mutual or server certificate validation
      (EAP-TLS, or PEAP or EAP-TTLS with certificate pinning).

