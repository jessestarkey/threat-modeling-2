  Container Runs as Root (Policy Exception):
    id: container-runs-as-root
    baseline_likelihood: possible
    baseline_impact: medium
    finding_class: weakness-shown
    description: 'This container runs as the root user (UID 0), rather than with the least privilege that its function requires. Elevated Linux capabilities, however, are covered separately by the dangerous-container-capabilities rule.'
    impact: 'If this risk remains unmitigated, an attacker who compromises the container has a substantially easier path to escalating privileges on the underlying node.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html
    action: 'Ensure that a formal AO risk acceptance is on file.'
    mitigation: 'Compensating controls must be strictly enforced through admission-controller policy (Azure Policy for AKS or OPA Gatekeeper). Specifically, (1) scope the waiver to the exact workload it applies to rather than granting a namespace-wide exception, (2) drop every Linux capability that is not explicitly required, even while the container runs as root, and (3) apply a restrictive seccomp or AppArmor profile to narrow the syscalls that a root process can actually reach.'
    references: DISA Kubernetes STIG; NIST SP 800-53 AC-6 (Least Privilege); DoD Container Hardening Guide
    risk_assessment: 'Likelihood starts at Possible, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is a High risk of container breakout and full node compromise if the container is also internet-reachable or processes untrusted input. Root inside the container removes the last layer between a code-execution bug and privilege escalation on the host.'
    false_positives: 'None, since this is an explicit policy waiver.'
    function: operations
    stride: elevation-of-privilege
    cwe: 250
    detection_logic: 'Query the cluster (kubectl get pods -o json) for containers whose securityContext omits runAsNonRoot: true or explicitly sets runAsUser: 0. Then, confirm that a matching exception:runs-as-root waiver and AO acceptance record exist for every match.'
    risks_identified: {}

