  'ATLAS: AI Agent Tool and Plugin Compromise':
    id: atlas-agent-tool-plugin-compromise
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'The LLM or agent has access to external tools or function-calling APIs whose definitions, credentials, or registry listings can be poisoned or replaced by an adversary.'
    impact: 'If this risk remains unmitigated, tool compromise can allow credential theft, data exfiltration, or attacker-controlled commands, all within the agent''s legitimate trust context.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Maintain a cryptographically signed allowlist of approved tools and require explicit human confirmation for consequential tool invocations.
    mitigation: Pin all tool definitions to cryptographically verified versions. Prohibit dynamic tool registration at runtime. Enforce credential isolation — tools should use scoped, short-lived tokens, never long-lived shared secrets. Rate-limit and alert on anomalous tool call volume per user or session. Log all tool invocations with full argument context for SOC review.
    references: MITRE ATLAS AML.T0053 (AI Agent Tool Invocation), AML.T0083 (Credentials from AI Agent Config), AML.T0085.001 (Data from AI Agent Tools), AML.T0086 (Exfiltration via Agent Tool Invocation), AML.T0098 (Tool Credential Harvesting), AML.T0099 (Tool Data Poisoning), AML.T0100 (AI Agent Clickbait), AML.T0104 (Publish Poisoned Tool), AML.T0110 (AI Agent Tool Poisoning), AML.T0011.002 (Poisoned AI Agent Tool); OWASP LLM07:2025
    risk_assessment: Critical for write-capable tool access. High for read-only tool access where sensitive data is reachable.
    false_positives: The LLM has zero tool access and is used exclusively for stateless text generation.
    function: architecture
    stride: elevation-of-privilege
    detection_logic: Alert on tool invocations to external endpoints not in the pre-approved allowlist. Monitor for credential access patterns from tool execution contexts. Audit tool definition registries for unauthorized modifications.
    risks_identified: {}

  'ATLAS: AI Agent Memory and Session State Poisoning':
    id: atlas-agent-memory-poisoning
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The AI agent maintains persistent memory or session state across turns, which an adversary can poison or silently alter to change the model''s conversational context.'
    impact: 'If this risk remains unmitigated, an adversary can maintain influence over agent behavior indefinitely and establish persistence that survives an agent restart.'
    asvs: V8 - Data Protection
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Apply integrity controls to all persisted agent memory and enforce strict access control on memory write paths.
    mitigation: Cryptographically sign or hash all persisted memory entries and verify integrity before loading. Restrict write access to memory stores to the authenticated agent runtime only. Implement memory content validation on load — flag entries that contain instruction-like language. Log all memory write and modification events. Implement session memory expiry and enforce periodic re-authentication of memory state.
    references: MITRE ATLAS AML.T0080 (AI Agent Context Poisoning — T0080.000 Memory, T0080.001 Thread), AML.T0081 (Modify AI Agent Configuration), AML.T0092 (Manipulate User LLM Chat History); OWASP LLM07:2025
    risk_assessment: High for persistent-memory agentic systems with multi-session continuity. Medium for in-session-only memory with no cross-session persistence.
    false_positives: Agent uses in-context-window-only memory with no external persistence layer; memory is discarded entirely at session end.
    function: architecture
    stride: tampering
    detection_logic: Audit memory store write logs. Alert on memory entries created or modified outside of authenticated agent runtime sessions. Monitor for memory entries containing syntactic patterns characteristic of prompt injection (e.g., instruction-like imperative sentences, role-switch phrases).
    risks_identified: {}

