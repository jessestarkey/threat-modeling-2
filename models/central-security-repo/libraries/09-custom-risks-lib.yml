  # --- 10.1 POLICY EXCEPTIONS ---
  EOL Component in ATO Boundary:
    id: eol-component-ato-boundary
    baseline_likelihood: likely
    baseline_impact: medium
    finding_class: weakness-shown
    description: 'A software component within the ATO boundary has reached end of life, and its vendor no longer provides security patches for it.'
    impact: 'If this risk remains unmitigated, the component accumulates unpatched CVEs indefinitely. Thus, any newly discovered vulnerability in it is effectively a zero-day for as long as it remains in the boundary.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: 'Ensure that a formal AO risk acceptance is on file, and that a remediation timeline is documented in the POA&M.'
    mitigation: >-
      Establish an immediate upgrade path to a supported version.

      If an upgrade is not immediately feasible, implement four compensating controls: (1)
      network-isolate the EOL component to the minimum required connectivity, (2) deploy WAF or RASP
      protections in front of it, (3) raise the fidelity of monitoring for exploitation indicators,
      and (4) document the risk acceptance with a hard deadline in the POA&M.

      If an upgrade is infeasible within the POA&M window, remove the component from the ATO
      boundary through an architecture change.
    references: DISA Application Security and Development STIG; NIST SP 800-53 SI-2 (Flaw Remediation); DoD RMF Process Guide
    risk_assessment: 'Likelihood starts at Likely, and impact starts at Medium. Impact then steps on the highest of the asset''s confidentiality, integrity, and availability ratings, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High. However, it rises to Critical if the EOL component has active CVEs with public exploits and is internet-accessible or handles CUI directly.'
    false_positives: 'None, since this is an explicit policy exception, and an AO risk acceptance must be on file.'
    function: operations
    stride: elevation-of-privilege
    cwe: 1104
    detection_logic: 'Integrate SCA tooling (for example, OWASP Dependency-Check, Grype, or Snyk) with EOL version database checks into the CI/CD pipeline. Additionally, subscribe to vendor EOL announcement feeds and NVD CVE notifications for every component in the SBOM. Finally, query Azure Advisor and Microsoft Defender for Cloud for EOL runtime and OS version alerts.'
    risks_identified: {}

