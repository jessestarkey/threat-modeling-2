    references: MITRE ATLAS AML.T0053 (AI Agent Tool Invocation), AML.T0061 (LLM Prompt Self-Replication), AML.T0080 (AI Agent Context Poisoning), AML.T0081 (Modify AI Agent Configuration), AML.T0084 (Discover AI Agent Configuration), AML.T0086 (Exfiltration via AI Agent Tool Invocation), AML.T0094 (Delay Execution), AML.T0101 (Data Destruction via Agent Tool Invocation), AML.T0103 (Deploy AI Agent), AML.T0105 (Escape to Host), AML.T0108 (AI Agent C2), AML.T0034.002 (Agentic Resource Consumption); OWASP LLM07:2025
    risk_assessment: Critical for any agentic deployment with write-capable tools or multi-agent coordination.
