  'ATLAS: AI Agent Memory and Session State Poisoning':
    id: atlas-agent-memory-poisoning
    baseline_likelihood: likely
    baseline_impact: medium
    description: 'The AI agent maintains persistent memory or session state across turns, which an adversary can poison or silently alter to change the model''s conversational context.'
    impact: 'If this risk remains unmitigated, an adversary can maintain influence over agent behavior indefinitely and establish persistence that survives an agent restart.'
    asvs: V8 - Data Protection
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Apply integrity controls to all persisted agent memory and enforce strict access control on memory write paths.
    mitigation: Cryptographically sign or hash all persisted memory entries and verify integrity before loading. Restrict write access to memory stores to the authenticated agent runtime only. Implement memory content validation on load — flag entries that contain instruction-like language. Log all memory write and modification events. Implement session memory expiry and enforce periodic re-authentication of memory state.
    references: MITRE ATLAS AML.T0080 (AI Agent Context Poisoning — T0080.000 Memory, T0080.001 Thread), AML.T0081 (Modify AI Agent Configuration), AML.T0092 (Manipulate User LLM Chat History); OWASP LLM07:2025
