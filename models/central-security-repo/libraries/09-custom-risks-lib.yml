    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Treat evaluation datasets and scoring infrastructure with the same integrity controls as production systems.
    mitigation: Store evaluation datasets in a write-protected, access-controlled repository with cryptographic hashing. Separate the evaluation pipeline's compute environment from the training pipeline with no shared write access. Maintain a secondary, independently curated adversarial holdout set stored offline and never used for training. Require dual-approval for any modification to evaluation datasets or scoring logic.
    references: MAESTRO L5 (Evaluation and Observability) — Manipulation of Evaluation Metrics, Poisoned Benchmarks; NIST AI RMF MEASURE 2.5
    risk_assessment: High for any AI system where a single automated evaluation pipeline is the sole gate before production promotion.
    false_positives: Evaluation datasets are stored in an immutable, cryptographically signed artifact store with no external write path, and scoring logic is version-controlled with mandatory code review.
    function: architecture
    stride: tampering
    detection_logic: Verify cryptographic hashes of evaluation dataset files before every eval run. Alert on any change to evaluation dataset artifacts outside the approved change management process. Cross-validate automated pipeline results against a manual spot-check on a random sample before every promotion decision.
    risks_identified: {}

  'MAESTRO L5: AI Observability Stack Compromise and Evidence Destruction':
    id: maestro-l5-observability-compromise
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The AI-specific monitoring and anomaly-detection layer is itself an adversarial target once an attacker has initial access, since blinding it conceals further activity.'
    impact: 'If this risk remains unmitigated, an attacker can selectively delete inference logs, mask anomalous behavior, or exfiltrate sensitive prompts through the telemetry pipeline itself.'
    asvs: V7 - Error Handling and Logging
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Vocabulary_Cheat_Sheet.html
    action: Isolate AI observability infrastructure from the AI runtime write path and enforce tamper-evident logging.
    mitigation: Route AI inference telemetry to a write-once, append-only log store that the AI runtime process cannot modify or delete. Enforce strict access separation between the AI system being monitored and the monitoring infrastructure. Scrub or tokenize PII and CUI from telemetry before storage using a pre-pipeline redaction layer. Implement integrity monitoring on observability pipeline configurations.
    references: MAESTRO L5 (Evaluation and Observability) — Compromised Observability Tools, Evasion of Detection, Data Leakage through Observability; NIST SP 800-53 AU-9 (Protection of Audit Information)
    risk_assessment: High for AI systems handling CUI where inference logs may capture sensitive content. Critical when the observability stack is the primary post-incident forensic source.
    false_positives: Observability pipeline uses a fully isolated, write-once SIEM with no network path from the AI runtime to the log store modification API.
    function: operations
    stride: information-disclosure
    detection_logic: Monitor observability pipeline configuration files for unauthorized modifications. Alert on any gap or discontinuity in inference log ingestion. Periodically verify log integrity using stored hashes. Audit access logs of the observability infrastructure itself.
