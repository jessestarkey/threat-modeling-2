  # --- 5.3 AI OPERATIONAL AND DEPLOYMENT HARDENING GAPS ---
  # Beyond standard ATLAS technique coverage and MAESTRO layer generalities
  # above -- specific operational controls for fielding and running AI
  # systems that a technique/layer catalog alone does not capture.
  AI Output Path to OT or Safety-Critical Actuation Without Human Gate:
    id: ai-ot-actuation-boundary-gap
    baseline_likelihood: likely
    baseline_impact: very-high
    description: 'This AI system''s output has a path to an operational technology actuator or safety-critical process with no technical, AI-unbypassable human authorization gate in between.'
    impact: 'If this risk remains unmitigated, a model failure -- hallucination, prompt injection, or adversarial manipulation -- can directly trigger a physical-world safety incident with no human decision point to catch it.'
    asvs: V1 - Architecture, Design and Threat Modeling
    cheat_sheet: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    action: Insert a technical, AI-system-unbypassable human authorization gate between any AI-generated output and OT/safety-critical actuation, and document a standing policy prohibiting fully autonomous safety-relevant decisions.
    mitigation: Architect the actuation path so the AI system's output is a proposal routed to a human approver through a channel the AI system itself has no ability to complete or bypass (not a UI element the AI system could theoretically also be granted access to). Maintain a documented, enforced policy listing prohibited autonomous use cases (autonomous safety decisions, autonomous mission-critical control, unsupervised process changes) checked at system intake/design review, not left to individual deployment teams to self-assess.
    references: NIST AI RMF (GOVERN 1.2, MANAGE 2.3); MAESTRO L6 (Security and Compliance); IEC 61508 (Functional Safety) where applicable to the actuated process
    risk_assessment: Critical for any AI system with output reaching an OT actuator or safety-critical process through any path not mediated by an unbypassable human gate.
    false_positives: AI system output is strictly advisory with no technical path to actuation, or every actuation path is confirmed to route through a human approval gate the AI system cannot complete or bypass.
    function: architecture
    stride: elevation-of-privilege
    risks_identified: {}

