  VDI Clipboard Data Exfiltration:
    id: vdi-clipboard-data-exfiltration
    baseline_likelihood: unlikely
    baseline_impact: low
    finding_class: control-not-evidenced
    description: 'This asset''s VDI session allows clipboard redirection between the remote session and the local endpoint. However, most network-layer DLP controls do not inspect that channel.'
    impact: 'If this risk remains unmitigated, a malicious insider can exfiltrate data through the clipboard without generating any network-layer alert.'
    asvs: V8 - Data Protection
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    action: 'Disable clipboard redirection in the AVD host pool''s RDP properties, and enforce that setting through Azure Policy.'
    mitigation: >-
      Set the AVD host pool RDP property `redirectclipboard:i:0` to disable clipboard redirection,
      and enforce that configuration through Azure Policy to prevent drift.

      Restrict local resource redirection (drives, printers, and USB) to GFE devices only, using
      Conditional Access device compliance policies.

      Enable AVD connection diagnostics and forward them to the SIEM to monitor session activity.
    references: NIST SP 800-53 AC-19 (Access Control for Mobile Devices); NIST SP 800-53 AC-3 (Access Enforcement); DoD Zero Trust Reference Architecture
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Low. Impact then steps on the asset''s confidentiality rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for a deployment that permits non-GFE or personally owned devices to access AVD sessions containing CUI. However, it is Medium if access is restricted to GFE devices enrolled in Defender for Endpoint.'
    false_positives: 'Clipboard redirection is disabled at the host pool level and enforced by Azure Policy, with no active exceptions on file.'
    function: operations
    stride: information-disclosure
    cwe: 200
    detection_logic: 'Enable AVD host diagnostics, and forward the WVDConnections and WVDCheckpoints logs to the SIEM. Additionally, alert on sessions that originate from devices that do not meet the Conditional Access compliance requirements. Finally, monitor the Microsoft Defender for Endpoint clipboard telemetry on enrolled GFE endpoints for an anomalous copy volume from VDI process contexts.'
