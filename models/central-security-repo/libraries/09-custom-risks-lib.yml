    id: self-managed-boot-integrity-bypass
    baseline_likelihood: unlikely
    baseline_impact: medium
    finding_class: control-not-evidenced
    description: 'This self-managed physical host has no confirmed secure boot or measured-boot attestation. Thus, the integrity of its boot chain cannot be verified.'
    impact: 'If this risk remains unmitigated, a tampered bootloader or bootkit survives indefinitely, and it produces no signal to any control that runs only after the operating system has loaded.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.html
    action: 'Enable secure boot and TPM-backed measured-boot attestation on this physical host, and verify the attestation results before trusting the host''s post-boot state.'
    mitigation: >-
      Enable UEFI Secure Boot, so that the host rejects unsigned or improperly signed bootloaders
      and kernels.

      Enable TPM-backed measured boot, so that each boot stage's hash is recorded and can be
      attested remotely.

      Build attestation verification into the host's admission to the fleet, since a host that fails
      attestation should not be trusted with workload placement.

      Treat a host with secure boot disabled or with no TPM as non-compliant, rather than as a
      silently accepted gap.
    references: NIST SP 800-53 SI-7 (Software, Firmware, and Information Integrity); NIST SP 800-155 (BIOS Integrity Measurement Guidelines)
    risk_assessment: 'Likelihood starts at Unlikely, and impact starts at Medium. Impact then steps on the asset''s integrity rating, moving one level up at Confidential/Critical or above and one level down at Internal/Operational or below. Additionally, likelihood moves with the asset''s attractiveness and internet reachability. Once the condition is confirmed, the finding is High for any self-managed physical host with secure boot disabled or with no TPM-backed measured-boot attestation.'
