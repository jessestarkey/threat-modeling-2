  #
  # --- 5.2 MAESTRO GAP COVERAGE (L3, L5, L6, L7) ---
  'MAESTRO L3: Agent Framework and Dependency Supply Chain Compromise':
    id: maestro-l3-agent-framework-supply-chain
    baseline_likelihood: unlikely
    baseline_impact: very-high
    description: 'The AI agent framework layer -- the libraries used to build and run agents and their transitive dependencies -- is itself a supply chain attack surface distinct from model artifacts or tool definitions.'
    impact: 'If this risk remains unmitigated, a compromised framework package propagates automatically to every agent deployment that installs it, executing with the full privilege of the agent runtime.'
    asvs: V14 - Configuration
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html
    action: Pin all AI framework dependencies to cryptographically verified versions and integrate SCA into the CI/CD pipeline.
    mitigation: Pin all AI framework and transitive dependencies to exact versions with hash verification (pip hash-checking mode, npm lockfiles with integrity hashes). Integrate SCA tools (e.g., Dependabot, Snyk, OSV-Scanner) into CI/CD targeting the AI framework dependency graph. Mirror approved package versions to a private registry and prohibit direct public PyPI/npm access from build pipelines. Subscribe to security advisories for all AI framework packages in use.
    references: MAESTRO L3 (Agent Frameworks) — Compromised Framework Components, Supply Chain Attacks, Input Validation Attacks; NIST SP 800-53 SA-12 (Supply Chain Protection)
    risk_assessment: Critical for any agent built on a publicly-sourced AI framework with an uncontrolled transitive dependency graph.
    false_positives: All framework dependencies are sourced from a fully air-gapped, internally mirrored registry where every package version has been manually reviewed and signed before admission.
    function: architecture
    stride: tampering
    detection_logic: Run SCA scans on every CI/CD build and alert on newly introduced CVEs or suspicious new transitive dependencies. Monitor for unexpected network egress from the agent runtime process at startup.
    risks_identified: {}

  'MAESTRO L5: Evaluation Pipeline and Benchmark Poisoning':
    id: maestro-l5-eval-pipeline-poisoning
    baseline_likelihood: unlikely
    baseline_impact: medium
    description: 'The model evaluation and benchmark pipeline that gates promotion decisions can be manipulated at the dataset, scoring, or reporting layer.'
    impact: 'If this risk remains unmitigated, a backdoored or degraded model can pass pre-production review and reach every user in production undetected.'
