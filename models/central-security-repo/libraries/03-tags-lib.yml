# ==============================================================================
# TAG TAXONOMY: 03-tags-lib.yml
# ==============================================================================
# The full set of tags available across technical assets, communication
# links, trust boundaries, shared runtimes, and data assets in this
# framework — classification tags, and the feature:*/ops:*/net:*/cds:*/
# exception:*/ai:*/icon:* namespaces. Every tag inject_risks.py's
# tag-scanning if-chain checks for should be documented here, though (see
# LIVE DEPENDENCY below) inject_risks.py does not actually read this file.
#
# USAGE:
#   1. Review your system's technical asset tags and machine types.
#   2. Copy the tags that apply to your app's assets into your own
#      03-tags.yml under tags_available — Threagile fails at runtime
#      ("missing referenced tag in overall tag list") if a tag used on an
#      asset isn't declared there. Trim to what you actually use; don't
#      paste the whole list.
#   3. Each tag's trailing comment documents its meaning and, where
#      relevant, which inject_risks.py trigger(s) it feeds.
#
# LIVE DEPENDENCY, unlike every other file in this directory except
# 09-custom-risks-lib.yml: generate_report.py's load_tag_descriptions()
# re-reads this file directly at report-render time (a regex line-scan, not
# yaml.safe_load, since each tag's description lives in a trailing comment
# that plain YAML parsing discards) to source the description text shown in
# the report's Tag Listing section. Editing a tag's comment here changes
# every future report's output immediately — no per-app copy step involved,
# unlike every other reference-catalog library file. inject_risks.py's own
# tag matching, by contrast, is hardcoded literal string checks in its own
# if-chain (`if 'tag:name' in tags: inject(...)`) — it never opens this
# file, so keeping its checks in sync with what's documented here is a
# human convention to maintain, not something enforced at runtime.
# ==============================================================================

tags_available:

  # =============================================================================
  # CLASSIFICATION TAGS
  # These tags describe what an asset IS and what data it handles.
  # They are used for documentation, data flow annotation, and as inputs to
  # risk triggers. They do not fire risks directly on their own.
  # =============================================================================

  # --- Data Asset Classification ---
  - data:payload       # Business/mission content being processed or stored
  - data:credential    # Authentication material: tokens, passwords, API keys, certificates
  - data:pii           # Asset processes or stores personally identifiable information on individuals — trigger for the missing-privacy-impact-assessment risk
  - storage:persistent # Data written to disk or databases (at-rest risk)
  - storage:ephemeral  # Data residing only in memory or transit (in-motion risk)
  - storage:vault      # Highly sensitive data in a dedicated secrets manager (e.g., Azure Key Vault, HashiCorp Vault)
  - auth:human         # Data directly interacted with or generated by end-users
  - auth:npe           # Non-Person Entity data: machine-to-machine interactions
  - risk:malware-vector # Unstructured data that could harbor malicious payloads (e.g., file uploads, email attachments)

  # --- Foundational Asset Classification (Compute, Network, Crypto) ---
  - app:frontend-ui    # Asset serves HTML/JS to the browser — primary user-facing application surface
  - app:backend-api    # Asset implements business logic and API endpoints
  - app:async-worker   # Asset processes jobs from a queue without accepting direct web traffic
  - ops:ci-pipeline    # Asset is a CI/CD build runner or pipeline — modeled as its own technical asset since its dependency-resolution, install-script, and change-control configuration varies per app/repo even on shared enterprise tooling
  - net:ingress-path   # Asset is part of the traffic inspection and routing chain from the perimeter to the cluster
  - net:egress-path    # Asset initiates outbound connections to external entities
  - net:tls-terminator # Asset is where encryption-in-transit is decrypted (plaintext exists in memory here)
  - sec:secrets-broker # Asset fetches, caches, or distributes credentials on behalf of other services
  - compliance:fips-validated # Asset has been confirmed to use FIPS 140-2/3 validated cryptographic modules — suppresses FIPS risk
  - crypto:hsm-backed         # Keys are generated and held in a hardware-backed vault (HSM) rather than software — suppresses part of the key-storage-ownership-hardening-gap risk
  - crypto:customer-managed-key # Key ownership tier is customer-managed (CMK), not platform-managed (PMK), matching this asset's classification requirement — suppresses part of the key-storage-ownership-hardening-gap risk
  - crypto:key-rotation-tested  # Key rotation is automated on a schedule, and any customer-managed key's escrow/recovery procedure has been exercised — suppresses the key-rotation-escrow-neglect risk
  - crypto:key-management-separated # Key-operation permissions and vault-administration/audit permissions are held by distinct roles/individuals — suppresses the key-management-separation-of-duties-violation risk

  # --- Trust Boundary Classification ---
  - zone:dmz           # Internet-facing or untrusted transit network — asset is expected to handle hostile traffic
  - net:internet-reachable # Internet-originated traffic can plausibly reach this asset, even though it isn't the edge component itself (e.g. the real application behind an already-modeled app gateway/ALB/WAF, which carries its own internet:true field instead) — author-maintained ground truth, not derived from graph topology; feeds inject_risks.py's own Likelihood/IDS-blind-spot/containment-disposition checks. Tag the actual application, not the gateway that fronts it, and not anything merely sharing infrastructure with a real DMZ path (a log-forwarding sink, an unrelated internal integration behind the same shared ingress) — that distinction is exactly what a prior graph-walk version of this signal got wrong, which is why it's an explicit tag now instead
  - zone:restricted    # Deep-internal boundary (data tier, private endpoint) — must never have a direct route to the internet
  - mgmt:csp-managed   # Boundary where Azure owns the underlying security controls (Shared Responsibility Model)
  - scope:ato-boundary # Asset is within the formal ATO accreditation boundary — assets without this tag are external dependencies

  # =============================================================================
  # SELF-MANAGED INFRASTRUCTURE TAGS
  # The inverse case of mgmt:csp-managed above: apply one of these to an
  # asset whose application team operates a given control domain itself
  # rather than inheriting it from the enterprise-managed landing zone.
  # Most apps carry none of these -- identity, PAM, physical hardware, and
  # network-perimeter risk content (09-custom-risks-lib.yml sections 1.1,
  # 1.2, 2.2, 3.1) is excluded by default on the assumption that a shared
  # platform team owns those controls uniformly. These tags are the
  # explicit opt-in for the asset that doesn't fit that assumption: a
  # self-hosted directory/CA, a bare-metal host the app team administers
  # down to BMC access, or a network segment the app team configures
  # itself rather than riding the landing zone's segmentation.
  # =============================================================================

  - mgmt:self-managed-identity  # Asset relies on a directory/CA/hybrid-sync service the app team operates itself, not the enterprise identity tenant — trigger for the self-managed directory Tier-0, CA template, and hybrid-sync risks
  - mgmt:self-managed-identity-hardened # Self-managed directory/CA/hybrid-sync infrastructure has been audited against Tier-0 hardening, ESC1-class template misconfiguration, and hybrid-sync isolation — suppresses the self-managed identity risks
  - mgmt:self-managed-pam       # Privileged access to this asset is not governed by an enterprise PAM/JIT program — trigger for the standing-privilege, credential-disclosure, and break-glass risks
  - mgmt:self-managed-pam-hardened # Just-in-time privilege activation, credential vaulting/brokering, and a tested independent break-glass path are confirmed for this asset — suppresses the self-managed PAM risks
  - mgmt:self-managed-hardware  # Asset is a physical host the app team administers itself, including BMC/firmware/boot-chain — trigger for the BMC compromise, firmware persistence, and boot integrity risks
  - mgmt:self-managed-hardware-hardened # BMC credentials/isolation, firmware patch tracking, and secure boot/measured-boot attestation are confirmed for this physical host — suppresses the self-managed hardware risks
  - mgmt:self-managed-network   # Asset's network segmentation, wireless, or external routing is configured by the app team itself, not inherited from the landing zone — trigger for the self-managed network segmentation, rogue AP, and RPKI risks
  - mgmt:self-managed-network-hardened # Default-deny segmentation, rogue AP detection, and RPKI route origin validation are confirmed for this self-managed network — suppresses the self-managed network risks

  # =============================================================================
  # BEHAVIORAL FEATURE TAGS
  # These tags describe what an asset DOES — specific capabilities that introduce
  # discrete attack surfaces. Each tag triggers one or more risk injections.
  # =============================================================================

  # --- Authentication and Identity ---
  - feature:oauth-oidc-provider # Asset issues or validates OAuth 2.0/OIDC tokens (IdP, authorization server, or custom token validation middleware — e.g., Keycloak, Entra ID app registration)
  - feature:saml-sp             # Asset acts as a SAML 2.0 Service Provider consuming assertions from an external IdP (e.g., CAC/PIV federation via ADFS, Okta SAML, Shibboleth)
  - feature:password-reset      # Asset implements a self-service credential recovery or password reset flow (applies even to break-glass and service account recovery flows)
  - ops:token-binding-enforced  # Session/refresh tokens are bound to the issuing client via DPoP or mutual TLS — suppresses the missing-token-binding risk
  - ops:oauth-consent-governed  # Administrator consent is required for high-privilege scope requests and user self-service consent is restricted to a verified-publisher allow-list — suppresses the oauth-illicit-consent-grant risk

  # --- Authorization ---
  - feature:multi-tenancy       # Asset serves data to multiple distinct organizational tenants from a shared deployment — amplifier tag that raises severity of BOLA, BFLA, and data leakage findings
  - feature:admin-panel         # Asset exposes an administrative interface for user management, system configuration, or audit log access
  - feature:vendor-remote-support # Asset grants third-party vendor support engineers remote access — trigger for the vendor-remote-support-access-gap risk
  - ops:vendor-access-case-bound  # Vendor remote support access is scoped to a specific support case with automatic expiry — suppresses the vendor-remote-support-access-gap risk

  # --- Input Handling and Injection ---
  - feature:dynamic-code-execution  # Asset interprets and runs code, scripts, or complex expressions provided by a user (e.g., template engines, eval(), formula processors)
  - feature:file-upload-processing  # Asset accepts and parses complex file formats uploaded by users (e.g., PDFs, Office documents, ZIP files, images)
  - feature:deserialization         # Asset deserializes objects from user-supplied or externally-sourced byte streams (e.g., Java serialization, .NET BinaryFormatter, Python Pickle outside AI model context, YAML.load)
  - feature:pdf-generation          # Asset generates PDFs server-side from user-supplied or user-influenced content (e.g., wkhtmltopdf, Puppeteer, WeasyPrint rendering HTML templates with user data)
  - feature:email-sending           # Asset constructs and sends email where any part of the recipient address, subject, or body is derived from user-supplied input
  - feature:webhook-receiver        # Asset receives inbound HTTP callbacks from external systems and acts on the payload (e.g., GitHub webhooks, Stripe events, CI/CD triggers)
  - feature:import-export           # Asset supports bulk data import (CSV/Excel/JSON batch upload) or bulk data export (full dataset download, report generation)
  - feature:graphql-endpoint        # Asset exposes a GraphQL API (distinct from REST — introspection, query depth, and field-level authorization create a unique attack surface)

  # --- Application Feature Risks ---
  - feature:search-index            # Asset has query capabilities over a search index (e.g., Elasticsearch, Lucene, Solr, Azure AI Search)
  - feature:websocket               # Asset uses persistent WebSocket connections for real-time communication
  - feature:background-jobs         # Asset processes jobs from a queue or scheduler where job parameters originate from earlier user-supplied input (distinct from app:async-worker which is the infrastructure label)
  - feature:caching-layer           # Asset uses an application-level cache (Redis, Memcached, in-process LRU) to serve responses to users
  - feature:ugc-rendering           # Asset renders content created by one user to be displayed to another user (e.g., comments, forum posts, wiki pages) — XSS risk is covered by Threagile's native cross-site-scripting rule; this tag is retained for model completeness
  - feature:third-party-plugins     # Asset allows admins or end-users to install third-party marketplace plugins that execute code in the application's core memory space
  - feature:vdi-path                # Asset is accessed via Virtual Desktop Infrastructure (AVD/RDS) — differentiates VDI access path from direct browser path
  - feature:public-api-endpoint     # Asset exposes an API intentionally accessible to the internet for third-party or B2B integration (distinct from internal-only backend APIs)

  # =============================================================================
  # INFRASTRUCTURE HARDENING TAGS
  # Positive-confirmation tags: presence means the control IS in place.
  # Absence of these tags fires the corresponding hardening risk.
  # =============================================================================

  # --- Container Hardening (absence fires risk) ---
  - ops:trusted-base-image             # Container is deployed from a vetted, scanned DoD/DoW-approved registry image (e.g., Iron Bank)
  - ops:read-only-fs                   # Container mounts its root filesystem as read-only via PodSecurityContext
  - net:micro-segmented                # Container namespace enforces strict default-deny Kubernetes NetworkPolicies
  - ops:container-capabilities-restricted # Container explicitly drops all Linux capabilities and re-grants only those required via securityContext
  - ops:cluster-audit-logging-enabled  # Cluster's audit policy explicitly captures exec/attach/port-forward, secret access, and admission-controller decisions, forwarded to the SIEM (beyond the API server's default policy)

  # --- VM Hardening (absence fires risk) ---
  - ops:host-agents-installed # VM has mandatory DoW endpoint security agents deployed (EDR, Tanium, Splunk Forwarder)
  - ops:stig-baseline         # VM is deployed from a STIG-compliant baseline image and enrolled in automated patch management
  - ops:disk-encrypted        # VM managed disks are encrypted at rest using Azure Disk Encryption or Host-Based Encryption
  - ops:media-sanitization-documented # A documented, NIST SP 800-88-aligned sanitization procedure exists for this VM's storage at end-of-life/decommissioning/repurposing

  # --- Service Hardening (absence fires risk) ---
  - ops:waf-enabled                # A WAF with a managed ruleset in Prevention mode is confirmed in the ingress path — suppresses the WAF coverage risk on zone:dmz assets
  - net:ids-monitored              # Network-based intrusion detection/traffic-anomaly monitoring observes traffic to and from this asset — suppresses the network-ids-blind-spot risk on internet-reachable/zone:dmz assets
  - ops:requires-backup            # Asset requires backup for DR/COOP — presence triggers backup integrity risk
  - ops:api-abuse-logging-enabled  # Public API logs rate-limit rejections, authorization failures, and object-ID request patterns with caller-identity correlation — suppresses the API abuse/enumeration logging gap risk
  - ops:security-event-logging-enabled # Application-level security events (authentication failures, authorization denials, input-validation rejections) are captured and forwarded to the SIEM — suppresses the baseline-security-event-logging-gap risk on app:frontend-ui/backend-api/async-worker assets
  - ops:dns-record-reconciled      # Asset's DNS records are reconciled against live resource state on a recurring schedule — suppresses the dangling-dns-subdomain-takeover risk

  # --- Backup and Recovery Hardening (absence fires risk, alongside ops:requires-backup above) ---
  - ops:backup-admin-segregated  # Backup administration is a distinct role from production administration, with dual authorization and step-up auth required for destructive backup operations — suppresses the backup-admin-privilege-separation-gap risk
  - ops:backup-immutable         # Backup store's immutability lock is confirmed in compliance mode (irreversible by any account, including its own administrators, for the retention period) — suppresses the backup-immutability-not-enforced risk
  - ops:backup-key-rotation-aligned # Backup encryption key rotation accounts for the longest retention period of any backup copy, retaining superseded key versions accordingly — suppresses the backup-key-rotation-retention-mismatch risk
  - ops:recovery-objectives-defined # A criticality-tier-derived RTO/RPO is documented and validated against an actual restore test for this asset — suppresses the recovery-objective-definition-gap risk
  - ops:backup-recovery-tested   # A full restoration exercise using only the written procedure, by someone other than its author, has been completed within the current ATO period — suppresses the untested-restoration-procedure risk
  - ops:vendor-hosted-service    # Asset is a SaaS tenant, vendor-hosted appliance, or niche managed service the enterprise backup platform cannot directly enroll — trigger for the unsupported-saas-backup-gap risk
  - ops:saas-export-configured   # A native or purpose-built export job routes this vendor-hosted asset's data into enterprise-controlled backup storage on a recurring schedule — suppresses the unsupported-saas-backup-gap risk

  # --- Incident-Response Readiness (absence fires risk) ---
  - ir:containment-disposition-documented # A documented containment disposition (auto-isolation permitted / human approval required / prohibited) exists for this asset — suppresses the undocumented-containment-disposition risk
  - ir:credential-inventory-documented    # A current inventory of every credential/secret this asset consumes or issues exists, sufficient to support complete post-compromise rotation — suppresses the undocumented-credential-blast-radius risk
  - ir:plan-tested                        # The incident response plan has been exercised via a tabletop or live-fire drill (not merely documented) within the current ATO period — suppresses the untested-incident-response-plan risk
  - ir:breach-notification-procedure-documented # A documented procedure identifies the DoD/contract-specified reporting timeline (e.g., DFARS 252.204-7012's 72-hour requirement) and the party responsible for executing it — suppresses the dfars-breach-notification-gap risk
  - ir:evidence-handling-documented       # A documented forensic evidence-handling procedure (acquisition, custody log, storage, transfer) exists for incidents affecting this model — suppresses the forensic-chain-of-custody-gap risk

  # --- CI/CD Pipeline Hardening (absence fires risk on ops:ci-pipeline assets) ---
  - ops:dependency-proxy-enforced  # Internally-named packages resolve only from the internal feed, with no public-index fallback for that namespace — suppresses the dependency-confusion-internal-namespace risk
  - ops:install-scripts-restricted # Dependency install/post-install script execution is suppressed by default, with a publish-to-adoption cooldown enforced — suppresses the malicious-install-script-execution risk
  - ops:pipeline-changes-reviewed  # Pipeline/policy edits outside the repository's PR trail are restricted to a minimal administrative group and logged to the SIEM — suppresses the cicd-pipeline-tampering-outside-repo risk

  # =============================================================================
  # DATA GOVERNANCE AND LIFECYCLE TAGS
  # Apply to any technical asset that stores, ingests, or releases data.
  # Positive-confirmation tags (data:*/ops:* below) suppress the matching
  # 09-custom-risks-lib.yml "Data Governance and Lifecycle" risk when the
  # control is already in place, following the same absence-fires-risk
  # pattern as the Infrastructure Hardening tags above.
  # =============================================================================

  - data:external-feed-ingest      # Asset ingests data from an external or third-party source on an ongoing basis (a partner feed, an upstream integration) — trigger for the provenance/lineage chain-of-custody risk, alongside ai:dataset-store
  - data:release-candidate         # Asset produces files or datasets intended for release or broad sharing outside their originating boundary — trigger for the re-identification and data-rights-management risks
  - data:classification-scanned    # Data store's contents have been run through an automated classification/discovery scan on a recurring schedule — suppresses the unscanned-data-store risk
  - data:provenance-tracked        # Ingested external content is checked against an append-only origin/integrity record at consumption time — suppresses the missing-data-provenance-chain risk
  - ops:dlp-egress-inspected       # This asset's export/attachment/outbound-transfer paths are routed through classification-aware DLP inspection — suppresses the dlp-egress-blind-spot risk
  - data:retention-scheduled       # A documented retention period and disposition action exists for this asset's data/classification types — suppresses the missing-data-retention-schedule risk
  - data:downgrade-procedure-documented # Media/data moved from this asset to a lower classification enclave follows a documented, independently verified downgrading procedure distinct from routine sanitization — suppresses the media-downgrade-procedure-gap risk
  - data:pia-documented            # A current Privacy Impact Assessment covers this asset's actual PII collection, use, and sharing, reviewed since the last material change — suppresses the missing-privacy-impact-assessment risk
  - data:reidentification-tested   # Released datasets from this asset have been tested against a motivated-intruder re-identification attempt per NIST SP 800-188 — suppresses the dataset-reidentification-risk
  - data:rights-managed            # Files released from this asset are routed through an enterprise rights-management capability providing persistent, revocable access control — suppresses the missing-data-rights-management risk
  - data:data-plane-audit-enabled  # Operation-level (read/write/delete/list) audit logging is enabled on this data store and forwarded to the SIEM, with anomaly detection applied to access patterns — suppresses the data-store-audit-detection-gap risk

  # =============================================================================
  # CROSS-DOMAIN SOLUTION INTERFACE TAGS
  # Apply to assets that interface with an external, UCDMO-approved CDS.
  # The CDS itself is outside the ATO boundary and modeled as an external entity.
  # These tags cover only the low-side application's role in the transfer workflow.
  # =============================================================================

  # LOW-SIDE INTERFACE (outbound low-to-high, inbound high-to-low)
  - cds:low-side-submitter   # Asset prepares and submits content to the external CDS for outbound low-to-high transfer. Responsible for schema validation of classification markings before submission.
  - cds:low-side-receiver    # Asset receives and processes content that has arrived from the high side through the external CDS. Must treat inbound content as untrusted regardless of CDS approval.
  - cds:low-side-broker      # Asset is the message broker or queue staging content between the low-side application and the CDS interface.

  # HIGH-SIDE INTERFACE (outbound high-to-low, inbound low-to-high) — in-scope assets
  - cds:high-side-submitter  # Asset prepares and proposes content for downward release from the high side to the CDS. Responsible for sanitization, above-releasable content review, and release authority approval gating before submission.
  - cds:high-side-receiver   # Asset receives and processes content arriving from the low side through the CDS into the high-side environment. Must treat inbound low-side content as untrusted for integrity purposes.
  - cds:high-side-broker     # Asset is the message broker or queue staging content between the high-side application and the CDS interface on the high side.

  # =============================================================================
  # POLICY EXCEPTION TAGS  (POA&M Triggers)
  # These tags mark explicit AO-accepted waivers. Each fires a risk entry
  # requiring formal risk acceptance documentation.
  # =============================================================================

  - exception:runs-as-root       # Container executes as UID 0 or with elevated Linux capabilities — AO waiver required
  - exception:cleartext-internal # Asset transmits or receives data in plaintext over the internal network — AO waiver required
  - exception:local-auth-fallback # Asset maintains a local credential store bypassing the Enterprise IdP and mandatory MFA/CAC — AO waiver required
  - exception:eol-component      # Asset includes a software component that has reached End-of-Life and no longer receives security patches — AO waiver required
  - exception:direct-admin-access # VM has SSH/RDP exposed without routing through a Bastion host or enforcing JIT access — AO waiver required

  # =============================================================================
  # AI/ML THREAT SURFACE TAGS
  # Apply to any technical asset that hosts, serves, or integrates an AI/ML
  # component. Tags are grouped by the ATLAS/MAESTRO attack surface they map to.
  # =============================================================================

  # --- Inference and Access Surface ---
  - ai:llm-endpoint    # Asset exposes an LLM or ML model inference API (internal or external)
  - ai:model-serving   # Asset hosts and serves a trained model artifact (e.g., Triton, TorchServe, vLLM, Ollama)

  # --- Prompt and Input Attack Surface ---
  - ai:user-prompt-input     # Asset accepts free-form natural language input directly from end-users fed to an LLM
  - ai:indirect-prompt-input # Asset processes content from third-party/external/user-controlled sources interpreted by an LLM (e.g., emails, web pages, documents, search results, calendar events)

  # --- RAG and Knowledge Base Surface ---
  - ai:rag-pipeline        # Asset is a Retrieval-Augmented Generation pipeline (vector DB + retrieval + LLM grounding)
  - ai:rag-ingest-pipeline # Asset ingests, chunks, embeds, and writes documents into the vector store

  # --- Agentic and Tool-Use Surface ---
  - ai:agent-orchestrator  # Asset is an AI agent orchestration layer that plans, decomposes tasks, and dispatches tool calls (e.g., LangChain, AutoGen, CrewAI, custom ReAct loop)
  - ai:plugin-tool-use     # LLM or agent is granted tool/plugin/function-calling capabilities that invoke external APIs or execute actions
  - ai:agent-memory        # Asset maintains persistent memory or session state for an AI agent across turns or sessions
  - ai:agent-framework     # Asset is an AI agent framework or its transitive dependency graph (e.g., LangChain, AutoGen, Semantic Kernel and their PyPI/npm deps) — flags the framework code layer as a supply chain surface

  # --- Training and Data Pipeline Surface ---
  - ai:training-pipeline # Asset participates in model training, fine-tuning, RLHF, or continual learning workflows
  - ai:dataset-store     # Asset is the authoritative storage layer for training, evaluation, or fine-tuning datasets

  # --- Supply Chain Surface ---
  - ai:model-registry   # Asset is a model registry, artifact store, or package feed for AI model weights and configs (e.g., MLflow, HuggingFace Hub mirror, private OCI registry for models)
  - ai:model-exfil-risk # Asset sits at a data boundary where model weights, architecture, or training data could be extracted

  # --- Evaluation and Observability Surface (MAESTRO L5) ---
  - ai:eval-pipeline        # Asset is a model evaluation, red-teaming, or benchmark pipeline that gates promotion decisions
  - ai:observability-stack  # Asset is the AI-specific monitoring, logging, or anomaly detection layer for an AI system (e.g., LLM tracing, inference telemetry, behavioral drift detection)

  # --- Security AI as Target (MAESTRO L6) ---
  - ai:security-agent # Asset is an AI-powered defensive tool: AI-driven SIEM, UEBA, automated threat hunter, or policy enforcement bot

  # --- Agent Ecosystem and Identity (MAESTRO L7) ---
  - ai:multi-agent-boundary # Asset is a trust boundary where multiple AI agents interact across identity domains (e.g., A2A gateway, MCP server, agent registry)

  # --- Operational and Deployment Hardening Surface ---
  # Trigger tags (mark an asset as having this exposure) and their
  # matching positive-confirmation suppression tags, for the AI
  # operational/deployment risks beyond standard ATLAS/MAESTRO coverage.
  - ai:ot-adjacent-output        # Asset's output has a path to an OT actuator or safety-critical process — trigger for the ai-ot-actuation-boundary-gap risk
  - ai:system-prompt-governed    # Production system prompts are version-controlled with mandatory review and enforce explicit instruction-boundary structure — suppresses the ungoverned-system-prompt-change risk
  - ai:on-device-inference       # Model is fielded onto edge/embedded hardware an adversary could gain physical custody of — trigger for the on-device-model-extraction-gap risk
  - ai:secure-enclave-protected  # Model runs and is encrypted within a hardware-backed TEE/secure enclave on the device, with debug interfaces disabled — suppresses the on-device-model-extraction-gap risk
  - ai:air-gapped-model-delivery # Model is delivered into a disconnected/air-gapped enclave — trigger for the air-gapped-model-package-integrity-gap risk
  - ai:model-package-signed      # Model package (weights, tokenizer, config, manifest) is signed with an externally-held key and verified at every load — suppresses the air-gapped-model-package-integrity-gap risk
  - ai:rollback-capable          # A tested rollback-within-recovery-time path and an independent kill switch with a defined safe-mode fallback exist — suppresses the missing-model-rollback-killswitch risk
  - ai:canary-tested             # A versioned canary prompt suite runs against the production endpoint on a recurring schedule with alerting on deviation — suppresses the missing-canary-prompt-testing risk
  - ai:registry-source-verified  # Serving platform loads models only from the approved internal registry, verified by host and digest — suppresses the untrusted-model-registry-source risk
  - ai:training-code-protected   # Training scripts and feature-engineering code are access-restricted, encrypted at rest, and monitored for bulk-clone/export activity — suppresses the training-script-ip-exfiltration risk
  - ai:hyperparameter-diffed     # Every promotion-bound run's actual applied hyperparameters are recorded and diffed against an approved baseline before promotion — suppresses the hyperparameter-tampering-no-baseline-diff risk
  - ai:third-party-model-api     # Asset sends requests to a vendor-hosted foundation model API — trigger for the ungoverned-third-party-model-api risk
  - ai:vendor-model-governed     # Data-transmission classification restriction, training-use opt-out, credential vaulting, and recurring vendor security-posture review are all confirmed for this vendor model API — suppresses the ungoverned-third-party-model-api risk

  # =============================================================================
  # DIAGRAM ICON TAGS
  # Purely cosmetic -- select which small icon(s) threagile_dfd_to_html.py
  # draws on the data-flow diagram. Never used as an inject_risks.py
  # trigger. A technical asset can carry more than one -- e.g. an ALB with
  # WAF attached tags both icon:aws-waf and icon:aws-alb, and the node
  # renders both icons side by side above its label -- rendered in the
  # order listed on the asset. A trust boundary still only ever shows one
  # corner badge, using whichever of its icon: tags is found first, since
  # its corner-badge rendering has no side-by-side layout. Pilot set --
  # extend as new component types need one, not meant to be exhaustive.
  # =============================================================================

  - icon:azure-waf           # Web Application Firewall / App Gateway with WAF policy
  - icon:azure-ngfw          # Next-gen firewall appliance (e.g., Azure Firewall)
  - icon:azure-vnet          # Virtual network boundary (the VNet itself -- see icon:azure-subnet below for a subnet nested inside one)
  - icon:azure-aks           # AKS cluster boundary
  - icon:azure-key-vault     # Azure Key Vault (or equivalent secrets manager)
  - icon:azure-database      # Relational/NoSQL database service
  - icon:azure-storage       # Blob/file storage service
  - icon:azure-monitor       # Centralized logging/monitoring workspace
  - icon:azure-avd           # Azure Virtual Desktop session host
  - icon:azure-entra-id      # Microsoft Entra ID (identity provider / app registration)
  - icon:azure-private-link  # Azure Private Endpoint / Private Link
  - icon:azure-subscription  # Azure subscription or tenant-level boundary
  - icon:azure-management-groups # The outer Azure Government/tenant cloud boundary itself, one level above icon:azure-subscription -- Microsoft's own Architecture Icons set has no generic "Azure Cloud" logo, so this real governance concept (Management Groups sit above Subscriptions in Azure's actual hierarchy) is the closest correctly-licensed fit
  - icon:azure-app-gateway   # Azure Application Gateway -- pair with icon:azure-waf when WAF is attached
  - icon:azure-load-balancer # Azure Load Balancer (Standard SKU, internal or public)
  - icon:azure-openai        # Azure OpenAI model inference endpoint -- use this rather than icon:azure-database/icon:azure-storage-style generic tags for the actual model-serving PaaS endpoint itself
  - icon:azure-subnet        # A subnet nested inside a VNet (e.g. where a storage tier, private-endpoint set, or AKS node pool lives) -- distinct from icon:azure-vnet, the VNet itself
  - icon:azure-nsg           # Network Security Group applied at this subnet -- tag alongside icon:azure-subnet, not instead of it (both render side by side)

  # --- AWS counterparts, one per Azure tag above -- no AWS app models this
  # set yet, but 05/06/07-*-lib.yml already have AWS sibling folders. ---
  - icon:aws-waf              # AWS WAF Web ACL
  - icon:aws-ngfw             # AWS Network Firewall
  - icon:aws-vpc              # Virtual Private Cloud boundary (the VPC itself -- see icon:aws-subnet-public/private below for a subnet nested inside one)
  - icon:aws-eks              # EKS cluster boundary
  - icon:aws-secrets-manager  # AWS Secrets Manager (or equivalent secrets store)
  - icon:aws-database         # Relational/NoSQL database service (e.g., RDS)
  - icon:aws-storage          # S3 or equivalent object/file storage service
  - icon:aws-monitor          # CloudWatch or equivalent centralized logging/monitoring
  - icon:aws-workspaces       # Amazon WorkSpaces session host (VDI)
  - icon:aws-identity-center  # AWS IAM Identity Center (identity provider / SSO)
  - icon:aws-private-link     # AWS PrivateLink / VPC endpoint
  - icon:aws-organizations    # AWS account or Organizations-level boundary
  - icon:aws-cloud            # The outer AWS Cloud/GovCloud boundary itself, one level above icon:aws-organizations -- AWS's own "Architecture Group Icons" set (distinct from its per-service icons) includes this generic group logo specifically for diagram-level boundary badges
  - icon:aws-subnet-public    # A public (internet-routable) subnet nested inside a VPC -- e.g. DMZ/ingress. AWS's own icon set gives public/private subnets distinct icons, unlike Azure's single icon:azure-subnet
  - icon:aws-subnet-private   # A private (no direct internet route) subnet nested inside a VPC -- e.g. where a storage tier, private-endpoint set, or EKS node pool lives
  - icon:aws-nacl             # Network ACL applied at this subnet -- AWS has no direct NSG equivalent (confirmed absent from AWS's own icon set); NACL is the real subnet-level analog. Tag alongside icon:aws-subnet-public/private, not instead of it

  # --- AWS-only additions beyond the paired pilot set above -- no Azure counterpart tag ---
  - icon:aws-bedrock       # Amazon Bedrock foundation-model API
  - icon:aws-api-gateway   # Amazon API Gateway
  - icon:aws-alb           # AWS Application Load Balancer -- pair with icon:aws-waf when WAF is attached

  # --- Kubernetes-native boundary icon, independent of cloud provider --
  # a namespace is a k8s concept, not an Azure/AWS one, so one tag covers
  # both an AKS and an EKS cluster's namespace boundaries (which cloud
  # it's under is already conveyed by the enclosing cluster boundary's own
  # icon:azure-aks/icon:aws-eks badge) ---
  - icon:k8s-namespace     # Kubernetes namespace boundary (NetworkPolicy-isolated)
  - icon:kubernetes        # Self-managed/baseline Kubernetes cluster boundary (cloud-provider-independent) -- pair with icon:azure-aks/icon:aws-eks's own reasoning: use this instead of them when the cluster's control plane is customer-administered rather than a managed PaaS offering (e.g. kubeadm on IaaS VMs), since "AKS" or "EKS" would misstate whose control plane it actually is
  - icon:execution-environment # Boundary badge for a `type: execution-environment` trust boundary (e.g. an agent process co-resident with the VM/host it runs on) -- cloud-provider-independent, same reasoning as icon:kubernetes above

  # --- Software running as pods/processes, independent of cloud provider
  # (mostly open-source; icon:confluence is commercial COTS, added to this
  # same set since it's self-hosted and icon-selected identically) ---
  - icon:keycloak    # Keycloak identity provider
  - icon:postgresql  # PostgreSQL database engine
  - icon:nginx       # NGINX (or NGINX Ingress Controller) reverse proxy
  - icon:temporal    # Temporal workflow orchestration engine
  - icon:qdrant      # Qdrant vector database
  - icon:open-webui  # Open WebUI chat frontend
  - icon:confluence  # Atlassian Confluence
  - icon:splunk      # Splunk SIEM/logging platform, self-hosted (not the managed Splunk Cloud offering)
  - icon:jira        # Atlassian Jira
  - icon:gitlab      # GitLab (self-hosted Community/Enterprise Edition)
  - icon:litellm     # LiteLLM proxy/gateway
  - icon:k8s-secret-csi # Kubernetes Secrets Store CSI Driver (cloud-provider-independent, same reasoning as icon:k8s-namespace)
  - icon:etcd        # Self-managed etcd datastore backing a self-managed Kubernetes control plane -- distinct from icon:azure-database, which a managed control plane's own backing etcd is tagged with instead since the customer never administers it directly there
  - icon:guacamole   # Apache Guacamole clientless VDI/remote-desktop gateway
  - icon:vault       # HashiCorp Vault, self-hosted secrets manager -- pair with icon:azure-key-vault's own reasoning: use this instead when the secrets manager itself is customer-administered (e.g. running as a workload in the app's own cluster) rather than a managed PaaS offering
  - icon:grafana     # Grafana observability/dashboarding platform
  - icon:mcp         # Model Context Protocol server -- the mediating gateway, not the backend product it fronts (e.g. a "Jira MCP Server" gets icon:mcp, not icon:jira)

  # --- Generic external-actor icons (not product logos) -- distinguish
  # who/what an out-of-scope external-entity node represents at a glance ---
  - icon:human-web       # External human user accessing via an ordinary web browser
  - icon:human-vdi       # External human user accessing via Virtual Desktop Infrastructure (AVD/RDS), not a direct browser path
  - icon:machine-client  # External non-human system/API caller (machine-to-machine, no human in the loop)

  # =============================================================================
  # COMMUNICATION LINK PATH-FILTER TAGS
  # Applied to an individual communication_links entry (not the asset itself)
  # to declare which bucket(s) it belongs to in the standalone HTML diagrams'
  # filter-links bar (threagile_dfd_to_html.py's classify_edge()). Purely
  # cosmetic/navigational -- never an inject_risks.py trigger. One or more
  # per link -- a shared perimeter hop that carries both authentication and
  # ordinary traffic can legitimately be both path:identity and
  # path:network at once. Mission Flows and Log/Telemetry are already
  # fully determined by a link's own `usage` (business/devops
  # respectively) and normally don't need tagging; Network Path is
  # inferred structurally instead, from whether the link crosses between
  # two different VPC/VNet trust boundaries (see compute_vpc_by_asset_id
  # in generate_report.py). Identity Path has no equivalent structural
  # signal and is never inferred -- it only ever comes from this explicit
  # tag; an untagged identity link shows up as mission/network instead,
  # a more honest failure mode than guessing (e.g. from endpoint
  # `technology`) and sometimes being wrong. Tag a link explicitly
  # whenever the automatic Network Path guess would be wrong, incomplete
  # (e.g. a shared hop that should also count as another category), or
  # whenever it's an identity link at all.
  # =============================================================================

  - path:mission   # Explicitly Mission Flows -- overrides/extends the automatic guess
  - path:telemetry # Explicitly Log/Telemetry -- overrides/extends the automatic guess
  - path:identity  # Explicitly Identity Path -- overrides/extends the automatic guess
  - path:network   # Explicitly Network Path -- overrides/extends the automatic guess