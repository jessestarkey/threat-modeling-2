    abuse_cases:

      "AISVS C1.3: Training Data Poisoning and Backdoor Insertion": >
        As an attacker with write access to training data sources, I want to
        inject poisoned samples or backdoor triggers into the training corpus
        so that the resulting model behaves maliciously on specific inputs
        while appearing benign on standard evaluations, evading pre-production
        review.

      "AISVS C2.1: Direct Prompt Injection and LLM Jailbreak": >
        As an attacker, I want to craft adversarial natural language inputs
        that override the system prompt or bypass safety guardrails so that
        I can extract confidential system instructions, enumerate model
        capabilities, or coerce the LLM into performing unauthorized actions
        on connected tools.

      "AISVS C2.1: Indirect Prompt Injection via External Content": >
        As an attacker, I want to embed malicious instructions inside
        documents, emails, or web pages that are subsequently retrieved and
        interpreted by an LLM so that I can hijack the model's execution
        context, exfiltrate session data, or trigger unauthorized tool actions
        without any direct user interaction.

      "AISVS C3.1: Model Substitution Inside a Disconnected Enclave": >
        As an insider or an attacker who has gained access inside an air-
        gapped enclave, I want to substitute a tampered model package for
        the legitimate one already sitting in the enclave's artifact store
        so that the substitution is never caught, since integrity was only
        verified once at transfer and never checked again at load time.

      "AISVS C3.1: Undetected Model Swap or Guardrail Disablement": >
        As an insider or an attacker who has gained deployment access, I want
        to silently swap the serving model to an unapproved version or disable
        a safety guardrail during an incident and never re-enable it, so that
        the change persists undetected because traffic-based monitoring alone
        has no independent known-answer baseline to compare against.

      "AISVS C3.2: Evaluation Pipeline Manipulation": >
        As an attacker who has compromised the model promotion pipeline, I
        want to poison the evaluation benchmark dataset or tamper with scoring
        logic so that a backdoored or degraded model passes pre-production
        review undetected and is promoted to production.

      "AISVS C3.5: Insider Hyperparameter Sabotage": >
        As an insider with legitimate training-pipeline access, I want to
        change a single hyperparameter value (class weighting, loss
        function terms) so that the resulting model is deliberately biased
        toward a chosen outcome, leaving no trace in the training code and
        still passing standard evaluation metrics.

      "AISVS C4.3: Physical Model Extraction from Edge Hardware": >
        As an attacker who gains physical custody of an edge or embedded
        device, I want to read model weights directly from unprotected
        storage or memory so that I obtain the full model with no hardware
        boundary in the way, since the device itself is now in my hands.

      "AISVS C5.2: Vendor Model API Data Exposure via Overlooked RAG Context": >
        As a malicious insider or negligent operator, I want to route CUI or
        classification-inappropriate content — including RAG-retrieved
        context passed along with the prompt — to a vendor-hosted foundation
        model API with no data-transmission restriction or confirmed
        training-use opt-out, so that the content is disclosed to a third
        party with no technical control having prevented it.

      "AISVS C6.1: ML Model Supply Chain Compromise": >
        As a sophisticated threat actor, I want to compromise an upstream
        model artifact (via Pickle deserialization exploit, backdoored
        weights, or registry rug pull) so that a malicious model is deployed
        to production, achieving RCE on the serving host or producing
        adversary-favorable outputs under specific trigger inputs.

      "AISVS C6.2: AI Agent Framework Supply Chain Attack": >
        As a threat actor, I want to publish a malicious or typosquatted
        package to PyPI or npm that impersonates a legitimate AI framework
        dependency so that the agent runtime automatically installs my
        backdoor during the next build, giving me persistent access to every
        agent deployment built on that framework.

      "AISVS C7.3: AI-Triggered Actuation Without Human Authorization": >
        As an attacker who has manipulated a model's output through
        hallucination or adversarial input, I want that output to reach an
        OT actuator or safety-critical process with no unbypassable human
        gate in the way, so that a model failure converts directly into a
        physical-world safety incident.

      "AISVS C8.2: RAG Knowledge Base Poisoning": >
        As an attacker with write access to indexed content, I want to inject
        adversarially crafted documents into the RAG knowledge base so that
        the LLM is persistently grounded on attacker-controlled content,
        redirecting responses across all users querying related topics or
        harvesting credentials embedded in retrieval context.

      "AISVS C9.1: Inference API Cost Harvesting and Denial of AI Service": >
        As an attacker with API access, I want to submit resource-intensive
        queries in high volume so that I exhaust the inference budget, degrade
        model availability for legitimate users, or generate unauthorized
        cloud compute spend — bypassing standard network-layer volumetric
        DDoS protections.

      "AISVS C9.3: AI Agent Tool Abuse and Privilege Escalation": >
        As an attacker who has achieved prompt injection against an agentic
        system, I want to abuse the LLM's granted tool permissions to
        exfiltrate data via outbound API calls, modify backend records, or
        send communications as the victim — all within the trusted execution
        context of the agent without triggering perimeter controls.

      "AISVS C10.1: Malicious or Compromised MCP Server Grants Unintended Access": >
        As an attacker operating or having compromised a third-party MCP
        server the agent connects to, I want that server to advertise tool
        definitions or resource capabilities beyond what a legitimate
        integration would need so that the agent's runtime silently grants
        me execution or data access the application team never intended to
        expose through that connection.

      "AISVS C11.3: Model Extraction and Intellectual Property Theft": >
        As an attacker with inference API access, I want to systematically
        probe the model with grid-search queries to reconstruct a functional
        copy of a proprietary model, or perform membership inference to
        confirm whether specific CUI records were present in the training
        corpus.

    security_requirements:

      "AISVS C1.1: Training Data Origin & Data Security": |
        1.1.1 | Verify that training data includes only features, attributes, and fields required for the model's stated purpose. | 1
        1.1.2 | Verify that an up-to-date inventory is kept of every training-data source, including its origin, responsible party, license, collection method, intended use constraints, and processing history. | 2
        1.1.3 | Verify that data integrity is provided when training data is stored and transferred. | 2
        1.1.4 | Verify that integrity monitoring is applied to guard against unauthorized modifications or corruption of training data. | 2
        1.1.5 | Verify that datasets are watermarked so their use can be attributed and any unauthorized use detected. | 3

      "AISVS C1.2: Data Labeling and Annotation Security": |
        1.2.1 | Verify that labeling platforms enforce access controls that restrict who can create, modify, or approve annotations. | 1
        1.2.2 | Verify that cryptographic integrity is applied to labeling artifacts. | 2
        1.2.3 | Verify that sensitive information in labels is redacted, anonymized, or encrypted before being used in any labeling artifact. | 2

      "AISVS C1.3: Training Data Quality and Security Assurance": |
        1.3.1 | Verify that training and fine-tuning pipelines implement poisoning detection techniques to identify potential data poisoning or unintentional corruption in training data. | 2
        1.3.2 | Verify that automatically generated labels are subject to confidence thresholds and consistency checks to detect misleading or low-confidence labels. | 2
        1.3.3 | Verify that models used in security-relevant decisions are evaluated for bias patterns. | 2
        1.3.4 | Verify that disallowed content is detected and removed before training. | 2
        1.3.5 | Verify that defenses against clean-label poisoning attacks are implemented. | 3

      "AISVS C2.1: Prompt Injection Defenses": |
        2.1.1 | Verify that input normalization is applied before tokenization or embedding. | 1
        2.1.2 | Verify that encoding and representation smuggling in inputs is detected and mitigated. Approved mitigations include canonicalization, strict schema validation, policy-based rejection, or explicit marking. | 1
        2.1.3 | Verify that all inputs that could steer model behavior are treated as untrusted and screened by a prompt injection detection ruleset or classifier, with flagged inputs blocked. | 1
        2.1.4 | Verify that input length controls prevent content from exceeding the context window. The controls must reject inputs that exceed token limits rather than truncating them. | 1
        2.1.5 | Verify that the system implements a character set restriction for all inputs. The restriction must use an allow-list approach that permits only characters that are explicitly required. | 1
        2.1.6 | Verify that the system enforces an instruction hierarchy in which system and developer messages override user instructions and other untrusted inputs, even after user instructions have been processed. | 2
        2.1.7 | Verify that reserved special tokens are encoded as literal characters and cannot be injected into the model context. | 2
        2.1.8 | Verify that the system can detect many-shot jailbreaking patterns. | 3

      "AISVS C2.2: Content & Policy Screening": |
        2.2.1 | Verify that every prompt is scored by a content classifier for violence, self-harm, hate, and sexual content against configurable thresholds. Prompts that exceed those thresholds are rejected or sanitized before reaching the model context. | 1
        2.2.2 | Verify that prompt content classification is evaluated for unsupported languages. | 1
        2.2.3 | Verify that non-text inputs (image/video/audio) are checked for adversarial perturbations, steganographic payloads, hidden or embedded content, or known attack patterns. | 2
        2.2.4 | Verify that coordinated attacks spanning multiple input types (e.g., steganographic payloads in images combined with prompt injection in text) are detected and blocked. | 3

      "AISVS C3.1: Model Authorization & Integrity": |
        3.1.1 | Verify that a model registry maintains an inventory of all deployed model artifacts and their origin. | 1
        3.1.2 | Verify that all model artifacts (weights, configurations, tokenizers, base models, fine-tunes, adapters, and safety/policy models) are cryptographically signed by authorized entities. | 2
        3.1.3 | Verify that model cryptographic signatures are verified at deployment admission and on load. | 2

      "AISVS C3.2: Model Validation & Testing": |
        3.2.1 | Verify that models undergo automated input validation testing, safety evaluation testing, and output sanitization testing before deployment. | 1
        3.2.2 | Verify that models subjected to post-training quantization are re-evaluated against the same safety and alignment test suite on the compressed artifact before deployment. | 2
        3.2.3 | Verify that provider model, version, or routing changes trigger security re-evaluation before continued use. | 3

      "AISVS C3.3: Controlled Deployment & Rollback": |
        3.3.1 | Verify that production deployments implement rollout mechanisms with automated rollback triggers. | 2
        3.3.2 | Verify that rollback capabilities restore the complete model state. | 2
        3.3.3 | Verify that model versions running in parallel use isolated runtime state so that AI-specific shared resources are not shared across deployments. | 2

      "AISVS C3.4: Secure Development Practices": |
        3.4.1 | Verify that AI-specific runtime components are not shared across environment boundaries (e.g., development, staging, production). | 1
        3.4.2 | Verify that model training and fine-tuning environments are isolated from production environments. | 2

      "AISVS C3.5: Pipeline Fine-Tuning": |
        3.5.1 | Verify that models used in RLHF fine-tuning are versioned and integrity-verified before use in a training run. | 2
        3.5.2 | Verify that RLHF training stages include automated detection of reward hacking or reward model over-optimization. | 3
        3.5.3 | Verify that in multi-stage fine-tuning pipelines, each stage's output is integrity-verified before it is consumed by the next stage. | 3
        3.5.4 | Verify that fine-tuning checkpoints are registered as distinct artifacts. | 3

      "AISVS C4.1: AI Workload Sandboxing & Validation": |
        4.1.1 | Verify that AI models execute in isolated sandboxes. | 1
        4.1.2 | Verify that model artifact loading enforces an explicit allow-list of serialization formats that do not permit arbitrary code execution during deserialization. | 1
        4.1.3 | Verify that workload attestation is performed before model loading to provide proof that the execution environment has not been tampered with. | 3
        4.1.4 | Verify that confidential inference services protect model weights during runtime through isolated execution environments. | 3

      "AISVS C4.2: AI Hardware Security": |
        4.2.1 | Verify that AI accelerator (GPU) firmware is version-pinned, signed, and attested at boot. | 2
        4.2.2 | Verify that execution within a trusted execution environment (TEE) provides hardware-enforced isolation, memory encryption, and integrity protection. | 3
        4.2.3 | Verify that AI accelerator (GPU) integrity is validated using hardware-based attestation mechanisms before each workload executes. | 3
        4.2.4 | Verify that accelerator (GPU) memory is isolated between workloads through partitioning mechanisms with memory sanitization between jobs. | 3
        4.2.5 | Verify that accelerator interconnects are restricted to approved topologies and authenticated endpoints. | 3

      "AISVS C4.3: Edge & Distributed AI Security": |
        4.3.1 | Verify that edge AI devices authenticate to central infrastructure using strong authentication mechanisms. | 1
        4.3.2 | Verify that models deployed to edge or mobile devices are cryptographically signed during packaging, and that the on-device runtime validates these signatures or checksums before loading or inference. | 2
        4.3.3 | Verify that inference runtimes enforce process, memory, and file access isolation. | 3
        4.3.4 | Verify that model weights and sensitive parameters stored locally are encrypted using hardware- backed key stores or secure enclaves. | 3
        4.3.5 | Verify that models packaged within mobile, IoT, or embedded applications are encrypted at rest, and decrypted only inside a trusted runtime or secure enclave, preventing direct extraction from the app package or filesystem. | 3

      "AISVS C5.1: Authentication": |
        5.1.1 | Verify that high-risk AI operations (model deployment, weight export, training data access, production configuration changes) require step-up authentication. | 3
        5.1.2 | Verify that AI agents in federated or multi-system deployments authenticate using short-lived, minimal-scoped, cryptographically signed tokens. | 3

      "AISVS C5.2: AI Resource Authorization & Classification": |
        5.2.1 | Verify that every AI resource (datasets, endpoints, vector collections, embedding indices, compute instances) enforces access controls with explicit allow-lists and default-deny policies. | 2
        5.2.2 | Verify that retrieval pipelines (e.g., RAG queries, embedding lookups) enforce the end-user's authorization context at each retrieval and assembly stage, rather than relying solely on the service account's permissions. | 2
        5.2.3 | Verify that sensitive data is retrieved via retrieval pipelines (e.g., RAG queries, embedding lookups) to prevent permanent storage in models. | 2
        5.2.4 | Verify that post-inference filtering mechanisms prevent responses from including data that the requester is not authorized to receive. | 2
        5.2.5 | Verify that the policy decision point for agent authorization is isolated from the agent's execution environment. | 2
        5.2.6 | Verify that privileged access to model weights, training pipelines, and production AI configuration is granted just in time, with a defined maximum session duration and automatic expiry. Zero Standing Privilege (ZSP) to these resources is encouraged. | 3
        5.2.7 | Verify that data classification labels propagate to downstream resources (embeddings, prompt caches, model outputs). | 3

      "AISVS C5.3: Multi-Tenant Isolation": |
        5.3.1 | Verify that shared model serving infrastructure prevents one tenant's fine-tuning, inference, or embedding operations from influencing or observing another tenant's operations. | 2
        5.3.2 | Verify that one tenant cannot influence or observe another tenant's operations through shared compute resources. Satisfying this requirement typically requires hardware partitioning, confidential computing, or dedicated per-tenant compute allocation. | 3

      "AISVS C6.1: Model Artifact Integrity": |
        6.1.1 | Verify that models are scanned for malicious code before import. | 1
        6.1.2 | Verify that model weights, datasets, and fine-tuning adapters are downloaded only from approved sources. | 1
        6.1.3 | Verify that every third-party model artifact can be integrity-verified. | 2
        6.1.4 | Verify that models pass a behavioral acceptance test suite before being promoted to any non- development environment. | 2

      "AISVS C6.2: AI BOM & Supply Chain Monitoring": |
        6.2.1 | Verify that every model artifact publishes a version-controlled, machine-readable AI BOM listing datasets, weights, licenses, and data-origin statements. | 1
        6.2.2 | Verify that AI BOMs are cryptographically signed before deployment. | 2
        6.2.3 | Verify that AI BOM completeness checks fail the build if any component metadata is missing. | 2

      "AISVS C7.1: Output Format Enforcement": |
        7.1.1 | Verify that the application validates all model outputs against a defined schema and rejects any output that does not match. | 1
        7.1.2 | Verify that model-generated output is bounded by length limits and termination controls. | 1

      "AISVS C7.2: Hallucination Detection & Mitigation": |
        7.2.1 | Verify that the system assesses the reliability of generated answers using a confidence estimation method. | 2
        7.2.2 | Verify that the application automatically blocks answers or switches to a fallback message if the confidence score drops below a defined threshold. | 2
        7.2.3 | Verify that for responses classified as high-risk by policy, the system performs an additional verification step. | 3

      "AISVS C7.3: Output Safety": |
        7.3.1 | Verify that automated classifiers scan every response and block content that matches defined harmful content categories. | 1
        7.3.2 | Verify that output filters detect and block responses that disclose system prompt content or backend data. | 2
        7.3.3 | Verify that model-generated output is prevented from triggering outbound requests. | 2
        7.3.4 | Verify that model outputs are checked for hidden, encoded, or misleading content created through homoglyphs, formatting, metadata, or structured fields. | 3

      "AISVS C7.4: Source Attribution & Citation Integrity": |
        7.4.1 | Verify that responses generated using retrieval-augmented generation (RAG) include attribution to the source documents. | 1
        7.4.2 | Verify that RAG attributions are derived from retrieval metadata and are not generated by the model, so provenance cannot be fabricated. | 1
        7.4.3 | Verify that claims in a RAG response can be traced to the retrieved chunk. | 2
        7.4.4 | Verify that generated media is watermarked to prove it was AI-generated. | 3

      "AISVS C8.1: Access Controls on Memory & RAG Indices": |
        8.1.1 | Verify that vector identifiers and namespaces enforce uniqueness per tenant and prevent cross- tenant collisions. | 1
        8.1.2 | Verify that document metadata tags are immutable after the initial write. | 2
        8.1.3 | Verify that retrieval operations enforce scope constraints. | 2

      "AISVS C8.2: Embedding Sanitization & Validation": |
        8.2.1 | Verify that sensitive fields are detected before embedding and are masked, tokenized, or dropped. | 1
        8.2.2 | Verify that vectors that fall outside normal clustering patterns are flagged and quarantined before entering production indices. | 2
        8.2.3 | Verify that agent outputs and tool outputs are not automatically written to trusted agent memory without explicit source validation. | 2
        8.2.4 | Verify that content crafted to manipulate retrieval results is detected and rejected or quarantined before vectorization. | 3
        8.2.5 | Verify that new content written to memory is checked for contradictions with what is already stored and that conflicts trigger alerts. | 3

      "AISVS C8.3: Memory Expiry & Revocation": |
        8.3.1 | Verify that expired vectors are excluded from retrieval results. | 2
        8.3.2 | Verify that memory can be reset. | 2
        8.3.3 | Verify that quarantined content is retained but excluded from all retrieval results. | 3

      "AISVS C9.1: Execution Budgets, Loop Control, and Circuit Breakers": |
        9.1.1 | Verify that per-tool quotas and timeouts (e.g., CPU, memory, disk, egress, and execution time) are enforced. | 1
        9.1.2 | Verify that per-execution budgets (e.g., max recursion depth, token use, and monetary spend) are configured and enforced by the runtime. | 1
        9.1.3 | Verify that a swarm-level kill-switch exists that can halt all active agent instances. | 2

      "AISVS C9.2: High-Impact Action Approval and Irreversibility Controls": |
        9.2.1 | Verify that the agent runtime blocks execution of privileged, high-impact, or irreversible actions until explicit human approval is received and verified. | 1
        9.2.2 | Verify that approval requests display canonicalized and complete action parameters, such as diffs, commands, recipients, amounts, resources, and scopes, without truncation or unsafe transformation. | 2
        9.2.3 | Verify that each high-impact action has a trusted reversibility classification, such as read-only, reversible, externally reversible, or irreversible. | 2
        9.2.4 | Verify that the agent runtime enforces reversibility classifications by blocking, requiring approval, or restricting actions based on their impact and ability to be reversed. | 2
        9.2.5 | Verify that any self-modification capability (e.g., prompt rewriting, tool-list changes, parameter updates) is restricted by enforceable boundaries. | 2
        9.2.6 | Verify that agentic systems include an AI-augmented review of planned high-risk actions before execution that adds to, and does not replace, the deterministic policy gate. | 2
        9.2.7 | Verify that the AI-augmented review mechanism is protected against manipulation by adversarial inputs, and cannot be overridden or bypassed through prompt injection. | 2
        9.2.8 | Verify that approvals are cryptographically bound to action parameters, requester identity, execution context, and a unique single-use nonce. | 3
        9.2.9 | Verify that cryptographic key material or credentials used to issue approvals are isolated from the agent runtime. | 3
        9.2.10 | Verify that approval gates for multi-step or multi-agent action chains enforce the highest-impact reversibility classification present anywhere in the chain. | 3

      "AISVS C9.3: Component Isolation and Tool Authorization": |
        9.3.1 | Verify that each tool/plugin executes in a least-privilege sandbox or is otherwise isolated from model operations. | 1
        9.3.2 | Verify that tool outputs are validated against schemas. | 1
        9.3.3 | Verify that tool manifests declare required privileges, resource limits, and output validation requirements. | 2
        9.3.4 | Verify that the runtime enforces the privileges, resource limits, and output-validation requirements declared in tool manifests. | 2
        9.3.5 | Verify that components processing untrusted data are isolated from tool-calling capabilities, ensuring that compromised data processing cannot trigger unauthorized tool invocations. | 2
        9.3.6 | Verify that there is architectural separation between processing of untrusted tool outputs and agent operations. | 2
        9.3.7 | Verify that external resources named in model output are verified against an approved allow-list or registry before the agent installs or invokes them. | 2
        9.3.8 | Verify that policy violations trigger automated tool containment. | 3

      "AISVS C9.4: Agent and Orchestrator Identity": |
        9.4.1 | Verify that each agent instance has a unique cryptographic identity and authenticates as a first-class principal to downstream systems. | 2
        9.4.2 | Verify that agent-initiated actions are cryptographically bound to each step of the execution chain for non-repudiation. | 2
        9.4.3 | Verify that agent identity credentials rotate on a defined schedule. | 3
        9.4.4 | Verify that agent state persisted between invocations is integrity-protected. | 3

      "AISVS C9.5: Agent Authorization, Delegation, and Continuous Enforcement": |
        9.5.1 | Verify that agent actions are authorized against fine-grained policies enforced by the runtime that restrict which tools an agent may invoke, and which parameter values it may supply. | 2
        9.5.2 | Verify that when an agent acts on a user's behalf, the runtime propagates an integrity-protected, scope-limited token that carries the user's authorization context and is enforced at every downstream call. | 2
        9.5.3 | Verify that all access control decisions are enforced by application logic or a policy engine, never by the AI model itself. | 2
        9.5.4 | Verify that secrets and credentials required by an agent at runtime are not exposed within the model's observable context, including the context window, system prompts, or tool call parameters. | 2
        9.5.5 | Verify that inter-agent task delegation is restricted by an explicit authorization policy. | 2
        9.5.6 | Verify that long-running agent sessions re-evaluate current backend authorization policy on every privileged action. | 3

      "AISVS C9.6: Shutdown and Graceful Degradation": |
        9.6.1 | Verify that a manual kill-switch mechanism exists to immediately halt AI model inference and outputs. | 1
        9.6.2 | Verify that when a human-approval gate is not satisfied within the defined approval time, the system blocks the pending action. | 2
        9.6.3 | Verify that kill-switch commands are implemented through an out-of-band channel that is isolated from the agent runtime. | 3

      "AISVS C10.1: Component Integrity": |
        10.1.1 | Verify that MCP components are obtained only from trusted sources and cryptographically verified. | 1
        10.1.2 | Verify that only allow-listed MCP servers are permitted. | 2
        10.1.3 | Verify that locally launched MCP servers run in a least-privilege sandbox with restricted file system, network, and system access. | 2

      "AISVS C10.2: Authentication & Authorization": |
        10.2.1 | Verify that MCP servers validate access tokens for each request and do not rely on transport security alone. | 1
        10.2.2 | Verify that MCP servers validate the presented access token's issuer, audience, expiration, and scope claims in accordance with OAuth 2.1. | 1
        10.2.3 | Verify that MCP servers acting as OAuth 2.1 resource servers do not store or persist access tokens or user credentials. | 1
        10.2.4 | Verify that MCP tools/list returns only tools permitted by resource owners' authorized scopes. | 2
        10.2.5 | Verify that MCP servers enforce access control on every tool invocation, validating that the user's access token authorizes both the requested tool and the specific argument values supplied. | 2
        10.2.6 | Verify that MCP servers ensure all session artifacts are removed when a session terminates. | 2
        10.2.7 | Verify that MCP servers do not pass through access tokens received from clients to downstream APIs. | 2

      "AISVS C10.3: Secure Transport": |
        10.3.1 | Verify that authenticated, encrypted streamable HTTP is used for MCP transport for remote services. | 1
        10.3.2 | Verify that stdio transport is permitted only in controlled local environments. | 1
        10.3.3 | Verify that MCP servers validate both the Origin header and the Host header independently on all HTTP-based transports to prevent DNS rebinding attacks. | 2
        10.3.4 | Verify that MCP clients enforce a minimum acceptable protocol version and reject initialize responses that propose a version below that minimum. | 2
        10.3.5 | Verify that access tokens between the MCP client and server are sender-constrained using mTLS or DPoP. | 3

      "AISVS C10.4: Schema, Message, and Input Validation": |
        10.4.1 | Verify that MCP tools/list and tools/call responses are validated against their declared schemas before being injected into the model context. | 1
        10.4.2 | Verify that MCP tools/list and tools/call responses are screened for indirect prompt injection before being injected into the model context. | 1
        10.4.3 | Verify that MCP servers reject unrecognized or oversized parameters in function calls. | 1
        10.4.4 | Verify that all MCP servers enforce strict schema validation. | 2
        10.4.5 | Verify that all MCP transports enforce maximum payload size limits. | 2
        10.4.6 | Verify that MCP servers sign tool responses with a unique nonce and timestamp so MCP clients can detect replay attempts. | 2
        10.4.7 | Verify that MCP clients present users with explicit consent dialogue and cancellation options upon installation of a local MCP server. | 2
        10.4.8 | Verify that MCP clients maintain a snapshot of tool definitions and that any change to a tool definition triggers re-approval before the modified tool can be invoked. | 3

      "AISVS C11.1: Model Alignment, Safety, and Robustness Testing and Training": |
        11.1.1 | Verify that the model has undergone alignment and safety training or fine-tuning to prevent the model from generating disallowed content categories. | 1
        11.1.2 | Verify that a version-controlled alignment test suite is run on every model update or release. | 1
        11.1.3 | Verify that models are evaluated against known adversarial attack techniques relevant to their modality. | 1
        11.1.4 | Verify that models are hardened against adversarial inputs. | 2
        11.1.5 | Verify that an automated evaluator measures harmful-content rate and flags regressions beyond a defined threshold. | 3

      "AISVS C11.2: Membership-Inference and Model-Inversion Mitigation": |
        11.2.1 | Verify that model-inferred sensitive attributes are not directly returned in outputs. | 1
        11.2.2 | Verify that inference endpoints enforce per-principal and global rate limits sized to the extraction threat model, and not solely as a generic API throttle. | 1
        11.2.3 | Verify that model outputs are calibrated to reduce overconfident predictions. | 2
        11.2.4 | Verify that training on sensitive datasets employs differentially-private optimization. | 2
        11.2.5 | Verify that membership-inference attack simulations demonstrate that attack accuracy does not exceed random guessing on evaluated data. | 3

      "AISVS C11.3: Model-Extraction Defense": |
        11.3.1 | Verify that query-pattern analysis feeds an extraction-attempt detector. | 1
        11.3.2 | Verify that raw model outputs are not directly exposed beyond the application backend, and that externally visible responses are calibrated to the extraction risk level. | 2
        11.3.3 | Verify that model watermarking or fingerprinting techniques are applied so that unauthorized copies can be identified. | 3
        11.3.4 | Verify that detection of suspected extraction triggers response measures. | 3

  # ============================================================================
  # DATA
  # Triggers: storage:persistent, storage:vault, data:external-feed-ingest, data:release-candidate,
  #           feature:import-export, cds:high-side-submitter, cds:high-side-broker, data:pii
  # Source: ASVS V11, V14
  # ============================================================================
  - name: "Data"
    triggers:
      - storage:persistent
      - storage:vault
      - data:external-feed-ingest
      - data:release-candidate
      - feature:import-export
      - cds:high-side-submitter
      - cds:high-side-broker
      - data:pii

    abuse_cases:

      "ASVS V11.1: Self-Authorized Key Misuse and Trace Removal": >
        As a privileged insider holding both key-operation and vault-
        administration permissions, I want to grant myself key-use access,
        use the key, and then alter the vault's own audit configuration so
        that no independent party can detect the misuse afterward.

      "ASVS V11.2: Custom Cryptography Exploitation": >
        As an attacker, I want to target a hand-rolled or non-standard
        cryptographic routine (a custom hash, a proprietary token scheme, an
        outdated cipher mode) so that I can forge tokens, recover plaintext,
        or bypass an integrity check that a vetted, standard algorithm would
        have resisted.

      "ASVS V11.7: Software-Only Key Theft via Host Compromise": >
        As an attacker who has compromised a host holding software-only key
        material, I want to read the key directly from process or host
        memory so that I obtain it with no hardware boundary to cross.

      "ASVS V14.1: Exfiltration from an Unclassified Data Store": >
        As an attacker, I want to reach a data store that has never been
        run through a classification scan so that every downstream control
        keyed to a sensitivity label — encryption tier, access policy, DLP —
        silently applies a default posture, since no label exists to drive
        the correct one.

      "ASVS V14.2: Substituted Content in an Unverified External Feed": >
        As an attacker or compromised upstream partner, I want to substitute
        tampered content into a feed this asset ingests so that the
        substitution goes undetected, since no provenance record exists to
        compare what was actually received against what was expected.

      "ASVS V14.2: Bulk Exfiltration via an Uninspected Export Path": >
        As a malicious insider or compromised account, I want to use this
        asset's own legitimate bulk-export or attachment feature so that I
        can move CUI out with no DLP inspection in the path, since the
        export feature was never covered by the classification-aware policy.

      "ASVS V14.2: Re-Identification of a Released De-Identified Dataset": >
        As an attacker, I want to cross-reference a released dataset against
        public or reasonably obtainable auxiliary data so that I can
        re-identify individuals the releasing organization believed were
        already protected by de-identification alone.

    security_requirements:

      "ASVS V11.1: Cryptographic Inventory and Documentation": |
        11.1.1 | Verify that there is a documented policy for management of cryptographic keys and a cryptographic key lifecycle that follows a key management standard such as NIST SP 800-57. This should include ensuring that keys are not overshared (for example, with more than two entities for shared secrets and more than one entity for private keys). | 2
        11.1.2 | Verify that a cryptographic inventory is performed, maintained, regularly updated, and includes all cryptographic keys, algorithms, and certificates used by the application. It must also document where keys can and cannot be used in the system, and the types of data that can and cannot be protected using the keys. | 2
        11.1.3 | Verify that cryptographic discovery mechanisms are employed to identify all instances of cryptography in the system, including encryption, hashing, and signing operations. | 3
        11.1.4 | Verify that a cryptographic inventory is maintained. This must include a documented plan that outlines the migration path to new cryptographic standards, such as post-quantum cryptography, in order to react to future threats. | 3

      "ASVS V11.2: Secure Cryptography Implementation": |
        11.2.1 | Verify that industry-validated implementations (including libraries and hardware-accelerated implementations) are used for cryptographic operations. | 2
        11.2.2 | Verify that the application is designed with crypto agility such that random number, authenticated encryption, MAC, or hashing algorithms, key lengths, rounds, ciphers and modes can be reconfigured, upgraded, or swapped at any time, to protect against cryptographic breaks. Similarly, it must also be possible to replace keys and passwords and re-encrypt data. This will allow for seamless upgrades to post-quantum cryptography (PQC), once high-assurance implementations of approved PQC schemes or standards are widely available. | 2
        11.2.3 | Verify that all cryptographic primitives utilize a minimum of 128-bits of security based on the algorithm, key size, and configuration. For example, a 256-bit ECC key provides roughly 128 bits of security where RSA requires a 3072-bit key to achieve 128 bits of security. | 2
        11.2.4 | Verify that all cryptographic operations are constant-time, with no ‘short-circuit'operations in comparisons, calculations, or returns, to avoid leaking information. | 3
        11.2.5 | Verify that all cryptographic modules fail securely, and errors are handled in a way that does not enable vulnerabilities, such as Padding Oracle attacks. | 3

      "ASVS V11.3: Encryption Algorithms": |
        11.3.1 | Verify that insecure block modes (e.g., ECB) and weak padding schemes (e.g., PKCS#1 v1.5) are not used. | 1
        11.3.2 | Verify that only approved ciphers and modes such as AES with GCM are used. | 1
        11.3.3 | Verify that encrypted data is protected against unauthorized modification preferably by using an approved authenticated encryption method or by combining an approved encryption method with an approved MAC algorithm. | 2
        11.3.4 | Verify that nonces, initialization vectors, and other single-use numbers are not used for more than one encryption key and data-element pair. The method of generation must be appropriate for the algorithm being used. | 3
        11.3.5 | Verify that any combination of an encryption algorithm and a MAC algorithm is operating in encrypt-then-MAC mode. | 3

      "ASVS V11.4: Hashing and Hash-based Functions": |
        11.4.1 | Verify that only approved hash functions are used for general cryptographic use cases, including digital signatures, HMAC, KDF, and random bit generation. Disallowed hash functions, such as MD5, must not be used for any cryptographic purpose. | 1
        11.4.2 | Verify that passwords are stored using an approved, computationally intensive, key derivation function (also known as a "password hashing function"), with parameter settings configured based on current guidance. The settings should balance security and performance to make brute-force attacks sufficiently challenging for the required level of security. | 2
        11.4.3 | Verify that hash functions used in digital signatures, as part of data authentication or data integrity are collision resistant and have appropriate bit-lengths. If collision resistance is required, the output length must be at least 256 bits. If only resistance to second pre-image attacks is required, the output length must be at least 128 bits. | 2
        11.4.4 | Verify that the application uses approved key derivation functions with key stretching parameters when deriving secret keys from passwords. The parameters in use must balance security and performance to prevent brute-force attacks from compromising the resulting cryptographic key. | 2

      "ASVS V11.5: Random Values": |
        11.5.1 | Verify that all random numbers and strings which are intended to be non-guessable must be generated using a cryptographically secure pseudo-random number generator (CSPRNG) and have at least 128 bits of entropy. Note that UUIDs do not respect this condition. | 2
        11.5.2 | Verify that the random number generation mechanism in use is designed to work securely, even under heavy demand. | 3

      "ASVS V11.6: Public Key Cryptography": |
        11.6.1 | Verify that only approved cryptographic algorithms and modes of operation are used for key generation and seeding, and digital signature generation and verification. Key generation algorithms must not generate insecure keys vulnerable to known attacks, for example, RSA keys which are vulnerable to Fermat factorization. | 2
        11.6.2 | Verify that approved cryptographic algorithms are used for key exchange (such as Diffie-Hellman) with a focus on ensuring that key exchange mechanisms use secure parameters. This will prevent attacks on the key establishment process which could lead to adversary-in-the-middle attacks or cryptographic breaks. | 3

      "ASVS V11.7: In-Use Data Cryptography": |
        11.7.1 | Verify that full memory encryption is in use that protects sensitive data while it is in use, preventing access by unauthorized users or processes. | 3
        11.7.2 | Verify that data minimization ensures the minimal amount of data is exposed during processing, and ensure that data is encrypted immediately after use or as soon as feasible. | 3

      "ASVS V14.1: Data Protection Documentation": |
        14.1.1 | Verify that all sensitive data created and processed by the application has been identified and classified into protection levels. This includes data that is only encoded and therefore easily decoded, such as Base64 strings or the plaintext payload inside a JWT. Protection levels need to take into account any data protection and privacy regulations and standards which the application is required to comply with. | 2
        14.1.2 | Verify that all sensitive data protection levels have a documented set of protection requirements. This must include (but not be limited to) requirements related to general encryption, integrity verification, retention, how the data is to be logged, access controls around sensitive data in logs, database-level encryption, privacy and privacy-enhancing technologies to be used, and other confidentiality requirements. | 2

      "ASVS V14.2: General Data Protection": |
        14.2.1 | Verify that sensitive data is only sent to the server in the HTTP message body or header fields, and that the URL and query string do not contain sensitive information, such as an API key or session token. | 1
        14.2.2 | Verify that the application prevents sensitive data from being cached in server components, such as load balancers and application caches, or ensures that the data is securely purged after use. | 2
        14.2.3 | Verify that defined sensitive data is not sent to untrusted parties (e.g., user trackers) to prevent unwanted collection of data outside of the application's control. | 2
        14.2.4 | Verify that controls around sensitive data related to encryption, integrity verification, retention, how the data is to be logged, access controls around sensitive data in logs, privacy and privacy-enhancing technologies, are implemented as defined in the documentation for the specific data's protection level. | 2
        14.2.5 | Verify that caching mechanisms are configured to only cache responses which have the expected content type for that resource and do not contain sensitive, dynamic content. The web server should return a 404 or 302 response when a non-existent file is accessed rather than returning a different, valid file. This should prevent Web Cache Deception attacks. | 3
        14.2.6 | Verify that the application only returns the minimum required sensitive data for the application's functionality. For example, only returning some of the digits of a credit card number and not the full number. If the complete data is required, it should be masked in the user interface unless the user specifically views it. | 3
        14.2.7 | Verify that sensitive information is subject to data retention classification, ensuring that outdated or unnecessary data is deleted automatically, on a defined schedule, or as the situation requires. | 3
        14.2.8 | Verify that sensitive information is removed from the metadata of user-submitted files unless storage is consented to by the user. | 3

      "ASVS V14.3: Client-side Data Protection": |
        14.3.1 | Verify that authenticated data is cleared from client storage, such as the browser DOM, after the client or session is terminated. The ‘Clear-Site-Data' HTTP response header field may be able to help with this but the client-side should also be able to clear up if the server connection is not available when the session is terminated. | 1
        14.3.2 | Verify that the application sets sufficient anti-caching HTTP response header fields (i.e., Cache-Control: no-store) so that sensitive data is not cached in browsers. | 2
        14.3.3 | Verify that data stored in browser storage (such as localStorage, sessionStorage, IndexedDB, or cookies) does not contain sensitive data, with the exception of session tokens. | 2

  # ============================================================================
  # DETECTION
  # Triggers: feature:public-api-endpoint, machine:container, ai:observability-stack
  # Source: ASVS V16, AISVS C11.4, C12
  # ============================================================================
  - name: "Detection"
    triggers:
      - feature:public-api-endpoint
      - machine:container
      - ai:observability-stack

    abuse_cases:

      "ASVS V16.3: Enumeration Paced Under the Rate Limit": >
        As an attacker, I want to pace object-ID enumeration or credential
        probing requests just under this API's rate limit so that I produce
        no throttling event at all, remaining invisible to a SOC watching
        only for volumetric abuse.

      "ASVS V16.4: Audit Trail Evasion and Tampering": >
        As an attacker performing unauthorized actions, I want to abuse
        business logic flaws to suppress, bypass, or flood the application's
        internal audit logging mechanism so that my malicious activities
        cannot be traced by the SOC.

      "AISVS C12.3: Model Drift Masked by Absence of Behavioral Baseline Monitoring": >
        As an attacker able to influence model behavior gradually (via
        adversarial inputs, a slow-poisoned feedback loop, or an unnoticed
        dependency change), I want the resulting behavioral drift to
        accumulate with no continuous baseline comparison in place, so that
        a security-relevant change in model output goes undetected until it
        surfaces as a downstream incident rather than a monitored alert.

    security_requirements:

      "ASVS V16.1: Security Logging Documentation": |
        16.1.1 | Verify that an inventory exists documenting the logging performed at each layer of the application's technology stack, what events are being logged, log formats, where that logging is stored, how it is used, how access to it is controlled, and for how long logs are kept. | 2

      "ASVS V16.2: General Logging": |
        16.2.1 | Verify that each log entry includes necessary metadata (such as when, where, who, what) that would allow for a detailed investigation of the timeline when an event happens. | 2
        16.2.2 | Verify that time sources for all logging components are synchronized, and that timestamps in security event metadata use UTC or include an explicit time zone offset. UTC is recommended to ensure consistency across distributed systems and to prevent confusion during daylight saving time transitions. | 2
        16.2.3 | Verify that the application only stores or broadcasts logs to the files and services that are documented in the log inventory. | 2
        16.2.4 | Verify that logs can be read and correlated by the log processor that is in use, preferably by using a common logging format. | 2
        16.2.5 | Verify that when logging sensitive data, the application enforces logging based on the data's protection level. For example, it may not be allowed to log certain data, such as credentials or payment details. Other data, such as session tokens, may only be logged by being hashed or masked, either in full or partially. | 2

      "ASVS V16.3: Security Events": |
        16.3.1 | Verify that all authentication operations are logged, including successful and unsuccessful attempts. Additional metadata, such as the type of authentication or factors used, should also be collected. | 2
        16.3.2 | Verify that failed authorization attempts are logged. For L3, this must include logging all authorization decisions, including logging when sensitive data is accessed (without logging the sensitive data itself). | 2
        16.3.3 | Verify that the application logs the security events that are defined in the documentation and also logs attempts to bypass the security controls, such as input validation, business logic, and anti-automation. | 2
        16.3.4 | Verify that the application logs unexpected errors and security control failures such as backend TLS failures. | 2

      "ASVS V16.4: Log Protection": |
        16.4.1 | Verify that all logging components appropriately encode data to prevent log injection. | 2
        16.4.2 | Verify that logs are protected from unauthorized access and cannot be modified. | 2
        16.4.3 | Verify that logs are securely transmitted to a logically separate system for analysis, detection, alerting, and escalation. The aim is to ensure that if the application is breached, the logs are not compromised. | 2

      "ASVS V16.5: Error Handling": |
        16.5.1 | Verify that a generic message is returned to the consumer when an unexpected or security-sensitive error occurs, ensuring no exposure of sensitive internal system data such as stack traces, queries, secret keys, and tokens. | 2
        16.5.2 | Verify that the application continues to operate securely when external resource access fails, for example, by using patterns such as circuit breakers or graceful degradation. | 2
        16.5.3 | Verify that the application fails gracefully and securely, including when an exception occurs, preventing fail-open conditions such as processing a transaction despite errors resulting from validation logic. | 2
        16.5.4 | Verify that a "last resort" error handler is defined which will catch all unhandled exceptions. This is both to avoid losing error details that must go to log files and to ensure that an error does not take down the entire application process, leading to a loss of availability. | 3

      "AISVS C11.4: Model Runtime Anomaly Detection": |
        11.4.1 | Verify that inputs from external or untrusted sources pass through anomaly detection before model inference. | 2
        11.4.2 | Verify that inputs flagged as anomalous trigger gating actions. | 2
        11.4.3 | Verify that the safety violation feedback pipeline includes poisoning detection and human review gates to prevent adversarial manipulation of the improvement mechanism. | 3

      "AISVS C12.1: Request & Response Logging": |
        12.1.1 | Verify that AI interactions are logged with session context and AI-specific telemetry. | 1
        12.1.2 | Verify that safety filtering and policy decisions are logged with sufficient detail to support audit, debugging, and forensic analysis of content moderation systems. | 2
        12.1.3 | Verify that log entries for AI inference events follow a structured, interoperable schema that includes at least the model identifier, token usage (input and output), provider name, and operation type. | 2
        12.1.4 | Verify that RAG pipeline retrieval events are logged, including the query, documents retrieved, and knowledge source. | 2

      "AISVS C12.2: Detection and Alerting": |
        12.2.1 | Verify that the system detects and alerts on known jailbreak patterns, prompt injection attempts, and adversarial inputs. | 1
        12.2.2 | Verify that behavioral anomaly detection identifies unusual conversation patterns, excessive retry attempts, or probing behaviors. | 2
        12.2.3 | Verify that custom rules detect AI-specific threat patterns for coordinated jailbreak attempts, prompt injection, and system prompt extraction attempts. | 2
        12.2.4 | Verify that extraction-alert events include offending query metadata to support investigation. | 2
        12.2.5 | Verify that token usage is tracked at granular attribution levels including per user, per session, per feature endpoint, and per team or workspace. | 2
        12.2.6 | Verify that LLM API traffic is monitored for covert-channel indicators and communication signatures to identify malware and command-and-control (C2) activity. | 3

      "AISVS C12.3: Model, Data, and Performance Drift Detection": |
        12.3.1 | Verify that data drift detection monitors input distribution changes that may impact model performance, using statistically validated methods matched to the input data type (e.g., KS test or PSI for tabular numeric features, embedding-distance metrics for text or image). | 1
        12.3.2 | Verify that hallucination detection monitors identify and flag model outputs that contain factually incorrect, inconsistent, or fabricated information. | 2
        12.3.3 | Verify that hallucination rates are tracked as continuous time-series metrics to enable trend analysis and detection of sustained model degradation. | 2
        12.3.4 | Verify that unexplained behavioral shifts are distinguished from gradual, expected operational drift. | 3

      "AISVS C12.4: Proactive Security Behavior Monitoring": |
        12.4.1 | Verify that autonomous action triggers include proactive behavior-pattern analysis, security evaluation, and threat-landscape assessment. | 2
        12.4.2 | Verify that audit logs capture security-critical proactive actions, including approver identity, timestamp, action parameters, and decision outcomes. | 2
        12.4.3 | Verify that kill-switch activations and override commands are logged. | 2

      "AISVS C12.5: Training Data & Model Lifecycle Audit": |
        12.5.1 | Verify that dataset lineage records each dataset and its components, including all transformations, augmentations, and merges. | 1
        12.5.2 | Verify that all labeling activities are recorded in logs. | 1
        12.5.3 | Verify that all model changes generate immutable audit records. | 2
        12.5.4 | Verify that every ingested document is tagged at write time with source, writer identity, and timestamp. | 2

  # ============================================================================
  # RESPONSE
  # Triggers: zone:dmz, sec:secrets-broker
  # Also relevant to any exception-bearing asset, or any asset in a model
  # with business_criticality critical/mission-critical.
  # Source: NIST SP 800-53 Rev 5 (IR family)
  # ============================================================================
  - name: "Response"
    triggers:
      - zone:dmz
      - sec:secrets-broker

    abuse_cases:

      "IR-4: Incomplete Credential Rotation After a Breach": >
        As an attacker who has compromised this asset, I want to retain a
        credential that was never inventoried as one this asset consumes,
        so that it survives the incident response team's rotation effort
        and gives me a return path after the incident is declared contained.

      "IR-3: Incident Response Plan Fails Under Real Conditions": >
        As an incident responder executing the documented plan for the
        first time during an actual incident, I want the plan's untested
        assumptions about tooling access, escalation paths, and authority to
        isolate assets to fail exactly when they matter most, turning a
        contained incident into a prolonged one.

    security_requirements:

      "IR-4: Containment Disposition": |
        1 | Business-critical, mission-critical, internet-facing, exception-bearing, and CDS-interface assets MUST have a documented containment disposition (auto-isolation permitted / human approval required / prohibited) agreed in advance by the asset owner and the response team. | 1

      "IR-4: Credential Inventory for Incident-Driven Rotation": |
        1 | A current inventory of every credential/secret an asset consumes or issues MUST exist, sufficient to identify every consumer and complete a full rotation without an extended outage. | 1
        2 | The rotation procedure MUST be exercised, not merely documented, within the current ATO period. | 3

      "IR-3: Regularly Tested Incident Response Plan": |
        1 | A plan that has only ever been reviewed on paper does not satisfy this requirement. | 1
        2 | The incident response plan MUST be exercised via tabletop or live-fire testing at least annually, with findings tracked to closure. | 2

      "IR-6: Mandatory Incident Reporting Timeline": |
        1 | Cyber incidents meeting the DFARS 252.204-7012 reporting threshold MUST be reported to the required authority within 72 hours of discovery. | 1
        2 | The reporting workflow and escalation contacts MUST be documented and known to the on-call responder, not looked up for the first time during the incident. | 2

  # ============================================================================
  # RECOVERY
  # Triggers: ops:requires-backup, ops:vendor-hosted-service
  # Source: NIST SP 800-53 Rev 5 (CP family, plus SA-9, AC-5, SC-12)
  # ============================================================================
  - name: "Recovery"
    triggers:
      - ops:requires-backup
      - ops:vendor-hosted-service

    abuse_cases:

      "CP-9: Ransomware Deletes Co-Administered Backups": >
        As a ransomware actor who has compromised a production administrator
        account, I want to delete or shorten the retention on this asset's
        backups using that same account so that the incident becomes
        unrecoverable rather than merely disruptive.

      "CP-4: Undiscovered Restoration Gap During an Actual Incident": >
        As an incident responder attempting recovery, I want to execute the
        documented restoration procedure only to discover it is incomplete,
        outdated, or dependent on knowledge held only by the engineer who
        originally built the backup job — knowledge unavailable during the
        incident itself.

    security_requirements:

      "CP-9 / AC-5: Backup Access Separation and Immutability": |
        1 | Backup administration MUST be a role distinct from production administration, with dual authorization and step-up authentication required for destructive backup operations. | 1
        2 | The backup store's immutability lock MUST be in compliance mode -- irreversible by any account, including the backup platform's own administrators, for the retention period. | 3

      "CP-2: Criticality-Derived Recovery Objectives": |
        1 | A criticality-tier-derived RTO and RPO MUST be documented in the system contingency plan for each asset. | 1

      "CP-4: Tested Restoration Procedure": |
        1 | Documented RTO/RPO values MUST be validated against the measured result of an actual restore test. | 2
        2 | A full restoration exercise, using only the written procedure and performed by someone other than its author, MUST be completed at least annually for business-critical/mission-critical assets. | 3

      "SA-9: Independent Export for SaaS and Vendor-Hosted Services": |
        1 | Any SaaS tenant or vendor-hosted service the enterprise backup platform cannot directly enroll MUST have a native or purpose-built export job routing its data into enterprise-controlled backup storage on a recurring schedule. | 2
        2 | A vendor's own in-tenant retention MUST NOT be treated as satisfying this requirement. | 1

      "SC-12: Backup Encryption Key Rotation and Retention": |
        1 | Backup encryption keys MUST be rotated on a defined schedule independent of the backup retention period. | 2
        2 | A rotated key MUST remain available for the full retention period of any backup it encrypted -- a key rotation MUST NOT orphan older backups. | 2

