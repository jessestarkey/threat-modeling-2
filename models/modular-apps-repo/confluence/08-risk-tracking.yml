risk_tracking:

  unauthorized-marketplace-plugin@confluence:
    status: in-progress
    justification: >
      Investigation pending. The ISSE team is currently coordinating with the 
      Platform Engineering team to determine the exact technical or procedural 
      controls (such as UPM disablement, strict RBAC, or IaC deployments) utilized 
      to restrict third-party plugin installations within the Confluence JVM. 
      Once the mitigation strategy is confirmed and verified, this finding will 
      be updated.
    ticket: TBD
    date: 2026-04-26
    checked_by: Jesse Starkey

  cui-telemetry-spillage@*:
    status: in-discussion
    justification: >
      Finding acknowledged. Currently unmitigated. The Confluence application 
      (Log4j) does not currently employ regex-based data masking or redaction 
      for user-generated content (CUI) or verbose error traces prior to 
      writing to stdout. Consequently, sensitive mission metadata may be 
      ingested in plaintext by the Azure Monitor agent. 
      
      The Platform Security team is currently evaluating the engineering effort 
      required to implement custom Logstash filters at the cluster level versus 
      formalizing a Risk Acceptance (POA&M) to treat the destination SIEM as a 
      high-side CUI enclave. This finding remains open pending a formal 
      architectural decision and resource allocation.
    ticket: TBD
    date: 2026-04-26
    checked_by: Jesse Starkey

  network-ids-blind-spot@entra-id:
    status: mitigated
    justification: >
      Platform Inherited Mitigation. Entra ID is a Microsoft-operated SaaS identity
      provider. Network intrusion detection and traffic-anomaly monitoring for its
      public sign-in and token endpoints are Microsoft's, under the service's
      FedRAMP authorization, not a control this team deploys or can place a
      sensor for. The tenant-side controls on Entra ID (OAuth/OIDC and SAML
      configuration, secrets, backup) remain tracked through their own findings.
    ticket: TBD
    date: 2026-11-18
    checked_by: Pending ISSO review

  dangling-dns-subdomain-takeover@entra-id:
    status: in-discussion
    justification: >
      DNS for Entra ID's own sign-in endpoints (login.microsoftonline.us and
      related Microsoft domains) is Microsoft-operated, under the service's
      FedRAMP authorization, an inherited control. Not yet closed: any custom
      domains verified in this tenant are this organization's DNS, where a stale
      verification TXT or CNAME record is a real takeover risk. Close as
      mitigated (inherited) once the tenant is confirmed to use no custom
      domains, or once their records are reconciled against active resources.
    ticket: TBD
    date: 2026-11-18
    checked_by: Pending ISSO review
