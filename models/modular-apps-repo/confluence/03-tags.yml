# ==============================================================================
# TAGS USED BY THIS APP: 03-tags.yml
# ==============================================================================
# Subset of models/central-security-repo/libraries/03-tags-lib.yml,
# trimmed to only the tags this app's technical assets, data assets, and
# trust boundaries actually reference. Regenerate whenever tags are added
# to or removed from this app's other fragment files.
#
# See 03-tags-lib.yml for the full tag taxonomy and every available tag's
# description.
# ==============================================================================

tags_available:

  # =============================================================================
  # CLASSIFICATION TAGS
  # These tags describe what an asset IS and what data it handles.
  # They are used for documentation, data flow annotation, and as inputs to
  # risk triggers. They do not fire risks directly on their own.
  # =============================================================================

  # --- Data Asset Classification ---
  - data:payload       # Business/mission content being processed or stored
  - data:credential    # Authentication material: tokens, passwords, API keys, certificates
  - storage:persistent # Data written to disk or databases (at-rest risk)
  - storage:ephemeral  # Data residing only in memory or transit (in-motion risk)
  - storage:vault      # Highly sensitive data in a dedicated secrets manager (e.g., Azure Key Vault, HashiCorp Vault)
  - auth:human         # Data directly interacted with or generated by end-users
  - auth:npe           # Non-Person Entity data: machine-to-machine interactions
  - risk:malware-vector # Unstructured data that could harbor malicious payloads (e.g., file uploads, email attachments)

  # --- Foundational Asset Classification (Compute, Network, Crypto) ---
  - app:frontend-ui    # Asset serves HTML/JS to the browser — primary user-facing application surface
  - app:backend-api    # Asset implements business logic and API endpoints
  - net:ingress-path   # Asset is part of the traffic inspection and routing chain from the perimeter to the cluster
  - net:egress-path    # Asset initiates outbound connections to external entities
  - net:tls-terminator # Asset is where encryption-in-transit is decrypted (plaintext exists in memory here)
  - sec:secrets-broker # Asset fetches, caches, or distributes credentials on behalf of other services
  - compliance:fips-validated # Asset has been confirmed to use FIPS 140-2/3 validated cryptographic modules — suppresses FIPS risk

  # --- Trust Boundary Classification ---
  - zone:dmz           # Internet-facing or untrusted transit network — asset is expected to handle hostile traffic
  - zone:restricted    # Deep-internal boundary (data tier, private endpoint) — must never have a direct route to the internet
  - mgmt:csp-managed   # Boundary where Azure owns the underlying security controls (Shared Responsibility Model)
  - scope:ato-boundary # Asset is within the formal ATO accreditation boundary — assets without this tag are external dependencies

  # =============================================================================
  # BEHAVIORAL FEATURE TAGS
  # These tags describe what an asset DOES — specific capabilities that introduce
  # discrete attack surfaces. Each tag triggers one or more risk injections.
  # =============================================================================

  # --- Authentication and Identity ---
  - feature:oauth-oidc-provider # Asset issues or validates OAuth 2.0/OIDC tokens (IdP, authorization server, or custom token validation middleware — e.g., Keycloak, Entra ID app registration)
  - feature:saml-sp             # Asset acts as a SAML 2.0 Service Provider consuming assertions from an external IdP (e.g., CAC/PIV federation via ADFS, Okta SAML, Shibboleth)
  - feature:password-reset      # Asset implements a self-service credential recovery or password reset flow (applies even to break-glass and service account recovery flows)

  # --- Authorization ---
  - feature:admin-panel         # Asset exposes an administrative interface for user management, system configuration, or audit log access

  # --- Input Handling and Injection ---
  - feature:file-upload-processing  # Asset accepts and parses complex file formats uploaded by users (e.g., PDFs, Office documents, ZIP files, images)
  - feature:import-export           # Asset supports bulk data import (CSV/Excel/JSON batch upload) or bulk data export (full dataset download, report generation)
  - feature:dynamic-code-execution  # Asset interprets and runs code, scripts, or complex expressions provided by a user (e.g., template engines, eval(), formula processors)

  # --- Application Feature Risks ---
  - feature:search-index            # Asset has query capabilities over a search index (e.g., Elasticsearch, Lucene, Solr, Azure AI Search)
  - feature:third-party-plugins     # Asset allows admins or end-users to install third-party marketplace plugins that execute code in the application's core memory space
  - feature:vdi-path                # Asset is accessed via Virtual Desktop Infrastructure (AVD/RDS) — differentiates VDI access path from direct browser path
  - feature:public-api-endpoint     # Asset exposes an API intentionally accessible to the internet for third-party or B2B integration (distinct from internal-only backend APIs)

  # =============================================================================
  # INFRASTRUCTURE HARDENING TAGS
  # Positive-confirmation tags: presence means the control IS in place.
  # Absence of these tags fires the corresponding hardening risk.
  # =============================================================================

  # --- Container Hardening (absence fires risk) ---
  - ops:trusted-base-image             # Container is deployed from a vetted, scanned DoD/DoW-approved registry image (e.g., Iron Bank)
  - ops:read-only-fs                   # Container mounts its root filesystem as read-only via PodSecurityContext
  - net:micro-segmented                # Container namespace enforces strict default-deny Kubernetes NetworkPolicies
  - ops:container-capabilities-restricted # Container explicitly drops all Linux capabilities and re-grants only those required via securityContext

  # --- VM Hardening (absence fires risk) ---
  - ops:host-agents-installed # VM has mandatory DoW endpoint security agents deployed (EDR, Tanium, Splunk Forwarder)
  - ops:stig-baseline         # VM is deployed from a STIG-compliant baseline image and enrolled in automated patch management
  - ops:disk-encrypted        # VM managed disks are encrypted at rest using Azure Disk Encryption or Host-Based Encryption

  # --- Service Hardening (absence fires risk) ---
  - ops:waf-enabled     # A WAF with a managed ruleset in Prevention mode is confirmed in the ingress path — suppresses the WAF coverage risk on zone:dmz assets
  - ops:requires-backup # Asset requires backup for DR/COOP — presence triggers backup integrity risk

  # =============================================================================
  # POLICY EXCEPTION TAGS  (POA&M Triggers)
  # These tags mark explicit AO-accepted waivers. Each fires a risk entry
  # requiring formal risk acceptance documentation.
  # =============================================================================

  - exception:local-auth-fallback # Asset maintains a local credential store bypassing the Enterprise IdP and mandatory MFA/CAC — AO waiver required

  # =============================================================================
  # DIAGRAM ICON TAGS
  # Purely cosmetic -- see 03-tags-lib.yml. Never used as a risk trigger.
  # =============================================================================

  - icon:azure-waf           # Web Application Firewall / App Gateway with WAF policy
  - icon:azure-app-gateway   # Azure Application Gateway
  - icon:azure-ngfw          # Next-gen firewall appliance (e.g., Azure Firewall)
  - icon:azure-vnet          # Virtual network / subnet boundary
  - icon:azure-aks           # AKS cluster boundary
  - icon:azure-subnet        # Subnet nested inside a VNet
  - icon:azure-nsg           # Network Security Group applied at a subnet
  - icon:k8s-namespace       # Kubernetes namespace boundary (cloud-provider-independent)
  - icon:azure-key-vault     # Azure Key Vault (or equivalent secrets manager)
  - icon:azure-database      # Relational/NoSQL database service
  - icon:azure-storage       # Blob/file storage service
  - icon:azure-monitor       # Centralized logging/monitoring workspace
  - icon:azure-avd           # Azure Virtual Desktop session host
  - icon:azure-entra-id      # Microsoft Entra ID (identity provider / app registration)
  - icon:keycloak            # Keycloak identity provider
  - icon:postgresql          # PostgreSQL database engine
  - icon:azure-private-link  # Azure Private Endpoint / Private Link
  - icon:azure-subscription  # Azure subscription or tenant-level boundary
  - icon:azure-management-groups # Outer Azure Government/tenant cloud boundary
  - icon:nginx               # NGINX (or NGINX Ingress Controller) reverse proxy
  - icon:confluence          # Atlassian Confluence
  - icon:human-web           # External human user accessing via an ordinary web browser
  - icon:human-vdi           # External human user accessing via Virtual Desktop Infrastructure (AVD/RDS)

  # =============================================================================
  # COMMUNICATION LINK PATH-FILTER TAGS
  # Purely cosmetic -- see 03-tags-lib.yml. Never used as a risk trigger.
  # =============================================================================

  - path:mission   # Explicitly Mission Flows -- overrides the endpoint-technology guess
  - path:identity  # Explicitly Identity Path -- overrides the endpoint-technology guess
  - path:network   # Explicitly Network Path -- overrides the endpoint-technology guess
