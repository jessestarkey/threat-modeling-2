  Azure Log Analytics Workspace:
    id: log-analytics-workspace
    description: >
      Centralized SIEM (e.g., Azure Sentinel) for aggregating, indexing, 
      and analyzing all system telemetry, security events, and application logs.
    type: datastore 
    usage: devops 
    used_as_client_by_human: false
    out_of_scope: false
    size: service 
