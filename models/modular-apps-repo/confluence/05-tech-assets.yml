    internet: false
    machine: serverless
    encryption: transparent
    owner: Platform Team
    confidentiality: restricted
    integrity: critical 
    availability: important 
    justification_cia_rating: >
      Confidentiality (Restricted): As the centralized Security Information and 
      Event Management (SIEM) repository, this workspace aggregates highly sensitive 
      system telemetry, including internal routing paths, privileged API queries, 
      and potentially unmasked CUI/PII spillage from application error traces. 
      Unauthorized disclosure provides an adversary with a comprehensive blueprint 
      of the internal architecture and security control configurations.
      
      Integrity (Critical): The absolute immutability of audit trails is a foundational 
      DoD requirement for non-repudiation and forensic incident response. Malicious 
      tampering, deletion, or suppression of these event logs would allow an Advanced 
      Persistent Threat (APT) or malicious insider to operate undetected within the 
      ATO boundary and destroy evidence of exploitation.
      
      Availability (Important): Continuous ingestion of security telemetry is mandatory 
      for real-time SOC monitoring and automated alerting (e.g., Azure Sentinel analytics). 
      While an outage of the logging platform does not immediately halt the primary 
      kinetic or business mission, a prolonged blind spot violates continuous monitoring 
      mandates (NIST SP 800-53 AU-9) and severely degrades defensive cyber operations.
    multi_tenant: true
    redundant: true
    custom_developed_parts: false
    data_assets_processed: 
      - system-telemetry-logs
    data_assets_stored: 
      - system-telemetry-logs
    data_formats_accepted: 
