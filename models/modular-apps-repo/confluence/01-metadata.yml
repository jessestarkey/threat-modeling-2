threagile_version: 1.0.0

title: Confluence Threat Model

date: 2026-03-31

author:
  name: Jesse Starkey
  role: ISSE

management_summary_comment: >
  Confluence serves as the organization's central knowledge management hub, facilitating cross-functional collaboration
  by hosting critical project documentation, architectural designs, and institutional policies. It is a mission-essential
  application that supports day-to-day operations and decision-making; a loss of availability or data integrity would
  significantly disrupt productivity and result in the loss of vital intellectual property.

mission_criticality: mission-essential

threat_landscape:
  description: >
    The threat model for this Confluence instance identifies a medium-to-high risk profile primarily driven by its role as a
    high-value target for unauthorized data exfiltration. While core infrastructure protections are in place, the primary security
    focus remains on mitigating risks associated with identity provider integration, sensitive data leakage through plugins, and
    ensuring robust network-policy isolation within the cluster.
  images:

technical_overview:
  description: >
    Confluence is deployed as a containerized application within an Azure Kubernetes Service (AKS) cluster, utilizing an Nginx Ingress Controller
    for traffic routing and TLS termination. The architecture relies on an externalized managed database for persistence and integrates with Entra ID
    via OIDC/SAML for centralized identity management. Security is enforced through Kubernetes network policies to isolate namespace traffic and a
    dedicated secret store for managing sensitive integration credentials.
  images:

questions:

  # ==============================================================================
  # Answers for the capability questions and feature checklist in 01-metadata-lib.yml,
  # for the focus areas selected in this app's own 02-abuse-and-reqs.yml. This app has no
  # AI focus area, so those questions and checklist items are omitted. Checklist answers
  # state only what this model already records, and mark everything else
  # [ANSWER REQUIRED].
  # ==============================================================================

  # ----------------------------------------------------------------------------
  # FEATURE CHECKLIST: the options that apply, separated by commas. [ANSWER REQUIRED]
  # marks a selection that still needs confirming. Selections come from this model's
  # own answers and tags. The capability questions below carry the detail.
  # ----------------------------------------------------------------------------

  "Feature: Authentication mechanisms": "Enterprise IdP, Local accounts (including break-glass), Self-service password reset [ANSWER REQUIRED]"
  "Feature: Session model": "Application sessions, Federated login"
  "Feature: OAuth, OIDC, and SAML roles": "OIDC client, SAML service provider [ANSWER REQUIRED]"
  "Feature: Self-managed identity infrastructure": "None"
  "Feature: Administrative and support access": "Administrative interface"
  "Feature: Host hardening and access": "[ANSWER REQUIRED]"
  "Feature: Self-managed hosts and workload identity": "[ANSWER REQUIRED]"
  "Feature: Self-managed network": "None"
  "Feature: Authorization boundary crossings": "[ANSWER REQUIRED]"
  "Feature: Cross-domain solution roles": "None"
  "Feature: Browser and VDI access": "Rendered in a browser, Sets cookies, Accessed through VDI [ANSWER REQUIRED]"
  "Feature: Code execution and deserialization": "Dynamic code or template execution, Object deserialization [ANSWER REQUIRED]"
  "Feature: Interfaces exposed": "Public or B2B API, Search over an index [ANSWER REQUIRED]"
  "Feature: Content handling": "File uploads, Bulk import or export, Server-side PDF generation, Rendering one user's content to others [ANSWER REQUIRED]"
  "Feature: Platform features": "Third-party plugins [ANSWER REQUIRED]"
  "Feature: User-facing flows that could be automated at scale": "[ANSWER REQUIRED]"
  "Feature: AI use and model sourcing": "None"
  "Feature: AI deployment": "None"
  "Feature: Agent capabilities": "None"
  "Feature: AI inputs and outputs": "None"
  "Feature: In-use and client-side data": "Sensitive data reaches a client [ANSWER REQUIRED]"
  "Feature: Sensitive data handled": "Credentials or keys, Credentials brokered for other services [ANSWER REQUIRED]"
  "Feature: Incident reporting requirement": "[ANSWER REQUIRED]"
  "Feature: Vendor-hosted or SaaS components": "No"
  "Feature: Data that requires backup": "Yes"

  # ----------------------------------------------------------------------------
  # IDENTITY
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V6.1-ASVS V6.8
  "How is each authentication mechanism implemented, enforced, and documented?": >
    Primary login federates to Entra ID over OIDC, and a self-managed Keycloak instance acts as a
    SAML service provider for legacy and partner flows. Additionally, a vendor-required local
    Recovery Administrator account provides emergency access if federation fails, which is the
    model's exception:local-auth-fallback waiver. Its vault-generated password is stored in Azure
    Key Vault, and its login endpoint is reachable only from management jump boxes, though both
    still need verifying.

    [ANSWER REQUIRED] Confirm (1) that the OIDC flow uses only the authorization code flow with PKCE
    and exact-match redirect URIs, (2) that the SAML path resists XML Signature Wrapping, disables
    XXE, and validates recipient, audience, and expiry, (3) the entropy, expiry, and single use of
    the local account's reset tokens, and that the reset link is not built from the Host header, and
    (4) that the POA&M for the waiver is on file.

  # Requirement IDs: ASVS V7.1-ASVS V7.6
  "How are sessions created, timed out, ended, and re-authenticated?": >
    Confluence keeps server-side sessions, and logout invalidates the session in the clustered
    session store rather than only clearing the cookie. Additionally, the global administration
    console requires step-up re-authentication with the IdP, and that elevated session expires after
    10 minutes by default. However, space-level privileged actions, such as exporting a space or
    deleting a page, rely only on the primary session.

    [ANSWER REQUIRED, gap] Decide whether bulk export of CUI should also require step-up
    re-authentication.

  # Requirement IDs: ASVS V8.1-ASVS V8.4
  "How is authorization enforced at the function, data, and field level, and what protects the admin interface?": >
    A server-side permission engine checks every request at the global, space, page, and attachment
    levels, so a guessed resource ID does not bypass it. The deployment is single-tenant, and the
    admin console also requires the step-up challenge described in the session answer.

  # Requirement IDs: ASVS V9.1-ASVS V9.2, ASVS V10.1-ASVS V10.7
  "For each OAuth or OIDC role the asset plays, how are tokens validated and scoped, and how are the flows secured?": >
    Confluence is an OIDC relying party of Entra ID and a SAML service provider of Keycloak. The
    flow-level gaps for both are listed in the authentication answer.

    [ANSWER REQUIRED] Confirm that tokens are validated for signature, issuer, audience, and expiry
    before any claim is trusted, and that Confluence requests only the scopes it needs.

  # ----------------------------------------------------------------------------
  # DEVICE AND INFRASTRUCTURE
  # ----------------------------------------------------------------------------

  # Requirement IDs: CM-14, CM-7, SC-7(21), SC-5, AC-6, CM-6, SI-2, SI-4, AC-17, SC-28
  "How are the containers and VMs hardened, patched, monitored, and administered?": >
    Container images come only from the internal ACR, pinned by digest and signature-verified at
    admission. Additionally, every pod drops all Linux capabilities and is barred from privilege
    escalation, host namespaces, and hostPath, and every workload has CPU and memory limits. A
    default-deny NetworkPolicy governs every namespace. Confluence's own pods write to emptyDir or
    Azure Files volumes, since they cannot use a read-only root filesystem.

    The AVD session hosts are built from DISA STIG images with Azure Policy drift remediation, run
    Defender for Endpoint, and patch through Azure Update Manager. Administrators reach them only
    through the AVD enclave or Azure Bastion with JIT access, and every disk uses Encryption at Host
    with Key Vault keys.

    [ANSWER REQUIRED] Confirm (1) that pods cannot reach the instance metadata service, (2) that
    service-account tokens are not automounted, and that the CSI driver's account has
    least-privilege RBAC, (3) a STIG scan result from the last 30 days, (4) the actual patch SLAs,
    since the documented 30 to 60 days misses the 7-day Critical and 21-day High directive, and (5)
    whether the session hosts use a managed identity, and if so, its scope.

  # ----------------------------------------------------------------------------
  # NETWORK AND ENVIRONMENT
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V12.1-ASVS V12.3
  "How is TLS implemented for external traffic and for service-to-service calls?": >
    External TLS terminates at the Azure Application Gateway in the DMZ, which also applies the
    OWASP Core Rule Set before traffic reaches the AKS NGINX Ingress.

    [ANSWER REQUIRED] Confirm that only TLS 1.2 or later with strong ciphers is enabled, and that
    pod-to-pod and pod-to-database traffic inside the cluster is also encrypted.

  # ----------------------------------------------------------------------------
  # APPLICATION
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V1.3
  "What prevents injection and unsafe deserialization?": >
    Confluence renders dynamic macros with Velocity and OGNL by design, which is why the asset
    carries feature:dynamic-code-execution. Class allow-listing and sandboxing restrict macro
    execution. However, the main defense is containment, since a successful RCE stays inside a
    hardened pod with dropped capabilities and strict egress policies.

  # Requirement IDs: ASVS V2.3, ASVS V2.4
  "What stops users from skipping business-logic steps or automating abuse?": >
    Confluence has no sequential workflow to skip, since every action passes through the same
    authorization engine regardless of order. Bulk export, however, lets an authorized user scrape
    all accessible content quickly. The WAF and Ingress monitor request velocity and egress
    patterns, but that is monitoring rather than a hard limit on export volume.

    [ANSWER REQUIRED] Verify that the velocity and egress monitoring is in place.

  # Requirement IDs: ASVS V4.1
  "How are the HTTP, GraphQL, and WebSocket interfaces secured?": >
    Confluence does not rate-limit its own REST API. Instead, the Application Gateway WAF and the
    NGINX Ingress enforce per-token rate limits, and pod resource limits keep a saturated backend
    from exhausting the cluster's nodes.

  # Requirement IDs: ASVS V5.1-ASVS V5.4
  "How are uploaded files validated, stored, and served?": >
    Confluence disables DTD resolution in its XML parsers, allow-lists classes during
    deserialization, and caps the uncompressed size of ZIP archives. Additionally, the Azure
    Firewall IDPS and the Application Gateway WAF inspect inbound traffic.

    [ANSWER REQUIRED] Name the malware scan applied to attachment uploads (for example, Defender for
    Storage). Additionally, describe how the server-side PDF export renderer is sandboxed, with
    JavaScript and external resource loading disabled.

  "How are cookies, security headers, CSRF, and origin separation configured for the browser?": >
    Confluence is rendered in a browser and sets session cookies.

    [ANSWER REQUIRED] Describe the session cookies' Secure, HttpOnly, and SameSite settings, the
    security headers set (Content-Security-Policy, X-Frame-Options or frame-ancestors, and HSTS), how
    CSRF is prevented, and whether pages load external resources with integrity checks.

  "How is configuration managed, how do backend services authenticate, and where do secrets live?": >
    Backend secrets reach Confluence through the AKS CSI Driver from Azure Key Vault.

    [ANSWER REQUIRED] Describe how configuration is managed and reviewed, how Confluence authenticates
    to Postgres, the file store, and Keycloak, and confirm that no secrets live in images, manifests,
    or environment variables.

  "How is third-party dependency risk tracked, and which defensive coding practices are enforced?": >
    [ANSWER REQUIRED] Describe how Confluence's vendor patches and its third-party plugins are tracked
    against known vulnerabilities, and how plugin updates are reviewed before they are installed.

  # ----------------------------------------------------------------------------
  # DATA
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V11.1, ASVS V11.2
  "How are cryptographic keys managed, and are the algorithms approved?": >
    Azure Key Vault generates keys in an HSM, and Confluence uses only standard JCA libraries
    (BCrypt, a CSPRNG, AES-256, and SHA-256), with no custom cryptography. The JVM is reported to
    run in FIPS mode, which still needs verifying.

    [ANSWER REQUIRED, gap] Confirm (1) the CMK or PMK tier of each key against the mission-essential
    rating, (2) automated key rotation, (3) that key-operation authority is separate from vault
    administration, verified by an access review, and (4) whether any data must be protected while
    in use (ASVS V11.7).

  # Requirement IDs: ASVS V14.1, ASVS V14.2
  "How is sensitive data classified and protected at rest, in transit, and on the client?": >
    Exports are scoped by space and page permissions and watched by velocity and egress monitoring.
    However, no classification-aware inspection covers them.

    [ANSWER REQUIRED, gap] Confirm (1) a recurring classification scan (for example, Microsoft
    Purview) of the Postgres database, the Keycloak store, and the file store, (2) DLP inspection of
    exports and attachment downloads, (3) a retention schedule for content, identity, and audit
    data, (4) operation-level audit logging on Postgres, forwarded to the SIEM, and (5) how
    sensitive data is protected in the browser (ASVS V14.3), such as through cache-control headers.

  # ----------------------------------------------------------------------------
  # DETECTION
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V16.1-ASVS V16.5
  "What is logged, where do the logs go, and what do error messages reveal?": >
    Production error pages are generic, while full diagnostic detail, including OGNL errors, goes to
    backend logs forwarded to the SIEM. Log4j masks secrets and session tokens, and the SIEM
    ingestion rules are relied on to mask other sensitive content, which still needs verifying.
    Additionally, authentication, permission, and content events are written as immutable audit
    records with a timestamp, the Entra ID identity, and the source IP.

    [ANSWER REQUIRED, gap] Confirm (1) logging of object-ID request sequences, with a SIEM rule for
    callers that pace requests just under the rate limit, and (2) an AKS API-server audit policy
    extended to exec, attach, port-forward, secret access, and admission decisions.

  # ----------------------------------------------------------------------------
  # RESPONSE
  # ----------------------------------------------------------------------------

  # Requirement IDs: IR-4, IR-3, IR-6
  "How are containment, credential rotation, and incident reporting handled, and have they been tested?": >
    The Response focus area applies because the model is mission-essential, and several assets also
    trigger it, namely the two Application Gateways in the DMZ, the CSI driver as a secrets broker,
    and Confluence's local-auth waiver. The secrets-broker chain (the CSI driver to Key Vault, and
    Keycloak to its store) gives a starting credential inventory.

    [ANSWER REQUIRED, gap] Confirm (1) a containment disposition for each of these assets, agreed
    with the response team, (2) an exercised end-to-end rotation of every credential in the chain,
    (3) a tabletop or live-fire exercise within the ATO period, and (4) a documented DFARS 72-hour
    reporting procedure that the on-call responder knows.

  # ----------------------------------------------------------------------------
  # RECOVERY
  # ----------------------------------------------------------------------------

  # Requirement IDs: CP-9 / AC-5, CP-2, CP-4
  "How is the asset backed up, what are its RTO and RPO, and has a restore been tested?": >
    The Keycloak store, Postgres, the file store, and Key Vault all require backup. The file store
    uses Azure Backup with soft delete, and Postgres has cross-zone HA. However, a privileged
    account can reverse soft delete, and HA is an availability control rather than a tested restore.
    Confluence is self-hosted, so no vendor export applies.

    [ANSWER REQUIRED, gap] Confirm (1) backup administration separate from production
    administration, with dual authorization for destructive operations, (2) compliance-mode
    immutability on every backup vault, (3) a backup key rotation cadence that covers the longest
    retention, and (4) a validated RTO and RPO, with a restore performed by someone other than the
    procedure's author within the ATO period.

