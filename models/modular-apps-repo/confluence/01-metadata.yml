threagile_version: 1.0.0

title: Confluence Threat Model

date: 2026-03-31

author:
  name: Jesse Starkey
  role: ISSE

management_summary_comment: >
  Confluence serves as the organization's central knowledge management hub, facilitating cross-functional collaboration
  by hosting critical project documentation, architectural designs, and institutional policies. It is a mission-essential
  application that supports day-to-day operations and decision-making; a loss of availability or data integrity would
  significantly disrupt productivity and result in the loss of vital intellectual property.

mission_criticality: mission-essential

threat_landscape:
  description: >
    The threat model for this Confluence instance identifies a medium-to-high risk profile primarily driven by its role as a
    high-value target for unauthorized data exfiltration. While core infrastructure protections are in place, the primary security
    focus remains on mitigating risks associated with identity provider integration, sensitive data leakage through plugins, and
    ensuring robust network-policy isolation within the cluster.
  images:

technical_overview:
  description: >
    Confluence is deployed as a containerized application within an Azure Kubernetes Service (AKS) cluster, utilizing an Nginx Ingress Controller
    for traffic routing and TLS termination. The architecture relies on an externalized managed database for persistence and integrates with Entra ID
    via OIDC/SAML for centralized identity management. Security is enforced through Kubernetes network policies to isolate namespace traffic and a
    dedicated secret store for managing sensitive integration credentials.
  images:

questions:

  # ==============================================================================
  # Answers for the capability questions and feature checklist in 01-metadata-lib.yml,
  # for the focus areas selected in this app's own 02-abuse-and-reqs.yml. This app has no
  # AI focus area, so those questions and checklist items are omitted. Checklist answers
  # state only what this model already records, and mark everything else
  # [ANSWER REQUIRED].
  # ==============================================================================

  # ----------------------------------------------------------------------------
  # FEATURE CHECKLIST: the options that apply, separated by commas. Selections follow
  # this model's own tags and fields, and the capability questions below carry the
  # detail. This is a sample model, so every answer is filled in and confirmed.
  # ----------------------------------------------------------------------------

  "Feature: Authentication mechanisms": "Enterprise IdP, Local accounts (including break-glass), MFA, Self-service password reset"
  "Feature: Session model": "Application sessions, Federated login"
  "Feature: OAuth, OIDC, and SAML roles": "OIDC client, SAML service provider"
  "Feature: Self-managed identity infrastructure": "None"
  "Feature: Administrative and support access": "Administrative interface"
  "Feature: Multi-tenancy": "Shared multi-tenant platform services"
  "Feature: Host hardening and access": "Hardening inherited from a managed platform, Direct administrator access to hosts"
  "Feature: Compute and workload identity": "Containers, Virtual machines, Managed or serverless platform services"
  "Feature: Hosting environment": "Azure Government"
  "Feature: Impact level": "IL5"
  "Feature: Approved policy exceptions": "Local authentication fallback"
  "Feature: Users and exposure": "Internal users, Internet-facing endpoints"
  "Feature: Self-managed network": "None"
  "Feature: Authorization boundary crossings": "None"
  "Feature: Cross-domain solution roles": "None"
  "Feature: Browser and VDI access": "Rendered in a browser, Sets cookies, Accessed through VDI"
  "Feature: Code execution and deserialization": "Dynamic code or template execution, Object deserialization"
  "Feature: Interfaces exposed": "Public or B2B API, Search over an index"
  "Feature: Content handling": "File uploads, Bulk import or export, Server-side PDF generation, Rendering one user's content to others"
  "Feature: Platform features": "Third-party plugins"
  "Feature: User-facing flows that could be automated at scale": "No"
  "Feature: Development and delivery": "Commercial or open-source software only"
  "Feature: AI use and model sourcing": "None"
  "Feature: AI deployment": "None"
  "Feature: Agent capabilities": "None"
  "Feature: AI inputs and outputs": "None"
  "Feature: In-use and client-side data": "Sensitive data reaches a client"
  "Feature: Sensitive data handled": "Credentials or keys, Credentials brokered for other services"
  "Feature: Incident reporting requirement": "Yes"
  "Feature: Vendor-hosted or SaaS components": "No"
  "Feature: Data that requires backup": "Yes"

  # ----------------------------------------------------------------------------
  # IDENTITY
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V6.1-ASVS V6.8
  "How is each authentication mechanism implemented, enforced, and documented?": >
    Primary login federates to Entra ID over OIDC, with MFA enforced by conditional access, and a
    self-managed Keycloak instance acts as a SAML service provider for legacy and partner flows.
    Additionally, a vendor-required local Recovery Administrator account provides emergency access
    if federation fails, which is the model's exception:local-auth-fallback waiver. Its
    vault-generated password is stored in Azure Key Vault and rotated every 30 days, its login
    endpoint is reachable only from management jump boxes, and the POA&M for the waiver is on file.

    The OIDC flow uses only the authorization code flow with PKCE, with exact-match redirect URIs.
    Furthermore, the SAML path resists XML Signature Wrapping, disables XXE in its parser, and
    checks the recipient, audience, and expiry of every assertion. Finally, the local account's
    reset tokens are random, single-use, and expire after 15 minutes, and the reset link is built
    from the configured base URL rather than the Host header.

  # Requirement IDs: ASVS V7.1-ASVS V7.6
  "How are sessions created, timed out, ended, and re-authenticated?": >
    Confluence keeps server-side sessions, and logout invalidates the session in the clustered
    session store rather than only clearing the cookie. Additionally, the global administration
    console and the bulk export of a space both require step-up re-authentication with the IdP, and
    that elevated session expires after 10 minutes by default. Other space-level actions, such as
    deleting a page, rely on the primary session and its MFA.

  # Requirement IDs: ASVS V8.1-ASVS V8.4
  "How is authorization enforced at the function, data, and field level, and what protects the admin interface?": >
    A server-side permission engine checks every request at the global, space, page, and attachment
    levels, so a guessed resource ID does not bypass it. The deployment is single-tenant, and the
    admin console also requires the step-up challenge described in the session answer.

  # Requirement IDs: ASVS V9.1-ASVS V9.2, ASVS V10.1-ASVS V10.7
  "For each OAuth or OIDC role the asset plays, how are tokens validated and scoped, and how are the flows secured?": >
    Confluence is an OIDC relying party of Entra ID and a SAML service provider of Keycloak, and it
    does not accept OAuth access tokens as a resource server. It validates each ID token's
    signature, issuer, audience, and expiry before trusting any claim, and it requests only the
    openid, profile, and email scopes. The flow-level controls for both paths are described in the
    authentication answer.

  # ----------------------------------------------------------------------------
  # DEVICE AND INFRASTRUCTURE
  # ----------------------------------------------------------------------------

  # Requirement IDs: CM-14, CM-7, SC-7(21), SC-5, AC-6, CM-6, SI-2, SI-4, AC-17, SC-28
  "How are the containers and VMs hardened, patched, monitored, and administered?": >
    Container images come only from the internal ACR, pinned by digest and signature-verified at
    admission. Additionally, every pod drops all Linux capabilities and is barred from privilege
    escalation, host namespaces, and hostPath, and every workload has CPU and memory limits. A
    default-deny NetworkPolicy governs every namespace, pods cannot reach the instance metadata
    service, and service-account tokens are not automounted, while the CSI driver's account has
    least-privilege RBAC. Confluence's own pods write to emptyDir or Azure Files volumes, since they
    cannot use a read-only root filesystem.

    The AVD session hosts are built from DISA STIG images with Azure Policy drift remediation, and
    their latest STIG scan is less than 30 days old. They run Defender for Endpoint, use no managed
    identity, and patch through Azure Update Manager within the 7-day Critical and 21-day High
    directive. Finally, administrators reach them only through the AVD enclave or Azure Bastion with
    JIT access, and every disk uses Encryption at Host with Key Vault keys.

  # ----------------------------------------------------------------------------
  # NETWORK AND ENVIRONMENT
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V12.1-ASVS V12.3
  "How is TLS implemented for external traffic and for service-to-service calls?": >
    External TLS terminates at the Azure Application Gateway in the DMZ, which allows only TLS 1.2
    or later with strong ciphers, and which applies the OWASP Core Rule Set before traffic reaches
    the AKS NGINX Ingress. Additionally, pod-to-pod and pod-to-database traffic inside the cluster
    is encrypted with TLS.

  # ----------------------------------------------------------------------------
  # APPLICATION
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V1.3
  "What prevents injection and unsafe deserialization?": >
    Confluence renders dynamic macros with Velocity and OGNL by design, which is why the asset
    carries feature:dynamic-code-execution. Class allow-listing and sandboxing restrict macro
    execution, and the same allow-listing applies when Confluence deserializes objects. However, the
    main defense is containment, since a successful RCE stays inside a hardened pod with dropped
    capabilities and strict egress policies.

  # Requirement IDs: ASVS V2.3, ASVS V2.4
  "What stops users from skipping business-logic steps or automating abuse?": >
    Confluence has no sequential workflow to skip, since every action passes through the same
    authorization engine regardless of order. Bulk export, however, lets an authorized user scrape
    all accessible content quickly. Thus, the WAF and Ingress monitor request velocity and egress
    patterns and alert the SOC on bulk export, and bulk export also requires step-up
    re-authentication, as the session answer describes.

  # Requirement IDs: ASVS V4.1
  "How are the HTTP, GraphQL, and WebSocket interfaces secured?": >
    Confluence does not rate-limit its own REST API. Instead, the Application Gateway WAF and the
    NGINX Ingress enforce per-token rate limits, and pod resource limits keep a saturated backend
    from exhausting the cluster's nodes.

  # Requirement IDs: ASVS V5.1-ASVS V5.4
  "How are uploaded files validated, stored, and served?": >
    Confluence disables DTD resolution in its XML parsers, allow-lists classes during
    deserialization, and caps the uncompressed size of ZIP archives. Additionally, Defender for
    Storage scans every attachment upload before it is stored or shared, and the Azure Firewall IDPS
    and the Application Gateway WAF inspect inbound traffic. Finally, the server-side PDF export
    renderer runs in a sandbox, with JavaScript and external resource loading disabled.

  "How are cookies, security headers, CSRF, and origin separation configured for the browser?": >
    Confluence is rendered in a browser and sets its session cookies with the Secure, HttpOnly, and
    SameSite=Lax attributes. Additionally, it sends Content-Security-Policy, frame-ancestors, and
    HSTS headers, prevents CSRF with synchronizer tokens, and loads no external resources.

  "How is configuration managed, how do backend services authenticate, and where do secrets live?": >
    Configuration is managed as code in the platform repository and reviewed through pull requests.
    Backend secrets reach Confluence through the AKS CSI Driver from Azure Key Vault, and Confluence
    authenticates to Postgres, the file store, and Keycloak with those vault-held credentials. As a
    result, no secrets live in images, manifests, or environment variables.

  "How is third-party dependency risk tracked, and which defensive coding practices are enforced?": >
    The platform team tracks Confluence's vendor security advisories, and applies patches within the
    directive's timelines. Additionally, third-party plugins come only from an approved list, and
    each plugin update is reviewed and scanned before it is installed.

  # ----------------------------------------------------------------------------
  # DATA
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V11.1, ASVS V11.2
  "How are cryptographic keys managed, and are the algorithms approved?": >
    Azure Key Vault generates keys in an HSM, and Confluence uses only standard JCA libraries
    (BCrypt, a CSPRNG, AES-256, and SHA-256), with no custom cryptography, on a JVM that runs in
    FIPS mode. Additionally, every key uses the customer-managed tier that the mission-essential
    rating requires, and key rotation is automated every 180 days. Key-operation authority is held
    by a role separate from vault administration, as the latest access review verified. Finally, no
    data needs protection while it is in use, so ASVS V11.7 does not apply.

  # Requirement IDs: ASVS V14.1, ASVS V14.2
  "How is sensitive data classified and protected at rest, in transit, and on the client?": >
    Microsoft Purview scans the Postgres database, the Keycloak store, and the file store every
    month, and labels their contents. Additionally, exports are scoped by space and page
    permissions, and Purview DLP inspects exports and attachment downloads. A retention schedule
    covers content, identity, and audit data, and Postgres sends operation-level audit logs to the
    SIEM. Finally, in the browser, Confluence sets cache-control headers that keep sensitive pages
    out of the browser cache.

  # ----------------------------------------------------------------------------
  # DETECTION
  # ----------------------------------------------------------------------------

  # Requirement IDs: ASVS V16.1-ASVS V16.5
  "What is logged, where do the logs go, and what do error messages reveal?": >
    Production error pages are generic, while full diagnostic detail, including OGNL errors, goes to
    backend logs forwarded to the SIEM. Log4j masks secrets and session tokens, and the SIEM
    ingestion rules mask other sensitive content. Additionally, authentication, permission, and
    content events are written as immutable audit records with a timestamp, the Entra ID identity,
    and the source IP.

    The SIEM also flags callers that request sequential object IDs just under the rate limit.
    Furthermore, the AKS API-server audit policy captures exec, attach, port-forward, secret access,
    and admission decisions, and forwards them to the SIEM.

  # ----------------------------------------------------------------------------
  # RESPONSE
  # ----------------------------------------------------------------------------

  # Requirement IDs: IR-4, IR-3, IR-6
  "How are containment, credential rotation, and incident reporting handled, and have they been tested?": >
    The Response focus area applies because the model is mission-essential, and several assets also
    trigger it, namely the two Application Gateways in the DMZ, the CSI driver as a secrets broker,
    and Confluence's local-auth waiver. Each of these assets has a containment disposition agreed
    with the response team. Additionally, the secrets-broker chain (the CSI driver to Key Vault, and
    Keycloak to its store) serves as the credential inventory, and a full rotation of every
    credential in it was exercised this ATO period. Finally, the incident response plan was
    exercised in a tabletop this ATO period, and the DFARS 72-hour reporting procedure is documented
    and known to the on-call responder.

  # ----------------------------------------------------------------------------
  # RECOVERY
  # ----------------------------------------------------------------------------

  # Requirement IDs: CP-9 / AC-5, CP-2, CP-4
  "How is the asset backed up, what are its RTO and RPO, and has a restore been tested?": >
    The Keycloak store, Postgres, the file store, and Key Vault all require backup. The file store
    uses Azure Backup, and every backup vault's immutability is locked in compliance mode, while
    Postgres also has cross-zone HA for availability. Additionally, backup administration is held by
    a role separate from production administration, with dual authorization for destructive
    operations, and the backup key rotation keeps superseded keys for the longest retention period.
    Finally, a restore performed by someone other than the procedure's author this ATO period
    validated an RTO of 8 hours and an RPO of 1 hour. Confluence is self-hosted, so no vendor export
    applies.

